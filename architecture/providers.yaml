closureRules:
  - id: closure.requested-only
    rule: Start from admitted public demand, explicitly accepted selectors, and accepted questionnaire prerequisites; recommendations never silently become selections and internal or environment-only capabilities cannot be requested.
    failure: Reject with PREREQUISITE_NOT_ACCEPTED or INVALID_CAPABILITY_ROLE.
  - id: closure.implementation-owned-only
    rule: Admit only packet-owned repository implementations or signed tenant external prerequisites; CONTRACT_ONLY records are comparative non-installable guidance and cannot enter selected modules, dependency closure, install plans, or bundles.
    failure: Reject a selected CONTRACT_ONLY record with PROVIDER_UNAVAILABLE until a future packet and catalog revision assign implementation ownership.
  - id: closure.transitive-fixed-point
    rule: Add required module dependencies and external prerequisites until a fixed point, then reject cycles, missing IDs, or incompatible conditions.
    failure: Reject with CLOSURE_INCOMPLETE, DEPENDENCY_CYCLE, or CAPABILITY_CONFLICT.
  - id: closure.one-provider-per-exclusive-capability
    rule: Every activated exclusive group resolves only from exactly one selector explicitly accepted in requestedCapabilities; ranking may propose but never select or substitute a provider, and inactive selectors are invalid.
    failure: Reject a missing selector with NEEDS_INPUT, multiple selectors with AMBIGUOUS_PROVIDER, an inactive selector with INVALID_COMBINATION, or an incompatible selected member with PROVIDER_UNAVAILABLE.
  - id: closure.platform-and-architecture
    rule: Retain only units whose declared platform, architecture, resources, storage, network, RBAC, and isolation conditions are satisfied by signed environment facts.
    failure: Reject before bundle construction with PLATFORM_CAPABILITY_MISSING.
  - id: closure.immutable-and-minimal
    rule: The BOM contains only selected units and their transitive closure; every released artifact and external fact is digest locked, and unselected blobs are forbidden.
    failure: A missing digest remains PLANNED and cannot enter a RELEASED bundle.
  - id: closure.zero-bill
    rule: Only the two catalog cost dispositions are valid; paid, metered, provider-key, phone-home, public-registry-only, and runtime-download providers are structurally invalid.
    failure: Reject with ZERO_BILL_POLICY_VIOLATION.
  - id: closure.offline
    rule: Air-gap closure replaces connected external endpoints with imported OCI layouts, mounted artifacts, local trust, local identity, and locally available data sources.
    failure: Reject any unresolved hostname, credential, package fetch, model fetch, telemetry export, or transparency-service dependency.
  - id: closure.lifecycle
    rule: The install plan orders verification, prerequisites, stateful services, stateless services, workers, adapters, and UIs; uninstall retains durable tenant data by default.
    failure: Reject a plan without health, rollback, uninstall, and retention disposition for every selected unit.

