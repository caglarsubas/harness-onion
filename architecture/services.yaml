enums:
  dependencyModes: [SYNC, ASYNC, CONTROL, ARTIFACT]
  failureModes: [FAIL_CLOSED, FAIL_OPEN]
  degradationPolicyTypes: [disableImmediately, bounded]
  degradationBudgetDimensions: [timeSeconds, bytes, workItems]
  degradationBudgetExhaustionModes: [ANY, ALL]
  degradationExhaustionActions: [MARK_DEGRADED_AND_FAIL_READINESS, STOP_CLAIMING_WORK_AND_FAIL_READINESS]
  behaviorModes: [STATEFUL, STATELESS, EPHEMERAL]
  implementationStatuses: [PLANNED, IN_PROGRESS, IMPLEMENTED, DEPRECATED]
  evidenceStatuses: [NOT_STARTED, COLLECTING, PASS, WARN, FAIL, STALE, WAIVED]

dependencyStateAggregation:
  evaluationModel: FULL_SNAPSHOT_RECOMPUTE
  edgeKey: consumerServiceId+dependencyId
  snapshotRevisionRule: LATEST_MONOTONIC_SNAPSHOT_ONLY
  conditionNormalization: ONE_CANONICAL_CONDITION_PER_EDGE_REVISION
  ruleApplication: AT_MOST_ONE_EXPLICIT_RULE_ELSE_DEFAULT_CONTRIBUTION
  triggerMatrix: EXACT_DECLARED_TRIGGERS_ONLY
  unmatchedSelectedFailureDisposition: FAIL_CLOSED_INVALID_TRIGGER
  unmatchedSelectedFailureContribution:
    severity: FAILED
    observedStateEffect: FAILED
    readinessEffect: NOT_READY
    desiredStateAction: NO_CHANGE
  unmatchedSelectedFailureWorkAction: REJECT_NEW_AND_COMPENSATE
  unmatchedSelectedFailureReason: DependencyTriggerInvalid
  defaultContributionEligibility: HEALTHY_CONDITION_ONLY
  modeAggregates:
    RUNTIME_DATA_PATH: [SYNC, ASYNC]
  defaultContribution:
    severity: READY
    observedStateEffect: NO_CHANGE
    readinessEffect: NO_CHANGE
    desiredStateAction: NO_CHANGE
  contributionUpdate: REPLACE_BY_EDGE_KEY
  recomputeOnAnyEdgeRevision: true
  orderIndependent: true
  severityPrecedence: [FAILED, BLOCKED, DEGRADED, READY]
  readinessPrecedence: [NOT_READY, POLICY_CONTROLLED, NO_CHANGE]
  desiredStateActionPrecedence: [SET_SUSPENDED, NO_CHANGE]
  workActionAggregation: ORDERED_UNIQUE_SET
  noChangeActionHandling: OMIT_WHEN_ANY_NON_NEUTRAL_ACTION_EXISTS
  workActionPrecedence:
    - FAIL_WAVE_RETAIN_EVIDENCE
    - REJECT_NEW_AND_COMPENSATE
    - DO_NOT_APPLY
    - BLOCK_START
    - BLOCK_MUTATIONS
    - PAUSE_ACK_RETAIN_CURSOR
    - RETURN_RETRYABLE_503
    - EXECUTE_ON_EXHAUSTION
    - APPLY_DEGRADATION_POLICY
    - RESET_DEGRADATION_BUDGET_AND_RECOMPUTE
    - RESTORE_OPTIONAL_CAPABILITY_AND_RECOMPUTE
    - RECOMPUTE_AND_UNBLOCK_IF_PERMITTED
    - RECOMPUTE_AND_RESUME_IF_PERMITTED
    - RECOMPUTE_FROM_DEPENDENCY_SNAPSHOT
    - NO_CHANGE
  reasonTieBreak: HIGHEST_SEVERITY_THEN_LEXICOGRAPHIC_EDGE_KEY
  neutralReasonHandling: EXCLUDE_FROM_PRIMARY_REASON
  projection:
    observedState: FAILED_ELSE_BLOCKED_ELSE_DEGRADED_ELSE_LOCAL_STATE
    readiness: NOT_READY_ELSE_POLICY_CONTROLLED_ELSE_LOCAL_READINESS
    desiredState: SET_SUSPENDED_ELSE_NO_CHANGE
  selectionHandling: UNSELECTED_EDGE_REPLACES_PRIOR_CONTRIBUTION_WITH_NO_CHANGE
  recoveryActionGate: EXECUTE_ONLY_IF_AGGREGATED_RESULT_PERMITS
  revokedReleaseRecovery: FORBIDDEN_TERMINAL

stateMachines:
  desired:
    initial: ABSENT
    states: [ABSENT, PRESENT, ACTIVE, SUSPENDED, RETIRED]
    transitions:
      ABSENT: [PRESENT]
      PRESENT: [ACTIVE, ABSENT]
      ACTIVE: [SUSPENDED, PRESENT]
      SUSPENDED: [ACTIVE, PRESENT, RETIRED]
      RETIRED: []
  observed:
    initial: UNKNOWN
    states: [UNKNOWN, ABSENT, PENDING, STARTING, READY, DEGRADED, BLOCKED, STOPPING, FAILED]
    transitions:
      UNKNOWN: [ABSENT, PENDING, BLOCKED, FAILED]
      ABSENT: [PENDING]
      PENDING: [STARTING, BLOCKED, STOPPING, FAILED]
      STARTING: [READY, DEGRADED, BLOCKED, STOPPING, FAILED]
      READY: [DEGRADED, BLOCKED, STOPPING, FAILED]
      DEGRADED: [READY, BLOCKED, STOPPING, FAILED]
      BLOCKED: [STARTING, DEGRADED, STOPPING, FAILED]
      STOPPING: [ABSENT, FAILED]
      FAILED: [PENDING, STOPPING]
  release:
    initial: DRAFT
    states: [DRAFT, BUILT, VERIFIED, AWAITING_SIGNATURE, SIGNED, RELEASED, DEPRECATED, RETIRED, FAILED, REVOKED]
    transitions:
      DRAFT: [BUILT, FAILED]
      BUILT: [VERIFIED, FAILED]
      VERIFIED: [AWAITING_SIGNATURE, FAILED]
      AWAITING_SIGNATURE: [SIGNED, FAILED]
      SIGNED: [RELEASED, REVOKED]
      RELEASED: [DEPRECATED, REVOKED]
      DEPRECATED: [RETIRED, REVOKED]
      RETIRED: []
      FAILED: [DRAFT]
      REVOKED: []

dependencyStatePropagation:
  - id: required-artifact-unverified
    trigger: {mode: ARTIFACT, requirement: REQUIRED, event: UNVERIFIED, phase: BEFORE_START, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: BLOCKED, observedStateEffect: BLOCKED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: DO_NOT_APPLY
      reason: DependencyArtifactUnverified
  - id: required-control-not-ready-before-start
    trigger: {mode: CONTROL, requirement: REQUIRED, event: NOT_READY, phase: BEFORE_START, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: BLOCKED, observedStateEffect: BLOCKED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: BLOCK_START
      reason: DependencyControlNotReady
  - id: required-control-lost-after-ready
    trigger: {mode: CONTROL, requirement: REQUIRED, event: LOST, phase: AFTER_READY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: BLOCK_MUTATIONS
      reason: DependencyControlLost
  - id: required-sync-lost
    trigger: {mode: SYNC, requirement: REQUIRED, event: LOST, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: RETURN_RETRYABLE_503
      reason: DependencySyncLost
  - id: required-async-lost
    trigger: {mode: ASYNC, requirement: REQUIRED, event: LOST, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: PAUSE_ACK_RETAIN_CURSOR
      reason: DependencyAsyncLost
  - id: fail-open-lost
    trigger: {mode: ANY, requirement: OPTIONAL, event: LOST, phase: ANY, degradationBudget: AVAILABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: POLICY_CONTROLLED, desiredStateAction: NO_CHANGE}
      workAction: APPLY_DEGRADATION_POLICY
      reason: DependencyDegraded
  - id: fail-open-budget-exhausted
    trigger: {mode: ANY, requirement: OPTIONAL, event: LOST, phase: ANY, degradationBudget: EXHAUSTED}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: EXECUTE_ON_EXHAUSTION
      reason: DependencyBudgetExhausted
  - id: optional-disable-immediately-lost
    trigger: {mode: ANY, requirement: OPTIONAL, event: LOST, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: POLICY_CONTROLLED, desiredStateAction: NO_CHANGE}
      workAction: APPLY_DEGRADATION_POLICY
      reason: DependencyCapabilityDisabled
  - id: optional-or-unselected
    trigger: {mode: ANY, requirement: UNSELECTED, event: UNSELECTED, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: READY, observedStateEffect: NO_CHANGE, readinessEffect: NO_CHANGE, desiredStateAction: NO_CHANGE}
      workAction: NO_CHANGE
      reason: DependencyNotSelected
  - id: dependency-release-revoked
    trigger: {mode: ANY, requirement: ANY, event: RELEASE_REVOKED, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: NOT_READY, desiredStateAction: SET_SUSPENDED}
      workAction: REJECT_NEW_AND_COMPENSATE
      reason: DependencyReleaseRevoked
  - id: ephemeral-dependency-failed
    trigger: {mode: ARTIFACT, requirement: REQUIRED, event: EXECUTION_FAILED, phase: BEFORE_START, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: FAILED, observedStateEffect: FAILED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: FAIL_WAVE_RETAIN_EVIDENCE
      reason: DependencyExecutionFailed
  - id: required-artifact-invalidated-after-ready
    trigger: {mode: ARTIFACT, requirement: REQUIRED, event: UNVERIFIED, phase: AFTER_READY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: DEGRADED, observedStateEffect: DEGRADED, readinessEffect: NOT_READY, desiredStateAction: NO_CHANGE}
      workAction: REJECT_NEW_AND_COMPENSATE
      reason: DependencyArtifactInvalidated
  - id: required-artifact-restored
    trigger: {mode: ARTIFACT, requirement: REQUIRED, event: VERIFIED_OR_RESTORED, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: READY, observedStateEffect: NO_CHANGE, readinessEffect: NO_CHANGE, desiredStateAction: NO_CHANGE}
      workAction: RECOMPUTE_FROM_DEPENDENCY_SNAPSHOT
      reason: DependencyArtifactRestored
  - id: required-control-restored
    trigger: {mode: CONTROL, requirement: REQUIRED, event: RESTORED, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: READY, observedStateEffect: NO_CHANGE, readinessEffect: NO_CHANGE, desiredStateAction: NO_CHANGE}
      workAction: RECOMPUTE_AND_UNBLOCK_IF_PERMITTED
      reason: DependencyControlRestored
  - id: required-runtime-dependency-restored
    trigger: {mode: RUNTIME_DATA_PATH, requirement: REQUIRED, event: RESTORED, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: READY, observedStateEffect: NO_CHANGE, readinessEffect: NO_CHANGE, desiredStateAction: NO_CHANGE}
      workAction: RECOMPUTE_AND_RESUME_IF_PERMITTED
      reason: DependencyRuntimeRestored
  - id: optional-dependency-recovered
    trigger: {mode: ANY, requirement: OPTIONAL, event: RESTORED, phase: ANY, degradationBudget: RECOVERED}
    outcome:
      edgeContribution: {severity: READY, observedStateEffect: NO_CHANGE, readinessEffect: NO_CHANGE, desiredStateAction: NO_CHANGE}
      workAction: RESET_DEGRADATION_BUDGET_AND_RECOMPUTE
      reason: OptionalDependencyRecovered
  - id: optional-disable-immediately-restored
    trigger: {mode: ANY, requirement: OPTIONAL, event: RESTORED, phase: ANY, degradationBudget: NOT_APPLICABLE}
    outcome:
      edgeContribution: {severity: READY, observedStateEffect: NO_CHANGE, readinessEffect: NO_CHANGE, desiredStateAction: NO_CHANGE}
      workAction: RESTORE_OPTIONAL_CAPABILITY_AND_RECOMPUTE
      reason: OptionalCapabilityRestored

externalDependencies:
  external.kubernetes-api: Operator-supplied Kubernetes, K3s, or OpenShift API.
  external.local-oci-source: Mounted OCI layout or operator-supplied local OCI registry.
  external.release-trust-store: Mounted public keys and revocation manifest; never a private key.
  external.oidc-provider: Tenant/operator-supplied OIDC issuer such as local Keycloak.
  external.postgresql: Tenant/operator-supplied PostgreSQL with service-scoped roles and RLS.
  external.pgvector: pgvector extension in the tenant PostgreSQL service.
  external.opa-engine: Local OPA engine loaded with signed policy bundles.
  external.otel-backend: Local Prometheus and Jaeger-compatible storage.
  external.tenant-source-endpoints: Explicitly allowlisted tenant data endpoints.
  external.tenant-object-store: Tenant PVC or tenant-supplied S3-compatible endpoint.
  external.tenant-model-volume: Pre-staged, license-approved local model artifacts.
  external.local-model-backend: Selected Ollama, llama.cpp, or vLLM backend.
  external.signed-catalog: Digest-pinned contract/module catalog artifact.
  external.signed-industry-packs: Digest-pinned industry-pack artifact.

startupWaves:
  - wave: 0
    objective: Verify immutable inputs and start the telemetry intake boundary.
    services: [bundle-verifier, otel-collector]
  - wave: 1
    objective: Establish cluster reconciliation, authorization, and isolated execution primitives.
    services: [operator, policy-decision, sandbox-runner]
  - wave: 2
    objective: Establish safety, usage, governance, domain, and optional desired-state synchronization.
    services: [fleet-sync-agent, guardrail-service, usage-ledger, governance-service, domain-service]
  - wave: 3
    objective: Establish registry, model, data-source control, and governed memory.
    services: [registry-service, inference-api, connector-controller, memory-service]
  - wave: 4
    objective: Establish management UI, ingestion, retrieval, protocol, and evidence intake.
    services: [control-web, ingest-worker, retrieval-service, protocol-gateway, evidence-service]
  - wave: 5
    objective: Establish compilation, indexing, orchestration API, decisions, and assurance.
    services: [profile-compiler-worker, index-worker, orchestration-api, decision-service, assurance-worker]
  - wave: 6
    objective: Establish governed tools and tenant AI routing.
    services: [tool-broker, ai-gateway]
  - wave: 7
    objective: Start durable workers and expose resumable tenant interactions.
    services: [orchestration-worker, experience-gateway]

services:
  - id: bundle-verifier
    ownerRepository: mas-harness-operator
    harness: runtime.infrastructure
    kind: job
    stateBehavior:
      mode: EPHEMERAL
      durableState: false
      restartSemantics: A new immutable verification run is created for each install or upgrade generation.
    stores:
      - name: external.local-oci-source
        ownership: read-only
        purpose: Bundle blobs and lock.
      - name: external.release-trust-store
        ownership: read-only
        purpose: Offline public-key and revocation verification.
    dependencies:
      - id: external.local-oci-source
        mode: ARTIFACT
        required: true
        failureMode: FAIL_CLOSED
        behavior: Missing or digest-mismatched blobs fail the generation before apply.
      - id: external.release-trust-store
        mode: ARTIFACT
        required: true
        failureMode: FAIL_CLOSED
        behavior: Missing, invalid, or revoked trust material fails verification.
    readinessCriteria:
      - All bundle-lock entries, signatures, licenses, and revocations validate offline.
      - Successful completion emits a generation-scoped verification evidence record.
    startupWave: 0
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: otel-collector
    ownerRepository: mas-harness-trust-plane
    harness: trust.observability-finops
    kind: collector
    stateBehavior:
      mode: STATEFUL
      durableState: true
      restartSemantics: Local bounded WAL/queue replays without cross-tenant mixing.
    stores:
      - name: collector-wal
        ownership: owned
        purpose: Bounded local telemetry buffer.
      - name: external.otel-backend
        ownership: write
        purpose: Local metrics and trace storage.
    dependencies:
      - id: external.otel-backend
        mode: ASYNC
        required: false
        failureMode: FAIL_OPEN
        behavior: Buffer locally within the configured byte/time budget; readiness fails when the budget is exhausted.
        degradationPolicy:
          type: bounded
          budget: {timeSeconds: 3600, bytes: 536870912}
          exhaustWhen: ANY
          onExhaustion: MARK_DEGRADED_AND_FAIL_READINESS
    readinessCriteria:
      - OTLP receivers listen only on configured cluster interfaces.
      - Tenant routing and content-redaction processors are loaded.
      - WAL is writable and below its fail-open capacity threshold.
    startupWave: 0
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: operator
    ownerRepository: mas-harness-operator
    harness: runtime.infrastructure
    kind: controller
    stateBehavior:
      mode: STATELESS
      durableState: true
      restartSemantics: Reconstructs desired/observed state from CRDs, status, and generation inventory.
    stores:
      - name: external.kubernetes-api
        ownership: control
        purpose: HarnessInstallation spec/status and managed resources.
      - name: installation-inventory-configmap
        ownership: owned
        purpose: Generation-scoped resource UID and digest inventory.
    dependencies:
      - id: external.kubernetes-api
        mode: CONTROL
        required: true
        failureMode: FAIL_CLOSED
        behavior: Reconciliation and readiness stop when the API is unavailable.
      - id: bundle-verifier
        mode: ARTIFACT
        required: true
        failureMode: FAIL_CLOSED
        behavior: No install or upgrade wave starts without successful verification evidence.
    readinessCriteria:
      - Kubernetes API discovery, leader lease, CRD storage version, and RBAC self-check pass.
      - Reconciler queue accepts work and observedGeneration can be persisted.
    startupWave: 1
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: policy-decision
    ownerRepository: mas-harness-trust-plane
    harness: trust.security-safety
    kind: api
    stateBehavior:
      mode: STATELESS
      durableState: false
      restartSemantics: Reloads the last verified signed policy bundle before becoming ready.
    stores:
      - name: external.opa-engine
        ownership: control
        purpose: Local policy evaluation.
      - name: external.release-trust-store
        ownership: read-only
        purpose: Policy-bundle signature and revocation verification.
    dependencies:
      - id: external.opa-engine
        mode: SYNC
        required: true
        failureMode: FAIL_CLOSED
        behavior: All protected decisions return unavailable/deny when OPA is not ready.
      - id: external.release-trust-store
        mode: ARTIFACT
        required: true
        failureMode: FAIL_CLOSED
        behavior: Unsigned or revoked policy bundles never activate.
      - id: otel-collector
        mode: ASYNC
        required: false
        failureMode: FAIL_OPEN
        behavior: Decision service continues inside bounded local telemetry buffering; audit decisions remain durably recorded by callers.
        degradationPolicy:
          type: bounded
          budget: {timeSeconds: 300, bytes: 16777216}
          exhaustWhen: ANY
          onExhaustion: MARK_DEGRADED_AND_FAIL_READINESS
    readinessCriteria:
      - Signed baseline policy bundle is active and its digest is exposed.
      - Tenant/actor identity and deny-path self-tests pass.
      - OPA health and decision timeout budget pass.
    startupWave: 1
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: sandbox-runner
    ownerRepository: mas-harness-execution-plane
    harness: execution.tool-skill-sandbox
    kind: job
    stateBehavior:
      mode: EPHEMERAL
      durableState: false
      restartSemantics: Every authorized execution receives a new bounded Job or WASM instance; failed native executions are never silently retried.
    stores:
      - name: ephemeral-workspace
        ownership: owned
        purpose: Per-execution scratch data destroyed after receipt capture.
    dependencies:
      - id: external.kubernetes-api
        mode: CONTROL
        required: true
        failureMode: FAIL_CLOSED
        behavior: Job creation or observation failure blocks execution.
      - id: external.release-trust-store
        mode: ARTIFACT
        required: true
        failureMode: FAIL_CLOSED
        behavior: Runner image/profile and authorization digest must verify.
    readinessCriteria:
      - Selected isolation class is available and matches the signed sandbox profile.
      - Default-deny network, resource/time limits, non-root, seccomp, and cleanup controls pass.
    startupWave: 1
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: fleet-sync-agent
    ownerRepository: mas-harness-operator
    harness: runtime.infrastructure
    kind: agent
    stateBehavior:
      mode: STATELESS
      durableState: true
      restartSemantics: Resumes from the last verified desired-state digest stored in Kubernetes status.
    stores:
      - name: external.kubernetes-api
        ownership: control
        purpose: Desired HarnessInstallation references and observed sync cursor.
    dependencies:
      - id: operator
        mode: CONTROL
        required: true
        failureMode: FAIL_CLOSED
        behavior: New desired state is not submitted while operator readiness is false.
      - id: bundle-verifier
        mode: ARTIFACT
        required: true
        failureMode: FAIL_CLOSED
        behavior: Synced references must be verifiable before status changes.
      - id: external.kubernetes-api
        mode: CONTROL
        required: true
        failureMode: FAIL_CLOSED
        behavior: Desired-state submission and verified cursor/status persistence stop when the Kubernetes API is unavailable.
      - id: external.local-oci-source
        mode: ASYNC
        required: false
        failureMode: FAIL_OPEN
        behavior: Existing workloads continue on last verified state; new sync remains pending.
        degradationPolicy:
          type: disableImmediately
          capability: management.fleet-pull
    readinessCriteria:
      - Disabled profiles report NOT_APPLICABLE; enabled profiles can read the local desired-state endpoint.
      - Last verified cursor and digest are observable without secret material.
    startupWave: 2
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: guardrail-service
    ownerRepository: mas-harness-trust-plane
    harness: trust.security-safety
    kind: api
    stateBehavior:
      mode: STATELESS
      durableState: false
      restartSemantics: Reloads signed detector/profile artifacts before accepting requests.
    stores:
      - name: guardrail-profile-artifact
        ownership: read-only
        purpose: Signed input/output/runtime detector configuration.
    dependencies:
      - id: policy-decision
        mode: SYNC
        required: true
        failureMode: FAIL_CLOSED
        behavior: Evaluation is denied when policy/profile authorization cannot be established.
      - id: otel-collector
        mode: ASYNC
        required: false
        failureMode: FAIL_OPEN
        behavior: Continues with bounded local metrics; guardrail result itself is returned synchronously.
        degradationPolicy:
          type: bounded
          budget: {timeSeconds: 300, bytes: 16777216}
          exhaustWhen: ANY
          onExhaustion: MARK_DEGRADED_AND_FAIL_READINESS
    readinessCriteria:
      - Signed detector profiles load and deterministic conformance vectors pass.
      - Streaming evaluator meets configured buffer and latency limits.
    startupWave: 2
    implementationStatus: PLANNED
    evidenceStatus: NOT_STARTED

  - id: usage-ledger
    ownerRepository: mas-harness-trust-plane
    harness: trust.observability-finops
    kind: api
    stateBehavior:
      mode: STATEFUL
