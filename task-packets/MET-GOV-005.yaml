contracts: ["Accepted base is main d7a3cda5010da560d168b47eee1675b10f9ec89e, tree 70fb659edbbba336b0cb24fbdc9620874780562e, holding 268 immutable packets including MET-ADOPT-005. Add MET-GOV-005 only, as packet 269. Preserve all 268 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The owner's TECH-D1 (the technology-stack decision, recorded in MET-ADOPT-005 as \"PostgreSQL-native (Recommended)\"), and the lane monitor's rulings under the owner's 2026-10-22 delegation: MON-PAR-NEXT (next is (a) TECH-TRUTH-001, on base d7a3cda5, by dossier, then design with Q-TT-n questions, a D5a oracle and lane-local CONTRACT rounds, then build; the dossier names C1-3, C1-4 and C2-2 from MET-GOV-004 and ADR 0011's consistency duty as the exact obligations; SERVICE-EDGES-001 (b) is sequenced after it; the services.yaml re-pin coupling is a carried note, with no services.yaml change in this packet); MON-TT-DOSSIER (Q-TT-1 to Q-TT-12 all ruled (a): the v2 record and checker grow in place; the re-issued D5a oracle covers v1 and v2, has a new identity and replaces the v1 oracle; the record states the doc-versus-decision divergence and never resolves it, and the checker picks no winner; every refusal and every adopted candidate has its own failing test or mutation row; ADR 0010 gains a dated MET-GOV-005 amendment section, its existing decision text and spans unchanged; the TO-P1-1 erratum stays carried and out of this packet; the id is MET-GOV-005; the join set is pre-ruled in the design, and any other join is a stop; the only gate material is the briefs.json rider (OWNER), so the merge is per PR, with the gate list re-derived at mechanics against the then-current main); MON-TT-D1 (C2-2 (TT-D1-3) (a), the section-anchored location: each span pins its enclosing heading text and the block must be the only match inside that section; TT-D1-1/2: BINDINGS_EXPECTED as an ordered closed list in the checker; TT-D1-12: H10's two rows stay PLANNED); MON-TT-D2 (Q-D2-1: yes, the divergence entry {roadmapSelection: Agent Router, decisions [OW-D3, H3-D1], deferral RUN-GATEWAY-ADOPT-001}, with no literal DEFERRED Agent Router row); MON-TT-D3 (Q-TT-D3 (a): design revision 3 with the binding rules BR-TT-1 to BR-TT-5, checked first in CONTRACT r1; Q-D2-2' (a): the whole-file reach of the C2-2 residual is accepted); MON-TT-C1 (c1 dd49a3ea noted; place c2, the module plus a re-issued identity with no catalog names, then CONTRACT r1 with BR-TT-1 to BR-TT-5 checked first); MON-GOV005-CR1 (CONTRACT r1 CHANGES_REQUIRED accepted as recommended: TT-C1-1 and TT-C1-2 folded into c3 on c2; C1-3 and C1-4 become design-errata wording; C1-5 and C1-6 go to the PR body); MON-TT-C1-7 (record, no scrub: the 23 hits in docs/DEVELOPMENT_STATUS.md are the repository-owner handle in GitHub repo references, unchanged at f9882c1a, b5166194 and d7a3cda5; lines added by this packet stay at 0); MON-GOV005-CR2 (CONTRACT delta r2 PASS_FOR_ADOPTION; c3 94316124 (tree c7c46047) adopted; TT-C2-1 goes to the PR body's carried list; MET-GOV-005 is slot 269 (MON-SLOT-269-GOV005); mechanics GO on base d7a3cda5 by the chainmech recipe, with the gate re-derived on the PR diff; briefs.json is OWNER, so this is gate material and the owner merges it, head-bound); MON-269-SEM (the semantic block V1-V4 accepted as written; V1's seven adopted files are exactly c3's eight paths minus briefs.json, named by path, and briefs.json is covered only by V4, the base plus exactly the MET-GOV-005/packet rider, 14 to 15 entries; V2's policySha256 is 267's layer constant, asserted against the LANG-D2 policy text at d7a3cda5); MON-269-B1 and MON-269-B2 (B1 (a): a named exemption for profile.ORACLE_TEST in the head test's retain-names scaffold only, plus the assert that it sits in _PROJECTION_RULES, named in the allowed-changes text and the PR body's carried list, not (b), since re-adding retired v1 names would test behaviour the v2 record no longer has; the oracle stays bound by V1 and V3; B2 (a): c4 is an oracle-only fix, the affected oracle test accepting a shift above a cited span (C2-2 / MON-TT-D1 / 267 errata 2 (B2)), every other oracle byte the same and the identity re-issued (file.sha256, candidateCommit), widening nothing else; the parked mechanics rebase onto c4 and redo only the head layer, its test, C2, the YAML and the authority); MON-269-B2-1 (E2-2 is exactly the design: at c4 the oracle still refuses a wrong-sha256 span and rows 12-17 and still accepts row 18, a move within the section, as at c3; the only change is the accepted shift above a cited span, with no checker or design change); MON-269-C4 and MON-269-CR3-GO (KEEP for the c4 oracle identity; GO for the capped CONTRACT delta r3 on c3..c4, the oracle diff only; the module e29d48ec differs from the baseline 60fb2c99 by one hunk in one test); and MON-269-CR3 (the r3 identity is KEEP; errata c4a 93786aed, tree ced61353, is ADOPTED via ADOPTION_CHECK_C4A; c3..c4a is exactly the oracle plus its identity; the parked work is applied onto c4a, and the mechanics redo only the head layer, with the V1/V3 pins to e29d48ec and the c4a identity bytes, its test with the B1 named exemption, C2, the YAML and the authority; any other change is a stop).", "Adopt candidate c4a (93786aed, tree ced61353) unchanged: c3 (94316124) with the c4 oracle fix (e7dfba9f) and the c4a identity errata, so that c3..c4a changes exactly the oracle and its identity: architecture/language-placement.json in schema planeon.internal.language-placement/v2; scripts/language_placement.py and tests/test_language_placement.py; the re-issued D5a oracle tests/test_language_placement_oracle.py and its identity architecture/oracle-identity-language-placement.json (schema planeon.oracle-identity/v1); ADR 0010's section \"Amendment 1 (MET-GOV-005, 2026-10-26): the technology record\" after its unchanged text; and one line in docs/DEVELOPMENT_STATUS.md citing the amendment. architecture/services.yaml, architecture/repositories.yaml, architecture/providers.yaml, every harness document and repository plan (but the index edit of docs/repositories/00-harness-engineering.md), ADR 0011 and the frozen records are unchanged; the master plan changes only by the index edits.", "Register this packet's review series in architecture/review-record/briefs.json: one PACKET entry, MET-GOV-005/packet, pinning the generic packet brief by sha256 (6dcff68d7e6b01823f1740063e94910edcc159a71a6ee803f1b66c62fd06e274). Gate material: exactly one path by the evolution surface record at this base, architecture/review-record/briefs.json (the MET-GOV-005/packet rider, class GATE_REVIEW_PROCESS, approver OWNER), so the merge is the owner's per-PR approval bound to the head. The evolution surface record itself does not change.", "Add one 269-packet current catalog with an exact 269-to-268 inverse before the accepted 268-to-267 MET-ADOPT-005 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule); through them MET-GOV-004's layer, which pins the packet's eight paths, reads its own era's bytes. The semantic check reads repository bytes only through reviewed_bytes, refuses a path outside its era before reading it and binds every era file by digest (the seven adopted files, the registry and the generic packet brief). Its checks, V1-V4 (MON-269-SEM), with every constant computed from c4a's committed bytes or at the base: V1, the adopted files are exactly the seven (docs/adr/0010-language-placement.md, architecture/language-placement.json, scripts/language_placement.py, tests/test_language_placement.py, tests/test_language_placement_oracle.py, architecture/oracle-identity-language-placement.json and docs/DEVELOPMENT_STATUS.md), each equal to the sha256 of its bytes at c4a (the oracle e29d48ec, the identity c2b431aa); V2, architecture/language-placement.json is in schema planeon.internal.language-placement/v2, names docs/adr/0010-language-placement.md, and its policySha256 equals the LANG-D2 (a) digest 4b0a8a4b9e043823cfa884bdb883ae5b8f796877ead7bdbc413b318082fbc441 that MET-GOV-004's layer holds (ADR 0010's policy text asserted unchanged at d7a3cda5, c3 and c4a); V3, the identity in schema planeon.oracle-identity/v1 names tests/test_language_placement_oracle.py, and its file.sha256 equals that file's bytes; V4, architecture/review-record/briefs.json differs from the base by exactly the MET-GOV-005/packet entry (kind PACKET, the generic packet brief, the sha256 of that brief's bytes, version 1), 14 to 15 entries. It names no catalog file and pins no chain validator or chain test. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 268's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 80 predecessor routes, every catalog walk and round trip, the full payload loop); 268's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ADOPT-005 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_gov_005.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 269-packet membership and count updates; layer tests and the MET-ADOPT-005 layer's checks adjusted solely for the successor bridge; C2's two test changes in 268's test tests/test_met_adopt_005.py; the one-deeper successor hand edit of 267's test tests/test_met_gov_004.py (as 268 made for 266's); the count line of 266's test tests/test_met_linux_008.py, which the cascade skips after 268's hand edit; catalog-membership filters ignoring only the added MET-GOV-005 member; and the current-state text. No sector-catalog set changes (the join set is empty), no read fix and no other hand edit. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority. The new head's test carries 268's generic scaffold with one named exemption (MON-269-B1 (a)): its retain-names test test_changed_historical_tests_retain_their_test_identities skips profile.ORACLE_TEST, the re-issued D5a oracle tests/test_language_placement_oracle.py, which replaces the v1 oracle's test names, and asserts that profile.ORACLE_TEST sits in _PROJECTION_RULES; the oracle stays bound by V1 and V3."]
