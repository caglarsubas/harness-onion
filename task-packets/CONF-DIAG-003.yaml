offlineAcceptanceCommands: [["python3","-c","exec(\"import cProfile as c\\nimport faulthandler as f\\nimport hashlib\\nimport json\\nfrom pathlib import Path\\nimport sys\\nimport sysconfig as sc\\nimport time as t\\nimport unittest as u\\nIDS_SHA='03ab92921cd44154d4658e7e0205ac6134a66cf905ab0baf360f52dc01369a94'\\nROOT=Path.cwd()\\nSTDLIB=Path(sc.get_path('stdlib'))\\nTIMING_ONLY={'test_supervisor.PerformanceArithmeticTests.test_fixed_three_sample_workload','test_supervisor.PerformanceSourceProofTests.test_benchmark_restores_observer_after_workload_exception','test_supervisor.PerformanceSourceProofTests.test_benchmark_refuses_ambient_observer_without_replacing_it',}\\ndef emit(event,**kw):\\n print(json.dumps(dict(event=event,evidenceClass='WORKLOAD_DIAGNOSTIC_ONLY',**kw),sort_keys=True,allow_nan=False),flush=True)\\ndef busy():\\n m=sys.monitoring\\n return any(m.get_tool(i)is not None or m.get_events(i)for i in range(6))\\ndef profile():\\n if sys.implementation.name!='cpython'or sys.version_info[:3]!=(3,12,14):\\n  raise RuntimeError('CPython 3.12.14')\\n p=c.Profile()\\n d={'call':p._pystart_callback,'return':p._pyreturn_callback,'c_call':p._ccall_callback,'c_return':p._creturn_callback,'c_exception':p._creturn_callback}\\n def hook(frame,event,arg):\\n  d[event](frame.f_code,frame.f_lasti,arg,sys.monitoring.MISSING)\\n return p,hook\\ndef clocks():\\n return t.perf_counter(),t.thread_time(),t.process_time()\\ndef label(c):\\n if isinstance(c,str):\\n  return['BUILTIN',0,c[:160]]\\n p=Path(c.co_filename)\\n for root,tag in((ROOT,'SUBJECT'),(STDLIB,'STDLIB')):\\n  try:\\n   return[tag+'/'+str(p.relative_to(root)),c.co_firstlineno,c.co_name]\\n  except ValueError:\\n   pass\\n return['OTHER',c.co_firstlineno,c.co_name]\\nclass Result(u.TextTestResult):\\n def close(self):\\n  if self.h is not None and sys.getprofile()is self.h:\\n   sys.setprofile(None)\\n  f.cancel_dump_traceback_later()\\n def startTest(self,test):\\n  self.p=self.h=None\\n  if sys.getprofile()is not None or busy():\\n   raise RuntimeError('ambient profiler')\\n  super().startTest(test)\\n  emit('case-start',testId=test.id())\\n  self.begin=clocks()\\n  try:\\n   f.dump_traceback_later(30,repeat=True,exit=False)\\n   if test.id()not in TIMING_ONLY:\\n    self.p,self.h=profile()\\n    sys.setprofile(self.h)\\n  except BaseException:\\n   self.close()\\n   raise\\n def stopTest(self,test):\\n  try:\\n   wall,cpu,proc=(a-b for a,b in zip(clocks(),self.begin))\\n   owned=sys.getprofile()is self.h if self.h else None\\n   self.close()\\n   valid=owned is not False and sys.getprofile()is None and not busy()\\n   rows=self.p.getstats()if self.p and valid else[]\\n   def top(key):\\n    return[dict(function=label(e.code),calls=e.callcount,recursiveCalls=e.reccallcount,selfElapsed=e.inlinetime,cumulativeElapsed=e.totaltime)for e in sorted(rows,key=key,reverse=True)[:20]]\\n   emit('case-finish',testId=test.id(),wallSeconds=wall,threadCpuSeconds=cpu,processCpuSeconds=proc,hookOwnedAtFinish=owned,observationValid=valid,functionCount=len(rows),topSelf=top(lambda e:e.inlinetime),topCumulative=top(lambda e:e.totaltime))\\n   if not valid:\\n    raise RuntimeError('interference')\\n  finally:\\n   self.close()\\n  super().stopTest(test)\\ndef identities(s):\\n for x in s:\\n  if isinstance(x,u.TestSuite):\\n   yield from identities(x)\\n  else:\\n   yield x.id()\\ndef main():\\n f.dump_traceback_later(30,repeat=True,exit=False)\\n try:\\n  wall,_,cpu=clocks()\\n  s=u.defaultTestLoader.discover('tests/live_backend','test_*.py')\\n  ids=sorted(identities(s))\\n  digest=hashlib.sha256(json.dumps(ids,separators=(',',':')).encode()).hexdigest()\\n  if len(ids)!=1397 or digest!=IDS_SHA:\\n   raise ValueError('exact inventory required')\\n  emit('discovered',cases=len(ids),idsSha256=digest,wallSeconds=t.perf_counter()-wall,processCpuSeconds=t.process_time()-cpu)\\n  r=u.TextTestRunner(verbosity=2,resultclass=Result).run(s)\\n  emit('finished',cases=r.testsRun,failures=len(r.failures),errors=len(r.errors),skips=len(r.skipped))\\n  return 0 if r.wasSuccessful()and not r.skipped and r.testsRun==1397 else 1\\n finally:\\n  f.cancel_dump_traceback_later()\\nif __name__=='__main__':\\n raise SystemExit(main())\\n\")"]]
