contracts: ["Accepted base is main afee03b93da691cb113da495e3be7e39695756aa, tree 766b07ae06a9888366d0998a8089797cd5b17d8e, holding 283 immutable packets including MET-SECTOR-005. Add MET-VERIFY-006 as the 279th chain packet and publish its products DIST-005A and CTRL-FIX-004 (C = S + P: 286 packets at slot 279). Preserve all 283 predecessor YAML files (DIST-005 at 1cf1826b and CTRL-INTEGRATE-001 at 28441f4f among them), every contract snapshot, review record and status record, the catalogs, the chain-compaction, chain-product-packet and chain-inheritance records and the three earlier identity models unchanged.", "The product packets are c1's bytes, agreed with R11 and R04 by digest: task-packets/DIST-005A.yaml (sha256 6e9c228fdefe20abd981726915968a09609cd1559f7c9ae347e99fc25cbf3702, DIST-005's bytes with exactly six counted edits: id, branch, predecessors [DIST-TRANSPORT-001], its descriptor path, one shared-transport contract and the 22-command list) and task-packets/CTRL-FIX-004.yaml (sha256 c6e837fa926ad89a782b90d8bc7782ba42612a713ca754e497ca05d5feb73760, 16 keys in CTRL-TRANSPORT-001's order, predecessors [CTRL-TRANSPORT-001], 13 allowedPaths, 8 commands); this packet lists both in allowedPaths and its authority records them in productPackets, never in newFiles, and pins their comparators DIST-TRANSPORT-001 and CTRL-TRANSPORT-001 in productComparators; R04's plan gains item 13 and R11's plan item 10, verbatim in their own words; scripts/validate_readiness.py's authority_owner maps both products to MET-VERIFY-006; the task-packet index lists the three new packets; the registry gains exactly one rider, MET-VERIFY-006/packet (kind PACKET, the generic packet brief architecture/review-briefs/REVIEW_BRIEF_PACKET.md, sha256 6dcff68d7e6b01823f1740063e94910edcc159a71a6ee803f1b66c62fd06e274, version 1), appended last; the CONTRACT records stay lane-local.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-SECTOR-005 direct-argv commands unchanged and in order, and add no argv; the products add none: the new layer validator runs inside the outer pytest, whose tests/test_met_verify_006.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict.", "Ownership (MON-279-OWN2 (ii)+(vi), placement P1): validate_packet_ownership stays byte-identical and gives 139 diagnostics, the base's 119 plus exactly the 20 listed messages (12 CTRL-FIX-004 and CTRL-INTEGRATE-001, 8 DIST-005 and DIST-005A); close_superseded_successor_overlaps in the new layer, the outermost call of validate_dispatch_ownership around 275's closer, removes exactly those 20, each only when present once and only while the four listed packets equal their verified bytes, reading the list only from architecture/dist-005a-ctrl-fix-004-publish-pairs.json (sha256 00e80307, R04's and R11's agreed bytes), and otherwise refuses; it carries no predecessor semantics. The 279 decisions are recorded in architecture/dist-005a-ctrl-fix-004-publish-decisions.md; the chain-inheritance records stay byte-identical.", "Add one 286-packet current catalog with an exact 279-to-278 inverse before the accepted 278-to-277 MET-SECTOR-005 layer. The new layer scripts/validate_met_verify_006.py binds PRODUCT_PACKETS = (\"DIST-005A\", \"CTRL-FIX-004\"), keeps the product forms in its class functions (F1-F7, F6' and F9), reads only its era's reviewed bytes, each bound by digest, and checks V1 (the products' frozen bytes and facts, DIST-005A's six-edit difference and CTRL-FIX-004's key order), V2 (this packet's allowedPaths, R04's and R11's items and the meta item), V3 (the registry rider), V4 (139 = 119 + the 20 listed messages, the two allowed-list strings covering exactly 12 and 8, the closer outermost, its pair list), V5 (one added YAML per repository and one YAML per product branch), V6 (the productComparators pins and the inheritance predicate), V7 (DIST-005, CTRL-INTEGRATE-001, R6 and the chain-inheritance records unchanged; the decisions record), V8 (the ownership validator unchanged) and V9 (every weights-table entry its value computed from the pinned inputs record), each with a failing test, and its canonical hunks.", "Inherited validators, tests and documents change only by: the step vocabulary with S 279 and C 286 and its product forms; the MET-SECTOR-005 layer's checks adjusted solely for the successor bridge; C2's test changes in 278's test; the one-deeper successor hand edit of 277's test tests/test_met_perf_045.py; the count lines the cascade skips or cannot class (seven catalog counts, 283 to 286, and the count in tests/test_met_sector_004.py); authority_owner's two product lines; the closer's import and outermost call; CONTRACT_279's site edits (the four conformance raw-count sites, 119 to 139 and 111 to 131 with two pair strings in two tuples, three allowed-list additions, and the V4 era bridges of 276's and 278's tests, whose unordered_sibling counts stay 129/10 and 140/21); the full weights refresh (162 of the 182 entries change, and three are added), from its committed inputs; the rider; R04's and R11's items; and the index docs. The new head's test keeps the full fan-in and the generic retain-names scaffold."]
