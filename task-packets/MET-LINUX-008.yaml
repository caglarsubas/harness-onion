contracts: ["Accepted base is main f9882c1a4d0c2576e773841fe96e1f2e5958473f, tree 297827234db958b1aa0346a6d2525cf326b4780a, holding 265 immutable packets including MET-ENFORCE-042. Add MET-LINUX-008 only, as packet 266. Preserve all 265 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The lane monitor's owner-delegated rulings (recorded in architecture/linux-host-authority/status.json): MON-LHA-CR1-KEEP, MON-LHA-CR2-KEEP and MON-LHA-C8 (the three CONTRACT rounds, the third capped by MON-LHA-CR-CAP), MON-LHA-ORACLE-KEEP (the D5a oracle), MON-LHA-C8-ADOPTED (the adoption of candidate c8 and its two own edits) and MON-LHA-266-GO-1-3 (the slot and the allowed-paths derivation at this base: named 29, bump 240, rider 0, union 266, pass, with no gate class).", "Add architecture/linux-host-authority/: host-authority.json (the superseding record), host-recipe.json (the two hosts, access, egress, inventories and runbook steps), launcher-install.json (the operator install steps, the signed-drop installer and the trigger units) and custody-model.json (the signing authorities, per-run credentials and live custody duties), each with its closed schema, drop-manifest.schema.json, vectors.json and README.md; the offline checker scripts/linux_host_authority.py (standard library only) and its tests tests/test_linux_host_authority.py. No evidence state changes: native AMD64 and ARM64 stay NOT_RUN_ENV_UNAVAILABLE, and approving capacity is not qualification.", "Publish the MET-LINUX-008/contract series in tree: review-round1.json to review-round3.json, the reviewers' v2 records byte for byte, each bound by its review-identity-round<n>.json; status.json ADOPTED (candidate c8), which binds the adopted subject by digest and pins the adoption's two own edits (README.md and tests/test_linux_host_authority.py) at their post-adoption bytes; and the D5a oracle tests/test_linux_host_authority_oracle.py, written outside the candidate by a separate agent and bound by oracle-identity.json (KEEP). Both review series were registered before this packet, so architecture/review-record/briefs.json and the generic briefs are unchanged. No gate class: by the evolution surface record at this base no path of the packet is gate material, so the lane monitor and the owner approve the PR (status.json gate.prApprovers). The evolution surface record itself does not change.", "Add one 266-packet current catalog with an exact 266-to-265 inverse before the accepted 265-to-264 MET-ENFORCE-042 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, refuses a path outside its era before reading it and binds every era file by digest (the adopted subject, the status, the rounds' records and identities, the registry and the two generic briefs). It checks the status (ADOPTED for MET-LINUX-008 at slot 266, with the allowed-paths derivation passing at this base and no gate class); the adopted subject (exactly its fifteen files, each digest equal to this era's bytes, except the adoption's two edits, which equal the post-adoption digests the status records); the reviews (each round's record and identity by path and digest); the oracle (the oracle test and its identity by path and digest); and the registry (exactly one MET-LINUX-008/packet and one MET-LINUX-008/contract entry, each pointing at its generic brief with that brief's digest). It pins no chain validator or chain test. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 265's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 77 predecessor routes, every catalog walk and round trip, the full payload loop); 265's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-042 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_linux_008.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too, over the new rounds, the oracle identity and the oracle test. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 266-packet membership and count updates; layer tests and the MET-ENFORCE-042 layer's checks adjusted solely for the successor bridge; C2's two test changes in 265's test tests/test_policy_observation_digests_v2.py; the one-deeper successor hand edit of 264's test tests/test_met_linux_009.py (as 265 made for 263's); the count line of 263's test tests/test_linux_probe_kit_admission.py, which the cascade skips after 265's hand edit; catalog-membership filters ignoring only the added MET-LINUX-008 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The Linux host-authority contract v1 (candidate c8, adopted after three in-tree CONTRACT rounds): the four records with their schemas, the drop-manifest schema, the vectors and the README under architecture/linux-host-authority/, the offline checker and its tests, the D5a oracle test with its oracle identity, and the status with the three rounds' records and identities.", "A fresh 266-to-265 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier after the lane monitor's and the owner's PR approval."]
excluded: ["Editing any earlier contract or record, the brief registry and the generic briefs, the evolution surface record, the frozen identity rule, docs/DEVELOPMENT_STATUS.md, docs/alpha-2/LINUX_READINESS.md, the harness documents or any R10 or R12 file; changing any byte of the adopted subject (the four records, the schemas, the vectors, the README, the checker, its tests, the D5a oracle test and its oracle identity), the published rounds or their identities; any ci/ file; creating a GCP project, VM, key or spend, running a cloud command, signing or installing a launcher or a drop, trust or root-policy bytes, verifier code or keys, acceptance argv changes, timeout changes, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.", "Any network access during validation."]
