contracts:
  - >-
    Starts only from exact merged mas-harness-industry-packs commit
    a4d3df9b169e95c285e22a2fdb2b4c9d711230e2, white-goods 0.2.0 computed
    pack digest e0ad15c9da5f126c4aa20c88f75d4e9b15808ee841347ba4663dd99664248177,
    raw pack.yaml SHA-256 3bc885342cd43870624a1a188851af2aa314ec333ba87cb8170597f7b3d8f674,
    and framework 0.1.1 wheel SHA-256
    d34a1a3c523b1e60f10602fff072d5dbf83f46f2220f29a4f13b9a31facf91f4.
  - >-
    Consumes public contracts commit
    2146278a95344cd2a8e22596b2f315b46edffc88 and its ApprovalRequest
    v1alpha1 schema at schemas/v1alpha1/lifecycle/approval-request.schema.json
    SHA-256 4fe8d214a920690008a4390919acebf797b0ab4e6c649a7a88e0882f3b2a1b27,
    lifecycle common schema SHA-256
    dce5d8030eea3a19694511eb26513614dcc720ef4e0d650772131b14ed58f075,
    and composition common schema SHA-256
    11b55d3eafa8d87a90956345da0919f67478a7738d5ca118025904f8ff58b5f0;
    no schema bytes or upstream source paths enter product execution.
  - >-
    ControlRequirement and IntegrationDeclaration are named in the architecture
    plan but are NOT_AVAILABLE_IN_BOUND_RELEASE. The packet must record that
    status and must not claim public-schema conformance, invent a public kind,
    or alter mas-harness-contracts. It produces only versioned pack-local,
    data-only IndustryControlRequirementRecordSet and
    IndustryIntegrationDeclarationRecordSet resources for the white-goods
    guidance surface.
  - >-
    Advances only the white-goods sector pack from 0.2.0 to 0.3.0. The common
    pack, contracts lock, journey, ontology, business/data resources, pack
    format 0.1.0, and framework distribution 0.1.1 remain byte-identical.
deliverables:
  - >-
    Add exactly four questionnaires: governance applicability, autonomy/action
    boundary, waiver declaration, and integration declaration. Closed action
    categories are READ_ONLY, REVERSIBLE_WRITE, IRREVERSIBLE_WRITE, and
    UNKNOWN_SIDE_EFFECT; closed autonomy levels are OBSERVE, RECOMMEND,
    APPROVAL_REQUIRED, and BOUNDED_AUTONOMOUS. Questions collect accountable
    roles, tenant-determined applicability and evidence references, policy and
    approval reference ids, separation/quorum, durable-receipt, idempotency,
    compensation or outcome-review, credential-reference and access-scope
    declarations, waiver scope/control/approval/compensating-control/expiry,
    and no executable values.
  - >-
    Regulatory content is a tenant-answerable applicability-candidate map for
    product safety, data protection, cybersecurity, quality management, and
    environmental/energy governance. It contains no legal conclusion,
    jurisdictional assertion, production threshold, or automatic control
    satisfaction; tenant legal/regulatory authority and local evidence remain
    required.
  - >-
    Add exactly four control resources: the immutable public-contract binding,
    pack-local control requirements, pack-local integration declarations, and
    a waiver policy. Control requirements name stable ids, accountable owners,
    applicability inputs, evidence requirements, action categories, waiver
    eligibility, freshness expectations, and promotion disposition.
    Integration declarations cover synthetic API, PostgreSQL, file, and event
    classes, declare read/write and side-effect categories, accept only scoped
    credential reference ids, and contain no endpoint, connection, credential
    value, or executable connector configuration.
  - >-
    The governance rule blocks any write-capable or unknown-side-effect demand
    unless the closed governance-evidence-complete answer is true. The packet
    handler independently fails write compilation without an exact policy
    reference, valid unexpired MUTATION ApprovalRequest, required distinct
    approver quorum, durable-receipt declaration, idempotency reference, scoped
    credential reference and access approval, and compensation or explicit
    outcome-review strategy. UNKNOWN_SIDE_EFFECT always blocks.
  - >-
    Add exactly eleven synthetic governance fixtures: ready read-only, ready
    reversible-write, missing policy, missing approval, missing receipt,
    missing compensation, unknown side effect, self approval, active
    scope-exact waiver, expired waiver, and waiver without compensating control.
    Decisions are READY or BLOCKED with sorted unique stable reason codes.
    An otherwise valid waiver still produces
    WAIVER_DOES_NOT_SATISFY_PROMOTION and remains BLOCKED; expiry or malformed
    scope adds its own reason and never converts evidence to PASS.
  - >-
    Declare nine new questionnaire/control/rule resources plus eleven governance
    fixtures in white-goods 0.3.0 for an exact closed inventory of 52 pack files and 49
    resource ids. Tests remain under tests/white_goods/ and are not pack
    content. Update predecessor business/data tests only for the sector version,
    file/resource inventory, archive name, and packet output version; preserve
    their frozen resource bytes, decisions, digests, and data assessment contract.
  - >-
    Register only the unique governance-integrations Make target with exact
    PACK=white-goods and direct argv to ci/handlers/ind_wg_003.py. Update the
    descriptor-inventory regression without changing Makefile or the dispatcher.
    The handler validates exact predecessor/public bindings, closed questions,
    controls, declarations, rule, fixtures, ApprovalRequest shape, governance
    decisions, two-build index/archive identity, no retained artifact, and false
    publication/deployment/runtime/assurance/tenant-acceptance flags.
excluded:
  - >-
    Legal advice or conclusions, automatic regulatory applicability, public
    ControlRequirement or IntegrationDeclaration schema claims, edits to the
    contracts repository, copied schema or warm-source bytes, warm checkout
    access, real tenant identities or records, credential values, secrets,
    tokens, endpoints, connection strings, remote reads, runtime downloads,
    paid services, executable pack content, connector execution, side effects,
    hard-coded production policy, self approval, implicit approval, automatic
    waiver approval or renewal, waiver-based PASS/promotion, signatures,
    publication, deployment, runtime evidence, assurance evidence, or tenant
    acceptance.
