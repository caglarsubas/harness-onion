expectedEvidence:
  - The exact predecessor commit, 0.2.0 raw pack file and computed digest, framework wheel, public contracts commit, and three public schema digests match immutable packet bindings without mounting or reading a warm-source checkout.
  - The contract-binding record proves ApprovalRequest v1alpha1 is available and records ControlRequirement and IntegrationDeclaration as NOT_AVAILABLE_IN_BOUND_RELEASE; no copied schema bytes or false public-conformance claim exists.
  - Four questionnaires, four controls, one rule, and eleven governance fixtures form the exact declared inventory; all control, declaration, question, fixture, and reason-code ids are unique and closed.
  - READ_ONLY and valid REVERSIBLE_WRITE vectors are READY. Missing policy, approval, quorum/separation, receipt, idempotency, scoped credential reference/access approval, compensation/outcome review, or a known side-effect category is BLOCKED with exact sorted reason codes.
  - Active, expired, malformed-scope, and missing-compensating-control waiver behavior is fail closed; a waiver documents an exception only and production promotion remains blocked until every required control has fresh PASS evidence.
  - Two canonical indexes and fixed-epoch archives of white-goods 0.3.0 are byte-identical and temporary outputs are removed; common.foundation 1.0.0, framework 0.1.1, and every predecessor content byte and decision remain unchanged.
  - Dispatcher inventory includes pack, data-readiness, and governance-integrations with no duplicate target, undeclared variable, shell transport, ambiguous handler, or predecessor regression.
  - Source, candidate, CI, merge, artifact, publication, deployment, runtime, assurance, and tenant acceptance remain separate evidence states; all post-merge operational and tenant states remain false or NOT_RUN_ENV_UNAVAILABLE.
rollback: Revert the unreleased white-goods 0.3.0 governance/integration slice and restore exact IND-WG-002 commit a4d3df9b169e95c285e22a2fdb2b4c9d711230e2 and pack 0.2.0; retain common.foundation 1.0.0, framework 0.1.1, predecessor evidence, and every downstream release, runtime, assurance, or tenant record unchanged.
