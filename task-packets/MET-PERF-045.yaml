uccessor bridge in the precedent's form, its own product kept; C2's test changes in 276's test tests/test_met_sector_004.py; the one-deeper successor hand edit of 275's test tests/test_met_verify_005.py; the count lines the cascade skips (tests/test_met_sector_003.py), cannot class (seven catalog counts, 280 to 281) or refuses as changed since the template (the two C3 tests' catalog counts); the rider; and the index docs. 275's ownership counts (119, closed 111) stay as they are. The new head's test keeps the full fan-in and the generic retain-names scaffold.", "The 1,000 s verify floor is an operating assumption (MON-277-FLOOR: the owner keeps heavy work off the host during each verify and the monitor's load gate holds it until the host is quiet), not a code guarantee; the packet makes no claim about verify time above load about 6 or about the 900 s worker deadline under load."]
