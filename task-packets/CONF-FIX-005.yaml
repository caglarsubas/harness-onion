deliverables: ["Add bounded separate credential custody created only by the fixed native supervisor/hook lifecycle after reservation and isolation. Derive the sole CAMPAIGN_PROXY credential path from the independently verified envelope/profile/capacity; never accept a caller path or FD. Fail unavailable when fixed proxy/policy eligibility is absent.","Retain one first-read root-owned 0400 credential and complete no-follow ancestry through the session; expose only verified immutable bytes to the fixed trusted proxy module. Check substitution, expiry/revocation and owner/process/channel before use and after blocking I/O, without refresh or premature credential opening.","Track only internally created, non-inherited, bounded temporary memfd/transport handles during the active fixed hook; separate persistent credentials from transient I/O. No ambient adoption, arbitrary socket/FD list, monkeypatch or caller callback. Seals and cryptographic/TLS transport validation remain CONF-LIVE-003 responsibilities.","Integrate ownership into peer/ambient checks and invalidation/cleanup on return, exception, cancellation, expiry, initialization failure and close. Close transient handles before hook return while preserving credential custody between operations. Attempt all cleanup after error, retain consumed nonce and never double-close reused FDs.","Preserve behavioral tests and append factory-to-fixed-hook unit regressions for two successive operations, credential first-read ordering, unknown handle injection, substitution, expiry and cleanup. Mock only native OS observations; no test flag grants production eligibility.","Adapt only three source-accounting regions in CustodySourceProofTests: inputs, test_actual_127_path_inventory_preserves_other_122_complete_file_bytes and test_original_279_methods_and_every_added_method_are_freshly_collected. Independently verify actual deltas, all 305 prior IDs and exact approved later inventories with fresh AST-versus-unittest collection. Old p