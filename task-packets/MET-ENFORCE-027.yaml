their exact subject bytes, executes the v4 model from this era's bytes to replay every decision through the reference decision and the compiled program, the worker's stacked filters and every policy mutation, checks the published digests, and restates the gate's rule, its dirfd outcomes on both architectures, the decisions quoted from HS43 and the six unchanged roles' digests.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-026 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_seccomp_v4.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the 900 s parallel-suite worker deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 237-packet membership and count updates; layer tests and the MET-ENFORCE-026 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-027 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
