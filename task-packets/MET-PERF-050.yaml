contracts: ["Accepted base is main cf2535065bf1d79efaccdc6bbc2aebac5bcd2aae, tree e55c1461c12358d22a3fc965ad2bc478914313a7, holding 301 immutable packets including MET-008. Add MET-PERF-050 as the 290th chain packet, a K = 0 step (302 packets at slot 290; the v2.5 reader's steps [1, 1], countPairs []). Preserve all 301 predecessor YAML files, every contract snapshot, review record and status record, the catalogs, the chain-compaction, chain-product-packet and chain-inheritance records, the identity models and the chain-checkpoint ledger; ci/parallel_suite.py stays byte-equal (E2).", "The weights (A2, Q-290-D2): table[f] = round((dryRunUs[f][0] + dryRunUs[f][1]) / 2 / 1000000 * kappa, 1) for every dryRunUs key of the inputs record, and table[k] = headTests[k] for every headTests key (disjoint from the dryRunUs keys); the table holds exactly these keys (raw keys = effective keys, 0 duplicates, 0 stale, every collected worker file keyed), written as json.dumps(table, indent=1, sort_keys=True) plus a newline, with Python 3's round and json.dumps; the head's E1 recomputes it from the record. Under the chain checkpoint's rule W the weights hunks are class other (authored), named in E3 with the corpus-count lines.", "The index docs: docs/MASTER_DEVELOPMENT_PLAN.md's current checkpoint and checklist, docs/repositories/00-harness-engineering.md's current section and item 164, and task-packets/README.md's current section and row 302, in 289's forms.", "The rulings this packet is built under: MON-290-GO-CHAIN, MON-290-SCOPE-FINAL, MON-290-DESIGN-RULE, MON-290-PARSE-GO, MON-290-PARSE-F1, MON-290-F1-GO, MON-290-C13, MON-290-DRY-CALLER, MON-290-DRYC2-RULE, MON-290-CR1-GO, MON-QOS-TRIAL, MON-290-FAST, MON-290-CR1-RULE and MON-290-REV2-OK.", "Forward notes (MON-290-DESIGN-RULE D3; CONTRACT_290 rev 2 section 13): FN-290-1 (T1, declined at 290). The readiness proof's tail: tests/linux_runner/test_build_and_predecessors.py's in-session predecessor proof runs an independent pytest --collect-only over the whole predecessor suite (its line 170) in the parent, after every worker has reported (ci/parallel_suite.py PARENT_NODES); at 289 it was about 13.3 s of the 15.5-15.6 s serial tail. Reason: 290 changes the weights alone (K = 0, MON-290-GO-CHAIN), and the tail is watched outside the packet (threshold 18 s, an alarm at 17 s). A later packet starts the independent collect-only process concurrently with the workers and lets the parent node wait for it, so the proof stays independent, about 10-13 s off the serial tail; it is due when the alarm fires or at the next PERF packet."]
