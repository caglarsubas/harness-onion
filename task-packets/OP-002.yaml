id: OP-002
repository: mas-harness-operator
branch: codex/op-002-preflight-verification
objective: Add deterministic read-only environment preflight and complete offline signed-bundle verification that fails before any Kubernetes apply or tenant workload mutation.
predecessors: [OP-001, DIST-003]
allowedPaths:
  - internal/preflight/
  - internal/verify/
  - cmd/bundle-verifier/
  - tests/preflight/
  - tests/verify/
  - fixtures/preflight/
  - deploy/helm/bundle-verifier/
  - docs/preflight.md
  - ci/run_packet_argv.py
  - ci/targets/op-002.json
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - >-
    Implementation starts from exact merged mas-harness-operator OP-001 commit
    b1544f9dbfd29ad169c6100579fe36d267af55d8. Its accepted pull-request and
    exact-main runs are 33649321337 and 33649487036. The namespaced CRD,
    lifecycle projection, generated artifacts, manager shell, dispatcher,
    workflow, Go closure, inert PORTING ledger, and zero-bill boundary remain
    active and byte-compatible. OP-002 adds no CRD field, lifecycle state,
    condition type, RBAC verb, manager behavior, or tenant mutation.
  - >-
    The release authority is exact merged mas-harness-distribution DIST-003
    commit c44136bbfa6c87d93c68c70c92fd97a6da8d9124. Its accepted pull-request
    and exact-main runs are 33638910112 and 33639066541. The signing,
    supply-chain, license, and vulnerability implementation byte SHA-256 values
    are fe81156ef620480d2ed962858272493c6ca800608ecdc00bb368e1d76660fa95,
    3594849e64e3bf7a9f23c55b4e5e07628e5f749b8aa00d8f6b2966e626d08109,
    5fc348278e413cff1d4646e1e9c32d20aa457c318648d301a34e3c35ea35ea84,
    and e872f99a861683dbada01a1cd9853c04bc6639caf9b3f5b49a4d4ae7d189c60d.
    No distribution checkout is mounted or opened during implementation or
    acceptance; fixtures independently encode only the pinned public wire
    facts stated here.
  - >-
    A locked preflight request closes platform kubernetes|openshift|k3s,
    architecture amd64|arm64, Kubernetes minimum/maximum minor, storage class,
    minimum allocatable CPU/memory/ephemeral storage, connectivity
    connected|bridge|silo|airgap, sandbox requirement, selected modules,
    profile digest, bundle digest, and release digest. A read-only observation
    contains only locally supplied platform/version/architecture/capacity,
    storage-class presence, network mode, and sandbox availability. Evaluation
    is pure, order-independent, and emits the closed conditions
    PLATFORM_SUPPORTED, ARCHITECTURE_MATCHED, VERSION_SUPPORTED,
    CAPACITY_AVAILABLE, STORAGE_AVAILABLE, NETWORK_MODE_MATCHED,
    SANDBOX_AVAILABLE, and LOCK_BINDINGS_MATCHED with PASS or BLOCKED and one
    bounded reason code. Unknown fields/enums, malformed quantities, or
    absent observations block.
  - >-
    The verifier accepts one already-local regular directory and caller-fixed
    whole-second UTC verification time. It rejects symlinks, hard links,
    devices, sockets, traversal, duplicate/case-fold-colliding names, unknown
    files, non-canonical JSON, unknown members, mutable image/chart references,
    and any digest/size mismatch before invoking signature verification. Exact
    allowed release files and component payload/signature pairs are derived
    from release-manifest.json; exact OCI files/blobs are derived from
    bundle.lock.json. Complete closure means no expected file is absent and no
    undeclared file is present.
  - >-
    Verification checks signed-release self-digest and SIGNED state; exact
    bundle-lock/evidence/root-manifest/root-signature/trust-file/approval
    digests; profile, organization, release-key, component, OCI, and evidence
    subject agreement; SCANNED supply-chain state; every component license
    decision ACCEPTED; no unresolved HIGH or CRITICAL vulnerability; model
    custody decisions ACCEPTED; and complete selected-module/platform closure.
    It never invents a missing record, accepts a warning as pass, evaluates a
    new license policy, or performs an online vulnerability query.
  - >-
    Trust verification admits only release-trust-bundle/v1alpha1 with strictly
    increasing caller-pinned minimum sequence, exact self-digest, exact public
    key set/file digests, unique key ids, sorted unique roles, ACTIVE or
    RETIRING state, BUNDLE_RELEASE role, and notBefore <= verificationTime <
    notAfter. A revocation effective at or before verificationTime blocks. Key
    removal, role mismatch, duplicate id, unknown role/state, stale sequence,
    malformed time, missing key, extra key, and public-key digest drift block.
  - >-
    Root and component signatures are verified only by root-owned
    /opt/planeon/bin/cosign v3.1.1 with SHA-256
    e1775d26440ce3f57a95599d34d2b976c6400e06d1b31b6bea927f4857e3fe18.
    It receives direct argv verify-blob --offline --insecure-ignore-tlog --key
    <exact-key> --bundle <exact-bundle> <exact-payload>, an empty temporary
    HOME, stdin closed, and no shell. No private key, keyless flow, Fulcio,
    Rekor, timestamp service, remote trust root, environment-selected binary,
    or network fallback is permitted.
  - >-
    Verify returns either one immutable VERIFIED receipt containing request,
    observation, profile, bundle, release, trust, evidence, and verifier
    digests plus condition results, or one bounded refusal code. The caller
    supplies a MutationSink whose Apply count must remain zero until the full
    receipt exists. Every negative vector asserts zero calls. OP-002 itself
    never supplies a Kubernetes-backed sink, never writes status, and never
    marks installation, deployment, runtime, assurance, or tenant acceptance.
  - >-
    cmd/bundle-verifier requires direct argv --request, --observation,
    --bundle-root, --verification-time, and --output. Inputs and output must be
    absolute non-symlink paths; output must not exist. It writes one canonical
    JSON receipt atomically only after all checks pass and emits only the
    bounded refusal code on stderr. The Helm Job uses a digest-only image,
    explicit read-only bundle/request/observation/trust projections, one
    bounded writable receipt emptyDir, dedicated non-automounted service
    account, no Kubernetes API token, no RBAC, no network service, and the same
    non-root/read-only/RuntimeDefault/drop-ALL/resource limits as OP-001.
  - >-
    ci/run_packet_argv.py receives a bounded transport correction: remove the
    OP-001-only packet-id literal and accept only packets whose repository is
    exactly mas-harness-operator while preserving the exact inline execution
    contract, direct argv parsing, packet digest recheck after every command,
    authority-path scrubbing, fixed Go isolation, forbidden command tokens,
    and OS network canary. No Makefile, ci/run_make_target.py, OP-001 handler,
    workflow, PORTING ledger, dependency, or toolchain change is authorized.
    The regression proves OP-001 and OP-002 are accepted and a foreign
    repository/id, duplicate identity, shell command, changed packet, or leaked
    authority is rejected.
  - >-
    make prefetch remains first through the unchanged OP-001 handler.
    ci/targets/op-002.json owns only preflight-fixtures,
    bundle-verifier-test, and security direct-argv handlers. Because the
    bootstrap Makefile exposes no generic later-packet target and is immutable,
    acceptance invokes those handlers directly through the existing closed
    ci/run_make_target.py dispatcher; no Makefile edit or bypass is authorized.
    zero-bill remains last through the OP-001 Make handler. Every test uses
    committed local fixtures, temporary directories, the immutable Go module
    cache, and root Cosign; it performs no package, image, cluster, registry,
    or trust download.
deliverables:
  - Closed preflight request/observation/result types, quantity/version comparison, deterministic condition ordering, and complete supported/blocked fixture matrix.
  - Canonical local bundle/trust/supply-chain/OCI/signature verifier, immutable receipt, bounded reason codes, fail-before-apply sink gate, and direct-argv CLI.
  - Digest-only non-networked verifier Job chart with read-only inputs, bounded receipt output, no API token/RBAC, and arbitrary-UID-compatible pod security.
  - Repository-scoped packet transport correction and packet-local Make descriptor preserving all bootstrap authorities.
excluded:
  - Kubernetes discovery, API-server calls, apply/status mutation, cluster/cloud checks, Red Hat entitlement, network artifact fetching, private signing keys, policy invention, online scanner, image build, registry mutation, or destructive behavior.
  - OP-003 foundation resources, optional modules, installation/deployment/runtime evidence, assurance, tenant acceptance, or any PASS inferred from unavailable input.
  - Warm-source access, hosted runners, Actions artifacts/caches/packages, API keys, credentials, external telemetry, runtime downloads, mutable references, or billable services.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["python3","ci/run_make_target.py","preflight-fixtures"],["python3","ci/run_make_target.py","bundle-verifier-test"],["python3","ci/run_make_target.py","security"],["make","zero-bill"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - Supported Kubernetes, OpenShift, and K3s plus amd64/arm64, version boundary, capacity, storage, connectivity, sandbox, and exact-lock vectors produce byte-identical ordered results twice; every missing/malformed/mismatched input blocks.
  - Valid local signed fixture verifies root and every component signature, complete file/OCI/module/platform closure, SCANNED evidence, accepted licenses/model custody, vulnerability disposition, trust sequence/time/role/key set, and emits one deterministic VERIFIED receipt.
  - Tampered, incomplete, extra, non-canonical, symlink, hard-link, traversal, case collision, revoked, expired/not-yet-valid, stale-trust, wrong-role/key/architecture/platform/network, unlicensed, unresolved-vulnerability, sandbox-unavailable, and digest/size mismatch vectors return their bounded reason and call the mutation sink zero times.
  - Transport regression proves the OP-001 and OP-002 packet shapes remain executable while foreign, duplicate, mutated, shell, leaked-authority, or environment-widened transports fail closed; all OP-001 dispatcher and generated/API/controller checks remain reachable unchanged.
  - Signed hash-pinned acceptance passes prefetch, preflight-fixtures, bundle-verifier-test, security, and zero-bill in one deny-all-network process tree. Source, PR CI, merge, exact-main, artifact, deployment, runtime, assurance, and tenant acceptance remain distinct evidence states.
rollback: Revert the unreleased preflight/verifier/CLI/chart/descriptor and transport correction together to exact OP-001 commit b1544f9dbfd29ad169c6100579fe36d267af55d8. No sink or Kubernetes mutation has occurred and no receipt may be reinterpreted as installation or runtime evidence.
