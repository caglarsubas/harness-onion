contracts:
  - Consumes the exact SDK-006 guardrail API from mas-harness-sdks commit a181302f81bf6a83760cfae3890551ace89f51e4 and reproducible planeon-harness-sdk 0.1.0 wheel SHA-256 9b85d01b7079fe27c189d70b7fba46614c3df647d6f44e9270fe4683d7337fa4; SDK source or fixtures are not mounted, copied, or required during implementation or acceptance.
  - Consumes mas-harness-contracts commit 2146278a95344cd2a8e22596b2f315b46edffc88, release-manifest SHA-256 c5dd4c39d1c69d07f8d8de3d1a09584bb906172fee2d5ac20ad25ff344b0db79, EvidenceRecord schema SHA-256 05ea50ee0ad9fb74414871c8c3fa572e9f1a22bbc667194f911834f26b829674, lifecycle common schema SHA-256 08326b0089973097698776011a2d5c386cd6e0e6490642f1b9bfd942d6f7e409, and trust OpenAPI SHA-256 b16d5bd0a16186c4a6c98c5fce938f1b9e2c8fda562586f1466715de0b531271 without claiming a guardrail route or event absent from that upstream snapshot.
  - Produces packet-local guardrail HTTP API v1 with authenticated POST /trust/v1/guardrails:evaluate, POST /trust/v1/guardrails/streams, POST /trust/v1/guardrails/streams/{streamId}:push, and POST /trust/v1/guardrails/streams/{streamId}:finish routes plus health endpoints. Tenant identity is derived only through the TRUST-001 signature-verified OIDC boundary and every caller-supplied tenant field is rejected.
  - Produces signed guardrail-profile artifact v1 with Ed25519 purpose GUARDRAIL_PROFILE, exact tenant binding, validity window, monotonically increasing version, predecessor digest, artifact digest, atomic activation, last-known-good rollback, and revocation-over-rollback semantics. Active profile selection is tenant plus profileId; stage is fixed by the active signed profile rather than supplied by an evaluation request.
  - "Produces content-free internal decision/audit records and contract-valid EvidenceRecord objects in RECEIVED state on the SECURITY axis. These records are evidence intake candidates only: this packet cannot mark them VERIFIED, emit a HarnessCloudEvent type absent from the pinned schema, certify a control, satisfy governance, or establish tenant acceptance."
deliverables:
  - The unary request body is exactly profileId and content. The response is the SDK-006 GuardrailResult plus decisionId, profileDigest, contentDigest, contentBytes, evaluatedAt, released, and evidenceRecord; raw input, subject identity, token material, detector exception detail, and an unredacted payload never appear. released is true only for ALLOW or REDACT; an explicit SDK FAIL_OPEN profile controls detector continuation but never converts ERROR_FAIL_OPEN into releasable content.
  - The stream-create body is exactly profileId and returns a tenant-bound opaque streamId with state OPEN and nextSequence 1. Push accepts exactly sequence and a non-empty content chunk; finish accepts exactly sequence. Sequence must be monotonic, cumulative content remains bounded by the signed profile, complete bounded content is re-evaluated on every push for cross-chunk matches, and raw stream content is cleared on DENY, QUARANTINE, ERROR_FAIL_CLOSED, finish, expiry, or eviction.
  - Streaming state is per-process and tenant-keyed with at most 128 active sessions per tenant, a 60-second idle TTL, and states OPEN, TERMINATED, FINISHED, or EXPIRED. Unknown, cross-tenant, replayed, out-of-order, expired, terminal, and finished operations fail with stable content-free reason codes; no streaming payload is persisted or logged.
  - Only closed, synchronous, deterministic, dependency-free local detector implementations are admitted to the service registry. They receive only the SDK stage and content, perform no I/O, network, subprocess, model, plugin, dynamic import, runtime download, or external telemetry, and return SDK-006 findings. Missing, duplicate, throwing, or malformed detectors follow the SDK fail-mode contract; no untrusted detector extension is loaded in-process.
  - Profile activation validates the closed embedded SDK GuardrailProfile and detector configuration before signature verification and atomic switching. INPUT and RUNTIME profiles must be FAIL_CLOSED. FAIL_OPEN is admitted only for OUTPUT or STREAMING and remains visibly degraded and non-releasing on detector error.
  - Decision, audit, and EvidenceRecord intake-candidate persistence is one atomic metadata-only commit. Evidence has recordState RECEIVED, axis SECURITY, producerAuthority PLATFORM, campaignGenerated false, a PASS result only for ALLOW, WARN for REDACT, FAIL otherwise, a profile-digest subject, a digest of the content-free decision envelope, and profile provenance digest. A commit failure returns AUDIT_COMMIT_FAILED and no successful evaluation response.
  - Independent product fixtures cover every SDK stage/outcome/fail mode and do not copy SDK-006 fixtures. They prove active-profile selection, signature/digest/version/revocation failures, UTF-8 limits, deterministic precedence, Unicode redaction, protected-sentinel absence, cross-chunk detection, sequence/state/TTL/capacity failures, content clearing, OIDC tenant derivation, cross-tenant denial, atomic evidence failure, and exact response/schema closure.
  - migrations/guardrails/001_guardrails.sql defines distinct owner, migrator, runtime, and evidence-writer roles; tenant-scoped profile metadata, decisions, and evidence outbox; ENABLE plus FORCE ROW LEVEL SECURITY; transaction-local tenant context; least privilege; and append-only decision/evidence records. It never stores raw or redacted content, and offline SQL tests do not claim that PostgreSQL ran.
  - The guardrail-service Helm chart is install-inert until an operator supplies an immutable image digest and existing OIDC registry, public profile-keyset, active-profile, and database Secret references. It creates no namespace, database, identity provider, secret value, registry, storage class, cloud resource, or billable service; uses non-root OpenShift-compatible security defaults; and denies egress by default.
  - TRUST-002 evolves pyproject.toml and uv.lock only to replace the SDK-003 wheel source with the exact SDK-006 wheel in /opt/planeon/wheelhouse/trust-002 while retaining the exact Python 3.12.14, cryptography 49.0.0, cffi 2.1.0, and pycparser 3.0 closure. The new packet-local prefetch handler and toolchain lock verify installed guardrail symbols, wheel digests, lock bindings, regular non-symlink files, and zero network requirement; TRUST-001 lock and handler remain unchanged.
  - ci/targets/trust-002.json adds cumulative direct-argv handlers for prefetch, guardrail-vectors, streaming-failure-matrix, security, and zero-bill without editing bootstrap-owned Makefile or ci/run_make_target.py. Duplicate, ambiguous, unknown, shell-based, or undeclared-variable dispatch remains fail-closed.
excluded:
  - Paid or remote moderation, provider APIs, API keys, hosted models, classifier/model downloads, Presidio packaging, asynchronous or network detectors, dynamic plugins, arbitrary regular expressions, shell execution, runtime dependency resolution, cloud provisioning, or external telemetry.
  - Raw protected content, redacted content, token/claims, subject identity, detector exception text, signing private keys, or secret values in persistence, evidence, outbox, telemetry, logs, console output, fixtures expected output, or CI artifacts.
  - Guardrail governance decisions, waivers, approvals, control verification, certification, promotion, public lifecycle event invention, EvidenceRecord state advancement beyond RECEIVED, deployment/runtime proof, or tenant acceptance.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["make","guardrail-vectors"],["make","streaming-failure-matrix"],["make","security"],["make","zero-bill"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - Two independent builds from exact SDK-006 commit a181302f81bf6a83760cfae3890551ace89f51e4 produce wheel SHA-256 9b85d01b7079fe27c189d70b7fba46614c3df647d6f44e9270fe4683d7337fa4; prefetch proves the frozen four-package local wheel closure and required guardrail API symbols under Python 3.12.14 with no network or source checkout.
  - Product-owned vectors prove byte-equivalent SDK result behavior independently of the upstream fixture file, exact HTTP request/response schemas, fail-closed active-profile admission, OIDC-derived tenant binding, and no caller-controlled tenant field.
  - Signature, artifact/profile digest, validity, version, predecessor, atomic switch, rollback, revocation, wrong tenant, wrong purpose, malformed detector, missing detector, and injected atomic commit vectors produce stable content-free failures and no partial state.
  - Streaming vectors prove split-match detection, monotonic sequencing, tenant isolation, 1,048,576-byte cumulative bound, 60-second idle expiry, 128-session tenant cap, all terminal transitions, post-terminal refusal, and raw-buffer clearing.
  - Protected sentinel scanning proves raw and redacted content, credentials, token claims, subject identity, detector exception detail, and private keys are absent from decision/audit/evidence/outbox persistence, captured output, logs, chart defaults, and committed fixture expectations.
  - Evidence vectors prove exact EvidenceRecord schema closure in RECEIVED state, SECURITY-axis result mapping, campaignGenerated false, content-free evidence digest, profile provenance digest, and inability of guardrail evaluation to emit VERIFIED evidence, certify a control, or create tenant acceptance.
  - SQL and Helm static/security vectors prove forced tenant RLS, least privilege, append-only metadata, no payload columns, digest-only images, existing-Secret references, non-root OpenShift compatibility, deny-default egress, and install-inert defaults. PostgreSQL, Kubernetes, OpenShift, image build, deployment, runtime, and tenant acceptance remain NOT_RUN_ENV_UNAVAILABLE.
  - The signed hash-pinned deny-all-outbound run passes cumulative prefetch, guardrail-vectors, streaming-failure-matrix, security, and zero-bill targets; Make dispatch stays direct-argv and closed, PORTING remains NO_AUTHORIZATION, no GitHub cache/artifact/package or hosted runner is used, and no warm-source path is mounted or observed.
rollback: Atomically reactivate only the immediately previous verified, unexpired, non-revoked signed guardrail profile, clear every volatile stream buffer, and preserve append-only decision/evidence metadata. Revert TRUST-002 code, descriptor, SDK-006 lock/source binding, migration, and chart together; never delete evidence, reactivate revoked profiles, downgrade to SDK-003 while guardrail code remains, or claim rollback as deployment/runtime proof.
