id: MET-LINUX-002
repository: Harness-Engineering
branch: codex/met-linux-002-linux-runner-kit
objective: "Implement a portable, root-custodied Linux trusted-offline launcher candidate and reproducible operator kit without installing or claiming a Linux host pass."
predecessors: ["MET-LINUX-001"]
allowedPaths: ["ci/linux-runner/","tests/linux_runner/","docs/linux-runner/"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
prefetchCommands: []
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
contracts: ["Consumes docs/alpha-2/LINUX_READINESS.md and the unchanged trusted-runner manifest, offline argv and live-runner contracts.","Produces a source-tested Linux launcher candidate, fixed direct-argv build recipes and operator preflight; installation remains separately signed external host maintenance."]
deliverables: ["Implement ci/linux-runner/launcher.py and deterministic build.py using only already locked Python standard-library tooling; produce candidate launcher and SHA-256 inventory, never install root files from repository code.","Implement ci/linux-runner/preflight.py and tests/linux_runner/ against Linux Firejail deny-all networking, exhaustive warm-root read/metadata/write denial, hidden credential homes/control sockets, packet/manifest tamper rejection, process descendants and environment scrubbing. Missing kernel/backend/privilege reports NOT_RUN_ENV_UNAVAILABLE; never fall back to unisolated execution.","Preserve the exact signed manifest and packet digest, root ownership, command order, local cache inventories and per-command digest checks. Do not re-use a Darwin preflight, command result, sandbox profile or native binary as Linux proof.","Publish docs/linux-runner/OPERATOR.md and closed build-input specification for operator-supplied pinned Linux AMD64/ARM64 toolchains, source trees and local caches. Linux-native dependencies and standalone Next.js output must be built in the declared Linux target, independently of macOS build folders.","Test malformed manifests, altered packets, unsafe paths, shell argv, wrong architecture/libc/toolchain, unpinned or missing caches, writable trust, runner credentials, child network/socket/source access, and byte-identical deterministic packaging. Run the real integration subset only when the trusted Linux backend exists; synthetic adapter tests are explicitly source-only."]
excluded: ["Root installation, workflow edits, product code, cloud or VM provisioning, package downloads, new keys, raw Docker/CRI socket grants, source observation, Linux runtime PASS and tenant acceptance."]
offlineAcceptanceCommands: [["uv","run","--offline","--frozen","--no-sync","python","-m","pytest","tests/linux_runner"]]
expectedEvidence: ["Candidate source/tests/package digests and negative-test results are separate from fresh operator-installed Linux isolation evidence; macOS unit results cannot close the Linux gate.","An external operator must review the candidate, install signed hash-pinned bytes with rollback and execute every required negative probe on the named Linux host before CONF-LINUX-001 live execution."]
rollback: "Revert the unconsumed candidate; installed host rollback is an independent operator transaction to the previously verified signed launcher and trust bundle."
