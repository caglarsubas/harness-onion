wed_bytes and refuses a path outside its era before reading it. It binds the contract, the status, the five review records, the round copies, the model and the four argument models and the check-kinds record by digest before parsing; checks the five rounds against their records, the README's one adoption edit and the redaction by digest; executes the five models from this era's bytes; and replays all 95 cases, 3 raw texts, 18 selection rows, 2 kinds cases and 2 run-events v1 embeddings in the validator.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-032 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_topology_coordination.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 245-packet membership and count updates; layer tests and the MET-ENFORCE-032 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-MAS-004 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
