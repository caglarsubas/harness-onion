contracts: ["Accepted base is main 9184f5b636e6226c1b9040b54b90508966ca001b, tree 5f472ed2f44ce0ee13f7e1451cd676fc5e156da9, holding 266 immutable packets including MET-LINUX-008. Add MET-GOV-004 only, as packet 267. Preserve all 266 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The owner's language policy LANG-D2 (a), and the lane monitor's owner-delegated rulings MON-GOV4-C1 (the D5a oracle, KEEP) and MON-GOV4-ADOPTED (the adopted contract: c1, the ADR, the data, the checker and its tests and the status line; c2, the D5a oracle and its identity; c3, the ADR's CONTRACT r1 text errata), MON-GOV4-267-B (c4, the checker's R5 locating each cited span by its content, and c4a, the ADR's matching consequence sentence) and MON-GOV4-C5 (c5, the re-issued D5a oracle, which copies by real copies, and its identity).", "Add docs/adr/0010-language-placement.md (the policy as one line between its policy markers, whose sha256 is the policy digest, and the four tables, repositories, deployables, outside the catalogue and exceptions, each rendered deterministically from the data between its own markers), architecture/language-placement.json (closed at every object: the two catalogue pins, the repository rows, the deployable rows, the closed outside-catalogue rows and the exception rows, each bound by digest to the source lines that state it) and the minimal offline checker scripts/language_placement.py (check only; the standard library and scripts/safe_yaml.py) with its tests tests/test_language_placement.py. docs/DEVELOPMENT_STATUS.md gains one line citing the ADR; the README is unchanged. No row is implemented, moved or rewritten: the exceptions stay pending LANG-HOTPATH-DECISION-001.", "Publish the D5a oracle tests/test_language_placement_oracle.py, written outside the candidate by a separate agent and bound by architecture/oracle-identity-language-placement.json (KEEP). Register this packet's review series in architecture/review-record/briefs.json: one PACKET entry, MET-GOV-004/packet, pinning the generic packet brief by sha256. Gate material: exactly one path, architecture/review-record/briefs.json (the MET-GOV-004/packet rider), class GATE_REVIEW_PROCESS by the evolution surface record at this base, approver OWNER, so the merge is the owner's per-PR approval bound to the head. The evolution surface record itself does not change.", "Add one 267-packet current catalog with an exact 267-to-266 inverse before the accepted 266-to-265 MET-LINUX-008 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, refuses a path outside its era before reading it and binds every era file by digest (the seven adopted files, the registry and the generic packet brief). It checks the adopted files (exactly the ADR, the data, the checker, its tests, the oracle test, the oracle identity and docs/DEVELOPMENT_STATUS.md, each pinned by the sha256 of its adopted bytes); the data's policy pin (language-placement.json in its own schema, naming the ADR, with policySha256 equal to the LANG-D2 (a) digest); the oracle (its identity names the oracle test, and its file.sha256 equals the oracle test's bytes); and the registry (exactly one MET-GOV-004 entry, its PACKET series, pointing at the generic packet brief with that brief's digest). It pins no chain validator or chain test. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 266's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 78 predecessor routes, every catalog walk and round trip, the full payload loop); 266's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-LINUX-008 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_gov_004.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 267-packet membership and count updates; layer tests and the MET-LINUX-008 layer's checks adjusted solely for the successor bridge; C2's two test changes in 266's test tests/test_met_linux_008.py; the one-deeper successor hand edit of 265's test tests/test_policy_observation_digests_v2.py (as 266 made for 264's); the count line of 264's test tests/test_met_linux_009.py, which the cascade skips after 266's hand edit; the named sector-catalog tripwire joins in tests/test_sector_catalog.py (MON-GOV4-C5: LITERAL_READERS gains scripts/language_placement.py and its two tests, PINNING_RECORDS and NAMING_RECORDS gain architecture/language-placement.json); catalog-membership filters ignoring only the added MET-GOV-004 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
