contracts:
  - Consumes source reuse authorization v1 and product compatibility adapters.
  - Produces warm-source parity registry, vector, result, and evidence v1 without source access.
  - >-
    Implementation base is exact merged CONF-001 main commit
    06858c17cbb254571aeecaae66fdfc2e43a84f1b. Its accepted pull-request run is
    33666746517 and exact-main run is 33666999796. The exact source-package and
    schema Git trees are 89b927313768b5a2dd931bc2ac40cef8146af49d and
    6e022aced0d3220d95558d4a4d582fe9fdae47e2. Makefile, dispatcher, offline
    wrapper, toolchain lock, inert PORTING ledger, and meta campaign byte
    SHA-256 values are bb652db371113bab5d9d8924f0b10b1f85793c0cc84178d447ab1095f4e7b981,
    0a0f5c2d6305a1772848ba2e58b8c3d17321de3fe5fdc99377515e09c1138389,
    335c857bbac638987c2a389355be3e4cbc11d34a81fcab990380a5cd406ec3ef,
    40a0cbb9fc244a8484b22494b6bfa070fbc76aec0edd86ab690026f6a8027bfc,
    69af26b731e28920bb4cc5dd25f6d1d1c18aa75308d75517d6a61f214fa238c4,
    and 22091f996b03eae43f8d00da3ec08c85ad12aef2cbb7d0d4ca8b79df8b705386.
    CONF-002 preserves Makefile, ci/run_make_target.py, toolchain.lock, PORTING,
    all schemas, and all CONF-001 handlers unchanged.
  - >-
    Public provenance authority is Harness-Engineering commit
    95d14248d6bfcfbcbec48a7372d7f2d3bfb19ce6. Its reuse-path-index and reuse-map
    byte SHA-256 values are 5e6843e56b0e4f884400848277c8c3a14b8d0c1d21bf66933a0f5bf0a712c283
    and 77a7a1613cd7584ed692d8ca8db64e0142ec536d9fa9654da3cd3867075589b8.
    The registry may consume only repository, commit, path, recordType,
    gitObject, useModes, license status, and reuse disposition already published
    there. It never reads a warm checkout or fetches a Git object.
  - >-
    parity/registry.yaml is JSON-compatible YAML with a closed top-level shape:
    schemaVersion, provenanceAuthority, records, vectors, and exclusions.
    Records are unique by repository, commit, and path; bind exact 40-hex Git
    objects; remain REFERENCE_ONLY or DISCOVERY_ONLY; carry no content bytes,
    source digest reconstructed from content, copy authorization, or behavioral
    assertion not supported by public planning. Vectors are unique, bind one or
    more records, one packet-owned fixture and adapter, exact direct argv,
    expectedRelation EXACT, INTENTIONAL_DIVERGENCE, or
    UNTESTABLE_NO_DESTINATION_TARGET, and a required reason for every non-EXACT
    relation. Exclusions always include cloud, billing, provider keys, network,
    mutation, and source execution.
  - >-
    The minimum registered blob provenance is model usage contract object
    c3ac327e2989ffbbc2452209e2a32f76be911534, model routing object
    68340eccbe4f7784f80788967add702995d0424b, request identity object
    657b26d35244cc28fe2ce4339af3f67082d76b29, upstream resilience object
    c110ed4d990736b2dc126b3c218333ab7cb16899, white-goods pack object
    b18e6d7099220d1b6a2e6797097400a9b3e4e510, data-batch schema object
    aaf77198b1ef680d1f6fa8deaaca1d198f1796a8, connector-profile schema object
    224728dadb9c9829494c4db04fd9c90833c7bc30, data contract-test object
    4e197257af4b372e4e9d949d7b6a23d3cbfed51f, and local-only object
    988ed77cce9beaea8c6c5c0c15fbee2e4b02ce61. These object IDs are provenance,
    never permission or content hashes.
  - >-
    Packet-owned vectors are independently authored closed JSON with only
    vectorId, family, input, expected, and exclusions. They cover tenant-neutral
    usage identity, fail-closed routing, bounded upstream retry, closed data
    batches with lineage, closed connector discovery, local-only operation, and
    a white-goods foundation manifest. They contain no copied fixture, source
    output, business payload, credential, URL, model weight, or source-derived
    expected byte sequence.
  - >-
    Packet-owned adapters are dependency-free Python and select handlers from a
    closed family table; no dynamic import, executable, subprocess, shell,
    network, filesystem mutation, or source invocation is permitted. Each emits
    one canonical result containing vectorId, relation, status, reasonCode,
    observationDigest, and provenance record IDs. EXACT vectors pass only on
    structural equivalence; intentional divergence passes only when the
    registry's public reason matches; unavailable destination behavior is WARN
    with UNTESTABLE_NO_DESTINATION_TARGET and never becomes PASS.
  - >-
    campaigns/parity/campaign.json is an OFFLINE_TEST campaign and may originate
    UNIT evidence only. It asserts registry closure and runs packet-local vectors;
    it does not claim source execution, warm parity, product integration,
    deployment, runtime, assurance, or tenant acceptance.
  - >-
    CONF-002 corrects only the already merged wrapper's packet reachability.
    ci/verify-offline.sh delegates to ci/run_packet.py after verifying the root-
    owned packet is regular and unchanged. The new standard-library runner reads
    the packet exactly once, accepts only the inline JSON prefetchCommands and
    offlineAcceptanceCommands members, validates the closed offlineExecution
    record, unsets and withholds the packet path from every child, direct-executes
    prefetch first and then acceptance in the same inherited OS-isolated process
    tree, and rechecks the opened packet descriptor and digest after every argv.
    It rejects YAML aliases, duplicate authority fields, shell executables,
    command strings, recursive verify targets, downloads, zero commands,
    unexpected fields, missing offline markers, or packet replacement. This
    generic transport supports later conformance packets without further wrapper
    edits; Makefile and dispatcher remain untouched.
  - >-
    ci/targets/conf-002.json registers only parity-registry-check and parity-meta,
    using direct Python argv into packet-owned adapters/tests. The inherited
    dispatcher executes descriptors in lexical packet order and preserves every
    CONF-001 handler. No generic campaign target is re-registered.
  - >-
    Signed acceptance runs under the exact CONF-002 packet through the root-owned
    offline launcher on a public-repository ephemeral credential-free runner.
    No hosted runner, artifact/cache/package upload, cloud or billing API,
    third-party key, runtime download, mutable reference, public fallback,
    external telemetry, privileged socket, or live campaign is allowed.
deliverables:
  - Closed reference-only path and Git-object registry with public provenance locks, explicit dispositions, exclusions, and no copied bytes.
  - Independent clean-room vector fixtures and bounded model/data parity adapters with deterministic canonical results.
  - Offline parity campaign, registry and adapter tests, relation and untestable semantics, and parity documentation.
  - Exact CONF-002 target descriptor plus the one-time generic packet runner and wrapper correction required for all later conformance packets.
excluded:
  - Opening, mounting, fetching, executing, importing, copying, adapting, translating, or hashing content from either warm-source repository.
  - Running an original warm test command, cloud, billing, provider, network, load, mutation, live, or paid evaluation; inferring behavior from a filename beyond published planning; or treating an intentional change or untestable target as exact parity.
