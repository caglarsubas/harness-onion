contracts: ["Accepted base is main 675daccbc8a060d88245f79bf124f0cc6c59d0c2, tree 867d0baff9f236e86acded4aa1b3f1680d36fddd, holding 263 immutable packets including MET-LIVE-004. Add MET-LINUX-009 only, as packet 264. Preserve all 263 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The lane monitor's owner-delegated rulings (2026-10-24, recorded in architecture/linux-root-aliases/status.json): MON-RA2-NEXT (the allowed-paths derivation, binding before the CONTRACT round and re-run at this base: named 25, bump 236, rider 1, union 258, pass), MON-RA-SERIES (the packet's own registry rider), MON-RA-R1-KEEP and MON-RA-R2-KEEP (the two CONTRACT rounds), MON-RA-ORACLE-KEEP (the D5a oracle) and MON-RA-SLOT-264 (the slot, after LPK-1 took 263).", "Change the native runner kit for the signed root-alias contract: ci/linux-runner/common.py (VERSION, ROOT_ALIASES, the record validator, validate_inputs() v4 and system_inventories(..., root_aliases)), ci/linux-runner/launcher.py (the record among the authority files, loaded, passed into isolation and re-checked there) and ci/linux-runner/prepare.py (--root-aliases for a v4 request only); docs/linux-runner/BUILD_INPUTS.md and OPERATOR.md; and the vectors tests/linux_runner/test_root_aliases.py. v3 inputs and their inventories are unchanged and v4 is opt-in through a signed record; tests/linux_runner/conftest.py, test_system_inventory_v2.py and test_toolchain.py are unchanged.", "Add architecture/linux-root-aliases/ (status.json ADOPTED; review-round1.json and review-round2.json, the reviewers' v2 records of the MET-LINUX-009/contract series byte for byte, each with its review-identity-round<n>.json; and oracle-identity.json) and the D5a oracle tests/test_met_linux_009_oracle.py, written outside the candidate by a separate agent and bound by its oracle identity (KEEP). The registry rider: architecture/review-record/briefs.json gains exactly this packet's PACKET and CONTRACT series, each pinning its generic brief by digest. The adopted bytes are the final contract round's subject (candidate c3), which status.json binds by digest. Gate material (the evolution surface record's GATE_CI, GATE_VERIFIER_DOCS and GATE_REVIEW_PROCESS classes): the owner approves the merge per PR, bound to the head. The evolution surface record itself does not change.", "Add one 264-packet current catalog with an exact 264-to-263 inverse before the accepted 263-to-262 MET-LIVE-004 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, refuses a path outside its era before reading it and binds every era file by digest. It checks the status (ADOPTED for MET-LINUX-009 at slot 264 on this base, with the allowed-paths derivation passing at this base); the adopted subject (exactly its nine files, each digest equal to this era's bytes); the reviews (each round's record and identity by path and digest); and the registry (exactly one MET-LINUX-009/packet and one MET-LINUX-009/contract entry, each pointing at its generic brief with that brief's digest). It pins no chain validator or chain test. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 263's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 75 predecessor routes, every catalog walk and round trip, the full payload loop); 263's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-LIVE-004 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_linux_009.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 264-packet membership and count updates; layer tests and the MET-LIVE-004 layer's checks adjusted solely for the successor bridge; C2's two test changes in 263's test tests/test_linux_probe_kit_admission.py; the one-deeper successor hand edit of 262's test tests/test_linux_probe_interface.py (as 263 made for 261's); the count line of 261's test tests/test_linux_probe_kit_gate.py, which the cascade misses after 263's hand edit; catalog-membership filters ignoring only the added MET-LINUX-009 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
