    Warm-source access or reuse; copied public fixture/schema bytes; caller-supplied
    tenant identity, policy, measurements, approval, permit, worker claim, or
    evidence result; illustrative-policy activation; policy/approval signing or
    verification; OPA or control-plane calls; source mutation; arbitrary SQL;
    endpoint/DNS/credential discovery; raw payload/field/row/document/event/offset
    persistence; index-freshness claims; checkpoint rewind; automatic requeue
    after dead-letter; dead-letter deletion; fail-open readiness; re-enable after
    revocation; indexing/retrieval/memory; cloud scheduling; external telemetry;
    hosted runners; paid/metered APIs; API keys; runtime downloads; publishing;
    deployment; production/runtime evidence; assurance; or tenant acceptance.
