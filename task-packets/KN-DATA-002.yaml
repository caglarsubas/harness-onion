deliverables:
  - >-
    Correct the KN-DATA-001 checkpoint ambiguity before any activation. Every new
    CheckpointCandidate and StagedBatch binds the exact normalized lease partition
    in its canonical digest. Existing predecessor batches without a partition are
    readable but permanently ineligible for readiness or commit with stable
    BATCH_PARTITION_UNBOUND. Connector regression tests and independently authored
    fixture digests are updated only for this new closed field; all prior lease,
    staging, decoder, grant, and source-boundary behavior remains unchanged.
  - >-
    ReadinessPolicyObservation is immutable and binds organization, stable policy
    id and semantic version, canonical policy digest, independent tenant-approval
    digest, effectiveAt, expiresAt, and decimal-string PASS/WARN thresholds for
    completeness, freshness minutes, duplicate rate, classification coverage,
    and provenance coverage. Bounds are closed to 0 through 1 for ratios and 0
    through 10080 minutes for freshness; PASS is always stricter than or equal to
    WARN. illustrative=true, missing approval, cross-tenant, future, expired,
    malformed, non-finite, over-precision, or digest-mismatched policies may be
    evaluated for named parity only but can never authorize activation.
  - >-
    MeasurementObservation is injected metadata, not request content. It binds
    organization, source-version, batch, material, record-set and checkpoint-
    candidate digests; observed/expected/non-null-required/duplicate/classified/
    provenanced counts; latest source-observation time; collectedAt; validUntil;
    sorted prerequisite evidence ids; and a canonical observation digest. Counts
    are non-negative, internally consistent, capped at 10000, and cannot exceed
    the relevant observed or expected total. No field name/value, row, document,
    event, owner identity, endpoint, credential, or source payload is retained.
  - >-
    Deterministic evaluation uses decimal-safe arithmetic and fixed timestamps.
    Zero observed records yields only FAIL/MISSING_DATA and suppresses misleading
    derived findings. Otherwise completeness is non-null-required divided by
    expected count; duplicate rate is duplicate divided by observed; coverage
    ratios are classified or provenanced divided by observed; freshness is the
    non-negative difference between evaluation time and latest source observation.
    A future observation, invalid denominator, inconsistent count, expired input,
    or batch/digest mismatch fails closed. Source freshness is never labeled or
    used as index freshness.
  - >-
    Each metric emits one immutable PASS, WARN, or FAIL ReadinessFinding with a
    stable reason code and exact policy/observation/batch digests. FAIL dominates
    WARN and WARN dominates PASS. Expected reason codes are MISSING_DATA,
    INCOMPLETE_DATA, COMPLETENESS_NEEDS_INPUT, STALE_DATA,
    FRESHNESS_NEEDS_INPUT, DUPLICATE_DATA, DUPLICATES_NEED_INPUT,
    UNCLASSIFIED_DATA, CLASSIFICATION_NEEDS_INPUT, UNPROVENANCED_DATA, and
    PROVENANCE_NEEDS_INPUT. Findings are sorted by metric id and reason code and
    never disappear when a later assessment supersedes them.
  - >-
    Every completed evaluation projects exactly one DataReadinessAssessment with
    apiVersion harness.planeon.ai/v1alpha1, kind DataReadinessAssessment, stable
    metadata id/version, an injected stable questionnaireSessionId, exactly ten
    ordered gates business.owner, business.outcome, data.owner, data.quality,
    data.completeness, data.freshness, data.provenance, data.classification,
    integration.readiness, and autonomy.boundary, sorted unique evidence ids and
    missingGateIds, and only PASS, NEEDS_INPUT, BLOCKED, or NOT_APPLICABLE gate
    states. The three prerequisite gates require current injected tenant evidence;
    integration and autonomy are explicitly NOT_APPLICABLE in this packet. Only
    all-PASS data/prerequisite findings yield READY. WARN yields BLOCKED with
    NEEDS_INPUT; FAIL yields BLOCKED with BLOCKED. Missing or stale evidence can
    never yield READY.
  - >-
    ProvenanceGraph is an immutable bounded DAG of at most 32 digest-only nodes
    and 64 typed edges. Assessment graphs bind source version, staged batch,
    material, record set, checkpoint candidate, lease partition/fence, domain
    version, semantic mapping, policy, measurements, findings, assessment, and
    evidence. Commit graphs additionally bind the prior assessment graph, exact
    owner approval, committed batch, and checkpoint revision. Node/edge ids are
    sorted and unique; dangling edges, cycles, duplicate semantic nodes, unknown
    kinds, cross-tenant refs, or digest drift fail before persistence. Individual
    payload records are represented only by the already committed record-set
    digest, never by values or an unbounded graph.
  - >-
    Assessment is worker-driven. POST assess atomically creates one idempotent
    readiness work item containing only exact dependency digests and returns 202;
    it does not run connector I/O or claim readiness. Worker claims are
    organization/work/source/batch scoped, have monotonically increasing fencing
    tokens and 1 through 300 second TTLs, and append revisions PENDING, CLAIMED,
    RETRY_SCHEDULED, SUCCEEDED, or DEAD_LETTERED. Stale, expired, wrong-worker,
    wrong-tenant, or superseded claims cannot publish an assessment.
  - >-
    Retry is closed to stable allowlisted transient reason codes and at most three
    attempts. Retry delays are deterministic metadata 1 second then 4 seconds;
    the core never sleeps, schedules a cloud job, or performs automatic I/O.
    Non-retryable failure dead-letters on its first attempt; the third transient
    failure or third expired claim dead-letters. A DeadLetterRecord contains only
    tenant/source/batch/work/attempt/fence/reason/digest/timestamp metadata. Review
    is append-only and limited to ACKNOWLEDGED with a stable review reason; it
    never deletes, silently drops, requeues, activates, or marks the work passed.
  - >-
    Successful worker completion appends findings, assessment, provenance graph,
    a public EvidenceRecord projection, source-readiness revision, metadata-only
    outbox event, and SUCCEEDED work revision in one copy-on-commit transaction.
    The EvidenceRecord is VERIFIED on axis SOURCE with result PASS, WARN, or FAIL,
    PLATFORM producer authority, campaignGenerated=false, exact subject/evidence/
    provenance digests, bounded control ids, collectedAt, and validUntil. It never
    claims PR, merge, artifact, signature, deployment, runtime, security,
    assurance, or TENANT_ACCEPTANCE evidence. Store/outbox failure leaves no
    partial assessment, evidence, state pointer, event, or successful work claim.
  - >-
    Source readiness is a separate append-only operational history and does not
    rewrite KN-DATA-001 source-revision history. Absence derives UNASSESSED. A
    current PASS assessment appends READY_FOR_APPROVAL; WARN/FAIL appends DEGRADED.
    If a source was ACTIVE, assessing a replacement batch fail-closes it to
    READY_FOR_APPROVAL or DEGRADED until that batch is explicitly approved and
    committed. An expired policy, measurement, assessment, evidence record, or
    owner approval makes the effective read state DEGRADED without rewriting
    history. Explicit REVOKED overrides every prior pointer and cannot be
    re-enabled by this packet.
  - >-
    Activation requires both an unexpired allow=true AccessPermit for exact action
    knowledge.ingestion.batch.commit and a separate already verified APPROVE
    OwnerApprovalAttestation. The attestation binds organization, owner digest,
    source version, batch, PASS assessment, VERIFIED PASS evidence, policy,
    provenance, issuedAt, expiresAt, approval id, and canonical approval digest.
    It must match SourceDefinition.ownerDigest and the latest readiness pointer.
    A policy allow, platform finding, fixture, worker identity, or generated output
    is never owner approval; owner approval is not TENANT_ACCEPTANCE.
  - >-
    Commit accepts only the latest current READY_FOR_APPROVAL PASS assessment for
    one partition-bound STAGED batch. One atomic transaction appends immutable
    BatchCommit, monotonically increasing CheckpointRevision/current pointer,
    ACTIVE SourceReadinessRevision, commit ProvenanceGraph, VERIFIED SOURCE/PASS
    EvidenceRecord, idempotency result, and metadata-only batch/source outbox
    events. The checkpoint stores only the exact candidate digest, partition,
    source version, batch digest, revision, fencing token, and activation time;
    it never stores or rewinds an opaque provider offset. An older/equal fence,
    older batch, stale revision, duplicate different request, superseded or
    expired assessment/approval, or atomic failure advances nothing.
  - >-
    Sampling may repeat from KN-DATA-001 VALID or SAMPLED source revision state;
    every run still appends SAMPLING then SAMPLED and requires the same current
    connector lease, policy/grant/domain checks, limits, decoder, staging receipt,
    and idempotency contract. A new staged batch does not itself change an ACTIVE
    pointer. Assessment or explicit revocation is required. No connector action,
    source write, automatic resampling, checkpoint rewind, or unbounded stream is
    introduced.
  - >-
    The standard-library controller extends its closed API only with POST
    /knowledge/v1/staged-batches/{batchId}:assess, POST
    /knowledge/v1/staged-batches/{batchId}:commit, GET
    /knowledge/v1/readiness-assessments/{assessmentId}, GET
    /knowledge/v1/sources/{sourceId}/readiness, POST
    /knowledge/v1/sources/{sourceId}:revoke, GET
    /knowledge/v1/dead-letters/{deadLetterId}, and POST
    /knowledge/v1/dead-letters/{deadLetterId}:review. Mutations require an
    idempotency key and If-Match where a readiness revision exists. Public bodies
    are empty except review's closed ACKNOWLEDGED decision and stable reason code;
    policy, measurements, prerequisites, approval, identity, permits, and worker
    claims are injected after scope authorization. Unknown routes/methods/fields,
    query strings, duplicate headers, body identity, existence probes, and all
    exceptions return bounded stable non-echoing errors.
  - >-
    connector-controller composes only the public controller with injected local
    readiness dependency ports. ingest-worker composes only claim/process/failure
    methods and exposes no new public HTTP business route. Neither service opens a
    source, filesystem path, socket, database, broker, evidence endpoint, policy
    endpoint, or credential. Existing Containerfiles/charts remain unchanged,
    disabled by default, digest-only, default-deny, and package-install-free.
  - >-
    migrations/ingestion/readiness/003_readiness.sql is additive and has no down
    migration. It leaves predecessor rows readable, adds a nullable partition
    column plus future-insert/commit guards so unbound legacy staged batches cannot
    activate, and creates tenant-RLS append-only policy/measurement/work/history/
    finding/assessment/provenance/evidence/readiness/batch-commit/checkpoint/dead-
    letter/review/outbox tables. Only readiness/work/checkpoint pointers are
    mutable, and only narrow SECURITY DEFINER compare-and-append functions may
    change them after transaction-local tenant, expected revision, fence,
    current-state, expiry, and digest checks. Runtime gets exact own-schema
    SELECT/INSERT/function grants, never BYPASSRLS, DDL, TRUNCATE, DELETE,
    arbitrary UPDATE, cross-schema access, payload/material access, or public
    function execution. PostgreSQL execution remains NOT_RUN_ENV_UNAVAILABLE.
  - >-
    Independently authored fixtures/readiness vectors cover all four FILE, HTTP,
    POSTGRESQL, and EVENT source classes; PASS, WARN, missing, incomplete, stale,
    duplicate, unclassified, unprovenanced, owner-denied, stale-approval,
    superseded-assessment, repeated sampling, checkpoint ordering, retry, claim
    expiry, terminal dead-letter, and acknowledged-review cases. Parity checks
    compare exact decisions/reason codes/gate order to the locked public
    white-goods boundary without copying its fixture bytes or treating its
    illustrative policy as tenant approval.
  - >-
    KN-DATA-002 owns only ci/targets/kn-data-002.json for Make integration. It
    registers readiness-parity, readiness-contract, failure-matrix, and security
    handlers using direct python3 -m unittest argv under tests/readiness and
    declares the existing prefetch target so KN-001 and KN-DOM handlers execute
    cumulatively. make security executes predecessor and packet-local handlers in
    lexical packet order. It does not edit Makefile, dispatcher, packet transport,
    prior descriptors/handlers, workflow, scanner, or PORTING ledger; unknown,
    duplicate, ambiguous, shell, undeclared-variable, warm-source, and zero-bill
    denial remain closed.
  - >-
    No acceptance step provisions PostgreSQL, a source, object store, queue,
    container, cluster, registry, cloud resource, hosted runner, telemetry sink,
    API key, credential, or mutable artifact. Source, contract/unit, PR check,
    merge, artifact/SBOM, signature/release, deployment, runtime, security,
    assurance, owner approval, and tenant acceptance remain distinct evidence
    states. This packet can prove only source and offline contract/unit behavior;
    PostgreSQL, source connectivity, images/charts, deployment, runtime, assurance,
    and tenant acceptance remain NOT_RUN_ENV_UNAVAILABLE or
    PENDING_TENANT_AUTHORITY.
excluded:
