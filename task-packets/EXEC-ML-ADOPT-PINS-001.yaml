id: EXEC-ML-ADOPT-PINS-001
repository: mas-harness-execution-plane
branch: codex/exec-ml-adopt-pins-001-provider-dossiers
objective: "G1 and G2 for H12's baseline upstreams (owner OW-D3): upstream dossiers (provider records, CycloneDX SBOMs of the pinned CPython 3.12 manylinux x86_64 closures, licence and notice reviews) for scikit-learn (planeon.sklearn) and ONNX Runtime (planeon.onnx), plus the safe artifact-format record (owner OQ-5), with a stdlib consistency test. No runtime code, no dependency in pyproject.toml, nothing selectable; the provider modules and adapters stay EXEC-ML-001's."
predecessors: ["PLANE-BOOTSTRAP-R08", "EXEC-TEMPORAL-PINS-001"]
allowedPaths: ["adoption/scikit-learn/PROVIDER.json", "adoption/scikit-learn/SBOM.cdx.json", "adoption/scikit-learn/NOTICE.md", "adoption/scikit-learn/SAFE-FORMAT.md", "adoption/onnxruntime/PROVIDER.json", "adoption/onnxruntime/SBOM.cdx.json", "adoption/onnxruntime/NOTICE.md", "tests/adoption/test_ml_dossiers.py", "tests/adoption/test_temporal_dossier.py"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - "Tree: the PR's base is R08 main at 8939c5cd542dcd0b748b87a8065d2e1f348c60db (PLANE-BOOTSTRAP-R08 and EXEC-TEMPORAL-PINS-001 merged, R08 PRs 1 and 3). The head adds exactly 8 files, each with status A, modifies exactly 1 file, `tests/adoption/test_temporal_dossier.py` (status M; the Temporal dossier's test, hardened for R08 issues 4 and 5), and changes nothing else. The 8 added files: `adoption/scikit-learn/PROVIDER.json`, `adoption/scikit-learn/SBOM.cdx.json`, `adoption/scikit-learn/NOTICE.md`, `adoption/scikit-learn/SAFE-FORMAT.md`, `adoption/onnxruntime/PROVIDER.json`, `adoption/onnxruntime/SBOM.cdx.json`, `adoption/onnxruntime/NOTICE.md` and `tests/adoption/test_ml_dossiers.py`."
  - "Each PROVIDER.json names its module id (planeon.sklearn or planeon.onnx, as architecture/providers.yaml has them), role BASELINE, selectable false and evidenceState PACKET_PUBLISHED; the version (scikit-learn 1.9.1, onnxruntime 1.32.0; the scikit-learn record also names the converter skl2onnx 1.20.0, used only at signing time); the pin date pinnedAt 2026-11-20T17:21:42Z; and one entry per closure artifact with file name, version, sha256, size, licence, upstream upload time and mirror object name. The closures are for CPython 3.12 on manylinux x86_64 only (cp312, abi3 and pure-Python wheels; ARM64 is a later amendment)."
  - "Each PROVIDER.json carries the quarantine object {\"minimumDays\": 7, \"source\": \"OWNER_DECISION\", \"decisionRef\": \"OQ-6 (owner 2026-11-20 18:39, '7 days + security exemption (Recommended)'), recorded as a decision in lock 74 or 75\", \"policyItem\": \"SUPPLY-QUARANTINE-001\", \"exemption\": {\"kind\": \"SECURITY_UPDATE\", \"used\": false}} where source is one of the closed values OWNER_DECISION and POLICY_IN_FORCE (POLICY_IN_FORCE once SUPPLY-QUARANTINE-001 publishes its value), and exemption.used true requires exemption.reason naming the advisory; every closure artifact's upload time plus minimumDays is at most pinnedAt unless exemption.used is true; both dossier tests follow the dossier-check clause of SUPPLY-QUARANTINE-001 (Roadmap-Visionary paper SQ001-DOSSIER-CLAUSE d2a55b0f, section 1; placed on that item at lock 78); wheels only, no sdist, nothing installed with lifecycle scripts."
  - "adoption/scikit-learn/SAFE-FORMAT.md records the owner's OQ-5 choice, \"ONNX only (Recommended)\" (2026-11-20, about 19:00): pickle and joblib loading is denied everywhere; a declared scikit-learn pipeline is converted to ONNX by skl2onnx at signing time, outside the decision service, and served only through planeon.onnx; the signed artifact carries a numeric-equivalence record (the converted model's outputs against the source pipeline's on a declared fixture set, with the tolerance and the result); an estimator or transformer the converter does not cover is refused, never served another way; planeon.sklearn runs only declared in-process pipelines built from a closed, data-only specification; a signed artifact with digest, feature schema and provenance is admitted before any load. skl2onnx and its closure join the scikit-learn dossier."
  - "Mirror (owner OQ-2, OQ-7): every artifact is an object named by its sha256 in the owner's write-once GCS bucket (project harness-onion, us-central1, set up by R10); the repository holds digests, licences and the SBOMs, never artifact bytes. Each SBOM.cdx.json is CycloneDX JSON, one component per closure artifact, hashes equal to its PROVIDER.json; each NOTICE.md records licences from the artifacts' own metadata and licence files, including the native libraries the wheels bundle. Both PROVIDER.json files cite manifests/EXEC-ML-ADOPT-PINS-001/20261120T172142Z-06e4d801.json, read back ok 15/15 by R10's mirror-read job (the 2 objects the bucket already held, protobuf and typing-extensions, accepted through the Temporal manifest's generations)."
  - "Closures: each dossier's closure is computed offline from the wheels' own METADATA Requires-Dist lines (R10 mirror reads) with the fetcher's requirement parser and marker evaluation for CPython 3.12.14 on Linux x86_64: planeon.sklearn from scikit-learn and skl2onnx, planeon.onnx from onnxruntime. A wheel both closures need appears in both dossiers; the union of the two closures equals the manifest's 15 entries exactly. Each entry records its marker-true requirements and that its pins meet them."
  - "Converter support: skl2onnx 1.20.0 declares scikit-learn>=1.1 and onnx>=1.2.1, and onnx 1.23.2 declares protobuf>=6.31.1 among its requirements; the pins meet them. Runtime compatibility of converted models is recorded as \"not stated by the artifacts; proven by EXEC-ML-001's numeric-equivalence test against onnxruntime 1.32.0 before selectable\"."
  - "Licences without a METADATA expression are marked derived with their basis (the METADATA licence text and the hashed licence files). scipy's identifier is derived only from its read licence text; if that text is withheld, scipy is NOASSERTION and NOTICE names the gap. NOTICE names the bundled-library notice files found in the onnxruntime, numpy and scipy wheels by name, size and sha256, or states that none were found."
  - "Fetches: only the owner-approved two-part item of FETCH-LIST.md (metadata reads, then wheel fetches by digest on GCP into the mirror), before the build and outside the offline run; no network in the run."
deliverables:
  - "Add exactly the 8 files of the Tree contract and modify `tests/adoption/test_temporal_dossier.py`, each LF-only strict UTF-8 without a byte order mark, mode 100644; every JSON file is written with every object's keys in sorted (code point) order, a one-space indent and one final LF."
  - "tests/adoption/test_ml_dossiers.py (stdlib unittest; reads files by its own file path; writes nothing; opens no socket): both PROVIDER.json and SBOM.cdx.json files parse; every closure entry has file name, version, sha256, size, licence, upload time and mirror object name equal to its sha256; each record agrees with its SBOM component by component, both ways; every sha256 and every SBOM hash is a full match of 64 lowercase hex; the record's digest set and its SBOM's digest set each equal a literal set written in the test, one set per dossier; the SBOM's hashes are unique; the record cites the closure manifest by its sha256 exactly once and its entry count equals the size of the literal set (for ML, the union of the two dossiers' sets); the required artifacts are present exactly once, named from the record's own versions; each quarantine object has exactly the keys minimumDays, source, decisionRef, policyItem and exemption, source is one of OWNER_DECISION and POLICY_IN_FORCE, minimumDays is an integer (not a boolean) of at least 7, policyItem is SUPPLY-QUARANTINE-001, exemption.kind is SECURITY_UPDATE and type(exemption.used) is bool, checked on every run whatever the artifacts' age; exemption.used true requires a non-blank string reason; exemption.used false requires every upload time plus minimumDays to be at most pinnedAt; in-memory negative cases (a string used, another kind, used true with a missing, a non-text and a blank reason, an under-age entry with used false, minimumDays below 7, the root artifact dropped from both record and SBOM, a digest with one extra character in the record, its mirror name and the SBOM, an SBOM-only component) each fail, and two positive cases (the committed record; a copy with used true and a textual reason) pass; the required artifacts are scikit-learn and skl2onnx (planeon.sklearn) and onnxruntime (planeon.onnx); no entry is an sdist; selectable is false and no evidence state is READY; the module ids are planeon.sklearn and planeon.onnx; SAFE-FORMAT.md states the OQ-5 choice ONNX only, that pickle and joblib loading is denied, that the signed artifact carries a numeric-equivalence record and that an uncovered estimator is refused; the scikit-learn record names skl2onnx in its closure; none of the draft placeholders (<sklearn version>, <onnxruntime version>, <skl2onnx version>, <pin date>) is left in any dossier file."
  - "tests/adoption/test_temporal_dossier.py (modified; stdlib unittest; reads files by its own file path; writes nothing; opens no socket): keeps every check it has at 8939c5cd and adds, for the Temporal dossier: every sha256 and every SBOM hash is a full match of 64 lowercase hex; the record's digest set and its SBOM's digest set each equal a literal set written in the test, one set per dossier; the SBOM's hashes are unique; the record cites the closure manifest by its sha256 exactly once and its entry count equals the size of the literal set (for ML, the union of the two dossiers' sets); the required artifacts are present exactly once, named from the record's own versions; each quarantine object has exactly the keys minimumDays, source, decisionRef, policyItem and exemption, source is one of OWNER_DECISION and POLICY_IN_FORCE, minimumDays is an integer (not a boolean) of at least 7, policyItem is SUPPLY-QUARANTINE-001, exemption.kind is SECURITY_UPDATE and type(exemption.used) is bool, checked on every run whatever the artifacts' age; exemption.used true requires a non-blank string reason; exemption.used false requires every upload time plus minimumDays to be at most pinnedAt; in-memory negative cases (a string used, another kind, used true with a missing, a non-text and a blank reason, an under-age entry with used false, minimumDays below 7, the root artifact dropped from both record and SBOM, a digest with one extra character in the record, its mirror name and the SBOM, an SBOM-only component) each fail, and two positive cases (the committed record; a copy with used true and a textual reason) pass; the required artifacts are the server archive temporal_<server version>_linux_amd64.tar.gz and checksums.txt (release assets) and the temporalio wheel at the SDK version. The literal set is the 7 digests on R08 main; the dossier files themselves are not changed."
excluded:
  - "pyproject.toml, uv.lock, the Makefile, PORTING.yaml, ci/**, src/**, services/**, deploy/**, migrations/**, providers/** (providers/scikit-learn/, providers/onnxruntime/ and providers/ortools/ are EXEC-ML-001's), tests/decision/** (EXEC-ML-001's), architecture/providers.yaml in harness-onion, any model artifact or wheel bytes, and any network access in the run."
prefetchCommands: []
offlineAcceptanceCommands: [["python3", "-I", "-B", "-m", "unittest", "discover", "-s", "tests/health"], ["python3", "-I", "-B", "-m", "unittest", "discover", "-s", "tests/adoption", "-p", "test_temporal_dossier.py"], ["python3", "-I", "-B", "-m", "unittest", "discover", "-s", "tests/adoption", "-p", "test_ml_dossiers.py"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - "The head's name-status against 8939c5cd542dcd0b748b87a8065d2e1f348c60db is exactly the Tree contract's 8 A entries and 1 M entry."
  - "The dossier unittest passes under the hash-pinned offline runner with all outbound network denied."
  - "Every sha256 in both PROVIDER.json files equals the part-2 report's computed digest and the mirror object's name."
  - "Source, offline unit, PR check and merge are the only evidence this packet can prove (G1, G2 records); adapters, Linux profile, artifact, deployment, runtime, assurance and tenant acceptance stay not run (G8)."
rollback: Revert the dossier commit; nothing is installed, registered or selectable, so no data, model or provider state changes; the mirror's write-once objects stay.
