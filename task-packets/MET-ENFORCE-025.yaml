contracts: ["Accepted base is main 6e7bfb3cfb3cd04dc55fc6276591fb02905e5d99, tree 46eeeb4edad3eadbb2ec3ff59b59c96084f7182f, holding 231 immutable packets including MET-MAS-006. Add MET-ENFORCE-025 only, as packet 232. Preserve all 231 predecessor YAML files, every contract snapshot, review record and status record (architecture/seccomp-allowlists-v3/, scripts/seccomp_allowlists_v3.py, the v1 edge record and its README, architecture/w03-plan-v2/ and architecture/repositories.yaml are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Add architecture/compiled-filter-programs/ (the 14 programs, index.json, README.md, the status record, the four independent review records verbatim and the round 1-3 snapshots of the files that differ from the adopted ones), scripts/compiled_filter_programs.py (the publisher and checker, which executes the v3 compiler from its verified bytes), architecture/artifact-edges/operator-harness-engineering-v2.json with README-v2.md, architecture/artifact-edges/conformance-labs-harness-engineering.json, and architecture/w03-obligation-amendment-1/ (amendment.json, README.md). The content passed its fourth independent review round (PASS_FOR_SOURCE_PUBLICATION on abe53d6, notes carried in the status record); the three READMEs' status lines are the one adoption edit. The content was reviewed on 82804a0 and rebased onto this base unchanged: it adds new files only.","Add one 232-packet current catalog with an exact 232-to-231 inverse before the accepted 231-to-230 MET-MAS-006 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes and binds every published file, round copy, review record, the status record and its inputs (the v3 sources, the v1 edge record, the W03 plan v2, the repository registry and safe_yaml) by digest before parsing; then it executes the v3 compiler from this era's bytes and requires it to compile exactly the published programs, checks both edge records' exact key sets (review note R2-1), rows and provider bytes and that neither edge can close a cycle, and checks that the amendment binds plan v2 by digest and changes exactly the restated obligations; the owner's decisions, the programs' digests and lengths and the role-to-packet registration are restated.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-MAS-006 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_compiled_filter_programs.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 232-packet membership and count updates; the YAML corpus count in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-MAS-006 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-025 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The independently reviewed compiled filter programs with their index, publisher, status and review records; the edge registry records v2 (operator, EDGE-2); W03-PLAN-AMEND-1.","A fresh 232-to-231 inverse authority, a layer validator and test, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
