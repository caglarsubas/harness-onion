ore the accepted 271-to-270 MET-ENFORCE-043 layer. The new layer scripts/validate_release_profile.py reads only its era's reviewed bytes, each bound by digest (the five packet files, the model's 23 data inputs and its two modules, the registry and the generic packet brief; the three catalogs bound by the model's own base pins, so the layer names no catalog), and checks V1 (the five packet files equal their adopted digests), V2 (the catalog pins are the model's own, and the model, run from its verified bytes with this era's overlay module and YAML loader, accepts the record over the era's reviewed bytes and the layer's own packet set), V3 (the oracle identity names the oracle test, is KEEP and binds its bytes) and V4 (the registry differs from the base by exactly the one rider), each with a failing test, and its canonical hunks.", "Inherited validators, tests and documents change only by: mechanical 272-packet membership and count updates; layer tests and the MET-ENFORCE-043 layer's checks adjusted solely for the successor bridge; C2's test changes in 271's test tests/test_edge_record_v12.py; the one-deeper successor hand edit of 270's test tests/test_met_perf_043.py; the count lines of tests/test_met_gov_005.py and tests/test_sector_catalog.py, which the cascade skips; tests/conftest.py's collection hook restoring sys.path after each tests/ module's collection (Q-272-DRY-1 (a)) and the tests/conftest.py member of tests/test_parallel_suite.py's SESSION_READERS (Q-272-PC2-1 (a)); the rider; and the index docs. The new head's test keeps the full fan-in (8 own and 83 predecessor routes) and the generic retain-names scaffold, followed by the model's tests.", "Recorded, not folded: RP-C5-1 (ensure_ascii in _canonical) goes to a later hardening packet; RP-C5-2 and RP-C5-3 are disclosed limits (provider-adoption's other valid shapes; the no-operator-read guarantee assumes a reader consistent between reads)."]
