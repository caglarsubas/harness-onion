expectedEvidence:
  - Journey and overview fixtures are canonical and byte-identical over two reads; schemas are closed; authority, stage, plane, harness, route, gate, module, status, reason, and evidence-axis sets and orders are exact with no duplicate or unknown member.
  - All predecessor commit/run/hash locks match packet-declared literals without product access to another checkout, and mutation of any lock, digest binding, organization binding, source reference, or fixture reference fails.
  - Questionnaire, business owners/outcomes/KPIs, domain digest set, source inventory, every readiness gate and evidence reference, profile digest, demand/dependency selection reason, and exact five-module set form one organization-bound chain; missing or reordered prerequisites block every dependent stage.
  - Negative vectors reject a sixth selected artifact, absent dependency, image tag or host, public URL, credential/secret key, tenant or business payload, false signature/preflight/apply/health/freshness PASS, stage skip, duplicated harness, collapsed evidence axis, and tenant acceptance claim.
  - Overview contains four ordered planes and sixteen named harnesses, selects exactly five, excludes eleven from health, derives BLOCKED=5/EMPTY=11 and organization BLOCKED, exposes all local drill-down routes and semantic equivalents, retains last binding as SOURCE_UNAVAILABLE, and returns indistinguishable bounded not-found for cross-tenant and unknown IDs.
  - Offline campaign emits required RUNTIME and ASSURANCE results as NOT_RUN_ENV_UNAVAILABLE, overall NOT_RUN_ENV_UNAVAILABLE, and deterministic evidence with only those originated axes. Evidence verification may PASS structurally but cannot upgrade campaign, deployment, runtime, assurance, or tenant acceptance.
  - Signed PR and exact-main acceptance pass Alpha-1 unit tests and generic evidence verification in one deny-all-outbound process tree. Source, CI, merge, artifact, signature/release, deployment, runtime, assurance, tenant-acceptance candidate, and tenant acceptance remain distinct evidence states.
  - Environment-facing execution remains NOT_RUN_ENV_UNAVAILABLE until a manual post-merge external launcher validates dual signatures, fixed tenant endpoints, independent capacity authorization, server-side zero-cost admission, and target-local authority. Campaign output can never sign or assert TENANT_ACCEPTANCE.
rollback: Revert only campaigns/alpha1, tests/alpha1, fixtures/alpha1, and the Alpha-1 report template to exact CONF-002 main. Offline work creates no bundle, release, deployment, runtime, tenant data, or external state to uninstall; any future live rollback requires its own authorized environment procedure and retains evidence by policy.
