  - >-
    The independent fixture also binds public predecessor interface hashes:
    CTRL-007 taxonomy 0341903fa6de38bc36a27fa6c938196daf65403cb885c7408e56c6429ba3275e,
    status contract e22d7599cbb92453632ea6dfc0e4d8af0e7f17b18134b9a78687f40f94799a4b,
    and overview guide 2f331a334aa72d4a8208dcca81b1cba81f347bd5a66fbf426a71135dd0ce5ac8;
    KN domain coverage 6c8ebd93daae1bcc0a056909a64f0202621b4e9e2a404f00abfdcbd18957e705
    and readiness-status a39a88015e401ec137e07ea66d994ac3d5844a2bdbe5418502ad2f7289ec026d;
    trust usage config 79978c6006e9e2d27b31cb15a212e668026a3ac7eb2867b55206da78a0999ec0;
    distribution OCI guide 68ca0d58cf657a90d514b870c0214f157bf69a4549c20a1f4bb294535d510c2b;
    and operator foundation status/plan
    134a515b26b50c54a627735db2738fc9da179f788e53e704fd0be20cd0469254/
    9db56d5edd265506d589fc2b802d41d6aab2a9ba0ca31bebf4784348ab87e391.
    Product acceptance compares only packet-owned literal locks; it never reads
    those predecessor repositories.
  - >-
    fixtures/alpha1/journey.json is canonical JSON with the exact closed fields
    schemaVersion, authority, organization, questionnaire, businessContext,
    domainContext, dataReadiness, profile, bundle, stages, and overviewRef.
    Authority has exactly six records, one for each predecessor, each closed to
    packetId, repository, commit, pullRequestRunId, and exactMainRunId.
    Organization is the synthetic org.marmara-thermal tenant, air-gapped
    OpenShift on linux/arm64 with PHYSICAL_AIR_GAP isolation, local-only
    dependencies, no external endpoint, and no credential, business payload,
    personal data, or secret.
  - >-
    Questionnaire answers declare the white-goods industry, owners, desired
    outcomes and KPI identifiers, deployment and regulatory inputs, source-kind
    inventory, and only the tenant-demanded knowledge.domain-semantic and
    knowledge.data-integration harnesses. Business context has named accountable
    roles and measurable KPI definitions without observed values. Domain context
    binds a synthetic ontology/mapping/coverage digest set. Data readiness has
    the ordered business.owner, business.outcome, data.owner, data.quality,
    data.completeness, data.freshness, data.provenance, data.classification,
    integration.readiness, and autonomy.boundary gates; every PASS requires a
    nonempty evidence reference and readiness remains fixture evidence, never a
    live source claim.
  - >-
    The locked profile separates two DEMAND_SELECTED knowledge harnesses from
    three REQUIRED_FOUNDATION_DEPENDENCY harnesses: runtime.infrastructure,
    trust.security-safety, and trust.observability-finops. Exactly five harnesses
    are selected and exactly eleven are NOT_SELECTED. The expected module list is
    exact, sorted, unique, digest addressed, local-only, and carries no image tag,
    registry host, public URL, or unselected artifact. Bundle state is
    NOT_BUILT_IN_OFFLINE_CAMPAIGN and signature, preflight, apply, health, and
    freshness remain NOT_RUN_ENV_UNAVAILABLE until the separately authorized live
    runner receives a real tenant environment and dual-signed envelope.
  - >-
    Journey stages are exact and ordered: QUESTIONNAIRE, BUSINESS_CONTEXT,
    DOMAIN_CONTEXT, DATA_READINESS, PROFILE_LOCK, BUNDLE_BUILD,
    SIGNATURE_RELEASE, PREFLIGHT, APPLY, RUNTIME_HEALTH, and EVIDENCE_FRESHNESS.
    The first five may be FIXTURE_VALIDATED with UNIT-only claims. The remaining
    six are NOT_RUN_ENV_UNAVAILABLE and must carry no fabricated digest, endpoint,
    receipt, timestamp, or PASS. Every downstream stage is blocked when any
    predecessor is non-pass; offline tests mutate every boundary and prove no
    status skipping or false readiness.
  - >-
    fixtures/alpha1/overview.json contains exactly the four canonical planes and
    sixteen numbered, named harnesses in CTRL-007 order. The five selected
    harnesses are BLOCKED with installation BLOCKED and reason
    LIVE_FOUNDATION_ENVIRONMENT_UNAVAILABLE. The eleven unselected harnesses are
    NOT_SELECTED, ABSENT, EMPTY, have only NOT_APPLICABLE evidence, and never
    improve or degrade organization health. Runtime, knowledge, and trust planes
    are BLOCKED, execution is EMPTY, and organization aggregate is BLOCKED with
    counts BLOCKED=5 and EMPTY=11.
  - >-
    Each selected harness overview carries all eleven independent axes in exact
    order: SOURCE, CONTRACT_UNIT, PR_CHECK, MERGE, ARTIFACT_SBOM,
    SIGNATURE_RELEASE, DEPLOYMENT, RUNTIME, SECURITY, ASSURANCE, and
    TENANT_ACCEPTANCE. Source and contract/unit may be PASS only with digest
    references. PR, merge, artifact/SBOM, signature/release, and security are
    MISSING in the packet-local pre-run projection. Deployment, runtime, and
    assurance are NOT_RUN_ENV_UNAVAILABLE. Tenant acceptance is NOT_APPLICABLE
    with an explicit foundation-scope applicability reason. No axis is collapsed,
    waived, scored, or inferred from another.
  - >-
    Overview freshness is SOURCE_UNAVAILABLE and retains its last packet-local
    binding without manufacturing current state. It includes exact local routes
    /overview, /planes/{planeId}, and /harnesses/{harnessId}; all four plane and
    sixteen harness destinations are unique and resolvable. Tests provide the
    same complete semantic navigation model at 320 CSS pixels and at 200 percent
    zoom, assert 44-pixel minimum controls and one labelled main landmark, and
    model cross-tenant/unknown detail as the same bounded NOT_FOUND result. No
    browser, frontend server, network, database, or tenant session is started by
    this repository.
  - >-
    campaigns/alpha1/campaign.json is LIVE_CAMPAIGN and contains exactly two
    required ENVIRONMENT_CAPABILITY controls: foundation-runtime on RUNTIME and
    foundation-assurance on ASSURANCE. Its packet-owned environment fixture sets
    both capabilities to null. Offline run status is therefore exactly
    NOT_RUN_ENV_UNAVAILABLE; the unsigned technical evidence remains structurally
    valid, has resultStatus NOT_RUN_ENV_UNAVAILABLE and originatedAxes exactly
    RUNTIME then ASSURANCE. evidence-verify PASS means only canonical bundle
    validation, never live readiness or assurance.
  - >-
    Signed offline acceptance first runs all Alpha-1 standard-library unit and
    negative tests, then generic campaign and evidence verification under the
    root-owned CONF-A1-001 packet on a public-repository ephemeral credential-free
    runner. No hosted runner, artifact/cache/package upload, cloud or billing API,
    third-party key, runtime download, mutable reference, public request, external
    telemetry, privileged socket, warm-source path, live target, or mutation is
    allowed.
deliverables:
  - Closed synthetic Alpha-1 journey, predecessor ledger, questionnaire/business/domain/data-readiness chain, locked minimal five-harness foundation profile, and explicit unavailable bundle-to-runtime stages.
  - Complete four-plane/sixteen-harness tenant overview fixture with exact selected/unselected aggregation, independent evidence axes, freshness, organization isolation, and local drill-down routes.
  - LIVE_CAMPAIGN definition that fails honestly to NOT_RUN_ENV_UNAVAILABLE offline plus deterministic technical-evidence verification and report template.
  - Standard-library positive, mutation, stage-order, selectivity, evidence-axis, freshness, isolation, navigation, accessibility-model, no-secret/no-endpoint, and reproducibility tests.
excluded:
  - Opening, mounting, fetching, executing, importing, copying, adapting, translating, or hashing content from the warm source or any predecessor checkout during product implementation or acceptance.
  - Retrieval, context assembly, memory, model inference, AI gateway, experience, protocols, orchestration, tools, sandbox, ML/decision execution, business-data ingestion, source mutation, live bundle creation/signing, cluster discovery/apply, health probing, assurance certification, or tenant acceptance.
  - Browser/server/database/registry/Kubernetes execution, live campaign argv in CI, public network, cloud or billing API, hosted runner, paid service, third-party key, credential, runtime download, artifact upload, telemetry export, or any PASS inferred from unavailable input.
