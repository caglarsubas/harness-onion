    97befeb8d8d8912c445aaa4b1a7b6976efc74479. Makefile,
    ci/run_make_target.py, ci/run_packet.py, and ci/verify-offline.sh byte
    SHA-256 values are bb652db371113bab5d9d8924f0b10b1f85793c0cc84178d447ab1095f4e7b981,
