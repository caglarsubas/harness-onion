  - >-
    Predecessor release locks are CTRL-007 main
    39eb8f8fc42382bbfdd8ac1e0723531282648656 with PR/main runs
    33662200783/33662472964, KN-DATA-002 main
    2056405d747f10bcea36f089fcd6f2de474b3ee5 with runs
    33569253853/33569419518, TRUST-OBS-001 main
    919deda20b5c2a126129de7d484dd7c9667ad11e with runs
    33535303809/33535602147, OP-003 main
    0fa716fae4009f4fc63861f808f9e794f8925999 with runs
