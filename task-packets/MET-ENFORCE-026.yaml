ytes only through reviewed_bytes and binds every file of the amendment directory, the model, the W02D effective text and record, the corrected W01 input and the overridden contract files by digest before parsing and on every read; it executes the amendment's model from this era's bytes and restates the design label, items, decisions, obligations, residuals, the superseded-clause count and the review verdicts.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ADOPT-004 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_host_interface_hs43.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the 900 s parallel-suite worker deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 236-packet membership and count updates; layer tests and the MET-ADOPT-004 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-026 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
