id: MODEL-ADOPT-PINS-001
repository: mas-harness-model-plane
branch: codex/model-adopt-pins-001-llama-cpp-dossier
objective: "Record the H2 open-source baseline dossier for llama.cpp, the first engine of MODEL-ADOPT-001 (gates G1 and G2; ruling A1, PAR-D1): the exact upstream release, its source archive digest, the licences of the engine and of every vendored component, notices, and an SPDX SBOM. The dossier records digests, licences and the SBOM only; the artifacts live in the owner-held, content-addressed, write-once mirror outside the repositories (owner 2026-11-20 18:19). No engine code, adapter, build, model weights or runtime."
predecessors: [PLANE-BOOTSTRAP-R06]
allowedPaths: ["adoption/llama-cpp/", "tests/adoption/"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - "Tree: the PR's base is R06 main at 2bae531427dcdc13eb8dfca1f9b294420df3d68e (the merged shell). The head adds exactly these files, each with status A, and changes nothing else: `adoption/llama-cpp/dossier.json`, `adoption/llama-cpp/LICENSES.md`, `adoption/llama-cpp/NOTICE.upstream`, `adoption/llama-cpp/sbom.spdx.json` and `tests/adoption/test_dossier.py`."
  - "adoption/llama-cpp/dossier.json (schema planeon.adoption-dossier/v1) names: engine ggml-org/llama.cpp; the exact release tag, its commit sha and that commit's git tree id; publishedAt (the release's publication time, UTC) and pinnedAt (the time the lane picked it, UTC); a quarantine object {\"minimumDays\": 7, \"source\": \"OWNER_DECISION\", \"decisionRef\": \"OQ-6 (owner 2026-11-20 18:39, '7 days + security exemption (Recommended)'), recorded as a decision in lock 74 or 75\", \"policyItem\": \"SUPPLY-QUARANTINE-001\", \"exemption\": {\"kind\": \"SECURITY_UPDATE\", \"used\": false}} where source is one of the closed values OWNER_DECISION and POLICY_IN_FORCE, and exemption.used true requires exemption.reason naming the advisory; the pick rule, applied to the release list of the fetch list's part 1: the newest non-prerelease release with publishedAt + minimumDays <= pinnedAt; the source archive's sha256 and size, and the git tree id recomputed offline from the archive's files by a standard-library script (GitHub tag archives are not promised byte-stable, so the archive binds to the commit through the tree id, not through its own digest); the mirror key of that archive (the owner-held GCS bucket's object name, its sha256); the upstream licence identifier and the sha256 of the upstream LICENSE file; the vendored components with path, licence identifier and licence-file sha256; the review result per component (ACCEPTED or REJECTED with a reason); the build inputs the archive declares (build system and minimum compiler), recorded as facts, not fetched; and evidence state PLANNED_BASELINE_TARGET with G1 and G2 recorded and G3 to G8 NOT_RUN."
  - "Pinned values (fetched once on GCP, run r06pins001b, 2026-11-20, kit gcp2.5 as mirror-fetch; gate evidence: R10's mirror-read check mck1, mirror_check.json sha256 prefix c808e22f, ok true, 0 mismatches, 1 entry checked, for the manifest below). dossier.json carries exactly these values: tag v1.0.0; commit b1b770d90d94cad9e9ea5b993bdbc383a522fb28; commit tree 03d5ee6748f415d4069dc570764c24ff3576a0f1, equal to the tree recomputed offline from the archive; publishedAt 2026-11-13T10:20:19Z; pinnedAt 2026-11-20T15:46:11Z; archive sha256 3f5f750e36326aea4d65c7623e7d597a33e395d65f4d76e5e0532171f252532b and size 38889520 bytes; mirror bucket harness-onion-artifact-mirror, object sha256/3f5f750e36326aea4d65c7623e7d597a33e395d65f4d76e5e0532171f252532b, generation 1795189583001229; manifest manifests/MODEL-ADOPT-PINS-001/r06-pins-001-20261120T154611Z.json, sha256 d4081819536ee48e22717c5ea7e5303663fc345bcd5717c93115b34a8400c73d, generation 1795189583094545; createOnlyProof second write 403, refused. The licence-named files of the archive (the name rule LICENSE, LICENCE, COPYING or NOTICE at any depth; path, sha256, bytes): LICENSE 94f29bbed6a22c35b992c5c6ebf0e7c92f13b836b90f36f461c9cf2f0f1d010d 1078; cmake/license.cmake 083515dff8a9b8696e348c7c616934e53941a7db30e1b3f092576632e9a2d1d4 1445; gguf-py/LICENSE ef78c7e6659e34c798194f0d344e807c722de70cbca1359ef54772661e11ca38 1072; licenses/LICENSE-jsonhpp c0d068392ea65358b798b8c165103560f06e9e3b38c4ab4e2d8810a7b931af86 1075; tools/ui/src/lib/vendors/big-integer/LICENSE e9b0e94f628e00b5ed98046cfa041696ff89eebbbdd54108ee350625bc6d0363 1234; tools/ui/src/lib/vendors/decimal.js/LICENCE.md 3108b546bcff5d346923a82f48b2d252ca722f9088076db6d145f6b67757ad6c 1104; tools/ui/src/lib/vendors/nerdamer-prime/LICENSE c9f52548869a0a2e63a7100055c54cebf36b9327c8fc2da7cf9ca8dddc2f1cca 1073; vendor/cpp-httplib/LICENSE 4b45cbe16d7b71b89ae6127e26e0d90a029198ca5e958ad8e3d0b8bbed364d8b 1075; vendor/hash/rotate-bits/LICENSE.md ca0b44aec101afb6b46f4c39b23369fa06a64fb9c0add37c2689d702156fee55 1088; vendor/hash/sha256/LICENSE b81d0022ca6367918c67b57e9647d3513ee58809fd4b0ef0b3492f1356bced25 41; vendor/hash/xxhash/LICENSE 6ffedbc0f7878612d2b23589f1ff2ab15633e1df7963a5d9fc750ec5500c7e7a 1389. These 11 entries are what the name rule matched, not yet a licence review. cmake/license.cmake matched by name and is classified by the review (a build file, not a licence text, unless its content says otherwise). Each entry's licence identifier and review result are read from the mirrored bytes at the dossier build, through a mirror-read job, and the sha256 of each read is checked against this list first."
  - "Licence review: a mirror-read job (account mirror-read) reads each of the 11 files of contracts[2] from the mirrored archive, checks its sha256 against contracts[2] before use, and writes licence_review.json: per file, the path, the sha256 read, the identifier (an SPDX id, or NOT_A_LICENCE_TEXT for a build file such as cmake/license.cmake), and the result. dossier.json names that file's sha256, and every identifier in dossier.json and the SBOM comes from it."
  - "No artifact byte is committed: no source archive, binary, model weight, tokenizer or vendored file. The mirror holds them; the repository holds digests. Each mirror key equals the sha256 the dossier records."
  - "adoption/llama-cpp/sbom.spdx.json is SPDX 2.3 JSON describing the pinned source archive: one package for the engine and one per vendored component, each with its licence and the archive-relative path, generated offline from the archive's file list and licence files. The SBOM tool is a standard-library script, so the packet needs no further download."
  - "The adapter, the managed and attachment modes and the G3 to G6 evidence are MODEL-LLAMACPP-001's (ruling A2). The Linux qualification and the engine-profile probes (G7, G8) are a later MODEL-ADOPT-001 packet. The attachment endpoint is MODEL-EXIST-QUAL-001's (ruling A3). Ollama and vLLM dossiers follow in that order, as separate packets."
deliverables:
  - "dossier.json, LICENSES.md (the engine's licence text and a table of the vendored components with their licences and review results), NOTICE.upstream (the upstream notices, if any, verbatim) and sbom.spdx.json, each LF-only strict UTF-8 without a byte order mark."
  - "tests/adoption/test_dossier.py (standard-library unittest; writes nothing): dossier.json parses, carries every key of contracts[1] with no extra key, every sha256 is 64 lowercase hex characters, every mirror object name is sha256/ followed by its own sha256, the pinned values equal contracts[2] exactly (tag, commit, commit tree, publishedAt, pinnedAt, archive sha256 and size, object name and generation, manifest name, sha256 and generation, and the 11 licence-named files by path, sha256 and bytes, with no file added or missing), the gate evidence names mirror_check.json c808e22f with ok true and 0 mismatches, no placeholder remains (no match of the pattern <[^<>]*> in dossier.json or sbom.spdx.json, and no value equals TBD, TODO or an empty string), the quarantine object has exactly the keys minimumDays, source, decisionRef, policyItem and exemption, source is one of OWNER_DECISION and POLICY_IN_FORCE, minimumDays is a positive integer, policyItem is SUPPLY-QUARANTINE-001, publishedAt + minimumDays <= pinnedAt unless exemption.used is true with a non-empty reason, the recomputed tree id equals the recorded commit tree id (both 40 lowercase hex characters), every vendored component in the SBOM appears in the dossier and the reverse, no component is REJECTED, each of the 11 licence-named entries carries an identifier and a reviewed sha256 equal to its contracts[2] sha256 (R06-P1), and G3 to G8 read NOT_RUN."
excluded:
  - "Any artifact byte, engine source, binary, build, adapter code, model weight, tokenizer, network access during acceptance, hosted endpoint, Makefile or ci/ change, PORTING.yaml change, and every path outside allowedPaths."
