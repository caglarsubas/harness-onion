contracts: ["Accepted base is main 26a8affbc289132a80c3c3b1c1b41a19ce2a358b, holding 256 immutable packets including MET-ENFORCE-040. Add MET-GOV-001 only, as packet 257. Preserve all 256 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions (2026-10-21, via the lane monitor, recorded verbatim in architecture/evolution-surface/status.json): Q-ES-1..7 \"Accept, but gate it (Recommended)\" with Q-ES-6 (b) (gate material: the owner's per-PR merge approval, D5a records, oracle tests outside the candidate); Q-ES-CAP (a); Q-ES-D1 (a), Q-ES-D2 (a) and Q-ES-D3 (a) (the gate-material extensions, the verifier and runner docs, the monitor's head-bound merge practice); Q-GOV-CAP \"One delta r5, then cap (Recommended)\"; and, with the monitor's ruling MON-GOV-R5-KEEP, the owner's \"Fold small fixes, no round (Recommended)\" for round 5's four NOTEs. Packet id MON-ES-ID.", "Add architecture/evolution-surface/ (the record evolution-surface.json, its closed schema, vectors.json, README.md and REVIEW_BRIEF.md; status.json ADOPTED_CONTRACT_CANDIDATE; review-round1.json to review-round5.json, the reviewer's records byte for byte; round1/ to round5/, each round's subject snapshot with the vectors bound by digest only) and the standard-library reference model scripts/evolution_surface.py. The adopted bytes are the owner's NOTE-fold commit, not round 5's subject: status.json binds round 5's subject, the fold commit and each file the fold changed by digest, and the README's status line is the one adoption edit. The candidate's own tests and the oracle tests written outside the candidate by a separate agent (D5a) are tests/test_evolution_surface.py (after the layer's tests, byte for byte as the fold left them) and tests/test_evolution_surface_oracle.py.", "Add one 257-packet current catalog with an exact 257-to-256 inverse before the accepted 256-to-255 MET-ENFORCE-040 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, reviewed_mode and reviewed_tree, refuses a path outside its era before reading it and binds every era file by digest: the 36 files this packet adds under architecture/evolution-surface/ and the model. It checks that this packet changes nothing under architecture/ and not the model, adds under architecture/ only the contract's directory, closed with its five round snapshots (mode 100644, no absolute local path); that the contract files are the adopted bytes; the status record's closed shape and values; the owner's NOTE fold bound by digest, with round 5's snapshot as its reviewed side, and the one adoption edit; the five rounds bound to their published records by digest, each record's subject, verdict and findings equal to its round's; round 5's NOTEs carried to the fold; and the record, its schema and its vectors naming the same contract. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 256's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 68 predecessor routes, every catalog walk and round trip, the full payload loop); 256's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-040 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_evolution_surface.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 257-packet membership and count updates; layer tests and the MET-ENFORCE-040 layer's checks adjusted solely for the successor bridge; C2's two test changes in 256's test tests/test_edge_record_v9.py; the one-deeper successor hand edit of 255's test tests/test_chain_compaction.py (as 256 made for 254's); tests/test_sector_catalog.py's GLOB_READERS gaining exactly the six new checkout listers, scripts/evolution_surface.py and its five round snapshots (the slot-218 tripwire's rule for a new .py that lists the checkout); catalog-membership filters ignoring only the added MET-GOV-001 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The evolution surface record v1 with its schema, vectors, README and reference model, and its status, five review records and round snapshots under architecture/evolution-surface/, adopted after independent contract review and the owner's NOTE fold.", "A fresh 257-to-256 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier after the owner's per-PR approval of the exact head (gate material)."]
