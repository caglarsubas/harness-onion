id: CTRL-TRANSPORT-001
repository: mas-harness-control-plane
branch: codex/ctrl-transport-001-verifier-bootstrap
objective: Admit R04 heads to the owner-operated verifier by adopting harness-onion's offline transport byte for byte, retiring the hosted-workflow path and making the closed dispatcher pass NEXT_TELEMETRY_DISABLED=1 to its children, without changing any product source, dependency, dispatch rule or public contract.
predecessors: [CTRL-FIX-003]
allowedPaths: ["ci/verify-offline.sh", "ci/warm-source-isolation.sh", "ci/network_canary.py", "ci/run_packet_argv.py", ".github/workflows/verify.yml", "ci/zero_bill_scan.py", "tests/bootstrap/test_no_workflow.py", "ci/targets/ctrl-transport-001.json", "ci/run_make_target.py", "tests/bootstrap/test_dispatch_child_env.py", "tests/bootstrap/test_node_closure.py"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts: ["Verifiable only once VERIFIER-EXT-R04-R11 is installed on the owner-operated verifier; the extension is an install step, not a packet dependency", "Consumes harness-onion main 57bb1033e4a68cbb38610987060aedd8e879c7e6 ci/verify-offline.sh, ci/warm-source-isolation.sh, ci/network_canary.py and ci/run_packet_argv.py as exact bytes and modes: ci/verify-offline.sh 100755 sha256 778cb0faf59786dc31559e5d96a399d1e3bb26a4576e0ee9ff70e1f6546bd114, 3908 bytes; ci/warm-source-isolation.sh 100644 sha256 f717f62fb1c9fdaec9eb594c733f25b17394bae6b90a311b9ccc08d4eaf9233b, 4674 bytes; ci/network_canary.py 100755 sha256 1be4a837c4a5baee900db20007c4841361b8c823a1b5e521badcf28890d82099, 1459 bytes; ci/run_packet_argv.py 100755 sha256 c2ed0852fa499f194bc91291c32d08b303ea79be3ba7ca6cb29a786d585929f5, 8279 bytes", "Preserves the CTRL-001 Makefile, handlers, PORTING ledger, dependency maps and every predecessor ci/targets descriptor unchanged; the closed dispatcher's rule loading, matching, ordering and argv rendering are unchanged, and only its child environment gains NEXT_TELEMETRY_DISABLED=1", "Produces a repository with no hosted workflow file whose zero-bill scan asserts that absence", "This is a one-time, closed transport-correction authority over CTRL-001-owned files, in CTRL-FIX-001's form: it covers only the four transport files, the deletion of .github/workflows/verify.yml, ci/zero_bill_scan.py, the one child-environment line of ci/run_make_target.py, ci/targets/ctrl-transport-001.json and the three new bootstrap tests; it does not change the Makefile, ci/handlers/**, any predecessor ci/targets descriptor, PORTING.yaml, product source, dependencies or any evidence axis, and later packets keep the bootstrap/Makefile/dispatcher/workflow/PORTING exclusion"]
deliverables:
  - "Replace ci/verify-offline.sh, ci/network_canary.py and ci/run_packet_argv.py with, and add ci/warm-source-isolation.sh as, exact copies of harness-onion main 57bb1033 (sha256 and git mode equal to the pins in contracts[1])."
  - "Delete .github/workflows/verify.yml; no file remains under .github/workflows/."
  - "Rewrite ci/zero_bill_scan.py: keep every non-workflow check unchanged (symlink walk, hosted-package and install-script refusals, runtime/kind tokens); replace the pinned two-step workflow contract with a refusal when any file exists under .github/workflows/; remove the then-unused FORBIDDEN_WORKFLOW tuple."
  - "Add tests/bootstrap/test_no_workflow.py (stdlib unittest): asserts .github/workflows/ holds no file at the packet head, that zero_bill_scan.py passes on the repository root, and that it refuses a temporary copy of the minimal scan layout that contains a synthetic workflow file; the temporary tree lives under TMPDIR, never in the repository."
  - "Change ci/run_make_target.py at the single subprocess.run call (line 158 at 1de7c405329f4458970be0187838145b4da222d8) to pass env={**os.environ, \"NEXT_TELEMETRY_DISABLED\": \"1\"}; no other line changes. Named allowedPaths exception: the harness-onion runner scrubs NEXT_TELEMETRY_DISABLED, so next build (ci/targets/ctrl-fix-003.json:10) would otherwise attempt telemetry under deny-all."
  - "Add tests/bootstrap/test_dispatch_child_env.py (stdlib unittest, loads ci/run_make_target.py by path as tests/bootstrap/test_dispatch.py does): writes one temporary descriptor under TMPDIR whose only argv is python3 -I -B -c checking os.environ for NEXT_TELEMETRY_DISABLED == '1' (exit 0, else a distinct code), runs dispatch() on it with the variable absent from the test's own environment, and asserts rc 0; a second case asserts the parent environment is not mutated. Named allowedPaths exception: the proof of the line above."
  - "Add tests/bootstrap/test_node_closure.py (stdlib unittest; named allowedPaths exception under Q-VX45-2 (a): the bootstrap installs node_modules in-session, the extension does not provide them). It (1) requires package-lock.json to have sha256 362ccf86489852256e36585ad1241c76a9c094d04cf8a35c9c2554e2f5e15cf7 and git blob d5efff4839064263b2b40b1734164903c1c91259, and package.json unchanged from 1de7c405329f4458970be0187838145b4da222d8; (2) takes a marker file under TMPDIR; (3) runs exactly [\"npm\",\"ci\",\"--offline\",\"--ignore-scripts\",\"--no-audit\",\"--no-fund\",\"--update-notifier=false\",\"--cache=/opt/planeon/npm-cache/ctrl-006\",\"--logs-dir=<TMPDIR>/npm-logs\"] from the repository root with shell=False, and with a child environment of the parent's PATH and TMPDIR plus HOME=<TMPDIR>/npm-home (empty, so no user .npmrc applies, as in the probe); (4) requires rc 0 and no file or directory under the cache with an mtime newer than the marker; (5) requires the host platform's Next SWC package directory to exist after the install, by a closed map of (platform.system(), platform.machine()) to node_modules/@next/<name>: (Darwin, arm64) -> swc-darwin-arm64, (Linux, x86_64) -> swc-linux-x64-gnu; any other host, or a missing directory, fails; (6) leaves node_modules in place. It writes nothing outside node_modules and TMPDIR."
  - "Add ci/targets/ctrl-transport-001.json registering only `transport-bootstrap`, a closed argv target running the three new tests in this order: test_node_closure.py first, then test_no_workflow.py and test_dispatch_child_env.py. Named allowedPaths exception: the packet needs its own make target; no other descriptor is touched."
excluded: ["Product source, tests other than the three new files, Makefile, ci/handlers/**, predecessor ci/targets/*.json, PORTING.yaml, package.json/package-lock.json, pyproject.toml/uv.lock, prisma, deploy, docs, new dependencies, network, warm sources, prefetch.sh, verifier or host configuration."]
prefetchCommands: []
offlineAcceptanceCommands: [["make","transport-bootstrap"],["make","zero-bill"],["make","prefetch-lineage-regression"],["make","compiler-worker-contract"],["make","ctrl-fix-003-regression"],["make","security"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - "The four transport files equal harness-onion main 57bb1033 by sha256 and mode; .github/workflows/ is empty; the diff touches only allowedPaths, and ci/run_make_target.py differs from 1de7c405329f4458970be0187838145b4da222d8 in the one subprocess.run line only."
  - "transport-bootstrap runs first and installs node_modules offline from the pinned lockfile and the ctrl-006 cache with rc 0, leaving no cache entry newer than its marker; the five later commands use that node_modules."
  - "zero-bill passes without a workflow file and the new test proves it refuses one; the child-env test proves a dispatched child sees NEXT_TELEMETRY_DISABLED=1 when the parent lacks it."
  - "The installed verifier (VERIFIER-EXT-R04-R11) accepts the head: the harness-onion runner scrubs the child environment to its allowlist, and the CTRL-004 venv python, the Node closure, the predecessor Vitest/build suite and the security target (typecheck, Vitest, dependency audit) still pass under it, with no telemetry attempt from next build."
  - "No product behaviour, dependency, dispatch rule, ledger or public contract changes."
rollback: Revert this commit to restore R04's prior transport, workflow and dispatcher child environment; no data, schema or dependency state is involved.
