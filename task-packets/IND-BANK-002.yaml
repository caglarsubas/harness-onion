id: IND-BANK-002
repository: mas-harness-industry-packs
branch: codex/ind-bank-002-data-readiness
objective: Add the banking source inventory, synthetic non-personal mock data, and explicit illustrative completeness, freshness, provenance and classification thresholds for customer, account and transaction sources as the banking successor of IND-WG-002.
predecessors: [IND-BANK-001]
allowedPaths:
  - packs/banking/pack.yaml
  - packs/banking/questions/data/
  - packs/banking/data/
  - packs/banking/rules/data-readiness.json
  - packs/banking/fixtures/sources/
  - packs/banking/fixtures/readiness/
  - tests/banking/test_banking_business_domain.py
  - tests/banking/test_banking_data_readiness.py
  - tests/framework/test_dispatch.py
  - docs/banking/data-readiness.md
  - docs/banking/business-domain.md
  - ci/handlers/ind_bank_001.py
  - ci/handlers/ind_bank_002.py
  - ci/targets/ind-bank-002.json
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - Consumes exact public R03 main commit bab45acfa34a0fb44d86aaf4e039ea0dfff9690f (IND-BANK-001), banking.financial-services 0.1.0 pack digest a7f021d3c56b812ecfcaf0cbd1baddbc811ef0dc37ce5b31d40d35c2e32dd602, raw packs/banking/pack.yaml SHA-256 bbde109b5ad00a0256d1bb8ac50e7aa2fc7ac74721cda57fb094f4d52b175dc2, common.foundation 1.0.0 pack digest 3cfea19e6e0a4a653d63622e250f40001b4f8221ebab18fa5bfc1601b8eddea3 and the unchanged reproducible framework 0.1.1 wheel SHA-256 d34a1a3c523b1e60f10602fff072d5dbf83f46f2220f29a4f13b9a31facf91f4, with pyproject.toml SHA-256 331f31f6fbe122a860325e23256b95f2cdbfcffd82e3f95e3a0d99fde332b1ba and uv.lock SHA-256 12ab191dedad208ea14f88a388006c395b63fbc4e9f23ea6583d802a30653e8f unchanged, without copying or mounting an upstream checkout during acceptance; it imports no ci/handlers/ind_wg_*.py or tests/white_goods code.
  - Consumes DataReadinessAssessment v1alpha1 from public contracts commit 2146278a95344cd2a8e22596b2f315b46edffc88 at the authoritative path schemas/v1alpha1/readiness/data-readiness-assessment.schema.json with SHA-256 ffe003a1a7ec0773f49d8f394ac3dd6281114bd4335ff05c87d223412faf92a5 and guidance schemas/v1alpha1/guidance/common.schema.json with SHA-256 4d77297073d4c2e559f1131fbada566b499197f87113f7e28b136f0b4ae5f429. A data-only binding record documents that the byte-copied contracts lock's guidance path for DataReadinessAssessment is historical and non-authoritative while its content digest is correct; no schema bytes or upstream checkout enter this repository or packet execution.
  - Produces banking pack 0.2.0, retaining pack-format compatibility 0.1.0 and framework distribution 0.1.1, with no framework, common-pack, white-goods-pack, transport, dependency or lock change.
  - Supersedes IND-WG-002 for release scope only (MET-SECTOR-001) and replaces the sector inputs of KN-DATA-001 and KN-DATA-002; IND-WG-002's accepted edges and the white-goods 0.2.0 slice stay byte-identical historical source.
  - "Carries four notes from IND-BANK-001's independent source review: IB1-R1-3 (a new raw-only scan function in the predecessor handler blanks only maximal lowercase hexadecimal tokens of exactly 40 or 64 characters with no alphanumeric neighbour before the strict scan, and still reports any strict hit that extends outside a blanked token; digests are written only as quoted strings or in backticks, never next to a digit group across one space or hyphen, so per-member SHA-256 values do not fail it spuriously while a run glued to any word is still found; the strict scan used for answers, texts, literals and data members is unchanged), IB1-R1-4 (the deferral and role-id rule stays in the predecessor handler's main and is documented, not moved), IB1-R2-1 (an optional-null business answer test) and IB1-R2-2 (cross-type empty business answer refusal tests)."
  - "Consumes no harness-onion provider, service or module catalog: the packet reads none of them, and any later read of their banking-era bytes goes only through scripts/sector_catalog.py's effective_bytes(path) or effective_catalog(path), never the raw catalog files (MET-SECTOR-002, SECTOR-D1)."
deliverables:
  - >-
    Advance only the banking sector pack from 0.1.0 to 0.2.0. Retain the
    byte-identical common pack, contracts.lock.json, journey.yaml, ontology,
    business questions, business answer vectors, pack-format compatibility
    0.1.0 and framework distribution 0.1.1. Update the predecessor handler and
    business test only for the new sector version, the declared file and
    resource inventory, the deterministic archive name and the four carried
    notes; the predecessor handler already discovers only questions/business/,
    so additive data questions cannot enter its frozen answer vectors, and all
    predecessor decisions and answer digests remain unchanged. The business
    test's empty-content assertion keeps only controls and provider
    preferences and asserts the exact 0.2.0 rule and readiness ids.
  - >-
    Data questionnaires collect source class and accountable owner and
    custodian roles, required-field coverage, observation timing, duplicate
    measurement, classification and provenance coverage, evidence references,
    cross-source reconciliation confirmation, tenant readiness-policy approval,
    and confirmation that examples are synthetic. Closed source-class options
    are api, postgresql, events and files. Questions cannot request tenant,
    customer, account or transaction records, credentials, secrets, connection
    strings, endpoints, production facts or regulatory conclusions.
  - >-
    The source inventory declares exactly four synthetic local source classes
    with accountable owner and custodian roles, classifications and stable
    evidence ids: an api product and rate catalogue keyed by banking ontology
    product ids, postgresql-shaped party and account CSV members with opaque
    party and account ids, transaction event JSONL with opaque ids, small
    amounts and ISO 4217 codes, and a files member of synthetic product terms
    and policy text written for the pack, whose inventory description says it
    is not an institution document and is replaced by each tenant's approved
    sources. No member holds a name, address, birth date, national id, phone,
    e-mail, real account or card number, or a decimal digit run of thirteen or
    more digits. dataset.lock.json binds every data member by relative path,
    media type, record count, byte size and SHA-256; these five files are the
    data members, and the files description is exactly: Synthetic product
    terms and policy text written for this pack; not an institution document.
    Each tenant replaces it with its own approved sources.
  - >-
    A versioned readiness policy records per-source-class PASS and WARN bands
    for completeness, freshness, duplicate rate, classification coverage and
    provenance coverage, each class labelled illustrative and
    tenant-overridable. Zero observations always fail as MISSING_DATA. The
    bands are examples, never production claims, and every tenant binds its
    own approved evidence and policy. The pack rule blocks readiness while the
    evaluator state is warn or fail or the tenant policy is not approved.
  - >-
    A data-only contract binding record names the public contracts
    repository by name only (mas-harness-contracts, equal to the repository
    suffix of the byte-copied contracts lock) with the exact commit and the two
    schema paths and digests, records the historical guidance-path observation of the
    byte-copied contracts lock as documented and not corrected, and copies no
    schema bytes.
  - >-
    PASS, WARN and FAIL readiness fixtures, each naming its source class, use
    fixed evaluation times and measurement counts. Negative vectors cover
    missing, stale, duplicate, unclassified and unprovenanced data, a
    cross-source reconciliation mismatch reported as
    DATA_RECONCILIATION_MISMATCH under data.quality, and disallowed data
    reported as PERSONAL_DATA_FORBIDDEN under data.classification, whose value
    is built at run time from arithmetic and never committed. Each vector's
    reason codes, ten gate states and missingGateIds are fixed in advance;
    integration and autonomy are always NOT_APPLICABLE. Evaluation uses
    decimal-safe arithmetic and sorted stable reason codes; FAIL dominates
    WARN, WARN never advances readiness, and a missing-data result suppresses
    misleading derived metric findings.
  - >-
    Each readiness fixture wraps one nested DataReadinessAssessment with
    exactly these gate ids in order and no other: business.owner,
    business.outcome, data.owner, data.quality, data.completeness,
    data.freshness, data.provenance, data.classification,
    integration.readiness and autonomy.boundary. PASS yields READY; WARN
    yields BLOCKED with NEEDS_INPUT; FAIL yields BLOCKED with BLOCKED. Only
    relevant non-pass gates appear in sorted missingGateIds. Integration and
    autonomy are always NOT_APPLICABLE.
  - >-
    The packet-owned Make descriptor registers only the unique data-readiness
    target with exact PACK=banking and direct argv to
    ci/handlers/ind_bank_002.py. The handler validates the contract binding,
    questionnaire, source, policy and rule closure, the class labels and the
    files description, dataset digests, counts, sizes and media types, the
    common pack digest, the pyproject.toml and uv.lock bytes, the literal
    rule and the strict
    disallowed-data scan over the five data members, the raw scan with the
    hexadecimal-token guard over its own four packet-owned files (handler,
    descriptor, test, docs) with no hit, every decision and assessment
    including the run-time mutation,
    two-build pack index and archive identity, no retained artifact, and false
    publication, deployment, runtime, assurance and tenant-acceptance flags.
    It reuses the predecessor's strict scanner and its raw-only scan
    function by loading its handler file under a fixed module name, never as
    __main__, and refuses if that load or any of the three functions it uses
    fails. The closed descriptor-inventory regression is updated without changing
    Makefile or the dispatcher; docs/banking/business-domain.md gains one
    cross-reference line to docs/banking/data-readiness.md.
excluded:
  - Real tenant, customer, account, employee or transaction data, institution documents, warm-source data, copied schema or source bytes, credentials, secrets, connection strings, source endpoints, remote reads, runtime downloads, paid services, production thresholds, unsupported freshness or regulatory claims, new readiness gates, mutable digests, executable pack content, write-capable actions, waivers, signatures, transport or zero-bill changes, publication, deployment, runtime evidence, assurance evidence, or tenant acceptance. Missing or WARN evidence cannot be marked ready.
