offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - The handler finds the public contracts commit, the two schema paths and digests, the common pack digest and the exact pyproject.toml and uv.lock bytes equal to the packet's bindings, without mounting or reading an upstream checkout; the start commit and the raw 0.1.0 pack file and digest are bindings of the start state, checked before the build, not by an acceptance command.
  - The four synthetic source classes, owner and custodian roles, data member paths, record counts, byte sizes, media types and SHA-256 values are closed and mutually consistent; a tampered byte, count, path or classification fails; every class carries the illustrative, tenant-overridable label and the files entry its synthetic-text description.
  - PASS, WARN, missing, stale, duplicate, unclassified, unprovenanced, reconciliation-mismatch and disallowed-data vectors produce exact sorted reason codes, the ten ordered contract gates and no other, correct gate states, correct missingGateIds, and READY only for PASS; no data member holds a disallowed value or a thirteen-or-more digit run.
  - Two canonical indexes and fixed-epoch archives of banking 0.2.0 are byte-identical and temporary outputs are removed; the common pack, the white-goods pack and the framework 0.1.1 distribution remain byte-identical.
  - The predecessor business slice still validates with unchanged answer digests and decisions; its raw repository scan finds only the pinned answer-vector value; a run-time-built Luhn-valid run directly after ref, id or code is found by the raw scan; a run inside a 40- or 64-character lowercase hexadecimal token is ignored by the raw scan and found by the strict scan; a 64-character hexadecimal token with a non-hex letter glued to either end is not exempt; a run inside an uppercase 64-character hexadecimal token is found; a space-grouped run whose last group sits inside a standalone 64-character hexadecimal token and is followed there by a hex letter a-f is found, and so is the mirror case whose first group is the tail of such a token; a bare space-delimited Luhn-valid run is found, and so is a run inside a standalone lowercase hexadecimal token of 39, 41, 63 or 65 characters; the optional-null and cross-type refusal cases pass; the raw scan of this packet's own four files finds nothing.
  - Dispatcher inventory includes IND-BANK-001 pack and IND-BANK-002 data-readiness with no duplicate target, undeclared variable, shell transport, ambiguous handler or predecessor regression; the white-goods pack, certification fixtures, IND-FIX-001 regression, reproducible build and zero-bill rules pass unchanged.
  - Source, candidate, CI, merge, artifact, publication, deployment, runtime, assurance and tenant acceptance remain separate evidence states.
rollback: Revert together the banking 0.2.0 bump in packs/banking/pack.yaml; packs/banking/questions/data/, packs/banking/data/, packs/banking/rules/data-readiness.json, packs/banking/fixtures/sources/ and packs/banking/fixtures/readiness/; ci/handlers/ind_bank_002.py and ci/targets/ind-bank-002.json; tests/banking/test_banking_data_readiness.py; docs/banking/data-readiness.md; the cross-reference line in docs/banking/business-domain.md; the IND-BANK-002 data-readiness line in tests/framework/test_dispatch.py; and the predecessor edits in ci/handlers/ind_bank_001.py and tests/banking/test_banking_business_domain.py (version, inventory, the raw-only scan function, its tests and the carried business-answer cases), restoring exactly IND-BANK-001's banking 0.1.0 slice; retain common.foundation 1.0.0, framework 0.1.1, the historical white-goods packs and evidence, the transport bootstrap, and every downstream tenant or release record unchanged.
