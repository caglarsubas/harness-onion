expectedEvidence:
  - Exact product and predecessor commits/runs, CON-005 file hashes, taxonomy, npm lock, browser inventory, and launcher custody are verified; no predecessor or warm-source checkout is mounted or observed during product work.
  - Golden and property vectors prove closed enum/binding rejection, exact four-by-four taxonomy, precedence, expired/source-unavailable blocking, waiver without pass, and zero contribution from NOT_SELECTED or PROPOSED harnesses.
  - Ingestion vectors prove eight-source validation, idempotent identical replay, changed-duplicate/gap/regression/cross-binding/future-time denial, atomic failure, cursor advancement, last-verified publication, and no fabricated evidence.
  - HTTP and independent RLS models prove session-derived tenant isolation, caller-identity rejection, operator policy/action/target/digest binding, audited allow and deny, stable pagination/filtering, and indistinguishable not-found responses.
  - SQL review proves exact additive tables, composite tenant keys, FORCE RLS, transaction-local context, bounded grants, append-only audit, monotonic cursor guard, and closed non-login fixed-search-path operator procedure; live PostgreSQL is honestly NOT_RUN_ENV_UNAVAILABLE.
  - Source and Playwright evidence proves semantic onion/list equivalence, named harnesses, stable route/filter navigation, keyboard/focus/history, loading/empty/stale/source-loss/unauthorized states, reflow/zoom/reduced motion, non-color status, and zero non-data/about requests.
  - Signed hash-pinned acceptance passes prefetch, cumulative bootstrap-e2e, all four CTRL-007 handlers, and terminal zero-bill in one OS-denied-outbound process tree. Source, PR CI, merge, exact-main, artifact, deployment, runtime, security, assurance, manual accessibility, and tenant acceptance remain separate evidence states.
rollback: Disable the additive overview and operator portfolio entry points, deploy the exact CTRL-006 compatible image, and revert CTRL-007 code, migration, tests, documentation, and descriptor together. Preserve every projection, source cursor, finding, and operator audit record for its retention period; never delete tenant evidence, weaken RLS, broaden operator authority, coerce status, or claim rollback as runtime or tenant-acceptance evidence.
