contracts: ["Accepted base is main dcf11803fca83454cb0660ffd88b65ce06a22a0f, tree 8f2d2b065038f0dea0f58dec7326e4a6489a2fec, holding 288 immutable packets including MET-ADOPT-007. Add MET-PERF-047 as the 282nd chain packet, a K = 0 step that publishes no product (C = S + P: 289 packets at slot 282). Preserve all 288 predecessor YAML files, every contract snapshot, review record and status record, the catalogs, the chain-compaction and chain-product-packet records and the identity models unchanged.", "The ledger architecture/chain-checkpoint/record.json (harness.planeon.ai/chain-checkpoint/v1): slot 282 over the 288-packet baseline, one entry per chain layer 189-281 with its validator, authority, test and captured inputs at their checkpoint-tree digests and its recorded node outcomes, the owner's parameters (cadence 10 slots, sample fraction 0.1, full runs on owner-named slots, N_shadow 10, a 15 s cap, 8 workers), the full-run proof, the check pairs, the writing run's two stated differences (argv 63 runs directly; the serial loop), and its closed exclusion (MON-282-W2-RULED: this step's authority, its hunk-class record and the ledger itself are never a layer's input, and the head validator is attested by its normalized digest, its AUTHORITY_SHA256 pin line excluded; the exclusion equals the bounded build's write set); its README and vectors 1-14.", "The reader ci/chain_checkpoint.py is shadow-only in this packet: the root conftest.py loads it by path, guarded, in the outermost session only; it rebuilds each attested file's checkpoint bytes from the published reverse hunks of the authorities newer than the checkpoint, newest first and class-gated, compares their digests and writes one shadow record line; it never changes a session's outcome, skips nothing and is bounded by its 15 s cap. Each classed authority's hunk classes live in its closed hunk-class record, named in the authority's own newFiles by sha256 (MON-282-W1-A2); this step's is architecture/chain-checkpoint/hunk-classes/282.json, built by chainmech v2.3's bounded two-pass build. chainmech v2.3 adds the closed register class (a step's own readiness block and master-plan status line, each once per file), and the reader holds v2.2's and v2.3's rules, chosen per authority by the record's rule sha256 (RULES_BY_SHA).", "The registry gains exactly one rider, MET-PERF-047/packet (kind PACKET, the generic packet brief architecture/review-briefs/REVIEW_BRIEF_PACKET.md, sha256 6dcff68d7e6b01823f1740063e94910edcc159a71a6ee803f1b66c62fd06e274, version 1), appended last; the CONTRACT records (contract revs 1 to 6 and their six review rounds) stay lane-local.", "The D5a oracle tests/test_met_perf_047_oracle.py (sha256 0b4d770613786c3a410022db92dafcfd92e75186770307c90340e0d41e58d25c) was written by a non-author from the README, the reader's docstring and vectors.json only, and is bound by architecture/chain-checkpoint/oracle-identity.json; its blind runs follow the lane monitor's MON-282-ORACLE-RUN.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ADOPT-007 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_perf_047.py calls its validate() on the current tree, and the reader rides argv 63's existing pytest through the root conftest.py. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict, and MET-PERF-041's caps unchanged.", "Add one 289-packet current catalog with an exact 282-to-281 inverse before the accepted 281-to-280 MET-ADOPT-007 layer. The new layer scripts/validate_met_perf_047.py binds no PRODUCT_PACKETS (a K = 0 step: its class functions carry no product form), reads only its era's reviewed bytes, each bound by digest, and checks V1 (the packet's seven files at their adopted digests and the oracle binding), V2 (the ledger, bound by the authority's newFiles digest and never an era file: its closed members, the owner's parameters, the full-run proof, the stated differences, its size, its exclusion and its layers as the chain walk 189-281), V3 (the root conftest.py's guarded load and docstring), V4 (the registry differs from the base by exactly the one rider), V5 (every attested file's checkpoint digest, the head validator's normalized) and V6 (its hunk-class record, re-checked in full by chainmech v2.3's rule), each with a failing test, and its canonical hunks.", "Inherited validators, tests and documents change only by: the step vocabulary with S 282 and C 289 at K = 0 (slot 189's set gains MET-PERF-047; the deepened closed sets gain the deeper NEW_PACKET after 281's; every catalog-equality id list names MET-PERF-047 after the template's block); the MET-ADOPT-007 layer's checks adjusted solely for the successor bridge in the precedent's form; C2's test changes in 281's test tests/test_authority_map.py; the one-deeper edit in tests/test_met_perf_046.py and the count line in tests/test_met_verify_006.py (288 to 289); the count and one deeper closing line in tests/test_parallel_suite.py; 281's registry check V9 in scripts/authority_map.py (V9 (a), MON-282-W2-RULED: the base, then MET-ADOPT-007's rider, then later packets' riders, each the generic packet brief for a published packet, once; an other edit riding this step's authority), with its README architecture/authority-map/README.md and its tests in tests/test_authority_map.py, and 281's D5a oracle with its identity, updated by R12; tests/test_sector_catalog.py's GLOB_READERS gains tests/test_met_perf_047_oracle.py by path; the packet's own edits in tests/test_diagnostic_repair.py and tests/test_parallel_suite.py; the weights entries; the rider; and the index docs. The new head's test tests/test_met_perf_047.py keeps the full fan-in and the generic retain-names scaffold."]
