contracts: ["Accepted base is main 3cba1171e2e9c1dda8fd9e9130f45a68f2ab27d6, tree a535a8e9bf79601c878d86f313741b2eb709bc3a, holding 241 immutable packets including MET-PERF-040. Add MET-ENFORCE-030 only, as packet 242. Preserve all 241 predecessor YAML files, every contract snapshot, review record and status record (the I05 v3 contract, its supplement and its model are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions Q-HE3D-2 (a) (2026-10-15) and Q-I5-4 (a), and the lane monitor's owner-delegated Q-I5-1..3 (a) with its confirmations Q-I5-READINGS (2026-10-16), recorded verbatim in architecture/i05-gate-channel-v4/status.json. Add architecture/i05-gate-channel-v4/ (README, review brief, vectors, the five independent review records with the subject copies of the four earlier rounds, the source index and the status record ADOPTED_DATA_CONTRACT) and the standard-library model scripts/i05_gate_channel_v4.py. At every BIND that passes v3's earlier checks the modelled gate reads the probe-worker cgroup's cgroup.procs, opens a pidfd, checks the worker's start time in /proc/<pid>/stat, reads cgroup.procs again and polls the pidfd; any failure refuses with the existing WORKER_NOT_OBSERVED, non-fatal and retryable, writing nothing durable; the frames stay planeon.internal.effect-gate-frame/v3 byte for byte, and every v3 and supplement transcript replays identically under v4.", "Add one 242-packet current catalog with an exact 242-to-241 inverse before the accepted 241-to-240 MET-PERF-040 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, binds the subject, the status, the source index, the five review records, the round copies and every input the vectors pin by digest before parsing, executes the v4 model from this era's bytes and requires all 277 vector checks (221 v3 and supplement replays, 56 v4).", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-PERF-040 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_i05_gate_channel_v4.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 242-packet membership and count updates; layer tests and the MET-PERF-040 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-030 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
