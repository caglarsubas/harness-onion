contracts: ["Accepted base is main b821ed656a9311529d23e443c8d903a17ad309d9, tree 448d9518faa757d496eace0b30cecf927a6e4640, holding 260 immutable packets including MET-LIVE-002. Add MET-GOV-003 only, as packet 261. Preserve all 260 predecessor YAML files, every contract snapshot, review record and status record (every review record and oracle test that predates review record v2 stays on the frozen list with its digest), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions (via the lane monitor): Q-PK-1 \"New data directory (Recommended)\" (a new top-level harness-onion data directory beside ci/linux-runner/, plus docs/linux-probe-kit/, classified by one owner-approved evolution-surface amendment, so kit PRs are data after it) and the registry decision \"Batch, carried by 260 (Recommended)\". The lane monitor's owner-delegated rulings (2026-10-22 and 2026-10-23): the dossier's six questions, all (a) (the directory is top-level linux-probe-kit/; one more CONTRACT_AND_SOURCE folder entry with no REVIEW_BRIEF or REVIEW_RECORD under-entries; docs/linux-probe-kit/ gets no rule; the 260 and 262 directories get nothing; packet MET-GOV-003, record version 3, gate list 31, only the record digest re-pinned in the vectors, the model unchanged, gate material; no independentOf change); Q-G3-1 (a) (re-issue the D5a oracle identity in place, by a fresh oracle agent); Q-G3-CAP (a) (the design closed at revision 3); MON-261-ORACLE-KEEP and MON-261-ORACLE-SLIPS (the oracle edit kept, its slips accepted as notes); MON-261-C1-KEEP (contract review round 1 kept); MON-261-C2-ADOPT (candidate c2 adopted, which removes exactly two README sentences from c1); MON-261-CAND (the oracle identity's candidateCommit stays); MON-261-R1-1 (packet review r1's R1-1: candidate c3, c2 with one README sentence corrected); and the build rules B-G3-1 (the MET-LIVE-004 registry entries ride with this packet) and B-G3-2 (the new layer pins the kit prefix's resolution).", "Amend MET-GOV-001's evolution surface record (architecture/evolution-surface/evolution-surface.json) from version 2 to version 3 in exactly two places: version 3, and one prefix entry {\"prefix\": \"linux-probe-kit/\"} appended to CONTRACT_AND_SOURCE's paths after release/, in the record's own serialization. No class, role, operation, skip rule, description, ground or independentOf changes, and no REVIEW_BRIEF or REVIEW_RECORD under-entry is added; the schema and the model scripts/evolution_surface.py do not change. The derived gate list stays at 31 entries (a difference of 25), and every path that resolves under version 2 resolves the same under version 3: linux-probe-kit/x resolves to CONTRACT_AND_SOURCE, Linux-Probe-Kit/x to no class, and a PR whose only changed path is under linux-probe-kit/ has approvers LANE_MONITOR and OWNER. The vectors (vectors.json) re-pin only recordDigest to version 3's digest, every other byte unchanged, and replay with the base's row counts. The README (README.md) gains the \"Record version 3\" paragraph, \"How the decision is read\" and \"The oracle test\", and linux-probe-kit/ in the class table's CONTRACT_AND_SOURCE row: it reads \"beside ci/linux-runner/\" as a top-level sibling of ci/ (the PATHS invariant refuses a data entry inside a gate prefix, vector I30), and states that docs/linux-probe-kit/, architecture/probe-kit-scope/ and architecture/linux-probe-interface/ need no rule, the latter two's review-history-* files included (only a REVIEW_BRIEF*.md or review-round*.json file there would resolve to REVIEW_BRIEF or REVIEW_RECORD). The adopted bytes are candidate c3's: c2's record and vectors (MON-261-C2-ADOPT) and c2's README with that one sentence corrected (MON-261-R1-1). No linux-probe-kit/ file is created: a prefix rule needs none.", "The D5a oracle test tests/test_evolution_surface_oracle.py is scoped to record version 3 by a fresh oracle agent outside the candidate (two added lines, each marked MET-GOV-003: a scope comment and linux-probe-kit/ as the ninth CONTRACT_AND_SOURCE prefix in the oracle's own design table; no line changed or removed), and its oracle identity architecture/review-record/oracle-identity-evolution-surface.json is re-issued in place under Q-G3-1 (a) with its own candidateCommit, binding the edited file by SHA-256 with ruling KEEP by the lane monitor (MON-261-ORACLE-KEEP; MON-261-ORACLE-SLIPS). The candidateCommit 5b3846ee is a local, unpublished commit on the old base b5166194 (MET-GOV-002's merge), made for the oracle agent's run before 260 merged; it holds the same record, vectors and oracle file bytes as this packet, so the same oracle bytes pass on both bases, and it stays (MON-261-CAND). The review-record README's note on MET-GOV-002's adoption of that identity is unchanged; the evolution surface README and this contract record the re-issue. The frozen list and architecture/review-record/status.json are unchanged.", "The MET-LIVE-004 brief registry entries (B-G3-1, with ERRATA_RIDER_DIR): architecture/review-record/briefs.json gains exactly two version-1 entries after 260's five (eight entries in all: 259's one, 260's five and these two), in this order, MET-LIVE-004/packet (PACKET, architecture/review-briefs/REVIEW_BRIEF_PACKET.md) and MET-LIVE-004/contract (CONTRACT, architecture/review-briefs/REVIEW_BRIEF_CONTRACT.md), each pinning its generic brief by the SHA-256 of its bytes, the file keeping its own serialization; the two briefs are unchanged, and the B-3 load rules hold. This packet's own MET-GOV-003/packet entry is already in 260's batch. The derived gate check: the gate paths among this packet's changed files are exactly the record, the vectors, the README, the oracle identity and briefs.json, so the owner approves the merge per PR, bound to the head; the owner's exact-head question names the two entries.", "Add one 261-packet current catalog with an exact 261-to-260 inverse before the accepted 260-to-259 MET-LIVE-002 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, lists no directory, refuses a path outside its era before reading it and binds every era file by digest (the record's three files, the oracle test and its identity, the registry and its two generic briefs, and the model); 260's merged bytes of every earlier contract file it changes are reached through its own inverse and bound by digest. It checks the freeze (this packet edits no existing file but chain validators, tests, the three living catalogs, the record's three files, the oracle identity and the registry); the file added (exactly its layer test); that the changed contract files hold no absolute local path; the adopted contract (c3's bytes, the record pinned; the record's change from version 2 exactly the version and the one kit entry, byte for byte; the vectors' only change the re-pinned digest); the unchanged model, executed from this era's verified bytes, over version 3 (its check, version 2's 31 exact or prefix gate entries, the replay with the base's counts, and B-G3-2's resolutions and approvers); the registry (260's with exactly the two MET-LIVE-004 entries); the oracle edit and its re-issued identity; and the derived gate check (exactly the five gate paths, by the base record's 31 exact or prefix gate entries lower-cased, which equals case-folding on this era's all-ASCII gate entries and paths). Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 260's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 72 predecessor routes, every catalog walk and round trip, the full payload loop); 260's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-LIVE-002 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_linux_probe_kit_gate.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 261-packet membership and count updates; layer tests and the MET-LIVE-002 layer's checks adjusted solely for the successor bridge; C2's two test changes in 260's test tests/test_probe_kit_scope.py; the one-deeper successor hand edit of 259's test tests/test_review_record.py (as 260 made for 258's); the count lines of the tests 260 hand-edited, tests/test_policy_observation_digests.py, tests/test_evolution_surface.py and tests/test_sector_catalog.py, which the cascade skips; catalog-membership filters ignoring only the added MET-GOV-003 member; the current-state text; the record version 3 amendment with its vectors and README; the oracle edit and its re-issued identity; and the two registry entries. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The evolution surface record version 3 with its re-pinned vectors and README (candidate c3: c2, adopted after independent design and contract review, with packet review r1's README correction); the D5a oracle test's scoping edit by an oracle agent with its re-issued oracle identity; the two MET-LIVE-004 brief registry entries.", "A fresh 261-to-260 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier after the owner's per-PR approval of the exact head (gate material)."]
excluded: ["Editing any earlier contract or record, except MET-GOV-001's evolution surface record, vectors and README (architecture/evolution-surface/evolution-surface.json, vectors.json and README.md, at version 2 from MET-GOV-002), tests/test_evolution_surface_oracle.py and its identity architecture/review-record/oracle-identity-evolution-surface.json, and two appended briefs.json entries, MET-LIVE-004/packet and MET-LIVE-004/contract; no other architecture/review-record/ file, no generic brief and no model; the evolution surface schema, the frozen identity rule, docs/DEVELOPMENT_STATUS.md, the harness documents and any R10 or R12 file; any linux-probe-kit/ file; publishing a name-token digest; installed launcher, trust or root-policy bytes, verifier code or keys, acceptance argv changes, timeout changes, ci/ changes, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.", "Any network access during validation."]
