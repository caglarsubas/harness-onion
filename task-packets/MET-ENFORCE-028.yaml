contracts: ["Accepted base is main 9f251d5d07772cbfb9987c422f3fca79748fad34, tree efd75210bdaf61aec26f9ec6882317680a5edf21, holding 238 immutable packets including MET-PERF-039. Add MET-ENFORCE-028 only, as packet 239. Preserve all 238 predecessor YAML files, every contract snapshot, review record and status record (the SELinux matrices v3 and v4, HS43, the resolved W01 design and the native profile v3 are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions, 2026-10-15, via the lane monitor, recorded in architecture/selinux-matrix-v3/status.json: Q-HE3D-2 (a) (the gate's observedWorkers source), Q-MX-2 (b) and Q-MX-3 (b) (the observer takes the native profile's P1 and P5 captures; the writer's /proc for the gate and the observer, the gate's for the broker and the observer), and the monitor's owner-delegated Q-MX-1 (a), Q-MX-4 (a) and Q-MX-5 (a). Add architecture/selinux-matrix-v3/ (matrix.json, vectors.json, README, review brief, source index, four verbatim independent review records, the round-1 to round-3 subject bytes and the status record ADOPTED_DATA_CONTRACT) and the evaluator scripts/selinux_matrix_v3.py: v4's, with the matrix version changed and one extension, a READ grant on a cgroup type narrowed to dir search. The matrix adds planeon_gate_i04_key_t (A09) and planeon_gate_i04_cert_t (A67), read by the gate alone; takes every capability from the gate (A48, A68.*); gives the gate READ on the probe-worker cgroup, dir search on its two parents and /proc on the worker (A38.*, A38S.*, A39.*, A59.planeon_worker_t); and narrows the writer's and the gate's /proc peers (A59.planeon_policy_writer_t, A59.planeon_gate_t). It discharges HS43's O-MATRIX-GATE-NETBIND, O-MATRIX-WRITER-PROCACCESS and O-MATRIX-GATE-PROCACCESS in data.", "Add one 239-packet current catalog with an exact 239-to-238 inverse before the accepted 238-to-237 MET-PERF-039 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes and binds every file of the v5 directory, the evaluator and the v4 matrix and vectors by digest before parsing and on every read; it binds the four review rounds to their exact subject bytes, executes the evaluator from this era's bytes, requires every assertion to hold, checks that v5 is v4 plus exactly the restated changes, and replays every access and mutation vector, every v4 vector keeping its identifier and position apart from the listed v5 changes.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-PERF-039 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_selinux_matrix_v3.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 239-packet membership and count updates; layer tests and the MET-PERF-039 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-028 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
