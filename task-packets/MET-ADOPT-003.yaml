contracts: ["Accepted base is main 93d32e1cc5125b5878f51de31c61ada29e1fa6da, tree 252d41e292b4691e28f55567d2527cb225147609, holding 227 immutable packets including MET-ENFORCE-024. Add MET-ADOPT-003 only, as packet 228. Preserve all 227 predecessor YAML files, every contract snapshot, review record and status record (architecture/research-adoption.json, docs/alpha-2/HARNESS_PAPER_REPOSITORY_MAP.md and legal/third-party-license-policy.yaml are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.","Add architecture/research-adoption-v2/ (crosswalk.json, the README rendered from it, the status record, the four independent review records (rounds 2-4 verbatim; round 1 as the reviewer's public copy, which replaces an author citation by the arXiv id, with the verbatim record bound by sha256) and the round 2 and round 3 snapshots; round 1's subject carried personal data that review R1-1 removed, so it is withheld and bound by its file digests) and scripts/research_adoption_v2.py (a standard-library check of the closed record: predecessor digests, cross-references, page-cited grounding, the pinned licence policy's classification, reuse-mode rules, personal-data hygiene and the README as the record's rendering). The contract passed its fourth independent review round (PASS_FOR_SOURCE_PUBLICATION on 3cb4b04, notes only).","Add one 228-packet current catalog with an exact 228-to-227 inverse before the accepted 227-to-226 MET-ENFORCE-024 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes and binds every reviewed file, round copy, review record and the status record by digest before parsing; then it executes the record's model from this era's bytes and restates the owner's decisions, the corpus counts, the licence-blocked codebases, the HO-D2 gates and the items made ready.","The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-024 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_research_adoption_v2.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout increase and no cached security verdict. Keep the nested 420 s, local 750 s, trusted 900 s and workflow 15 min limits and the 32 MiB outer output ceiling.","Inherited validators, tests and documents change only by: mechanical 228-packet membership and count updates; the YAML corpus count in tests/test_ci_performance.py and the matching literal in tests/test_credential_lifecycle.py; layer tests and the MET-ENFORCE-024 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ADOPT-003 member; and the current-state text. No other inherited logic, matrix, skip or limit changes, and each change is reversible through this packet's inverse authority."]
