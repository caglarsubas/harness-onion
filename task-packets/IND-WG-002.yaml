contracts:
  - >-
    Consumes exact merged IND-WG-001 product commit
    714e311b550798c230d440c869d36f7ad5a857b4, white-goods 0.1.0 pack
    digest cb413874a002a481a7163e6198cac277894e72a7c918085d635b1fadcf523913,
    raw pack.yaml SHA-256
    e20d3b6723698a298b93a8dc45743b6644d7e443e1c4fd0450a2c344a9238bf1,
    and reproducible framework 0.1.1 wheel SHA-256
    d34a1a3c523b1e60f10602fff072d5dbf83f46f2220f29a4f13b9a31facf91f4.
  - >-
    Consumes DataReadinessAssessment v1alpha1 from public contracts commit
    2146278a95344cd2a8e22596b2f315b46edffc88 at the authoritative path
    schemas/v1alpha1/readiness/data-readiness-assessment.schema.json with
    SHA-256 ffe003a1a7ec0773f49d8f394ac3dd6281114bd4335ff05c87d223412faf92a5
    and guidance common.schema.json with SHA-256
    4d77297073d4c2e559f1131fbada566b499197f87113f7e28b136f0b4ae5f429.
    A data-only binding record documents that the predecessor lock's guidance
    path for DataReadinessAssessment is historical and non-authoritative while
    its content digest is correct; no schema bytes or upstream checkout enter
    this repository or packet execution.
  - >-
    Produces white-goods pack 0.2.0, retaining pack-format compatibility 0.1.0
    and framework distribution 0.1.1, with a deterministic data-readiness
    slice whose nested assessment objects conform to the exact public
    DataReadinessAssessment surface: apiVersion, kind, metadata, and spec;
    READY or BLOCKED overall status; exactly ten ordered gate results; sorted
    unique evidence ids and missing-gate ids; and stable reason codes.
deliverables:
  - >-
    Advance only the white-goods sector pack from 0.1.0 to 0.2.0. Retain the
    byte-identical common pack, contracts.lock.json, journey.yaml, ontology,
    business questions, business answer vectors, pack-format compatibility
    0.1.0, and framework distribution 0.1.1. Update predecessor business tests
    only for the new sector version, declared resource/file inventory, and
    deterministic archive name. Narrow the predecessor handler's questionnaire
    discovery to its owned questions/business/ path so additive data questions
    cannot enter frozen business answer vectors; all predecessor decisions and
    answer digests remain unchanged.
  - >-
    Data questionnaires collect source kind and ownership, required-field
    coverage, observation timing, duplicate measurement, classification and
    provenance coverage, evidence references, and confirmation that examples
    are synthetic. Closed options cover API, PostgreSQL, files, and events.
    Questions cannot request tenant records, credentials, secrets, connection
    strings, endpoints, or unsupported production facts.
  - >-
    The source inventory declares exactly four synthetic local source classes
    with accountable owners, custodians, data classifications, and stable
    evidence ids. Representative API JSON, PostgreSQL-shaped CSV, document
    inspection evidence, and event JSONL are independently authored, minimal,
    non-personal, non-production fixtures. dataset.lock.json binds every data
    member by relative path, media type, record count, byte size, and SHA-256.
  - >-
    A versioned illustrative readiness policy records tenant-replaceable PASS
    and WARN thresholds: completeness at least 0.98/0.95, freshness no more
    than 15/60 minutes, duplicate rate no more than 0.01/0.02, classification
    coverage 1.00/0.98, and provenance coverage 1.00/0.98. Zero observations
    always fail as MISSING_DATA. Thresholds are examples, never production
    claims, and every tenant must bind its own approved evidence and policy.
  - >-
    PASS, WARN, and FAIL fixtures use fixed evaluation times and measurement
    counts. Negative vectors cover missing, stale, duplicate, unclassified,
    and unprovenanced data. Evaluation uses decimal-safe arithmetic and sorted
    stable reason codes; FAIL dominates WARN, WARN never advances readiness,
    and a missing-data result suppresses misleading derived metric findings.
  - >-
    Each readiness fixture wraps one nested DataReadinessAssessment with
    exactly these gate ids in order: business.owner, business.outcome,
    data.owner, data.quality, data.completeness, data.freshness,
    data.provenance, data.classification, integration.readiness, and
    autonomy.boundary. PASS yields READY; WARN yields BLOCKED with NEEDS_INPUT;
    FAIL yields BLOCKED with BLOCKED. Only relevant non-pass gates appear in
    sorted missingGateIds. Integration and autonomy may be NOT_APPLICABLE.
  - >-
    The packet-owned Make descriptor registers only the unique data-readiness
    target with exact PACK=white-goods and direct argv to
    ci/handlers/ind_wg_002.py. The handler validates the contract binding,
    questionnaire/source/policy closure, dataset digests and counts, all
    decisions and assessments, two-build pack index/archive identity, no
    retained artifact, and false publication/deployment/runtime/assurance/
    tenant-acceptance flags. The closed descriptor-inventory regression is
    updated without changing Makefile or the dispatcher.
excluded:
  - >-
    Real tenant or warm-source data, copied schema or source bytes, credentials,
    secrets, connection strings, source endpoints, remote reads, runtime
    downloads, paid services, production thresholds, plant/customer/employee
    identities, unsupported freshness or regulatory claims, mutable digests,
    executable pack content, write-capable actions, waivers, signatures,
    publication, deployment, runtime evidence, assurance evidence, or tenant
    acceptance. Missing or WARN evidence cannot be marked ready.
prefetchCommands: [["make","prefetch"]]
