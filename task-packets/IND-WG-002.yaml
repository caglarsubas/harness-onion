expectedEvidence:
  - The exact predecessor commit, raw pack file, pack digest, framework wheel, public contracts commit, two schema paths, and two schema digests match the packet's immutable bindings without mounting or reading a warm-source checkout.
  - The four synthetic source classes, source owners/custodians, data member paths, record counts, byte sizes, media types, and SHA-256 values are closed and mutually consistent; a tampered byte, count, path, or classification fails.
  - PASS, WARN, missing, stale, duplicate, unclassified, and unprovenanced vectors produce exact sorted reason codes, ten ordered contract gates, correct gate states, correct missingGateIds, and READY only for PASS.
  - Two canonical indexes and fixed-epoch archives of white-goods 0.2.0 are byte-identical and temporary outputs are removed; the immutable common pack and framework 0.1.1 distribution remain byte-identical to predecessor evidence.
  - Dispatcher inventory includes IND-WG-001 pack and IND-WG-002 data-readiness with no duplicate target, undeclared variable, shell transport, ambiguous handler, or predecessor regression.
  - Source, candidate, CI, merge, artifact, publication, deployment, runtime, assurance, and tenant acceptance remain separate evidence states; all post-merge operational and tenant states remain false or NOT_RUN_ENV_UNAVAILABLE.
rollback: Revert the unreleased white-goods 0.2.0 data-readiness slice and restore the exact IND-WG-001 0.1.0 pack; retain common.foundation 1.0.0, framework 0.1.1, predecessor evidence, and every downstream release, runtime, assurance, or tenant record unchanged.
