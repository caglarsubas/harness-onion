expectedEvidence:
  - "The diff against 25b11c5d4d5d64b158c005a5887e4806c848a558 is exactly M ci/run_packet_argv.py and M research/MANIFEST.json; the runner equals contracts[1] by sha256, size and mode; the other three transport files are unchanged."
  - "research/MANIFEST.json at the head has sha256 d7c3facfb966b33c836d91e48be09f29746298e3f6a36024b5c099d81e6f142d (38,087 bytes), differs from main's manifest in exactly the ci/run_packet_argv.py entry of 325, and research/tools/manifest_check.py prints \"MANIFEST OK: 325 files\"."
  - "prefetchCommands, offlineAcceptanceCommands and offlineExecution equal LAB-SYNC-001's byte for byte and in order."
  - "The installed verifier (bundle v9) accepts the head, and every acceptance command of LAB-SYNC-001 still passes under the new runner."
  - "No product behaviour, dependency, dispatch rule, ledger or public contract changes."
rollback: Revert this commit to restore the bundle v7 and v8 runner and main's manifest; under bundle v9 the repository is then gated again until a successor merges. No data, schema or dependency state is involved.
