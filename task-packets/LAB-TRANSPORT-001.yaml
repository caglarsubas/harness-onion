id: LAB-TRANSPORT-001
repository: mas-harness-research-lab
branch: codex/lab-transport-001-runner-v9
objective: Re-copy harness-onion's offline runner ci/run_packet_argv.py at verifier bundle v9's pin byte for byte (283's raw-byte digest and refusals, plus slot 288's posix_spawn child start and its inheritable-descriptor refusal), and regenerate research/MANIFEST.json so its runner entry follows, without changing any other transport file, test, descriptor, make target, product source, dependency, dispatch rule or public contract.
predecessors: ["LAB-SYNC-001"]
allowedPaths: ["ci/run_packet_argv.py", "research/MANIFEST.json"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - "Built on R13 main 25b11c5d4d5d64b158c005a5887e4806c848a558 (LAB-SYNC-001 merged); every reference below is at that commit"
  - "Consumes harness-onion's offline runner ci/run_packet_argv.py as published at harness-onion main 7e17f292 (slot 288, MET-007) and unchanged at main cee2cc76482f (slot 290), the runner verifier bundle v9 pins: exact bytes and mode 100755, git blob 5cc6d71637c1cabf33bb783d15a925ef64940671, sha256 915413fe551afdde7f97a4e7fe2c6c32ee65b4ba6f7c6d13ed72dd7e4afe65c9, 9975 bytes. It replaces the runner LAB-SYNC-001 carries (git blob 0bb50b269a19b5ae87c75674c38e91033857d74a, sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f, 9084 bytes, the bundle v7 and v8 pin). The other three transport files stay byte-identical, as bundle v9 keeps their pins: ci/verify-offline.sh 100755 sha256 778cb0faf59786dc31559e5d96a399d1e3bb26a4576e0ee9ff70e1f6546bd114, 3908 bytes; ci/warm-source-isolation.sh 100644 sha256 f717f62fb1c9fdaec9eb594c733f25b17394bae6b90a311b9ccc08d4eaf9233b, 4674 bytes; ci/network_canary.py 100755 sha256 1be4a837c4a5baee900db20007c4841361b8c823a1b5e521badcf28890d82099, 1459 bytes"
  - "Transport successor in R13 after LAB-SYNC-001: R13 is a meta repository outside harness-onion's product bootstrap map, so no descriptor applies, and the acceptance argv stay LAB-SYNC-001's. R13's research/MANIFEST.json (planeon.research.manifest/v1, 325 files) lists every repository file by sha256, the runner included, so it is regenerated with `python3 -I -B research/tools/make_manifest.py --bridge-commit a2482753e83158cbd71d790a608358f0fdd836f9`: only the ci/run_packet_argv.py entry moves (sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f to 915413fe551afdde7f97a4e7fe2c6c32ee65b4ba6f7c6d13ed72dd7e4afe65c9); the manifest becomes sha256 d7c3facfb966b33c836d91e48be09f29746298e3f6a36024b5c099d81e6f142d, 38,087 bytes; research/** is unchanged"
  - "The runner's verifier-facing interface is unchanged: read_packet_text(path) still returns (text, digest), verify_packet_digest(path, expected_digest) keeps its signature, and the raw-byte digest with its CRLF, bare carriage return, byte order mark and invalid UTF-8 refusals stays as at slot 283. Slot 288 changes only how each argv child starts: the executable is resolved on the scrubbed PATH and started through CPython's posix_spawn path (close_fds=False), and the run is refused if any descriptor above 2 is inheritable"
  - "Published by harness-onion slot 291 (MET-009) and keyed in verifier bundle v9's bootstrap table; until it merges, R13 is gated from v9's install. Verifiable only once bundle v9 is installed on the owner-operated verifier; the bundle is an install step, not a packet dependency"
deliverables:
  - "Replace ci/run_packet_argv.py with an exact copy of harness-onion's runner: git mode 100755, sha256 915413fe551afdde7f97a4e7fe2c6c32ee65b4ba6f7c6d13ed72dd7e4afe65c9, 9975 bytes (contracts[1]). No other file changes: no test, descriptor, make target or other transport file is added or edited."
  - "Regenerate research/MANIFEST.json with `python3 -I -B research/tools/make_manifest.py --bridge-commit a2482753e83158cbd71d790a608358f0fdd836f9` (contracts[2]): sorted keys, indent 2, trailing newline; 325 entries in the same order, exactly one changed (ci/run_packet_argv.py to sha256 915413fe551afdde7f97a4e7fe2c6c32ee65b4ba6f7c6d13ed72dd7e4afe65c9); keys bridgeCommit, files and schemaVersion unchanged; sha256 d7c3facfb966b33c836d91e48be09f29746298e3f6a36024b5c099d81e6f142d, 38,087 bytes."
excluded:
  - "Every path except ci/run_packet_argv.py and research/MANIFEST.json: the Makefile, ci/run_make_target.py, ci/handlers/**, every ci/targets descriptor, the other transport files, every test, product source, dependency and lock file, workflows, docs, deployment, network, warm sources, and verifier or host configuration; every research/** file other than the manifest stays byte for byte."
prefetchCommands: []
