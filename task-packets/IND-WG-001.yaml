contracts:
  - Consumes exact public IND-001 main commit a626437a18cd27d75cb96e0d846f56a235313c98, common.foundation 1.0.0 pack digest 3cfea19e6e0a4a653d63622e250f40001b4f8221ebab18fa5bfc1601b8eddea3, raw common/pack.yaml SHA-256 534246425cdf38fd4f311da1e4a587eadbffdb589d747435a081ed969ae978e9, and reproducible framework 0.1.0 wheel SHA-256 89b790008f594d32398d7e592706f1fe412a94e42cf2fbadb194ccf555126b17 without copying or mounting an upstream checkout during acceptance.
  - Produces white-goods business/domain pack slice harness.planeon.ai/industry-pack/v1alpha1 and framework distribution 0.1.1, retaining format compatibility 0.1.0 while admitting only the five exact W3C RDF/RDFS/XSD/OWL/SHACL namespace IRIs as non-dereferenced semantic identifiers in RDF-family files.
  - Adds development-only rdflib==7.6.0 and pyshacl==0.40.1 plus their exact locked transitive open-source closure; they are preloaded into a root-owned offline toolchain and are never downloaded by packet execution.
deliverables:
  - >-
    packs/white-goods is a closed SECTOR pack version 0.1.0 extending exactly
    common.foundation 1.0.0 at its computed digest. It carries byte-identical
    contracts.lock.json and journey.yaml bindings, overlayMode APPEND_ONLY,
    Apache-2.0 licensing, and only declared regular data members. No common
    resource id is shadowed and no sector pack is used as a parent.
  - >-
    Business questionnaires define uniquely identified, typed, required or
    optional questions for objectives, accountable roles, product families,
    processes, CTQs, KPIs, acceptance outcomes, evidence references, and
    deferred plant-specific choices. Closed response types are string,
    boolean, number, and choice; choice values are explicit and no question
    requests a secret, credential, personal record, remote endpoint, model
    prompt, write-capable action, or unsupported regulatory conclusion.
  - >-
    The white-goods ontology uses only local files, the five admitted W3C
    namespace identifiers, and urn:planeon:white-goods:* domain IRIs. It
    defines BusinessObjective, AccountableRole, ProductFamily, ProductModel,
    ManufacturingProcess, ProcessStep, QualityCharacteristic,
    CriticalToQuality, KeyPerformanceIndicator, AcceptanceOutcome, and their
    closed relationships. Product families are refrigeration, laundry,
    dish-care, and cooking. Every objective, CTQ, KPI, and acceptance outcome
    has exactly one accountable role or owner relation as specified by SHACL.
  - >-
    SHACL shapes require stable ids, labels, ownership, formula text,
    numerator/denominator or observation definitions, target direction,
    dimensions, evidence class, and acceptance semantics without embedding
    plant thresholds. Validation uses pySHACL with advanced=false, js=false,
    inference=none, do_owl_imports=false, and only explicit local graphs.
    Imports, external IRIs beyond the semantic allowlist, SPARQL constraints,
    JavaScript, remote graphs, and implicit network resolution fail closed.
  - >-
    Representative synthetic answer sets include one accepted pilot, missing
    accountable-owner, incomplete outcome evidence, and unverified
    plant-specific-choice cases. Canonical sorted UTF-8 JSON digests bind each
    vector and deterministic evaluation yields READY only for the complete
    pilot; incomplete or unverifiable cases are BLOCKED with sorted stable
    reason codes. Fixtures cannot assert that publication, deployment,
    runtime, assurance, or tenant acceptance occurred.
  - >-
    The packet-owned Make descriptor registers only pack with exact
    PACK=white-goods and direct argv to ci/handlers/ind_wg_001.py. The handler
    proves pack validity, two-build index/archive identity, SHACL conformance
    and negative detection, deterministic answer evaluation, exact dependency
    versions, no RDF imports or network use, and false evidence flags. It
    creates only temporary outputs and retains or publishes no artifact.
  - >-
    planeon-harness-industry-packs 0.1.1 keeps the framework runtime dependency
    surface unchanged. RDFLib and pySHACL are development-only. The semantic
    IRI exception is closed to RDF-family paths and exact W3C namespace
    prefixes; arbitrary HTTP, FTP, endpoint, template, credential, executable,
    and model/tool fields remain rejected. Framework regression tests cover
    both the five admitted identifiers and a non-allowlisted remote IRI.
excluded:
  - Plant names, production values, thresholds presented as real, customer or employee data, plant-specific facts, certification or regulatory claims, write-capable actions, credentials, secrets, source-schema bytes, warm-source observation, copied source material, network resolution, hosted services, paid APIs, JavaScript/SPARQL SHACL, ontology imports, signing, publication, deployment, runtime evidence, assurance evidence, or tenant acceptance.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["make","pack","PACK=white-goods"],["uv","run","--offline","--frozen","--no-sync","pytest","tests/white_goods/test_business_domain.py"],["make","build-reproducible"],["make","zero-bill"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - The exact sector pack validates against the merged IND-001 framework; two canonical indexes and fixed-epoch archives are byte-identical and retain all publication/runtime/assurance/tenant flags false.
  - pySHACL proves the local positive graph conforms and the negative graph fails with the expected closed constraint components while imports, JavaScript, advanced mode, inference, SPARQL, and network resolution stay disabled.
  - Questionnaire ids, answer keys, ontology terms, roles, objectives, CTQs, KPIs, formulas, dimensions, evidence classes, and acceptance outcomes are mutually closed and deterministic; negative answer vectors yield sorted stable blockers.
  - Dependency metadata, uv.lock, wheel METADATA, zero-bill rules, license-compatible package inventory, and the root-owned offline toolchain agree on framework 0.1.1, rdflib 7.6.0, and pyshacl 0.40.1.
  - Historical sourceReuse remains provenance only. Acceptance receives no warm-source path and the authored pack states that every fixture is synthetic and every plant-specific choice remains deferred until tenant evidence exists.
  - Source, candidate, CI, merge, artifact, publication, deployment, runtime, assurance, and tenant acceptance remain separate evidence states.
rollback: Revert the unreleased white-goods business/domain slice and framework 0.1.1 semantic-IRI patch together; retain common.foundation 1.0.0, IND-001 framework 0.1.0 evidence, and every downstream tenant or release record unchanged.
