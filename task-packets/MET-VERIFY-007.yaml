contracts: ["Accepted base is main 4b2be353facf23d47e60cb69d16585eedf3576d6, tree a961a01d34cba84eae5c513ad6ed57b599f48015, holding 289 immutable packets including MET-PERF-047. Add MET-VERIFY-007 as the 283rd chain packet, a K = 3 step publishing three product packets (C = S + P: 293 packets at slot 283). Preserve all 289 predecessor YAML files, every contract snapshot, review record and status record, the catalogs, the chain-compaction, chain-checkpoint, chain-product-packet and chain-inheritance records and the identity models unchanged.", "The runner ci/run_packet_argv.py (sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f) has one reader, read_packet_bytes(path) -> (raw, text, digest), with read_packet_text kept as a thin wrapper: it opens with O_RDONLY, O_CLOEXEC and O_NOFOLLOW, refuses a file that cannot be opened, a non-regular file, a leading UTF-8 byte order mark, bytes that are not strict UTF-8, CRLF line endings and a bare carriage return, each with its own text, as \"packet transport refused: <text>\" and exit 2; the digest is the sha256 of exactly the bytes read. ci/test_offline_runner.py holds a failing vector for every refusal.", "tests/test_chain_checkpoint.py's outermost-session child runs with -B, and a vector asserts that no __pycache__ entry remains after it (PKT283-PYCACHE).", "The product packets are the lanes' frozen bytes, agreed by digest (MON-283-E4, MON-283-R03-R2, MON-283-C2-GO): task-packets/DIST-TRANSPORT-002.yaml (sha256 255bdcc8d82e01489b5a10c33ce17181431a685283867db72c2738c70a82ac1b; mas-harness-distribution, predecessors [DIST-005A], main fe49981e, 2 allowedPaths: the runner and its own descriptor), task-packets/CTRL-TRANSPORT-002.yaml (sha256 c6a37fb87ade0c0b8f24264942aade88f7fec1d135b876e8a4c3e5ee6bbb9ca3; mas-harness-control-plane, predecessors [CTRL-FIX-004], main 7ef22569, 3 allowedPaths: the runner, one regression test and its own descriptor) and task-packets/IND-TRANSPORT-001.yaml (sha256 b2077e6d6f93264829f2ddf047e0f45bfdcfc51a3529cd421019674b24dcca25; mas-harness-industry-packs, predecessors [IND-BANK-002A], main f0bc4aa0, 3 allowedPaths: the runner, its own descriptor and the dispatch inventory test); each re-copies ci/run_packet_argv.py at sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f. This packet lists them in allowedPaths and its authority records them in productPackets, never in newFiles, and pins their comparators DIST-005A, CTRL-FIX-004 and IND-BANK-002A in productComparators. The raw validate_packet_ownership count stays 139 with the three added: each transport predecessor is an ancestor of its product and each product owns its exact make-target descriptor, so there is no ownership closer (erratum 4). R04's plan gains item 14 and the CTRL-TRANSPORT-002 transport re-copy authority section, R11's and R03's plans item 11, verbatim in their own words; scripts/validate_readiness.py's authority_owner maps the three products to MET-VERIFY-007; the task-packet index lists the four new packets.", "The registry gains exactly one rider, MET-VERIFY-007/packet (kind PACKET, the generic packet brief architecture/review-briefs/REVIEW_BRIEF_PACKET.md, sha256 6dcff68d7e6b01823f1740063e94910edcc159a71a6ee803f1b66c62fd06e274, version 1), appended last; the CONTRACT records (contract revs 1 to 3, errata 1 to 3 and their review rounds) stay lane-local.", "The authority is classed: its hunk classes live in its closed hunk-class record architecture/chain-checkpoint/hunk-classes/283.json, named in the authority's own newFiles by sha256 and built by chainmech v2.3's builder. The runner's raw-byte hunks, the hunks of c1's other two files, the product plan inserts, the index rows and the 304 hunks of the two K >= 1 member forms (a chain-member list gaining the starred product list; an id list gaining the meta id and the three product ids) are class other, which the 282 shadow reader does not undo (v2.3's class rule normalises at most one appended element), so each outermost session records class A input disagreements naming this authority: 11,671 over all 93 layers at a raised diagnostic cap, c1's 13 of erratum 3 (ci/run_packet_argv.py at layers 198, 218, 227, 232, 240, 249 and 275, ci/test_offline_runner.py at 197, 198, 216 and 218, and tests/test_chain_checkpoint.py at 216 and 218) among them (erratum 5), until the ledger rewrite, the reader's class cache and class rule v2.4 at slot 285. At the reader's 15 s cap the replay stops early, recording a newest-first prefix of that set and one class C over-budget disagreement; the reader only observes and records and never changes a session's outcome.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-PERF-047 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_verify_007.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict, and MET-PERF-041's caps unchanged.", "Add one 293-packet current catalog with an exact 283-to-282 inverse before the accepted 282-to-281 MET-PERF-047 layer. The new layer scripts/validate_met_verify_007.py binds PRODUCT_PACKETS (the three products, in install order), reads only its era's reviewed bytes and the products' authority-bound bytes, each bound by digest, and checks V1 (the era: the runner, its tests, the chain-checkpoint module test, the registry, the packet brief and the reader at their digests), V2 (each product's bytes, repository, predecessors, file set, main pin, runner digest and comparator), V4 (the registry differs from the base by exactly the one rider) and V6 (its hunk-class record, re-checked in full), each with a failing test, and its canonical hunks.", "Inherited validators, tests and documents change only by: the step vocabulary with S 283 and C 293 at K = 3 (slot 189's set gains MET-VERIFY-007; the deepened closed sets gain the deeper NEW_PACKET after 282's; every catalog-equality id list names MET-VERIFY-007 after the template's block); the MET-PERF-047 layer's checks adjusted solely for the successor bridge in the precedent's form; the bridge's test changes in 282's test tests/test_met_perf_047.py; the one-deeper edit in tests/test_authority_map.py and the count line in tests/test_met_perf_046.py (289 to 293); the six line-class rows (289 to 293) and authority_owner's three product lines by hand; the rider; and the index docs. The new head's test tests/test_met_verify_007.py keeps the full fan-in and the generic retain-names scaffold."]
deliverables: ["The raw-byte packet runner ci/run_packet_argv.py with its tests in ci/test_offline_runner.py, the chain-checkpoint module test's bytecode-free child, the registry rider MET-VERIFY-007/packet, the three product packets DIST-TRANSPORT-002, CTRL-TRANSPORT-002 and IND-TRANSPORT-001 with R04's, R11's and R03's plan inserts, and the task-packet index rows.", "A fresh 283-to-282 inverse authority with canonical byte-minimal hunks for every changed file, productPackets and productComparators, and its closed hunk-class record, the layer validator, the chain bumps, the bridged MET-PERF-047 layer and its compacted test, and the index docs."]
