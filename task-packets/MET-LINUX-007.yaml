contracts: ["Accepted base is main f560209d04b7e0f07b2480219718a8a6dbdb21ef, tree bc8509228d89bfd2aa1a4f9279d07b5874352282, holding 250 immutable packets including MET-ENFORCE-037. Add MET-LINUX-007 only, as packet 251. Preserve all 250 predecessor YAML files, every contract snapshot, review record and status record (the artifact edge records and the repository registry are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner VR-D1 (2026-10-17), the owner's 2026-10-15 decision on Linux capacity and Q-RP-0..9 (a) (2026-10-19), and the lane monitor's two messages (MON-18-CLASSES-KEEP-R1 on the eighteen resource classes and review round 1; MON-R3-KEEP-IF-OWN-NOTES, under which an earlier round-3 attempt was voided and not published), quoted verbatim in the status record. Clean room: designed from the roadmap text and those decisions only. Add architecture/lab-run-plan/ (README with the runbook, review brief, closed schemas for the run plan, the lease and the teardown-residual report, vectors with three positives, 99 negatives (68 plan, 11 lease, 20 teardown) and 9 parse negatives, the review records and the status ADOPTED_DATA_CONTRACT) and scripts/lab_run_plan.py, the standard-library offline checker; 5 independent contract review rounds; round 5 passed on 305918af. Every identifier in the vectors is invented; no credential, organisation project id or account identity is published.", "Add one 251-packet current catalog with an exact 251-to-250 inverse before the accepted 250-to-249 MET-ENFORCE-037 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, reviewed_mode and reviewed_tree, refuses a path outside its era before reading it and an absolute local path in a new contract file. It binds every contract file and review record by digest; restates the adoption, the decisions and the review binding; checks independently of the checker that the schemas are closed in the subset and restate the gates, viewer roles, residual and resource classes, that each positive plan's canonical sha256 binds its lease and report, that its cost recomputes and that it carries only invented identifiers; checks that the checker imports only the standard library and writes nothing; and executes the checker from this era's bytes to replay every vector and parse negative as recorded.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-037 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_lab_run_plan.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 251-packet membership and count updates; layer tests and the MET-ENFORCE-037 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-LINUX-007 member; tests/test_sector_catalog.py's NAMING_RECORDS gaining this packet's review records 3 to 5, whose reviewers quote the three catalog paths in their checked lines; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
