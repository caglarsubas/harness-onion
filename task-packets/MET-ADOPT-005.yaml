contracts: ["Accepted base is main ee26624dd91dbccb7516914ca0df83874d2c6a9f, tree ef42637df8e1d3b559bdf280fbd9959cbd69ae08, holding 267 immutable packets including MET-GOV-004. Add MET-ADOPT-005 only, as packet 268. Preserve all 267 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The owner's TECH-D1 (\"PostgreSQL-native (Recommended)\") and Q-TO-6 (\"ADR 0011 is the decision (Recommended)\"), and the lane monitor's owner-delegated rulings MON-SLOT268 (this packet at slot 268), MON-TECHORCH-1 (Q-TO-1 (a): amend the H10 block and add ADR 0011, which names the superseded older planning texts by path and line and edits none of them; Q-TO-2: the new block; Q-TO-3 (a): one clause on R08 line 103 only, with lines 101-102 byte for byte as at the base; Q-TO-4 (a): no catalog change; Q-TO-5 (a): no checker, no D5a oracle and no CONTRACT series; Q-TO-7 (a): the packet id MET-ADOPT-005; the merge is the owner's per-PR approval), MON-TECHORCH-2 (design revision 2 with its binding rules BR-TO-1 and BR-TO-2; Q-TO-D3 (a): no ADR link on R08 line 103) and MON-TECHORCH-M1 (Q-TO-M1 (a): the sector catalog's named join set is exactly LITERAL_READERS gaining scripts/validate_met_adopt_005.py; V4 stays exact; the head's test names no catalog).", "Replace lines 16-20 of docs/harnesses/execution.orchestration.md by the new planning-target block B1-B5 of design revision 2 section 3, every other byte unchanged; replace line 103 of docs/repositories/08-mas-harness-execution-plane.md by the clause of section 4, lines 101-102 (which ADR 0010's spans cite) and every other line unchanged; add docs/adr/0011-h10-execution-authority.md with section 5's text; and insert section 6's line in docs/DEVELOPMENT_STATUS.md directly after the ADR 0010 line. ADR 0008, docs/alpha-2/PROVIDER_ADOPTION_ROADMAP.md, docs/alpha-2/HARNESS_PAPER_REPOSITORY_MAP.md, docs/alpha-2/UNIFIED_ROADMAP_TRACEABILITY.md and the provider catalog are unchanged; the master plan changes only by the index edits.", "Register this packet's review series in architecture/review-record/briefs.json: one PACKET entry, MET-ADOPT-005/packet, pinning the generic packet brief by sha256 (6dcff68d7e6b01823f1740063e94910edcc159a71a6ee803f1b66c62fd06e274). Gate material: exactly two paths by the evolution surface record at this base, docs/harnesses/execution.orchestration.md (class GATE_HARNESS_DOCS, approver OWNER) and architecture/review-record/briefs.json (the MET-ADOPT-005/packet rider, class GATE_REVIEW_PROCESS, approver OWNER), so the merge is the owner's per-PR approval bound to the head. The evolution surface record itself does not change.", "Add one 268-packet current catalog with an exact 268-to-267 inverse before the accepted 267-to-266 MET-GOV-004 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, refuses a path outside its era before reading it and binds every era file by digest (the H10 document, the R08 plan, ADR 0011, the status file, the registry, the provider catalog, ADR 0008, the three superseded alpha-2 texts and the master plan). Its checks, design revision 2 section 2, each with its constants computed at the base or taken from the design: V1, lines 16-20 of the H10 document are exactly B1-B5, its other lines are the base's, and the layer's inverse restores the withdrawn base block; V2, line 103 of the R08 plan is exactly the new clause, and lines 101-102 and its other lines are the base's; V3, ADR 0011's bytes equal the pinned sha256, its superseded-texts table equals the closed constant SUPERSEDED (10 rows: path, lines, fragment), each fragment occurs exactly once in its file, and ADR 0008 and the three alpha-2 texts are the base's, while the master plan is checked by its fragments only; V4, the provider catalog is the base's; V5, the status file is the base's lines with the ADR 0011 line inserted directly after the ADR 0010 line and nothing else; V6, the registry differs from the base by exactly the MET-ADOPT-005/packet rider. It pins no chain validator or chain test. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 267's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 79 predecessor routes, every catalog walk and round trip, the full payload loop); 267's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-GOV-004 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_met_adopt_005.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 268-packet membership and count updates; layer tests and the MET-GOV-004 layer's checks adjusted solely for the successor bridge; C2's two test changes in 267's test tests/test_met_gov_004.py; the one-deeper successor hand edit of 266's test tests/test_met_linux_008.py (as 267 made for 265's); the count line of 265's test tests/test_policy_observation_digests_v2.py, which the cascade skips after 267's hand edit; the one named sector-catalog join in tests/test_sector_catalog.py (MON-TECHORCH-M1: LITERAL_READERS gains scripts/validate_met_adopt_005.py, whose V4 names the provider catalog; no other sector-catalog set changes); catalog-membership filters ignoring only the added MET-ADOPT-005 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
