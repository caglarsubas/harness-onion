deliverables: ["R2: execute the exact separate meta, parity, alpha1 and runner-boundary suite argv; assert nonzero collection and inventory closure for each owned test root, retain every old case and prove newly introduced test files cannot be silently omitted.","R3: require the named pre-established darwin-sandbox or linux-firejail backend to match the actual OS in both ci/verify-offline.sh and ci/run_packet.py; unknown, absent or mismatched markers fail before commands. Repository code never establishes or relaxes OS isolation.","R3: add ci/run_packet_argv.py only as the fixed direct-argv bridge to existing run_packet.py, satisfying the unchanged MET-LINUX-002 transport pin names. Preserve hash-pinned packet custody, command ordering, one process tree, no shell strings and per-command digest checks; retain the closed child-environment allowlist requirement and no unknown credential/path inheritance.","R3: fix ci/network_canary.py for Linux socket-creation denial as well as macOS connect denial. Only backend-appropriate EPERM/EACCES qualifies; route failures, timeout, DNS errors, unsupported families, successful socket/connect or missing boundary never pass. Never send a probe outside already established isolation.","R3: tests/parity/test_packet_runner.py may change only the existing main-preserves-phase-order mock setup to model OS/backend explicitly; keep its commands, assertions, every other test and vectors unchanged. New negative cases live only in tests/fixes/runner_boundary/.","R4: remove all subprocess/exec execution from ci/verify-live-campaign.py and fail closed with DIRECT_LIVE_ADAPTER_FORBIDDEN. A caller-created pipe/file/memfd, magic payload, marker or CI-variable removal is never trusted session authority. No substitute signature/descriptor protocol, signer, allowlist or live backend may be introduced.","Prove R4 rejects fabricated descriptor inputs and arbitrary argv without invoking a child, opening credentials or contacting a target. Preserve the existing direct/CI refusal tests and never execute a live campaign during these unit checks.","Publish source/CI/merge/exact-main, Linux unavailable and live-backend unavailable states separately; preserve logs and explain that any future usable bridge requires separately reviewed external installation and its own scoped authority."]
excluded: ["Campaign/evidence/model public schemas and product services, Makefile, ci/run_make_target.py, existing descriptors, PORTING.yaml, toolchain.lock, workflows, dependency or crypto changes, root installation, new keys/session protocols, live campaign execution, raw sockets/brokers, capacity provisioning, warm sources and Linux qualification."]
