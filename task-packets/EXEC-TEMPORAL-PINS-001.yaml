id: EXEC-TEMPORAL-PINS-001
repository: mas-harness-execution-plane
branch: codex/exec-temporal-pins-001-provider-dossier
objective: "G1 and G2 for H10's optional Temporal provider (ADR 0011 decision 2): an upstream dossier (provider record, CycloneDX SBOM of the pinned Linux AMD64 closure, licence and notice review) for the upstream server release binary (owner OQ-3) and the Python SDK closure for CPython 3.12 on manylinux x86_64 (abi3 wheels built for cp311 and cp310, and pure-Python wheels), with a stdlib consistency test. No runtime code, no dependency in pyproject.toml, no provider module and nothing selectable; the PostgreSQL executor stays H10's baseline and single side-effect authority."
predecessors: ["PLANE-BOOTSTRAP-R08"]
allowedPaths: ["adoption/temporal/PROVIDER.json", "adoption/temporal/SBOM.cdx.json", "adoption/temporal/NOTICE.md", "tests/adoption/test_temporal_dossier.py"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - "Tree: the PR's base is R08 main at 145d85cb730c3581dafd44918fa39f157097c2b2 (PLANE-BOOTSTRAP-R08 merged, R08 PR 1). The head adds exactly 4 files, each with status A, and changes nothing else: `adoption/temporal/PROVIDER.json`, `adoption/temporal/SBOM.cdx.json`, `adoption/temporal/NOTICE.md` and `tests/adoption/test_temporal_dossier.py`."
  - "adoption/temporal/PROVIDER.json names the candidate module id planeon.orchestrator.temporal (the registry's planeon.<category>.<implementation> form; no providers.yaml entry, which comes with EXEC-TEMPORAL-001), role OPTIONAL, selectable false and evidenceState PACKET_PUBLISHED; the server 1.32.2 as the upstream Linux AMD64 release binary (owner OQ-3; no upstream image), with no separate SQL schema-tool asset (release v1.32.2 has none matching the declared pattern), its checksums.txt as a closure entry; the Python SDK temporalio 1.36.0; the pin date pinnedAt 2026-11-20T16:01:51Z; and one entry per closure artifact with file name, version, sha256, size, licence, upstream upload time and mirror object name. The record names no PostgreSQL server artifact: in built-in mode the bundle provisions a separate PostgreSQL database for Temporal, and tenant attachment comes later, only on an operator-created schema (owner OQ-4, G4)."
  - "PROVIDER.json carries the quarantine object {\"minimumDays\": 7, \"source\": \"OWNER_DECISION\", \"decisionRef\": \"OQ-6 (owner 2026-11-20 18:39, '7 days + security exemption (Recommended)'), recorded as a decision in lock 74 or 75\", \"policyItem\": \"SUPPLY-QUARANTINE-001\", \"exemption\": {\"kind\": \"SECURITY_UPDATE\", \"used\": false}} where source is one of the closed values OWNER_DECISION and POLICY_IN_FORCE (POLICY_IN_FORCE once SUPPLY-QUARANTINE-001 publishes its value), and exemption.used true requires exemption.reason naming the advisory; every closure artifact's upload or publication time plus minimumDays is at most pinnedAt unless exemption.used is true; wheels and release binaries only, no sdist, nothing installed with lifecycle scripts."
  - "Mirror (owner OQ-2, OQ-7): every artifact is an object named by its sha256 in the owner's write-once GCS bucket (project harness-onion, us-central1, set up by R10); the repository holds digests, licences and the SBOM, never artifact bytes. PROVIDER.json cites the run's manifests by name: manifests/EXEC-TEMPORAL-PINS-001/20261120T160151Z-e79679c2.json (the 7 closure objects) and manifests/EXEC-TEMPORAL-PINS-001/20261120T202619Z-2d3dc342.json (the server LICENSE), each read back ok by R10's mirror-read job before this packet."
  - "Server licence (owner one named read, 2026-11-21): the server archive holds no licence-named member, so NOTICE.md and the server entry record the licence from the LICENSE file of temporalio/temporal at tag v1.32.2 (sha256 6aab9afd99ceb1dcaf6a0d91386b46baef9bce17ae4006044e0f231e31430b69, 1152 B, mirrored), with the note \"not in the archive\" and the identifier's basis; the SDK closure's licences come from each wheel's METADATA and licence files."
  - "Compatibility (owner 2026-11-21, 'Integration test (Recommended)'): PROVIDER.json records the SDK's server compatibility as \"not stated by the artifacts; proven by EXEC-TEMPORAL-001's integration test\" (temporalio 1.36.0 against the pinned server 1.32.2 on GCP), which must pass before selectable can turn true."
  - "adoption/temporal/SBOM.cdx.json is CycloneDX JSON with one component per closure artifact, Linux AMD64 only (ARM64 is a later amendment); its hashes equal PROVIDER.json's. adoption/temporal/NOTICE.md records each component's licence from the artifact's own metadata and licence files, not from the adoption view."
  - "Fetches: only the owner-approved two-part item of FETCH-LIST.md (metadata reads, then artifact fetches by digest on GCP into the mirror), before the build and outside the offline run; no network in the run."
deliverables:
  - "Add exactly the 4 files of the Tree contract, each LF-only strict UTF-8 without a byte order mark, mode 100644; PROVIDER.json and SBOM.cdx.json are written with every object's keys in sorted (code point) order, a one-space indent and one final LF."
  - "tests/adoption/test_temporal_dossier.py (stdlib unittest; reads files by its own file path; writes nothing; opens no socket): PROVIDER.json and SBOM.cdx.json parse; every closure entry has file name, version, sha256 (64 hex), size, licence, upload time and mirror object name equal to its sha256; record and SBOM agree component by component; the quarantine object has exactly the keys minimumDays, source, decisionRef, policyItem and exemption, source is one of OWNER_DECISION and POLICY_IN_FORCE, minimumDays is a positive integer, policyItem is SUPPLY-QUARANTINE-001, exemption.kind is SECURITY_UPDATE and exemption.used true carries a non-empty reason; minimumDays is read from the record, and every upload or publication time plus minimumDays is at most pinnedAt unless exemption.used is true; no entry is an sdist; selectable is false and no evidence state is READY; the module id is planeon.orchestrator.temporal; none of the draft placeholders (<server version>, <sdk version>, <pin date>) is left in any of the three dossier files."
excluded:
  - "pyproject.toml, uv.lock, the Makefile, PORTING.yaml, ci/**, src/**, services/**, deploy/**, migrations/**, providers/** (providers/temporal/ is EXEC-TEMPORAL-001's), tests/orchestration/** (EXEC-ORCH-001's), architecture/providers.yaml in harness-onion, any artifact bytes, images, databases, listeners and any network access in the run."
prefetchCommands: []
offlineAcceptanceCommands: [["python3", "-I", "-B", "-m", "unittest", "discover", "-s", "tests/health"], ["python3", "-I", "-B", "-m", "unittest", "discover", "-s", "tests/adoption", "-p", "test_temporal_dossier.py"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - "The head's name-status against 145d85cb730c3581dafd44918fa39f157097c2b2 is exactly the Tree contract's 4 A entries."
  - "The dossier unittest passes under the hash-pinned offline runner with all outbound network denied."
  - "Every sha256 in PROVIDER.json equals the part-2 report's computed digest and the mirror object's name."
  - "Source, offline unit, PR check and merge are the only evidence this packet can prove (G1, G2 records); adapter, Linux profile, artifact, deployment, runtime, assurance and tenant acceptance stay not run (G8)."
rollback: Revert the dossier commit; nothing is installed, registered or selectable, so no data, task or provider state changes; the mirror's write-once objects stay.
