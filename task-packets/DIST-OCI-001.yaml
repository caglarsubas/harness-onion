contracts:
  - Consumes locked profile, BOM, module releases, and OCI media types v1alpha1.
  - Produces canonical bundle.lock.json and staged OCI layout v1.
  - >-
    Implementation starts from exact merged DIST-001 commit
    03eac03a93560e54299c0f2e3eceef7339ecacc3, whose pull-request and exact-main
    runs are 33630243399 and 33630388800. All DIST-001 OCI validation, closed
    dispatcher, inert PORTING ledger, source locks, dependency-free Python
    toolchain, and zero-bill restrictions remain active and unmodified.
  - >-
    The contract predecessor remains exact merged mas-harness-contracts CON-005
    commit 63a1af44ce0abe31075c37c3529848ebe8fe2fcb. The locked profile and BOM
    schema SHA-256 values are
    08936914f52b8c3b611e47ffa35f668dd177718f613907687a67b448877c39a6 and
    03b2f6b27851f45133aa68b0cd8536e677eeb84ef07303582d6cdcc93b27d744.
    No contract repository, warm-start checkout, registry, or network endpoint
    is mounted or opened during implementation or acceptance.
  - >-
    fixtures/profiles/minimal-arm64.json is canonical closed JSON. It binds a
    profile id and digest, exactly linux/arm64, a bounded ordered module list,
    explicit selected booleans, and digest/size/media-type descriptors whose
    content is already present in the immutable DIST-001 local OCI fixture.
    Every selected artifact is sha256-addressed; URL, tag, latest, credential,
    local absolute path, implicit platform, duplicate module/artifact, unknown
    field, unsupported media type, or missing source blob fails closed.
  - >-
    resolver.py validates the complete declaration before selecting anything,
    includes only artifacts from selected modules matching every requested
    platform, orders modules/artifacts lexically, and returns an immutable
    resolution. An unselected module cannot contribute a blob, chart, image,
    provider, platform, or lock entry. Empty selection, missing platform
    coverage, digest/size mismatch, or conflicting reuse of a digest fails with
    a stable reason code and creates no staging path.
  - >-
    helm.py treats chart content only as a pre-vendored digest-addressed local
    component. It rejects dependency URLs, repositories, aliases, mutable
    versions, undeclared subcharts, or bytes not present under the source OCI
    digest. DIST-OCI-001 does not run Helm, render Kubernetes resources, or
    claim chart semantic conformance; DIST-004 owns render evidence.
  - >-
    builder.py creates a private sibling temporary directory, copies only the
    selected image roots plus their recursively verified config/layer closure,
    emits canonical bundle.lock.json, verifies every staged digest and the
    resulting OCI layout, fsyncs files/directories, and publishes with one
    no-overwrite atomic rename. Failure removes only the private candidate and
    never alters a prior destination. Symlink, special-file, traversal,
    hard-link ambiguity, extra source blob, output-inside-source, existing
    destination, or cross-device/non-atomic publish is rejected.
  - >-
    bundle.lock.json is closed canonical JSON with schemaVersion, state
    BUILT_UNSIGNED, profile id/digest, exact sorted platforms, exact sorted
    selected modules, component descriptors, complete staged blob descriptors,
    source index digest, and OCI layout digest. It contains no timestamp,
    hostname, username, absolute path, credential, signature, release,
    deployment, runtime, assurance, or tenant-acceptance assertion. Bundle id
    is sha256 of these canonical lock bytes and repeated clean builds match.
  - >-
    schemas/bundle-lock.schema.json closes every field, enum, length, digest,
    media type, platform, uniqueness, and bound consumed by the implementation.
    Validation is standard-library and code-enforced in this packet; no new
    Python dependency or runtime download is introduced. The lock state is
    staging evidence only and cannot advance beyond BUILT_UNSIGNED.
  - >-
    ci/targets/dist-oci-001.json adds only resolve-fixtures, build-fixture, and
    minimal-selectivity-proof direct-argv handlers. make prefetch remains the
    DIST-001 validation-only handler and is always the first packet phase. All
    acceptance runs in the existing signed deny-all-outbound process tree and
    zero-bill remains cumulative.
deliverables:
  - Exact architecture/module resolution, digest-only local closure, pre-vendored chart validation, canonical lock, staging state, atomic local publish, and minimal-profile proof.
  - Deterministic build and negative fixtures covering selection, platform, digest, closure, path, and atomicity failures.
excluded:
  - Mutable tags, unrelated modules, signing, promotion, SBOM, vulnerability scanning, network fetch, registry mutation, Helm execution/rendering, installation, or tenant mega-images.
  - Warm-source access, external packages, cloud services, hosted runners, GitHub artifact/cache/package storage, API keys, remote telemetry, or runtime downloads.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["make","resolve-fixtures"],["make","build-fixture"],["make","minimal-selectivity-proof"],["make","zero-bill"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - Stable canonical bundle-lock and bundle-id digests match across two independent temporary build roots and the complete staged OCI blob closure verifies.
  - Minimal profile includes only the selected infrastructure module's image/chart closure for linux/arm64; an explicitly unselected AI-gateway module contributes nothing.
  - Negative vectors reject mutable/remote references, duplicate/unknown fields, missing platform coverage, digest/size/media mismatch, missing/extra blobs, symlinks, output/source overlap, existing destination, and injected pre-publish failure without partial output.
  - Signed hash-pinned acceptance runs prefetch then resolve-fixtures, build-fixture, minimal-selectivity-proof, and zero-bill with OS-denied outbound traffic; CI/merge/exact-main remain distinct from artifact/release/deployment/runtime/assurance/tenant acceptance.
rollback: Delete only the unsigned staged OCI layout; no released bundle exists.
