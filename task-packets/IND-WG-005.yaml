expectedEvidence:
  - The exact merged 0.4.0 predecessor commit, raw pack file, computed pack/index/archive digests, 64-file/61-resource inventory, and framework wheel match immutable packet bindings before any successor validation.
  - Exactly five named source-contract scenarios and one five-case tamper catalog are present; every referenced path is declared by the pack, every raw digest matches, scenario/profile identities are one-to-one, and governance posture selection is exact.
  - The lock has exactly seventy lexical records and excludes only pack.lock.json and manifest.json. Every record's path, media type, byte size, raw SHA-256, and Apache-2.0 disposition match current bytes, while the canonical payload digest reconstructs twice identically.
  - The unsigned manifest reconstructs twice identically and binds the exact committed lock bytes, payload digest, entry count, source lineage, license disposition, and missing-planned signing state. It contains no signature, signer, retained artifact, archive digest, release, publication, deployment, runtime, assurance, conformance, or tenant claim.
  - Content-byte, missing-member, undeclared-member, payload-digest, and manifest-lock-binding mutations each produce their exact stable denial reason and never rewrite the pack.
  - Two canonical indexes and fixed-epoch archives of white-goods 0.5.0 are byte-identical and temporary outputs are removed; common.foundation 1.0.0, framework 0.1.1, and every predecessor pack resource remain unchanged.
  - Dispatcher inventory includes pack, data-readiness, governance-integrations, provider-profiles, and certification-fixtures with no duplicate target, undeclared variable, shell transport, ambiguous handler, or predecessor regression.
  - Source, candidate, CI, merge, artifact, publication, deployment, runtime, assurance, cross-repository conformance, and tenant acceptance remain separate evidence states; all post-source and post-merge states remain false or NOT_RUN_ENV_UNAVAILABLE.
rollback: Revert the unreleased white-goods 0.5.0 certification slice and restore exact IND-WG-004 commit 3814e642c8c8eb9f9bf77f230930eeff209de565 and pack 0.4.0; retain common.foundation 1.0.0, framework 0.1.1, predecessor evidence, and every downstream release, runtime, assurance, conformance, or tenant record unchanged.
