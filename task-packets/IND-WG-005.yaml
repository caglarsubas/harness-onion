contracts:
  - >-
    Starts only from exact merged mas-harness-industry-packs commit
    3814e642c8c8eb9f9bf77f230930eeff209de565, white-goods 0.4.0 computed
    pack digest 38a056e7f3008aa9980fc12f1677f6f160dddb18aa156e63258921b911ab1773,
    raw pack.yaml SHA-256 29e8732b5e6730ecc42e54bed8f00487ece81cde4c50fc1521f711b65240defb,
    exact 64-file/61-resource inventory, reproducible archive SHA-256
    3f0a3b22e1152526324fd7f7940a8d45331b2d182da309f249ef94956476856c,
    canonical-index SHA-256
    022a9d685c52cb73dad7b51d53c4d02a0168680ad138af99503076af9bd6783b,
    and framework 0.1.1 wheel SHA-256
    d34a1a3c523b1e60f10602fff072d5dbf83f46f2220f29a4f13b9a31facf91f4.
  - >-
    Advances only the white-goods sector pack from 0.4.0 to 0.5.0 and adds
    exactly eight declared data resources for a resulting exact
    72-file/69-resource inventory: five source-contract scenario records, one
    tamper-vector catalog, one non-recursive payload lock, and one unsigned
    artifact manifest. Common content, contracts lock, journey, ontology,
    every predecessor pack resource, pack format 0.1.0, and framework
    distribution 0.1.1 remain byte-identical.
  - >-
    The payload lock covers exactly the seventy final pack members other than
    pack.lock.json and manifest.json. Its lexically sorted records bind path,
    media type, byte size, raw SHA-256, and Apache-2.0 disposition. The lock's
    payload digest is SHA-256 over canonical SORTED_UTF8_JSON_V1 bytes of its
    algorithm, excluded-path set, and exact entry list. It never embeds the
    final pack, index, archive, lock-file, or manifest-file digest, avoiding a
    recursive subject.
  - >-
    The manifest binds the exact raw pack.lock.json SHA-256, its payload digest
    and entry count, the clean-room packet lineage IND-001 through IND-WG-005,
    and the pack-level Apache-2.0 disposition. Its artifact state is
    NOT_RETAINED and its release-signing state is MISSING_PLANNED with no
    signature or signer id. It is a deterministic source document eligible to
    become an offline signing subject after merge; it is not a signed release,
    retained artifact, publication, deployment, runtime observation,
    assurance result, cross-repository conformance result, or tenant
    acceptance.
deliverables:
  - >-
    Add exactly five synthetic end-to-end source-contract scenarios named
    minimal-arm64, minimal-amd64, regulated-openshift, silo, and air-gap. Each
    binds by exact relative path and raw SHA-256 one accepted business answer
    fixture, the PASS data-readiness fixture, one governance decision fixture,
    its provider-demand fixture, and its golden-output envelope. The regulated
    OpenShift scenario uses ready-reversible-write; the other four use
    ready-read-only. Each expected outcome is SOURCE_CONTRACT_READY and carries
    an exact evidence boundary with source true and candidate, CI, merge,
    artifact, publication, deployment, runtime, assurance,
    crossRepositoryConformance, and tenantAcceptance false.
  - >-
    Add one closed tamper-vector catalog with exactly five in-memory mutations:
    CONTENT_BYTES_CHANGED, MEMBER_MISSING, UNDECLARED_MEMBER,
    LOCK_PAYLOAD_DIGEST_CHANGED, and MANIFEST_LOCK_BINDING_CHANGED. Each vector
    names one exact target and one stable denial reason. Tests and the packet
    handler must prove all five deny deterministically without modifying the
    repository pack.
  - >-
    Add scripts/build_pack_manifest.py as a deterministic, network-free library
    for constructing and validating the lock and manifest in memory. It reads
    regular pack files without links, uses the framework's media-type and
    canonical-JSON rules, compares generated bytes with the committed lock and
    manifest, and exposes fail-closed in-memory mutation validation. It does not
    write, sign, retain, publish, deploy, fetch, resolve, or execute pack data.
  - >-
    Register only the unique certification-fixtures Make target with exact
    PACK=white-goods and direct argv to ci/handlers/ind_wg_005.py. Update the
    descriptor-inventory regression without changing Makefile or the
    dispatcher. Update predecessor handlers/tests only for sector version,
    exact file/resource inventory, archive name, packet output version, and
    cumulative successor dispatch; preserve every predecessor content byte,
    decision, digest, and validation contract.
  - >-
    The packet handler validates the exact predecessor binding, scenario
    closure, raw referenced digests, source-only evidence boundaries, exact
    70-entry payload lock, exact manifest binding, five stable tamper denials,
    two-build canonical-index and fixed-epoch archive identity, and false
    retained-artifact/publication/runtime/assurance/tenant states. It emits the
    computed 0.5.0 pack, index, archive, payload-lock, and manifest digests only
    as ephemeral command evidence.
excluded:
  - >-
    Warm checkout access; copied reference bytes; executable pack content;
    archive or signature retention; private keys; key generation; signing;
    signature verification; release admission; publication; upload; registry
    push; deployment; live campaign execution; cloud provisioning; hosted
    runners; paid or metered services; API keys; credentials; secrets; remote
    reads; external telemetry; runtime downloads; mutable references; legal or
    regulatory conclusions; cross-repository conformance; runtime evidence;
    assurance evidence; or tenant acceptance.
