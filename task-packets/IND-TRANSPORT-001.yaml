  - "Add ci/targets/ind-transport-001.json registering only transport-bootstrap, byte-identical to the pinned descriptor."
  - "Add the one inventory line (\"IND-TRANSPORT-001\", \"transport-bootstrap\") to tests/framework/test_dispatch.py; no other file changes."
excluded: ["Every path but the three allowedPaths: the other three transport files, ci/zero_bill_scan.py, ci/run_make_target.py, .github/**, packs/**, src/**, common/**, ci/handlers/**, every other ci/targets/** descriptor, every other tests/** file, docs/**, the Makefile, pyproject.toml/uv.lock, PORTING.yaml, README.md and NOTICE; new dependencies, network, warm sources, prefetch, verifier, bundle or host configuration."]
