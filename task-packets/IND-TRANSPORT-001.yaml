contracts: ["Verifiable only once bundle v7 (the raw-byte packet runner) is installed on the owner-operated verifier; the install is a verifier step, not a packet dependency", "Consumes harness-onion ci/run_packet_argv.py as exact bytes and mode from MET-VERIFY-007 candidate c1 cbffe6a6637f393197ae9e6dda9e410e5162cf32: 100755 sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f, 9084 bytes. The pin is provisional until slot 283's candidate c2; if c2 changes the runner, this packet's pin follows c2 before publication", "The other three transport files are already byte- and mode-identical at R03 main f0bc4aa07c617af34535f86ef91f598de6e5cd65 (IND-BANK-001's transport bootstrap) to harness-onion main 4b2be353facf23d47e60cb69d16585eedf3576d6: ci/verify-offline.sh 100755 sha256 778cb0faf59786dc31559e5d96a399d1e3bb26a4576e0ee9ff70e1f6546bd114, 3908 bytes; ci/warm-source-isolation.sh 100644 sha256 f717f62fb1c9fdaec9eb594c733f25b17394bae6b90a311b9ccc08d4eaf9233b, 4674 bytes; ci/network_canary.py 100755 sha256 1be4a837c4a5baee900db20007c4841361b8c823a1b5e521badcf28890d82099, 1459 bytes; this packet preserves them unchanged", "R03 already holds no hosted workflow at f0bc4aa07c617af34535f86ef91f598de6e5cd65: no file under .github/, ci/zero_bill_scan.py refuses any file or link under .github/workflows/, and tests/bootstrap/test_static_contract.py asserts the absence; both are preserved unchanged, so this packet adds no zero-bill or no-workflow change", "Owns its exact descriptor ci/targets/ind-transport-001.json (validate_packet_ownership: a product packet that invokes Make owns ci/targets/<id>.json), mode 100644, 299 bytes, sha256 2efdaaa455fce49936eba26eaf4f8d9632255af911d9e0d9a495592a3159d1f4, git blob 1cb1f4ab11ade840f40d22d930d01cafc5893238, in R03's descriptor form (schemaVersion, packetId, targets): it registers only transport-bootstrap, no variables, argv [[\"python3\", \"-m\", \"pytest\", \"tests/framework/test_dispatch.py\"]]. R03's dispatcher ci/run_make_target.py loads every ci/targets/*.json and refuses a target that matches zero or more than one rule, so the descriptor re-lists none of the inherited targets (re-listing them would make every inherited make command ambiguous); each of the twelve make commands matches exactly one rule", "tests/framework/test_dispatch.py::test_real_descriptor_inventory_is_closed pins the exact (packetId, target) set that make pack-framework-test checks, so the packet adds exactly one line to that set, (\"IND-TRANSPORT-001\", \"transport-bootstrap\"), after the IND-FIX-001 line; no other line changes (mode 100644, 3802 bytes, sha256 5e7f06c3e2b9f1caceca6a5a090e4eb8c6983c9ef703e011e2075504b4c5331f, git blob 4ffc48f6e093eb3128421ca89a5593344f85366e; base blob b59196d7917be5054b61dd1fbe8ee1872e39c151)", "Product comparator: the name-status set of the packet head against R03 main f0bc4aa07c617af34535f86ef91f598de6e5cd65 is exactly three entries, M ci/run_packet_argv.py (mode 100755 kept), A ci/targets/ind-transport-001.json (100644), M tests/framework/test_dispatch.py (100644 kept); any other added, modified, deleted or renamed path fails acceptance", "This is a closed transport-correction authority over one IND-001-owned file, the packet's own new descriptor and one inventory line: it does not change any pack, questionnaire, ontology, fixture, handler, existing ci/targets descriptor, ci/run_make_target.py, the Makefile, pyproject.toml, uv.lock, PORTING.yaml, any other test or test line, product source, dependency or evidence axis, and later packets keep the bootstrap/transport/Makefile/dispatcher/workflow/PORTING exclusion"]
