id: CTRL-TRANSPORT-002
repository: mas-harness-control-plane
branch: codex/ctrl-transport-002-raw-byte-runner
objective: Re-copy harness-onion's corrected offline runner byte for byte so the hash-pinned packet digest covers the packet's raw bytes and packets with CRLF, bare carriage returns, a byte order mark or invalid UTF-8 are refused, and prove it with one stdlib regression test, without changing any other transport file, product source, dependency, dispatch rule or public contract.
predecessors: [CTRL-FIX-004]
allowedPaths: ["ci/run_packet_argv.py", "tests/bootstrap/test_packet_raw_digest.py", "ci/targets/ctrl-transport-002.json"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts: ["Built on R04 main 7ef225698d7a3282eaa0ae32433eb54106e5302e (CTRL-FIX-004); every reference below is at that commit", "Consumes harness-onion's corrected offline runner ci/run_packet_argv.py as published by harness-onion slot 283 (MET-VERIFY-007, harness-onion #235), as exact bytes and mode: 100755 sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f, 9084 bytes. The other three transport files stay byte-identical to their CTRL-TRANSPORT-001 pins (equal at harness-onion main 4b2be353facf): ci/verify-offline.sh 100755 sha256 778cb0faf59786dc31559e5d96a399d1e3bb26a4576e0ee9ff70e1f6546bd114, 3908 bytes; ci/warm-source-isolation.sh 100644 sha256 f717f62fb1c9fdaec9eb594c733f25b17394bae6b90a311b9ccc08d4eaf9233b, 4674 bytes; ci/network_canary.py 100755 sha256 1be4a837c4a5baee900db20007c4841361b8c823a1b5e521badcf28890d82099, 1459 bytes", "This is the second closed transport correction, authorized by the plan section `CTRL-TRANSPORT-002` transport re-copy authority: it covers only the runner re-copy, its one new test and its own descriptor. CTRL-TRANSPORT-001's published packet and its historical pins stay as recorded", "Keeps CTRL-TRANSPORT-001's exclusion: the Makefile, ci/run_make_target.py, ci/handlers/**, every predecessor ci/targets descriptor, the other three transport files, ci/zero_bill_scan.py, the absence of .github/workflows/ and PORTING.yaml are unchanged", "The runner's verifier-facing interface is unchanged: read_packet_text(path) still returns (text, digest) and verify_packet_digest(path, expected_digest) keeps its signature. The digest becomes the sha256 of the packet's raw bytes, and a packet with CRLF line endings, a bare carriage return, a UTF-8 byte order mark or invalid UTF-8 is refused with PacketTransportError (R04 issue 13 ACCEPT)", "Verifiable only once the verifier bundle that carries MET-VERIFY-007's transport pins (bundle v7) is installed on the owner-operated verifier; the bundle is an install step, not a packet dependency"]
deliverables:
  - "Replace ci/run_packet_argv.py with an exact copy of harness-onion's corrected runner: git mode 100755, sha256 c8ac40f0b85f327b75748cde7c8498a02fdf48c004dbf3259660b92cc289646f, 9084 bytes (contracts[1]). No other transport file changes."
  - "Add tests/bootstrap/test_packet_raw_digest.py (stdlib unittest; loads ci/run_packet_argv.py by path as tests/bootstrap/test_dispatch.py does; every file it writes lives in a temporary directory under TMPDIR, never in the repository). Case 1: for an LF-only UTF-8 packet, read_packet_text returns the file's text and hashlib.sha256 of the file's raw bytes. Case 2: the same text with CRLF line endings, and a variant of the same length with one bare carriage return in place of a line feed, each have a raw sha256 different from the LF file (asserted) and each raise PacketTransportError. Case 3: the LF packet prefixed with a UTF-8 byte order mark, and the LF packet with one invalid UTF-8 byte, each raise PacketTransportError. Case 4 (newline-only mutation): verify_packet_digest(path, digest) passes on the LF file with its own raw digest, and raises PacketTransportError after the file is rewritten with only its line endings changed to CRLF, and again after it is rewritten with one extra trailing line feed and nothing else changed."
  - "Add ci/targets/ctrl-transport-002.json (schemaVersion harness.planeon.ai/make-target-descriptor/v1alpha1, packetId CTRL-TRANSPORT-002) registering only `transport-raw-digest`, a closed argv target running [[\"python3\",\"-B\",\"-m\",\"unittest\",\"tests/bootstrap/test_packet_raw_digest.py\"]] with acceptedVariables {}. Named allowedPaths exception: the packet needs its own make target; no other descriptor is touched."
excluded: ["The Makefile, ci/run_make_target.py, ci/handlers/**, predecessor ci/targets/*.json, ci/verify-offline.sh, ci/warm-source-isolation.sh, ci/network_canary.py, ci/zero_bill_scan.py, .github/**, PORTING.yaml, package.json/package-lock.json, pyproject.toml/uv.lock, every existing test file, apps/**, workers/**, packages/**, prisma, deploy, docs, e2e/**, new dependencies, network, warm sources, prefetch.sh, verifier or host configuration; CTRL-INTEGRATE-002's items (F-R04-10/12/13/14/15/16, the preview/production split, durable adapters) stay out."]
prefetchCommands: []
offlineAcceptanceCommands: [["make","transport-bootstrap"],["make","zero-bill"],["make","prefetch-lineage-regression"],["make","compiler-worker-contract"],["make","ctrl-fix-003-regression"],["make","ctrl-fix-004-page-status"],["make","ctrl-fix-004-page-resolver"],["make","transport-raw-digest"],["make","security"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - "The diff against 7ef225698d7a3282eaa0ae32433eb54106e5302e is exactly M ci/run_packet_argv.py, A tests/bootstrap/test_packet_raw_digest.py and A ci/targets/ctrl-transport-002.json; the runner equals contracts[1] by sha256, size and mode, and the other three transport files are unchanged."
  - "offlineAcceptanceCommands keep CTRL-FIX-004's eight argv byte-exact and in order, with transport-raw-digest inserted before security (the Q-CPP-2 ordered-supersequence rule)."
  - "test_packet_raw_digest.py passes at the packet head; against the runner at 7ef225698d7a3282eaa0ae32433eb54106e5302e (blob 2bd2d645) its cases 2, 3 and 4 fail: that runner hashes newline-translated text, so it accepts the CRLF and bare-CR variants and the CRLF rewrite with the LF digest, keeps a byte order mark, and raises UnicodeDecodeError rather than PacketTransportError on invalid UTF-8 (a scratch prototype of the four cases against blob 2bd2d645 and the corrected runner, 2026-11-07)."
  - "The installed verifier (bundle v7) accepts the head: the hash-pinned packet transport now pins raw bytes, and every predecessor command (transport-bootstrap, zero-bill, prefetch-lineage-regression, compiler-worker-contract, ctrl-fix-003-regression, the two CTRL-FIX-004 targets and security) still passes under it."
  - "No product behaviour, dependency, dispatch rule, ledger or public contract changes."
rollback: Revert this commit to restore the prior runner; the hash-pinned digest then returns to newline-translated text. No data, schema or dependency state is involved.
