contracts: ["Accepted base is main 35b733b523f46b2ccba095ea046efe5d42bfa583, tree cb629a271de21274526a9575780158223c7f5d17, holding 251 immutable packets including MET-LINUX-007. Add MET-ENFORCE-038 only, as packet 252. Preserve all 251 predecessor YAML files, every contract snapshot, review record and status record (native-profile v1 to v4, I06 v1 to v3, the W02 notes errata and edge records v1 to v6 are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The lane monitor's owner-delegated adoption of NATIVE-PROFILE-V5 candidate 4 (2026-10-19), after four independent contract review rounds (round 4, PASS_FOR_ADOPTION, on candidate 4), on owner decisions Q-NPE-1 to Q-NPE-8 and Q-HE4D2-3 (a) and the monitor's Q-NPE-9 (a) and Q-NPE-10, quoted verbatim in architecture/native-profile-v5/status.json. Add architecture/native-profile-v5/ (README, the v5 capture schema, vectors, source index, the four review records and the status record ADOPTED), scripts/native_qualification_v5.py (the reference model, importing native-profile v4's model unchanged) and edge record v7 with README-v7 (v6's 56 rows plus 6 for HE-004D2: the v5 schema, vectors and README with providerPacket MET-ENFORCE-038, and the native-profile v1 to v3 vectors at their last-change commits). v5 drops the seven host, policy and boot fields from the P1, P5 and backend captures, which become record-only with the T04 proofs T04-HOST-BOOT, T04-POLICY-STABLE, T04-HOST-LOCKS and T04-BOOT-ENTRY; the record, check_record and check_migration stay native-profile v4's; 8 of v4's cases are re-derived and 18 added (284 checks).", "Add one 252-packet current catalog with an exact 252-to-251 inverse before the accepted 251-to-250 MET-LINUX-007 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, reviewed_mode and reviewed_tree, refuses a path outside its era before reading it and an absolute local path in a new contract file. It freezes native-profile v4's and I06 v3's models by exact path and digest and keeps native-profile v1 to v4, I06 v1 to v3, the W02 notes errata and edge records v1 to v6 byte-identical; binds every contract file and review record by digest; checks that the adopted files are candidate 4's bytes except edge record v7's three providerPacket values and the status record's adoption fields, the four rounds bound to their records and subject candidates, the verbatim adoption and the closed findings; checks the source index's pins, edge record v7 against v6 and its six rows' bytes and modes, and the evidenceClasses constant against the v5 model with its eight host rows naming the four proofs; and executes the v5 model from this era's bytes, with this era's v4 model as its import, to replay every vector (284 checks).", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-LINUX-007 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_native_profile_v5.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 252-packet membership and count updates; layer tests and the MET-LINUX-007 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-038 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
