contracts: ["Accepted base is main 4875648cffb3f838650d96a5291445b3634bf9b3, tree 06588db06f78afbcf59ecc626720fa601a78c090, holding 298 immutable packets including MET-006. Add MET-007 as the 288th chain packet and LAB-SYNC-001 as its product, a K = 1 step (300 packets at slot 288; the v2.5 reader's steps [1, 2]). Preserve all 298 predecessor YAML files, every contract snapshot, review record and status record, the catalogs, the chain-compaction, chain-product-packet and chain-inheritance records, the identity models and the chain-checkpoint ledger; architecture/services.yaml, architecture/dependency-graph.yaml, both catalog schemas, architecture/service-edges.yaml, architecture/repositories.yaml and schemas/repositories.schema.json stay byte-equal.", "Part A (CONTRACT_288 rev 3 sections 3-5): the record's closed members name no catalog path; its basis pins the effective catalog's digest with the raw-equals-effective parity (28 services, 129 dependency entries), the service-edge record and the authority map's AM-02 row; one row per durable writer (21 STATEFUL, 3 STATELESS with durableState), each value sourced or UNSPECIFIED; the model replays the thirteen vectors to section 4's table and the checker refuses with DC_SHAPE to DC_VECTORS, both reading the catalog only through the effective view.", "Part B (section 6): repositories.json and language-placement.json gain R14's rows (the placement row from the Reference-Lab's pinned file, its two sources bound by line and digest; the decision member byte-equal); docs/repositories/14-mas-harness-reference-lab.md (its first span from the same file); rule-288.json with scripts/repository_registration_288.py (the 284 module pinned by sha256, R8 clause 2 from slot 288); the composed count 15 where it is frozen (section 9), the Phase-0 constant staying 13; tests/test_task_packets.py exempts exactly R14's name until REF-ESTATE-001's first packet (C2-2).", "Part C (section 7): task-packets/LAB-SYNC-001.yaml in LAB-REPO-001's 16-key form, every field but id, objective, deliverables and contracts from the Research-Lab's inputs file; LAB-REPO-001 is its comparator under R13 (its six commands kept byte-exact and in order) and R8 clause 2 admits its repository; the authority's productPackets names it and productComparators maps it to LAB-REPO-001's pin.", "Rev 4 (MON-288-C2-RULE): ci/chain_checkpoint.py becomes the reviewed v2.5 reader (class rule v2.5, C1 the receiver after the star, C2 the bridged loop at K >= 1; RULE_V25_SHA256; a newer authority's record, named <slot>.json for the slot the reader counts, names it if and only if slot >= 288), with its README paragraph and tests; the checker imports only sector_catalog's effective_bytes_from and keeps its own disk_reader and published_packets; the declaration test, and readiness twice, take C2-2's guarded exemption (exactly R14's name, or exactly LAB-SYNC-001 under the codex/lab-sync- prefix), each removed by REF-ESTATE-001's first packet or never needed again."]
