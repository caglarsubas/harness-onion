ged paths resolve to CONTRACT_AND_SOURCE; no path resolves to GATE_SCHEMAS and no .github/ path changes, so no transport approval applies. The owner approves the exact head and the merge per PR, bound to the head. Nothing is installed, and no R10 or R12 file changes."
