expectedEvidence:
  - Exact public contract/release digests, SDK-002 commit/module/vector digests, byte-equivalent admitted SDK wheel modules, CPython baseline, and unchanged dependency/lock files pass before behavior tests.
  - Public ExecutionBudget and BudgetConsumption compatibility plus all eleven dimensions, four scopes, HARD/ADVISORY modes, UTC windows, warning and exhaustion boundaries, suspension, reset-pending, and maximum integer bounds produce deterministic closed vectors.
  - Concurrent reservations never oversubscribe a HARD budget. Exact reserve/commit/release retries are stable; conflicting reuse, commit above reservation, duplicate terminal transition, expiry races, clock regression, storage failure, and tenant/budget/scope mismatch fail closed without partial state.
  - Every successful mutation has one atomic immutable reservation/transition/usage/aggregate/audit/outbox result. Aggregate recomputation matches authoritative records; injected discrepancies emit findings and never silently repair history.
  - Retention computes stable cutoff/history digests and RETENTION_DUE findings without deleting, updating, compacting, truncating, or hiding authoritative usage/audit records. Rollback and outage vectors preserve all history.
  - API/ASGI vectors prove server-derived tenant/subject scope, 65536-byte and closed-field limits, cross-tenant/query denial, stable non-echoing errors, readiness dependency semantics, and no content/token/credential storage or response leakage.
  - Telemetry tests match the pinned SDK-002 semantic contract, reject sensitive/arbitrary/high-cardinality content, enforce count/byte/age bounds, preserve audit-required evidence, and report collector/backend outage without altering budget decisions.
  - OTel, Prometheus, and Jaeger module source checks prove install-inert catalog alignment, external-backend ownership, local-only closed routes, bounded retention/cardinality/WAL, no Loki or Grafana implication, and rejection of external exporters, remote write, public hosts, inline secrets, API keys, mutable artifacts, or runtime fetches.
  - SQL source tests prove separate roles, FORCE RLS, transaction-local tenant context, append-only authority, idempotency uniqueness, runtime privilege denial, and no destructive migration. Helm source tests prove digest-only operator inputs, disabled defaults, bounded security/resources/network, external dependency references, and zero state/credential/cloud provisioning.
  - Cumulative dispatch tests preserve every predecessor target/owner and negative vector while adding TRUST-OBS-001. Zero-bill scanning finds no hosted runner, cache/artifact upload, cloud provisioning, paid/provider API, API-key field, remote telemetry, mutable artifact, scheduled work, runtime download, or retained CI artifact.
  - Source, contract/unit, PR check, merge, artifact/SBOM, signature/release, deployment, runtime, security, assurance, and tenant acceptance remain separate. This packet can prove only clean-room source and offline contract/unit behavior; PostgreSQL, collector/backend, Kubernetes, artifact, release, live security, assurance, and tenant acceptance remain pending or NOT_RUN_ENV_UNAVAILABLE.
rollback: Revert only the unreleased TRUST-OBS-001 source and disable new reservation routes with callers remaining fail closed. Preserve every immutable usage, reservation, transition, aggregate, audit, outbox, reconciliation, and retention record; do not delete PostgreSQL state, weaken a HARD budget, reset counters, remove tenant backend data, or claim rollback of any external deployment, release, runtime observation, assurance result, or tenant decision.
