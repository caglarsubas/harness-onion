contracts:
  - >-
    Starts from public mas-harness-contracts commit
    2146278a95344cd2a8e22596b2f315b46edffc88 and source-contract-only release
    manifest SHA-256
    c5dd4c39d1c69d07f8d8de3d1a09584bb906172fee2d5ac20ad25ff344b0db79.
    It consumes ExecutionBudget raw SHA-256
    3d605bcdf1180c9a2c9ab0c56dd3da2fe821c66c7cf33ba3fb576dfb98c5c7d7,
    runtime common raw SHA-256
    f5cbcee26f9dbd5250499358f26db403ce409d87e4fd625deccbca3f717d6ead,
    BudgetConsumption raw SHA-256
    98b72f3283388c8533069b05ca272c9d0e17f8709167837fa643a07b74b2d2c2,
    its valid vector raw SHA-256
    fea48682bee15b6a42e672234975bf6285a3b8c929237236b80b8f535c9d3a7b,
    and HarnessCloudEvent raw SHA-256
    f0be09712101b61980e7752ae4a394bd09fa21640df4cbeeec4764f1e6004d0f.
    Packet-local usage APIs may extend resource dimensions but must preserve the
    five public ExecutionBudget and BudgetConsumption dimension names and
    limits exactly; they do not revise or claim a new public contract release.
  - >-
    Consumes the SDK-002 telemetry authority at merged commit
    92a8ebf8e705eb2bf7a4e5be89edc5e8aa062c08. The exact unchanged Python
    context, attributes, and decorators source digests are respectively
    24cf52e5f9250674eb0348c5f95cc10e8c59d7b346727874003dc45982116a54,
    9ca5a49aa79e599ff3da222566dc04ece67fdfd33c534732343d082c9fa87e4f,
    and 0d18bea2878b2f1e3153f7d084e6a870bf1a35197709a5cb7f9164acc2c20dc4.
    The golden span vector digest is
    e6b6a5546566eb55739f2fbbba0c1c239312f26f6c0a62f44c79b850fe57714c.
    The already admitted SDK-006 wheel at SHA-256
    9b85d01b7079fe27c189d70b7fba46614c3df647d6f44e9270fe4683d7337fa4
    contains byte-identical copies of those three SDK-002 Python modules; this
    packet adds no dependency, changes neither pyproject.toml nor uv.lock, and
    does not receive the SDK source checkout during product implementation.
  - >-
    Produces packet-local usage-ledger API
    harness.planeon.ai/usage-ledger/v1alpha1. POST reserve, commit, release, and
    evaluate bodies never accept organizationId, tenantId, subjectId, pricing,
    currency, endpoint, credential, prompt, output, message, source, memory, or
    tool payload fields. OIDC admission and organization/subject derivation use
    the existing TRUST-001 boundary. GET query scope is always restricted to
    the derived organization. Requests and responses are closed JSON objects,
    bounded to 65536 bytes, and use stable reason codes.
  - >-
    The closed dimensions are concurrentTasks, taskSeconds, retries, toolCalls,
    modelTokens, modelCalls, inputTokens, outputTokens, cpuSeconds, gpuSeconds,
    and storageBytes. Values are non-negative integers no greater than
    9000000000000000. Budget scope is exactly TENANT, PROFILE, ROUTE, or
    WORKFLOW; enforcement is HARD or ADVISORY; windows are fixed UTC epochs with
    windowSeconds 60..31536000; warningThresholdBasisPoints is 1..9999;
    reservation TTL is 1..3600 seconds and is clipped to the current window.
    The five public ExecutionBudget dimensions retain their public maxima.
  - >-
    Reservation state is RESERVED then exactly one of COMMITTED, RELEASED, or
    EXPIRED. Reserve idempotency binds organization, budget digest, scope,
    operation, requested dimensions, and idempotency-key digest. Commit and
    release have independent transition idempotency; exact retries return the
    original result and conflicting reuse is denied. Commit observations may
    not exceed the reservation. A single organization-scoped transaction
    appends the reservation/decision/usage/outbox records and updates derived
    counters atomically. HARD exhaustion and every storage or reconciliation
    failure deny; ADVISORY exhaustion records the exceeded dimensions but does
    not authorize any operation that separately requires a public REQUIRED/BLOCK
    ExecutionBudget.
  - >-
    Produces source-only module contracts for planeon.otel and the cataloged
    external.otel-backend. Prometheus and Jaeger paths contain only install-inert
    tenant-attestation/query contracts for that external prerequisite; they do
    not package, install, provision, or claim ownership of either backend. The
    collector contract accepts only OTLP receivers, required content-redaction,
    memory/cardinality/batch controls, a bounded local WAL, and catalog-resolved
    tenant-private exporters. URL literals, remote write, public hosts, external
    exporters, payload capture, inline secrets, API keys, mutable images, and
    runtime downloads are rejected.
  - >-
    Produces closed packet-local Make target descriptor dispatch v1. The packet
    owns usage-vectors and observability-smoke plus cumulative security and
    zero-bill handlers. It owns the exact predecessor dispatch inventory test
    only to extend the generated target union and cumulative owner assertions;
    all predecessor negative-dispatch and PORTING assertions remain unchanged.
deliverables:
  - >-
    Implement a dependency-minimal Python service core using only the repository
    baseline closure. Define immutable BudgetDefinition, Reservation,
    ReservationTransition, UsageEntry, Aggregate, ReconciliationFinding,
    RetentionFinding, DependencyHealth, and content-free telemetry records.
    Store only digests, opaque identifiers, integer counts, states, reason codes,
    and timestamps; never retain request bodies, token/JWT material, business
    payloads, prompts, model outputs, source content, memory content, credentials,
    or arbitrary labels.
  - >-
    Implement locked in-memory reference storage with copy-on-commit semantics.
    Every mutation first expires due reservations, resolves the current window,
    validates tenant/scope/budget digests, and commits reservation, decision,
    usage, aggregate, audit, and outbox changes as one atomic state replacement.
    Injected failure leaves byte-equivalent prior state. Cross-organization IDs,
    duplicate/conflicting idempotency, terminal-state transitions, negative or
    oversized counters, clock regression, and unconfigured budgets fail closed.
  - >-
    Budget state is SUSPENDED when disabled, RESET_PENDING only while a prior
    window has unreconciled terminal accounting, EXHAUSTED when any current
    committed-plus-reserved dimension reaches or exceeds its limit, WARNING at
    the configured basis-point threshold, otherwise AVAILABLE. Expiry releases
    reserved capacity through an immutable EXPIRED transition. Reconciliation
    recomputes counters from immutable records and emits a finding on any
    discrepancy; it never silently resets or repairs authoritative history.
  - >-
    Retention is non-destructive in this packet. It computes query cutoffs and
    immutable RETENTION_DUE findings bound to aggregate/history digests. It does
    not delete, truncate, compact, mutate, or hide authoritative usage/audit
    history because no tenant-signed destructive-retention authority exists yet.
    Any future purge requires a separate governance contract and task packet.
  - >-
    Provide transport-neutral service methods and a dependency-minimal ASGI
    adapter for reserve, commit, release, usage query, budgets query/evaluate,
    SLO projection, dependency health, liveness, and readiness. Readiness fails
    without durable-store readiness, current reconciliation, and a valid local
    collector contract; collector/backend outage is reported as degraded and
    never changes authoritative budget decisions. Error responses contain no
    submitted value or identity material.
  - >-
    Provide an independent fixture catalog covering public budget compatibility,
    exact HARD and ADVISORY boundaries, all scopes/dimensions, warning/exhausted/
    suspended/reset states, races, idempotency conflicts, expiry, commit/release,
    aggregate reconciliation, clock/window edges, retention findings, collector
    outage, content rejection, and cross-tenant denial. Fixtures are clean-room
    and do not copy any warm-source vector.
  - >-
    Provide bounded content-free telemetry admission and local buffering.
    Required semantic attributes are derived from admitted SDK context; unknown,
    sensitive, nested, overlong, non-finite, or high-cardinality attributes are
    dropped without value echo. Buffer limits are exact record count, byte count,
    and age; overflow drops only non-audit telemetry in LOW then NORMAL priority
    order, while audit-required saturation fails readiness and reports a stable
    finding rather than discarding evidence.
  - >-
    modules/otel-collector contains a closed source configuration contract and
    install-inert example. modules/prometheus and modules/jaeger contain only
    external-backend attestation and content-free query catalogs. Offline smoke
    tests reject endpoint literals, public/remote exporters, remote write,
    payload capture, secrets, mutable artifacts, unbounded buffers/cardinality,
    missing tenant isolation/retention, and any claim that external backends are
    repository-built or currently released.
  - >-
    migrations/usage/001_usage.sql creates distinct NOLOGIN owner, migrator,
    runtime, and audit-reader roles plus tenant budget, reservation,
    reservation-transition, usage-entry, aggregate, reconciliation, retention,
    audit, and outbox tables. Tenant tables use ENABLE and FORCE RLS with only
    transaction-local planeon.organization_id. Runtime has no BYPASSRLS, DDL,
    TRUNCATE, or DELETE; authoritative tables reject UPDATE/DELETE; uniqueness
    closes reserve/commit/release idempotency; no down or destructive migration
    exists. PostgreSQL execution remains NOT_RUN_ENV_UNAVAILABLE.
  - >-
    The usage-ledger Helm chart is disabled until an operator supplies an
    immutable service image digest plus existing PostgreSQL, OIDC, policy, and
    optional local-collector references. It provisions no database, backend,
    PVC, Secret, key, namespace, cloud resource, or credential. It is non-root,
    read-only, capability-dropped, seccomp RuntimeDefault, resource-bounded,
    OpenShift arbitrary-UID compatible, and default-deny with only explicit
    cluster-local dependencies.
  - >-
    ci/targets/trust-obs-001.json registers usage-vectors,
    observability-smoke, security, and zero-bill as direct argv. Cumulative
    security retains TRUST-001 and TRUST-002 handlers and adds only packet-owned
    observability tests. The exact foundation dispatch test recognizes
    TRUST-OBS-001 owners while preserving all malformed/ambiguous/shell/variable/
    zero-handler/PORTING denial vectors.
excluded:
  - >-
    Warm checkout access or copied source; public contract revision; dependency
    or lockfile change; OpenTelemetry, Prometheus, Jaeger, Loki, PostgreSQL, or
    Kubernetes binary execution; backend/image download, packaging,
    provisioning, deployment, or release; Grafana; ClickHouse; Redis; cloud or
    hosted telemetry; public endpoint or remote-write defaults; external billing
    or pricing APIs; currency or invoice claims; provider/API keys; raw payload,
    prompt, output, source, memory, secret, credential, token, or arbitrary-label
    capture; automatic/destructive retention; scheduled work; hosted runners;
    Actions cache/artifacts/Packages; publishing; mutable artifacts; runtime
    downloads; deployment/runtime/security/assurance certification; or tenant
    acceptance.
