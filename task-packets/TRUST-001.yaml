allowedPaths: [".github/workflows/verify.yml", "src/planeon_trust/common/", "services/policy-decision/", "migrations/policy/", "tests/foundation/", "fixtures/policy/", "deploy/helm/policy-decision/", "pyproject.toml", "uv.lock", "Makefile", "README.md", "AGENTS.md", "CONTRIBUTING.md", ".gitignore", "LICENSE", "NOTICE", "SECURITY.md", "PORTING.yaml", "ci/"]
