expectedEvidence: ["Cross-tenant/forged-token denial.", "Signed activation, last-known-good, revoked/expired policy, OPA outage, and atomic audit/outbox reports.", "Negative Make-dispatch vectors reject missing, unknown, or duplicate targets; owner or filename mismatch; undeclared variables; shell transport; and zero or ambiguous applicable handlers.", "PORTING bootstrap validation proves zero authorized source mappings and rejects any copy claim without a future approved PORT_CANDIDATE packet."]
