contracts: ["Consumes identity, policy bundle, decision, audit, and event contracts v1alpha1", "Produces policy-decision API and fail-closed client v1", "Produces closed packet-local Make target descriptor dispatch v1", "Produces inert destination PORTING ledger v1 with zero current copy authorizations"]
deliverables: ["JWT/OIDC tenant derivation, separate RLS roles, offline signed policy activation, decision API, bounded decision metadata cache, append-only audit/outbox, and fail-closed client.", "Bootstrap Makefile delegates only to ci/run_make_target.py, which validates closed ci/targets/<packet-id>.json descriptors, exact target and variable bindings, cumulative lexical handler order, and direct argv without shell strings; later packets never edit Makefile.", "PORTING.yaml contains only the closed NO_AUTHORIZATION bootstrap sentinel and cannot name a source path, mapping, copied file, or applied port."]
