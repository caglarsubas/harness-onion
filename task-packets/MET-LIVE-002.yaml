contracts: ["Accepted base is main b516619404e177893143dd37f19f8673a4173fba, tree 292fc0beb7d254a0feb627f4e5f216d53d497800, holding 259 immutable packets including MET-GOV-002. Add MET-LIVE-002 only, as packet 260. Preserve all 259 predecessor YAML files, every contract snapshot, review record and status record (every review record and oracle test that predates review record v2 stays on the frozen list with its digest), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions (via the lane monitor, quoted in architecture/probe-kit-scope/amendment.json's ownerDecisions and recorded in its status.json): LX-D1 \"Add owning packets (Recommended)\", Q-PK-2 \"Move them (Recommended)\", Q-LPK0-3 \"Server side, KAP stays (Recommended)\", Q-LPK0-4 \"Retain as history (Recommended)\", R-S1-5 \"Retire 008 too (Recommended)\", and the registry decision \"Batch, carried by 260 (Recommended)\". The lane monitor's owner-delegated rulings (2026-10-22 and 2026-10-23): the design rulings through Q-LPK0-CAP (design revision 3 with build rules S3-1 to S3-17), the slot re-sequence (slot 260), the adoptions c3 to c11 (MON-LPK0-ADOPT-C3 to MON-LPK0-ADOPT-C8, MON-260-RIDER-DIR (a), MON-260-R1-1 and MON-260-R2-1), the exact registry series and the review history file names, the oracle identity's KEEP ref MON-LPK0-ORACLE-KEEP, Q-260-1 (a) (the registry rider as a README-only errata), MON-260-READ (a) (the layer's git-free base read) and MON-260-TREE (a) (check_tree runs only in the suite).", "Add architecture/probe-kit-scope/ (amendment.json, the closed record planeon.internal.probe-kit-scope/v1; README.md, vectors.json and replay.py; status.json ADOPTED; oracle-identity.json; and the review history of three design and two contract rounds as review-history-<kind>-r<n>.json, the reviewers' records byte for byte, with their briefs redacted of local paths as review-history-<kind>-r<n>-brief.md, each bound by its reviewed and published SHA-256 and its substitutions; these are not review-round records and carry no merge authority), the standard-library reference model scripts/probe_kit_scope.py and the prose page docs/linux-probe-kit/README.md. The record moves the CAMPAIGN_PROXY server side, its admission module, the UID ledger and cleanup, the native record inspector, the worker entry, the ten case recipes and the unsigned receipt candidates from R12's CONF-LIVE-003/004/005 to LINUX-PROBE-KIT-001, keeps the campaign client and receipt and evidence verification with R12, leaves the KAP leg deferred and unowned, supersedes the moved clauses by quote and pins or names every other file its declared search at 2043cc27 finds; it edits no pinned file. The D5a oracle tests, written outside the candidate, are tests/test_probe_kit_scope_oracle.py, bound by the oracle identity (ruling KEEP).", "The review-record brief registry rider (the owner's \"Batch, carried by 260 (Recommended)\"; Q-260-1 (a); MON-260-RIDER-DIR (a)): architecture/review-record/briefs.json gains exactly five version-1 entries, MET-LIVE-002/packet, MET-GOV-003/packet, MET-LIVE-003/packet and MET-LINUX-008/packet (PACKET) and MET-LINUX-008/contract (CONTRACT), each pinning one of the two generic briefs architecture/review-briefs/REVIEW_BRIEF_PACKET.md and REVIEW_BRIEF_CONTRACT.md by the SHA-256 of its bytes. briefs.json is the one gate-material path this packet changes, so the owner approves the merge per PR, bound to the head; the two briefs are data (REVIEW_BRIEF) in a directory no history-chain layer lists, and any change to their bytes needs a registry change. The scope contract's changed files are the packet's changed files less these three paths.", "Add one 260-packet current catalog with an exact 260-to-259 inverse before the accepted 259-to-258 MET-GOV-002 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes and reviewed_mode, refuses a path outside its era before reading it and binds every era file by digest (the 21 files this packet adds, the registry, the evolution surface record and its model, and 259's authority). It checks the freeze (this packet edits no existing file but chain validators, tests, the three living catalogs and the registry); the files added (exactly its own, each once, mode 100644, no absolute local path); the adoption (the status record's closed shape and values, the six adopted files as the adopted subject's bytes with amendment.json pinned, the five reviews bound to their published records and briefs, each brief redaction as stated, the adoptions c3 to c11 with their check digests, and the oracle identity with ruling KEEP); the registry (the base's with exactly the five ruled entries appended); the rider (among the changed files, with briefs.json exactly the gate path among them by the evolution surface record's 31 gate entries, lower-cased, which equals case-folding on this era's all-ASCII gate entries); and the reference model, executed from this era's verified bytes, returning no refusal for the adopted record over its base bytes with the changed files less the rider (so no pinned, quoted, amended or cross-input path changes, build rule S3-7). The base bytes are read git-free (MON-260-READ (a)): the 276 recorded paths unchanged since 2043cc27 from the tree, each bound by the record's SHA-256, and the three living catalogs 259 changed rebuilt to their exact base bytes (this layer's own edits undone, then 259's recorded reverse hunks), about 66.3 MB of tree reads; the layer test compares them with git show 2043cc27:<path> (build rule S3-17). Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 259's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 71 predecessor routes, every catalog walk and round trip, the full payload loop); 259's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-GOV-002 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_probe_kit_scope.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too (MON-260-TREE (a)). Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 260-packet membership and count updates; layer tests and the MET-GOV-002 layer's checks adjusted solely for the successor bridge; C2's two test changes in 259's test tests/test_review_record.py; the one-deeper successor hand edit of 258's test tests/test_policy_observation_digests.py (as 259 made for 257's); the count line of 257's test tests/test_evolution_surface.py, which the cascade misses after 259's hand edit; tests/test_sector_catalog.py's tripwire sets gaining exactly architecture/probe-kit-scope/amendment.json (PINNING_RECORDS and NAMING_RECORDS) and review-history-design-r2.json and review-history-design-r3.json (NAMING_RECORDS), whose quotes pin or name a catalog; catalog-membership filters ignoring only the added MET-LIVE-002 member; the current-state text, with design revision 3 section 1.1's five annotations in docs/MASTER_DEVELOPMENT_PLAN.md (build rule S3-12: the CONF-FIX-010 and CONF-LIVE-004/005/006 phase-table rows and the CONF-FIX-010, CONF-LIVE-004 and CONF-LIVE-005 checkboxes, their existing words unchanged); and the registry rider. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The probe-kit scope amendment (record, README, vectors and replay script) with its standard-library reference model and prose page, and its status, oracle identity and redacted review history under architecture/probe-kit-scope/, adopted after independent design and contract review; the D5a oracle tests outside the candidate; the review-record brief registry rider with its two generic briefs.", "A fresh 260-to-259 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier after the owner's per-PR approval of the exact head (gate material)."]
