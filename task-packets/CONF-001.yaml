id: CONF-001
repository: mas-harness-conformance-labs
branch: codex/conf-001-conformance-kit
objective: Bootstrap a dependency-free, deterministic offline conformance CLI, closed campaign and evidence contracts, honest environment intake, lifecycle and event assertions, technical-evidence signing, reproducible live-launcher candidate, generic campaign dispatch, and adversarial meta-tests.
predecessors: [CON-005, SDK-001, MET-003]
allowedPaths:
  - .github/workflows/verify.yml
  - src/harness_conformance/
  - schemas/
  - campaigns/meta/
  - tests/meta/
  - fixtures/environments/
  - toolchain.lock
  - pyproject.toml
  - uv.lock
  - Makefile
  - README.md
  - AGENTS.md
  - CONTRIBUTING.md
  - .gitignore
  - LICENSE
  - NOTICE
  - SECURITY.md
  - PORTING.yaml
  - ci/
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts:
  - Consumes canonical contracts, states, events, and evidence v1alpha1.
  - Produces conformance campaign, result, report, technical-evidence, environment-intake, campaign-release, execution-envelope, capacity-authorization, trust-bundle, and unsigned tenant-acceptance-candidate schemas v1alpha1.
  - Produces the dual-signed execution-envelope and preinstalled trusted live-launcher protocol v1.
  - Produces closed packet-local Make target descriptor dispatch v1 and generic campaign dispatch v1.
  - Produces inert destination PORTING ledger v1 with zero current copy authorizations.
