    AGENTS.md, and the pinned self-hosted workflow. CONF-001 is the sole owner
    of the repository bootstrap, Makefile, dispatcher, generic campaign rules,
    and PORTING.yaml. No warm-source repository may be mounted, opened, copied,
    adapted, translated, or supplied to a packet process.
