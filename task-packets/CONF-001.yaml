expectedEvidence: ["Self-test proves each canonical result state and evidence axis.", "Two-run deterministic campaign/evidence digest and no-network report.", "Negative live-protocol vectors reject a non-absolute or repository launcher, missing/stale/ambiguous/revoked trust bindings, either missing signature, any packet/command/campaign/kit/launcher/bundle/axis/endpoint/capacity/admission digest mismatch, DNS rebinding, wildcard or discovered endpoints, undeclared ports, public discovery, cloud/billing APIs, shell transport, unavailable targets falsely marked PASS, and use from a GitHub PR check.", "Positive and negative acceptance-package-contract tests prove a declared campaign emits an unsigned acceptance candidate and prove unknown campaigns, signature claims, and tenant-acceptance transitions fail closed.", "Negative Make-dispatch vectors reject missing, unknown, or duplicate targets; owner or filename mismatch; undeclared variables; shell transport; and zero or ambiguous applicable handlers.", "PORTING bootstrap validation proves zero authorized source mappings and rejects any copy claim without a future approved PORT_CANDIDATE packet."]
