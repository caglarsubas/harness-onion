contracts: ["Consumes canonical contracts, states, events, and evidence v1alpha1", "Produces conformance campaign/result/evidence schemas v1", "Produces the dual-signed execution-envelope and preinstalled trusted live-launcher protocol v1", "Owns the generic make acceptance-package CAMPAIGN=<id> dispatch contract; it produces only an unsigned tenant-acceptance candidate", "Produces closed packet-local Make target descriptor dispatch v1", "Produces inert destination PORTING ledger v1 with zero current copy authorizations"]
