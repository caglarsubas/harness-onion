expectedEvidence: ["Fresh native Linux AMD64 PASS is mandatory before CTRL-INTEGRATE-001, MODEL-001, EXEC-001 or RUN-001 runtime coding; missing Linux capacity or authority is NOT_RUN_ENV_UNAVAILABLE and keeps this stricter gate closed even after the kit source merges.","Linux ARM64 is separately required before advertising or releasing that target. Emulated execution never satisfies native qualification; macOS development artifacts cannot be accepted as Linux release outputs.","Real Linux-target build, full regression, startup, migration/RLS, restart, restricted UID and Kubernetes deny-all probes are digest-bound and independently verified; every missing or skipped mandatory case prevents PASS.","Full enterprise K8s/K3s/OCP/air-gap, upgrade, GPU and tenant acceptance remain later independently executed gates.","The approved MET-REPAIR-003 amendment fixes path/test-discovery authority only; CONF-FIX-001 closes source runner defects, not native Linux or usable live execution. All original Linux mandatory-case, freshness, signature, zero-bill and independent-capacity gates remain unchanged."]
rollback: "Remove only run-labelled resources inside the preauthorized namespace through the signed proxy; preserve tenant data and evidence. Do not destroy capacity or automatically reverse destructive migrations; restore a verified checkpoint only with separate data-owner authority."
