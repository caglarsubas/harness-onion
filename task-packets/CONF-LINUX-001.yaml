id: CONF-LINUX-001
repository: mas-harness-conformance-labs
branch: codex/conf-linux-001-early-linux-baseline
objective: "Implement and independently run the early Linux foundation acceptance campaign, keeping offline source tests separate from signed Linux build/isolation/runtime evidence."
predecessors: ["CONF-A1-001","MET-LINUX-002","CTRL-FIX-003","CONF-FIX-001"]
allowedPaths: ["campaigns/platform/linux-baseline/","tests/platform/linux_baseline/","fixtures/platform/linux-baseline/","docs/reports/linux-baseline.md","tests/meta/test_registry_dispatch.py","src/harness_conformance/linux_readiness.py","src/harness_conformance/campaign.py","src/harness_conformance/cli.py","src/harness_conformance/schema.py","src/harness_conformance/live.py","src/harness_conformance/live_launcher.py","schemas/v1alpha1/conformance-campaign.schema.json","schemas/v1alpha1/linux-readiness-evidence.schema.json","src/harness_conformance/models.py","schemas/v1alpha1/control-result.schema.json"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts: ["Consumes the MET-LINUX-001 Linux readiness policy and MET-LINUX-002 reviewed runner candidate, CONF-001 evidence/trust/dispatch contracts, and completed foundation plus CTRL-FIX-003 exact-main artifacts.","Produces a closed Linux readiness evidence record and a fixed LINUX_READINESS campaign handler; generic ENVIRONMENT_CAPABILITY=true and checked-in fixtures never satisfy real Linux acceptance."]
deliverables: ["Add the linux-baseline campaign and closed evidence schema with independent cases for native AMD64 and ARM64, Linux-target build provenance, offline full regression, standalone control container startup, PostgreSQL migrations/RLS/restart, arbitrary non-root UID/read-only filesystem and default-deny Kubernetes smoke.","Implement a fixed evidence verifier in src/harness_conformance/linux_readiness.py and additive campaign/CLI/schema/live-context integration. Verify exact source/image/OS/architecture/libc/toolchain/cache/probe/result digests, independent signer purpose and validity, observation freshness, envelope tenant/environment/release binding and every required case; do not trust caller-supplied verified booleans or capability fixtures.","Use the existing external dual-signed launcher only. Live probe operations are a closed set against the envelope-authorized pre-existing CAMPAIGN_PROXY or KUBERNETES_API_PROXY, with namespace/quota/zero-incremental-cost admission and per-operation evidence bound to the run nonce; no arbitrary executable, URL, command, plugin import, raw socket, root or provisioning authority.","Keep CI fully offline: fake transports are labelled unit evidence, unavailable signed runtime context yields NOT_RUN_ENV_UNAVAILABLE, real target failure yields FAIL, and malformed/expired/replayed or digest-mismatched records fail closed. Source-kit merge cannot satisfy the Linux gate.","Run all predecessor conformance tests plus new Linux negative cases. Preserve existing campaign output bytes and handlers for unaffected inputs; no synthetic fixture replacement of the full baseline.","Publish docs/reports/linux-baseline.md with exact packet/source/build/CI/merge versus operator-install/Linux evidence axes, native/emulated matrix, missing capacity blockers and reusable pre-existing resource cleanup/rollback. Operator-installed fixed probe/build helpers must be reviewed and hash-bound; absence is NOT_RUN_ENV_UNAVAILABLE, not permission to install or download them.","MET-REPAIR-003 R1: src/harness_conformance/models.py may only append LINUX_READINESS to HANDLERS; every other definition and old value/order stays byte-identical. schemas/v1alpha1/control-result.schema.json may only append that value to properties.handler.enum; every other schema member stays unchanged.","MET-REPAIR-003 R2: use the complete explicit seven-command suite/campaign/evidence sequence, not unittest discovery at tests root. Preserve legacy imports and assert nonzero collection plus inventory closure of meta, parity, alpha1, runner-boundary and linux-baseline suites; no omission, silent empty run or predecessor suppression.","MET-REPAIR-003 R3-R4: require merged CONF-FIX-001 and its exact-main source evidence first. The retired inner adapter may not be re-enabled, bypassed, imported as authority or replaced by a caller-supplied verified flag; the missing external endpoint-isolation/proxy backend remains NOT_RUN_ENV_UNAVAILABLE.","MET-REPAIR-003 acceptance: unchanged legacy inputs must produce byte-identical reports/evidence; Python handler registry, campaign schema and control-result schema admit exactly the old handlers plus LINUX_READINESS. Test every excluded edit and all three registry/schema views."]
excluded: ["Product service modifications, Makefile/dispatcher changes, root-owned launcher installation from CI, dependency downloads, cloud resources, new capacity, node-wide mutations, raw Docker/CRI sockets, warm sources, new tenant acceptance signatures, model/GPU performance or Alpha-4 platform certification."]
