expectedEvidence:
  - "The head's name-status against 9034e0f65e0756e5cf5404dff28893c62b641738 equals allowedPaths' A/M split (CONTRACT.md section 2); ind_bank_001.py and ind_bank_002.py move only on the listed lines; white goods, common/, the dispatcher, the runner, pyproject.toml and uv.lock are byte-identical."
  - "IND-TRANSPORT-001A's 12 commands (equal to IND-TRANSPORT-001's) run unchanged and in order as items 1-6 and 11-16 of the 16 and pass; make pack PACK=banking and the business-domain tests pass with the declared governance questionnaires, and an undeclared questionnaire is still refused."
  - "governance-integrations evaluates all 29 vectors to their labels; readiness-evaluate on the shipped fixture equals tests/fixtures/banking/evaluator/expected.json byte for byte and agrees with data-readiness on the nine readiness fixtures."
