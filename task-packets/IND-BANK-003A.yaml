contracts:
  - "Binds mas-harness-contracts commit 2146278a95344cd2a8e22596b2f315b46edffc88 (unchanged lock); ApprovalRequest v1alpha1 and its two common dependencies by exact sha256 in controls/contract-binding.json, no schema bytes copied; ControlRequirement and IntegrationDeclaration stay NOT_AVAILABLE_IN_BOUND_RELEASE (pack-local record sets)."
  - "Predecessor-module edits (CONTRACT.md section 3): ind_bank_001.py lines 71, an insertion after 75 (DECLARED_GOVERNANCE_QUESTIONNAIRES, four triples), 147 and 317 only; ind_bank_002.py lines 35-38, an insertion after 38 (ASSESSMENT_VERSION = '0.2.0', the DataReadinessAssessment version, as READINESS_POLICY keeps 0.2.0 at 120), 144, 667 (the assessment metadata version reads ASSESSMENT_VERSION instead of PACK_VERSION) and 736-737 only; the nine readiness vectors stay byte-identical; the two banking tests' 0.2.0, count, controls and rule-id pins only. The undeclared-questionnaire refusal and its test stay unchanged."
  - "Framework 0.1.1, pyproject.toml, uv.lock, the dispatcher, the runner and transport files, common/ and white goods stay byte-identical."
  - "INV01, INV03 and INV18 are adopted verbatim from the enterprise blueprint's register, pack side only (MON-BLUEPRINT-R03 C-2; VIS-C15-SPLIT)."
  - "Readiness evaluator: make readiness-evaluate PACK=banking runs the shipped fixture through ci/handlers/ind_bank_003.py; tenants use harness-pack readiness-evaluate <pack_root> --input <dir> (ruled OQ-C1 (a), MON-R03-C1-RULE) (stated deviation from MON-R03-EVAL-PLACED, ruled OQ-1 (c): the dispatcher admits only PACK)."
  - "Consumes no harness-onion provider, service or module catalog: the packet reads none of them (its integration profiles IP16-IP18 and the evaluator fixture's product-catalogue.json are pack-local synthetic data), and any later read of their banking-era bytes goes only through scripts/sector_catalog.py's effective_bytes(path) or effective_catalog(path), never the raw catalog files (MET-SECTOR-002, SECTOR-D1)."
deliverables:
  - "Bump packs/banking/pack.yaml to 0.3.0 and add the four governance/integration questionnaires, the governance rule, the seven controls records and the 29 governance fixtures as resources."
  - "Add the seven controls record sets (outcome states in controls/outcome-states.json), the governance rule as a plain PackRule, and 29 labelled vectors (CONTRACT.md sections 4 and 5)."
  - "Add ci/handlers/ind_bank_003.py and ci/targets/ind-bank-003.json (governance-integrations and readiness-evaluate, PACK const banking) with two inventory lines in tests/framework/test_dispatch.py."
  - "Add the readiness evaluator (src/planeon_industry_packs/readiness.py; in cli.py one add_parser and one branch before the package fall-through), failing closed on links, non-regular files and escaping paths, with its synthetic input and expected verdict under tests/fixtures/banking/evaluator/ (CONTRACT.md section 6)."
  - "Apply the predecessor-module edits of CONTRACT.md section 3, and add the governance, evaluator and carried-IB2 tests (IB2-R1-1, IB2-R1-3, IB2-R1-4)."
  - "Add docs/banking/governance.md with the HG-D1 deployer-duty map (candidates with named gaps) and the evaluator's two entry forms."
excluded:
  - "Every path not in allowedPaths: packs/white-goods/**, common/**, the Makefile, ci/run_make_target.py, ci/run_packet_argv.py and the other transport files, ci/zero_bill_scan.py, .github/**, every other ci/handlers/** and ci/targets/** file, every other src/** and tests/** file, schemas/**, pyproject.toml, uv.lock, the ontology and SourceInventory; new dependencies, network, warm sources, prefetch, verifier, bundle or host configuration; CONF-BANK-001 held-out answers."
