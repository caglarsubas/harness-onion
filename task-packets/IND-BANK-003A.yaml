rollback: "Revert the commit set: banking returns to 0.2.0 with its prior handler pins, the 003 handler, descriptor, controls, questionnaires, rule, fixtures, docs, evaluator and tests are removed, and test_dispatch.py loses its two lines; no data, schema, dependency or framework state is involved."
