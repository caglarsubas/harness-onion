contracts: ["Consumes docs/alpha-2/LIVE_BACKEND_READINESS.md and architecture/live-backend-roadmap.json from the exact merged MET-LIVE-001 authority, the existing trusted live-runner contract and unchanged CONF-LINUX-001/CON-007 wire contracts. Pin exact merged predecessor SHA and complete source inventory before edits.","Source-only enablement before the native gate is limited to these six packets. No installation or live execution occurs in a coding run. Missing authority, supported OS backend or native capacity fails closed; offline fakes remain UNIT_VERIFICATION_ONLY with nativeAcceptance=false.","Preserve all 120 original test identities across tests/meta, tests/parity, tests/alpha1, tests/fixes/runner_boundary and tests/platform/linux_baseline. Add flat tests/live_backend discovery, run all six roots on every packet and prove no module/test omission, skip, xfail, deselection or test-only runtime shortcut.","Python 3.12.14 standard library and existing pinned conformance crypto/canonical helpers only; no new dependency, public API/signature schema/role, Makefile/dispatcher, PORTING ledger, warm-source, workflow or toolchain change. Kernel primitives and fixed operator prerequisites are preinstalled, never downloaded."]
deliverables: ["Implement only the existing signed CAMPAIGN_PROXY endpoint mode for this release. Pin origin/address/TLS identity and all response sizes/deadlines to the signed endpoint; never resolve dynamic URLs, redirect, discover Pod IPs or accept proxy environment settings. Fixed stdlib transport runs only after the protected boundary, using short-lived tenant-local credential references under original custody rules.","Implement the bounded server-side service in the same repository but separate deployment/custody from the campaign. Independently verify capacity/signatures, namespace and nonce, pin quota/admission policy digests and resource identities, and maintain atomic reservations across concurrent requests. Client approval alone never authorizes a mutation.","Accept only the ten fixed operation paths from build_probe_request and validate binding through the authenticated protected session. Reject request-supplied argv, URL, GVK, namespace, artifact digest or credential scope. Server adapters use only preinstalled fixed probes and approved existing capacity; no generic Kubernetes or Docker/containerd socket exposure to the campaign.","Constrain mutations to run-labelled resources and exact signed manifests inside existing namespace/quota; require immutable server-enforced admission and scoped RBAC. Forbid new capacity/PVC provisioning, load balancers, autoscaling, cluster-scoped/unknown resources and cloud/billing APIs. Preserve tenant data; failed cleanup is an explicit remaining resource receipt, not permission to broaden deletion."]
excluded: ["No administrator installation, provisioning, kernel/cluster policy modification on this workstation, live network/probe argv, emulation-based native PASS, paid API or third-party key, mutable artifact, warm-source access, external telemetry or source-to-runtime evidence promotion.","No edits to predecessor tests, crypto.py, canonical.py, models.py, schema.py, registry.py, campaign.py, live.py, cli.py, linux_readiness.py, existing schemas, ci/build_live_launcher.py, Makefile, dispatcher, toolchain, workflow or PORTING.yaml. New tests independently preserve old source guards; no relaxing immutable baseline hashes."]
