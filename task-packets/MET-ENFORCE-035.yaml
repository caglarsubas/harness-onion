contracts: ["Accepted base is main 422bd18a9b6974f5200120185d940d92288634b2, tree b1b1d68649dda8891c62633127bda372208ffb7f, holding 247 immutable packets including MET-ENFORCE-034. Add MET-ENFORCE-035 only, as packet 248. Preserve all 247 predecessor YAML files, every contract snapshot, review record and status record (HS43, seccomp v4, matrices v5 and v6 and every W01 input and catalog file HS53 reads are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The owner's decisions Q-SOL-2/4 and SOL-SYSTEMD-CLEANS and the lane monitor's owner-delegated Q-SOL-1/3/5, F-SOL-1, Q-SOL-7 (a) and Q-MX6-R6 (recorded verbatim in HS53's record; v5's policy quotes all but Q-MX6-R6, a matrix v6 decision), with the review decisions SOL2-6-CONFIRM, SOL4-7-ACCEPT and SOL6-1 (a) (HS53's status). Add architecture/host-interface-amendment-hs53/ (the amendment record, the effective text, README, review brief, the eight independent review records with the earlier rounds' subject copies, the joint source index and the status ADOPTED_AMENDMENT, which carries SOL6-2, SOL6-3, SOL6-5, SOL7-2, SOL7-3 and SOL8-1..5 and records matrix v6's init_t grant as re-checked at its merge 422bd18), scripts/host_interface_amendment_v3.py, architecture/seccomp-allowlists-v5/ (README, review brief, syscall table, allowlists, vectors and the status ADOPTED_DATA_CONTRACT naming the joint review) and scripts/seccomp_allowlists_v5.py. The two contracts were reviewed together; round 8 passed on c97a2df2.", "The lane monitor's LOCAL-PATHS decision (b): in the published review records of rounds 1 to 7, the reviewers' scratch prefix (the operator host's temporary-directory prefix, 13 bytes, hex 2f707269766174652f746d702f) becomes \"<scratch>/\", once per record, with no semantic change, as its own commit after the review; HS53's status lists each record's before and after digests and the count, and the verbatim records stay operator-side.", "Add one 248-packet current catalog with an exact 248-to-247 inverse before the accepted 247-to-246 MET-ENFORCE-034 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes and refuses a path outside its era before reading it and an absolute local path in any non-frozen era file. It binds both contracts, both status records, the joint index, the eight review records, the round copies, both models and their inputs (HS43, the W01 inputs and catalog files HS53 reads, seccomp v4, matrix v5 and matrix v6 with its evaluator) by digest; checks the eight rounds against their records, every earlier finding as closed or carried, and the records' redaction; executes HS53's model and restates its record; replays all 3,069 v5 decisions through the reference decision and the compiled program, the 365 worker-stack checks, the 29 mutations and v4's 2,971 decisions (exactly six OBSERVER flips); restates OBSERVER's listener rules and accept4 outcomes; and re-checks matrix v6's init_t grant with matrix v6's own evaluator.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-034 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_seccomp_observer_listener.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 248-packet membership and count updates; layer tests and the MET-ENFORCE-034 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-035 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
