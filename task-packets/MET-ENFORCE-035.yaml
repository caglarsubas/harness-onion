branch: "codex/met-enforce-035-seccomp-observer-listener"
objective: "Publish, as the 248th packet on accepted main 422bd18, roadmap item SECCOMP-OBSERVER-LISTENER packet 1: W01 amendment HS53 on top of the byte-identical HS43 text and the seccomp allowlists v5, the successor of the byte-identical v4, reviewed together. OBSERVER gets the I01 AF_UNIX SOCK_SEQPACKET listener (bind, listen, accept4 with three flag values); the TCP-listen boundary is SELinux's; the socket's directory and mode come from the units; the observer binds after its seal and systemd clears only its stale path, under matrix v6's init_t grant. DATA_CHECK_ONLY: no filter is installed; packet 2 republishes OBSERVER's compiled programs and the edge record."
