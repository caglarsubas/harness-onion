deliverables: ["Implement the protected pre-boundary supervisor candidate with direct Linux syscall boundaries via fixed ctypes declarations: user/mount/PID/network namespaces, cgroup-v2 process custody, no_new_privs, capability drop, read-only/no-follow trust and executable custody, and enforced outbound policy. The operator must separately grant exact native prerequisites; absence yields NOT_RUN_ENV_UNAVAILABLE, never a subprocess fallback outside isolation.","Bind the inherited local channel to supervisor UID/custody, kernel peer credentials, child PID/start identity/cgroup, nonce, packet/source/command digest, endpoint/capacity scope and expiry. Validate before accepting requests; caller-owned FD, socket path, process flag, environment variable or memfd alone is never proof.","Implement root-custodied atomic reserve-before-execute replay storage using existing nonce semantics, bounded durable journal, exclusive locking, fsync and no-follow ancestry. States are RESERVED then RUNNING then terminal; expired/crashed sessions remain consumed. Kill/reap the whole child process tree at expiry/cancellation/crash, including double-fork attempts.","Expose injectable syscall/storage adapters for offline negative tests only. The production constructor binds fixed native implementations and has no caller-selected backend/module/command. Do not execute native isolation or change host policies during coding/CI."]
