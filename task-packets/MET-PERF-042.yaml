contracts: ["Accepted base is main 29c84b36dad2f6f9822b71cd959064f0202d9868, tree c324d86adf419da9bdb247bf26bb552b9528d869, holding 254 immutable packets including MET-ENFORCE-039. Add MET-PERF-042 only, as packet 255. Preserve all 254 predecessor YAML files, every contract snapshot, review record and status record, existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decision PA-D9 (D9a) and the CHAIN-COMPACTION-001 plan, revision 11, with the owner's answers of 2026-10-21 recorded verbatim in architecture/chain-compaction/decisions.md: Q-CC-1 (b) (no loss of a required check: E per layer, G once plus the identity rule, P by the head's fan-in plus adjacent pairs plus the identity rule, an identical-input twin for every dropped call), Q-CC-2 (a), Q-CC-3 (b), Q-CC-IDENTITY (a), Q-CC-RESIDUAL (a), Q-CC-6 (a), Q-CC-B4 (a), Q-CC-F1 (a), Q-CC-F2 (a) and F3. C2: in each of the 63 bridged scaffold test files (slots 192-254) only two tests change and every test function name stays: test_newest_authority_is_freshly_checked_on_every_route keeps its 8 own routes and the adjacent predecessor's route (its guarded setup lines and route table unchanged; 2,079 route nodes leave the suite, each with a twin of identical input in the head's fan-in), and test_every_predecessor_payload_is_checked_without_a_verdict_cache keeps one mutation and checks the layer's expected-payload table against digests the test computes with its own code from the disk YAML. The head's test keeps the full fan-in (8 own and 66 predecessor routes, every catalog walk and round trip, the full payload loop). C1: tests/conftest.py shares one YAML parse per packet YAML per test module on the test module's own safe_load binding (exact argument as the key, a deep copy per call, a refusal never memoised, never in a never-shared test or a test the static rule finds patching safe_load, ROOT or the tree), and its never-shared set gains the two identity tests.", "Add one 255-packet current catalog with an exact 255-to-254 inverse before the accepted 254-to-253 MET-ENFORCE-039 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes and reviewed_tree, refuses a path outside its era before reading it and binds every era file by digest. It checks the records under architecture/chain-compaction/ (README, M1's cost report, the fact map, the identity rule, the decisions, M2's ab.json and M3's seeded-faults.json; the closed directory, no absolute local path); then, by the reference model scripts/chain_identity.py run from its pinned bytes, the identity rule over the era's 67 chain validators (the walk, G1, G2, D with historical_bytes in two exact classes, the pre-scaffold functions, the step rule against the bump and bridge vocabularies, the binding rule and the head's allow-list), the conftest's never-shared identity tests, the C2 shapes and the fact map recomputed from the era's test files. Its test checks the identity rule over the live tree and the runtime binding check on the imported modules on every verify, refuses every identity-only fault as source text (classes I1 to I9, never imported or executed), and gives every check a failing case.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-039 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_chain_compaction.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 255-packet membership and count updates; layer tests and the MET-ENFORCE-039 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-PERF-042 member; C2's two test changes in each of the 63 bridged scaffold test files; tests/conftest.py's C1 and never-shared additions; the one inherited edit outside C2, tests/test_chain_depth_headroom.py::test_the_never_shared_names_are_pinned_by_name asserting the live never-shared set equals slot 241's set plus the two identity tests (owner Q-CC-F1 (a)); and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
