contracts: ["Conditional successor declaration. No dispatch before MET-PERF-012 LOCAL, required CI, protected merge and independent LOCAL exact-main all pass.","Accepted META abb67fde635dd45c8c3f6fbb3576a0a391300c91; accepted product 092fcf475c6f3ebd455e3c354cddb7664ea1f900; 135 exact tracked files/1277 identities, including1107 backend identities. No product draft is the baseline.","No product branch/PR13/14/15/18 mutation, budget reset, root/key/admin/power change, source reuse, dependency/download, provider/API or billing change.","READ_ONLY_MEASUREMENT. allowedPaths is only a subject anchor; no product writes or branch. Fixed baseline092fcf4 and exact reviewed candidate must be signed and reserved in one immutable comparison manifest before ordinal1.","Run only B,C,C,B, four total executions, zero retries. No hidden warmups, filters, ad hoc methods, observer/profile hook, fixture substitution or source overlay. Partial sets are INCONCLUSIVE, never pooled or promoted.","Same exact literal driver, ten frozen cases,64 iterations/case/sample,1 warmup plus7 retained measured samples. Fixture/workload/program/function/toolchain digests must match before every run.","Within-run wall and threadCPU relative MAD <=0.15; baseline medians drift <=1.20; each sample wall >=0.05s; candidate aggregate wall median/baseline <=0.90 and threadCPU <=0.85. Exact independent retained-output audit, no host interruption, no source drift, no missing-as-zero.","Trusted isolation/deadlines unchanged. No CI, merge, rollout, native or tenant certification from this packet. No claim of service-wide or PR18 improvement."]
