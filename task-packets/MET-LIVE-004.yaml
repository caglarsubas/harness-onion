contracts: ["Accepted base is main 0ffa7db076a92e8bb341db4867557b894ecb5b27, tree 3fc278a61d21303384dd7f640527a92ace867e99, holding 262 immutable packets including MET-LIVE-003. Add MET-LIVE-004 only, as packet 263. Preserve all 262 predecessor YAML files, every contract snapshot, review record and status record (every review record and oracle test that predates review record v2 stays on the frozen list with its digest), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions (via the lane monitor): Q-PK-3 \"Never, pinned (Recommended)\" (profile v2 gains the echo annotations and bounded emptyDir volumes; an admission successor requires Never, with AlwaysPullImages pinned off; the sealed bytes change only at a maintenance boot), Q-PK-4 \"Upstream v1.37.1 (Recommended)\", and \"As steps (Recommended)\" (the I01 successor, edge v11 and the R10 re-vendor are recorded as carried steps). The lane monitor's owner-delegated rulings (2026-10-23 to 2026-10-24): Q-LPK1-1 to Q-LPK1-12 and Q-LPK1-D1 to Q-LPK1-D5 (one combined contract beside the old versions, the in-tree MET-LIVE-004/contract series starting at round 1, the design rounds cited in source-index.json by sha256, MON-LPK1-DR3-3); MON-LPK1-ADOPT-REV4 (design revision 4 adopted); MON-LPK1-B3 (B-L1-3: chain validators and tests in the pin lists are pinned modulo the chain-bump vocabulary, every other pinned file byte-identical); MON-LPK1-SCHEMA-RUN (schema validation under the pinned G-JSONSCHEMA bundle's jsonschema 4.24.0); MON-LPK1-C3-ADOPT (candidate c3 adopted after CONTRACT rounds 1 and 2), with Q-LPK1-ADOPT-STATUS and Q-LPK1-SRCIDX; the oracle rulings MON-LPK1-ORACLE-V4-KEEP, MON-LPK1-ORACLE-P2-KEEP and MON-LPK1-ORACLE-R2; MON-LPK1-B6-P1 (B-L1-4: the authority stays the fixed eight-member record and the pins and evolution-surface classes go in architecture/linux-probe-kit-admission/mechanics-pins.json, bound by digest in the layer and reviewed as data); MON-LPK1-A6-DIFFCHECK (the one-deeper hand edit's test-diff evidence); the disclosed slips MON-LPK1-C1R2-SLIPS, MON-LPK1-CR1-SLIPS, MON-LPK1-CR2-SLIPS and MON-LPK1-MECH-SLIPS (KEEP); and the mechanics GO MON-LPK1-MECH-GO on this base.", "Add architecture/admission-semantics-v4/ (README.md, allowlists.json, vectors.json with 141 cases, status.json and the sealed A2 file admission-manifests/planeon-a2.json, 8322 bytes, SHA-256 92c21612, directory hash sha256:9b1ddc10...ca60) with the standard-library model scripts/admission_semantics_v4.py: every image pinned by digest and pulled Never (MC33, A2-POD-PULL-POLICY), every emptyDir bounded (MC42, A2-POD-EMPTYDIR), AlwaysPullImages pinned off as claim evidence, and a v3 claim refused. Add architecture/proxy-profile-v2/ (README.md, the closed profile.schema.json, vectors.json with 67 cases and status.json) with the standard-library model scripts/proxy_profile_v2.py: profile v2 is a successor beside profile v1, which stays byte-identical and remains the wire's profile until the carried wire steps land. Both status.json files record ADOPTED_DATA_CONTRACT, candidate c3 and CONTRACT rounds 1 and 2. Nothing is installed, compiled or contacted.", "Publish the MET-LIVE-004/contract series in tree (Q-LPK1-D5 (a)): architecture/linux-probe-kit-admission/review-round1.json and review-round2.json (SHA-256 3a3d8576 and 3f0fc266, CHANGES_REQUIRED then PASS_FOR_ADOPTION), bound by review-identity-round1.json and review-identity-round2.json (a99419fb and c3ffba5f), with source-index.json (the in-tree rounds and the TOOLS design rounds 1 to 4 cited by sha256, no local path). The two D5a oracle tests tests/test_admission_semantics_v4_oracle.py and tests/test_proxy_profile_v2_oracle.py, written from the adopted READMEs alone, are bound by oracle-identity-admission-v4.json and oracle-identity-profile-v2.json (planeon.oracle-identity/v1, candidateCommit 4ff0a830) with ruling KEEP by the lane monitor. No registry change: the review-record brief registry already holds MET-LIVE-004/packet and MET-LIVE-004/contract (registered by 261), and the generic briefs are unchanged. No gate path: by the evolution surface record (version 3, 31 exact or prefix gate entries) every new path is CONTRACT_AND_SOURCE, the two rounds REVIEW_RECORD and the two oracle tests ORACLE_TESTS, so the packet's approvers by the record are the lane monitor and the owner (data), not the owner alone.", "Every predecessor stays byte-identical (design revision 4 section 7, B-L1-3, B-L1-4): admission v3 and v2, profile v1 (PPS, PPV, baseline.json) and its amendment PCA, I01, the W03 plans, the edge records v4 to v10, PCR, the identity rule and the 46 profile-pinning files the pruned grep finds at this base. architecture/linux-probe-kit-admission/mechanics-pins.json (planeon.internal.linux-probe-kit-admission-pins/v1) records the 77 pins with their SHA-256 at this base (70 byte-identical; 7 chain validators and tests, VPC's membership line among them, governed by the step rule) and the evolution-surface class of every planned path; the new layer re-checks both tables at its era.", "Add one 263-packet current catalog with an exact 263-to-262 inverse before the accepted 262-to-261 MET-LIVE-003 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes and reviewed_mode, lists no directory, refuses a path outside its era before reading it and binds every era file by digest (the 21 files this packet adds, the 70 byte-identical pins, LPK-0's record, the registry and the two generic briefs, and the evolution surface record and its model). It checks the freeze; the files added (exactly its own, each once, mode 100644, no absolute local path); the adoption (both status records, each round's record and identity, the source index and both oracle identities); the models over their vectors, each executed from this era's verified bytes (v4's 141 cases, v3's 114 through the frozen v3 model, the sealed A2 file and its directory hash, and profile v2's 67 cases with B-L1-1's P01 text and the cross-contract group through both admission models); the pins and classes; the registry (261's merged file, unchanged); and the derived gate check. Every refusal is a pure check with a failing case on plain data; the layer's test also cross-checks the profile v2 schema's verdict with jsonschema against the model's P00.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 262's layer except for the bridge vocabulary (vi) to (x), its check_freeze keeping its literal \"tests/\" through the bridge (MON-261-BRIDGEFIX); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 74 predecessor routes, every catalog walk and round trip, the full payload loop); 262's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-LIVE-003 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_linux_probe_kit_admission.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too, over the new rounds, oracle identities and oracle tests. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 263-packet membership and count updates (VPC's membership line among them); layer tests and the MET-LIVE-003 layer's checks adjusted solely for the successor bridge; C2's two test changes in 262's test tests/test_linux_probe_interface.py; the one-deeper successor hand edit of 261's test tests/test_linux_probe_kit_gate.py (as 262 made for 260's; MON-LPK1-A6-DIFFCHECK); the count lines of the tests 262 hand-edited, tests/test_probe_kit_scope.py, tests/test_review_record.py, tests/test_policy_observation_digests.py, tests/test_evolution_surface.py and tests/test_sector_catalog.py, which the cascade skips; catalog-membership filters ignoring only the added MET-LIVE-004 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["Workload profile v2 and admission semantics v4 as one combined contract (candidate c3, adopted after two in-tree CONTRACT rounds): both directories, both models, the sealed v4 A2 file, the published rounds with their identities, the source index, and the two D5a oracle tests with their oracle identities; the mechanics pins record.", "A fresh 263-to-262 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier."]
excluded: ["Editing any earlier contract or record (admission v3 and v2, profile v1 and its amendment, I01, the plans, the edge records, LPK-0's record and every other pinned file), the review-record brief registry and the generic briefs, the evolution surface record, the frozen identity rule, docs/DEVELOPMENT_STATUS.md, the harness documents or any R10 or R12 file; changing any byte of the adopted contract files (both directories and both models), the published rounds and their identities, the source index, the D5a oracle tests tests/test_admission_semantics_v4_oracle.py and tests/test_proxy_profile_v2_oracle.py or their oracle identities, which are adopted bytes; installing the sealed A2 file or any admission configuration; the probe kit itself (any linux-probe-kit/ file); the carried wire and sealed-bytes steps; installed launcher, trust or root-policy bytes, verifier code or keys, acceptance argv changes, timeout changes, ci/ changes, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.", "Any network access during validation."]
