contracts: ["Accepted base is main 887cbe7a005f6c7c813623dce5072e1c75f1fe58, tree e07c13d0130bf5caeb276cdd32841cebd01fd1a1, holding 246 immutable packets including MET-ENFORCE-033. Add MET-ENFORCE-034 only, as packet 247. Preserve all 246 predecessor YAML files, every contract snapshot, review record and status record (matrix v5 and the earlier matrix records, HS43 and native-profile v4 are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "The owner's decisions Q-MX6-2/3/4/7, \"Keep, T04 uses v5\" and SOL-SYSTEMD-CLEANS and the lane monitor's owner-delegated Q-MX6-1/5/6/8, Q-MX6D-1/2, Q-MX6-R6 (b) and MX6-R7-ACCEPT (2026-10-16/17; recorded verbatim in the status record: MATRIX-V6-DOSSIER, Q-MX6-OWNER, Q-MX6-MONITOR, MX6-PROVENANCE, Q-MX6-KEEP-T04-V5, Q-MX6D-MONITOR, MX6-LOCK-AND-WORKTREE, MX6-R1-FIXES-MONITOR, SOL-SYSTEMD-CLEANS, Q-MX6-R6, MX6-R7-ACCEPT). Add architecture/selinux-matrix-v4/ (README, review brief, matrix, vectors, the seven independent review records with the subject copies of the six earlier rounds, the source index and the status record ADOPTED_DATA_CONTRACT, which carries XV5-1, XV6-3, XV6-6 and XV7-1..4) and the evaluator scripts/selinux_matrix_v4.py. The contract was reviewed against native-profile v4's candidate 5a3e6820; at adoption its README and schema at the merge 887cbe7 are byte-equal to that candidate, which the status records as the coupling re-check.", "Add one 247-packet current catalog with an exact 247-to-246 inverse before the accepted 246-to-245 MET-ENFORCE-033 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes and refuses a path outside its era before reading it. It binds the contract, the status, the source index, the seven review records, the round copies, the evaluator, matrix v5, HS43 and the merged native-profile v4 by digest before parsing; checks the seven rounds against their records and every earlier finding as closed or carried; restates v6 as v5 plus exactly its changes (the types with systemd's narrowed cleanup on the four listener sockets, the /proc narrowing by rule, the closures, the filesystem tables and the new assertions); re-checks the coupling with the merged native-profile v4 (its label constants, its sixteen entrypoint labels, the assertions and observer /proc it cites); executes the evaluator from this era's bytes; and replays all 4,600 access and 116 mutation checks in the validator.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-033 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_selinux_matrix_v4.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 247-packet membership and count updates; layer tests and the MET-ENFORCE-033 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-034 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The SELinux matrix v6: README, review brief, matrix, vectors, the evaluator, seven review records with the earlier rounds' subject copies, the source index and the status record.", "A fresh 247-to-246 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and owner-guide state; required verify from the owner-operated verifier."]
