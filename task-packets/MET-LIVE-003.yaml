contracts: ["Accepted base is main b8db30e5dfc4c820b70553cd1439359d73f4573a, tree b4d461536d5e7289cb863a1c9097162d46b05b9e, holding 261 immutable packets including MET-GOV-003. Add MET-LIVE-003 only, as packet 262. Preserve all 261 predecessor YAML files, every contract snapshot, review record and status record (every review record and oracle test that predates review record v2 stays on the frozen list with its digest), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions (via the lane monitor, quoted in architecture/linux-probe-interface/binding.json's ownerDecisions): Q-PK-6 \"Neutral contract (Recommended)\" (a neutral extractor builds the interface contract from R12; it is reviewed, then vendored back by R12, and the kit reads only the contract) and, on R12's acceptance rules, \"Keep them in R12 (Recommended)\" (the status and count thresholds stay in R12, and the contract stays form-only). The lane monitor's owner-delegated rulings (2026-10-22 to 2026-10-24): its own small data packet under architecture/linux-probe-interface/ with one light review; R-L1-A and MON-LIVE003-R1-PATH (the light review's findings applied as candidate c2 with no second review; the reviewer's command-line home-path slip kept); the adoptions MON-LIVE003-ADOPT-C2 to MON-LIVE003-ADOPT-C6 (c3 and c5 README errata, c4 the slot re-sequence to 262 with LPK-0 c6's record digest, c6 the review-history sentence); the 260 mechanics plan ruling's item 2 (the review history is published as review-history-<kind>-r<n>.json and -brief.md, not as review-round records, with no merge authority) and item 3 (the oracle identity's KEEP ref MON-LIVE003-ORACLE-KEEP); and the mechanics GO on this base (2026-10-24, with 261's merge record).", "Add architecture/linux-probe-interface/: the four handoff files v1/MANIFEST.json, v1/README.md, v1/probe-interface.json and v1/probe-interface.schema.json, byte-identical to the monitor-verified handoff (SHA-256 67cedd0c, 04977361, 8c630b41 and 2ae672a9), mode 100644, the unit R12 vendors back; binding.json, the closed record planeon.internal.linux-probe-interface-binding/v1 (the four digests, the MANIFEST's source and three review digests with the last verdict PASS_FOR_HANDOFF, the placeholder binding, the two owner decisions and four non-claims); README.md; vectors.json (one positive, 28 negatives and 15 validator vectors); replay.py (no repository read); status.json ADOPTED; oracle-identity.json; and the review history of its one light round as review-history-light-r1.json, the reviewer's record byte for byte, with its brief redacted of local paths as review-history-light-r1-brief.md, bound by its reviewed and published SHA-256 and its two substitutions (not review-round records, with no merge authority). Add the standard-library reference model scripts/linux_probe_interface.py. The adopted bytes are candidate c6's. The source commit is recorded and never resolved. The contract is form-only: a kit built from it shows the interface form, not acceptance; R12's acceptance rules stay in R12, and R12's own files stay authoritative until R12 vendors v1/ back in its own packet. A later revision of the interface is a new v2/ with its own packet.", "The placeholder binding (A8's forward pin): binding.json's placeholderBinding binds LPK-0's NEUTRAL_INTERFACE_CONTRACT placeholder to MET-LIVE-003 and to v1/probe-interface.json's SHA-256, and names LPK-0's merged architecture/probe-kit-scope/amendment.json by its SHA-256 at this base (3de2d73e), whose effectivePredecessors.placeholders holds the placeholder; status.json's predecessorPin records the same. LPK-0's record and README are unchanged; its R12_SUCCESSOR and LINUX-PROBE-KIT-001 rows wait on this packet.", "The D5a oracle test tests/test_linux_probe_interface_oracle.py (86 tests), written from the README alone by an oracle agent outside the candidate, is bound by its oracle identity architecture/linux-probe-interface/oracle-identity.json (planeon.oracle-identity/v1, the file's SHA-256 e706dab9, candidateCommit f037014c, this branch's oracle commit) with ruling KEEP by the lane monitor (MON-LIVE003-ORACLE-KEEP; disclosed interruptions: a 429 stop and resume, the slot re-derivation, and the parser-marker resume after MON-LIVE003-ADOPT-C5). No registry change: the review-record brief registry already holds MET-LIVE-003/packet (PACKET, registered by 260), and this packet publishes no v2 contract rounds, so it has no CONTRACT series; the generic briefs are unchanged. No gate path: by the evolution surface record (version 3, 31 exact or prefix gate entries) every new path is CONTRACT_AND_SOURCE and the oracle test ORACLE_TESTS, so the packet's approvers by the record are the lane monitor and the owner (data), not the owner alone (gate material).", "Add one 262-packet current catalog with an exact 262-to-261 inverse before the accepted 261-to-260 MET-GOV-003 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes and reviewed_mode, lists no directory, refuses a path outside its era before reading it and binds every era file by digest (the 14 files this packet adds, LPK-0's record, the registry and the generic PACKET brief, and the evolution surface record and its model). It checks the freeze (this packet edits no existing file but chain validators, tests and the three living catalogs); the files added (exactly its own, each once, mode 100644, no absolute local path); the adoption (the status record's closed shape and values, the nine adopted files as the adopted subject's bytes, the adoptions c2 to c6 with their check digests, the light review bound to its published record and brief, the brief redaction as stated, and the oracle identity with ruling KEEP); the contract (the four v1/ files as the handoff bytes the binding's files rows state; the binding's source and reviews equal to the MANIFEST's, the last verdict PASS_FOR_HANDOFF; the placeholder binding; the reference model, executed from this era's verified bytes, returning no refusal for the binding; and the vectors' replay as replay.py replays them, with every model call through the model's check: one positive, 28 negatives and 15 validator vectors, no mismatch); the registry (261's merged file, unchanged, with exactly this packet's PACKET series); and the derived gate check (no gate path among the packet's changed files, by the record's 31 exact or prefix gate entries lower-cased, which equals case-folding on this era's all-ASCII gate entries and paths). Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 261's layer except for the bridge vocabulary (vi) to (x), its check_freeze keeping its literal \"tests/\" through the bridge (MON-261-BRIDGEFIX); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 73 predecessor routes, every catalog walk and round trip, the full payload loop); 261's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-GOV-003 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_linux_probe_interface.py calls its validate() on the current tree, and the in-suite pre-check tests/test_review_records_in_tree.py runs check_tree there too, over the new oracle identity and oracle test. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 262-packet membership and count updates; layer tests and the MET-GOV-003 layer's checks adjusted solely for the successor bridge; C2's two test changes in 261's test tests/test_linux_probe_kit_gate.py; the one-deeper successor hand edit of 260's test tests/test_probe_kit_scope.py (as 261 made for 259's); the count lines of the tests 261 hand-edited, tests/test_review_record.py, tests/test_policy_observation_digests.py, tests/test_evolution_surface.py and tests/test_sector_catalog.py, which the cascade skips; catalog-membership filters ignoring only the added MET-LIVE-003 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The neutral Linux probe interface contract under architecture/linux-probe-interface/ (candidate c6, adopted after one light review): the four v1/ handoff files byte-identical, the binding record, README, vectors and replay script, with its standard-library reference model; status.json, the redacted light-review history and the D5a oracle test with its oracle identity.", "A fresh 262-to-261 inverse authority with canonical byte-minimal hunks, a layer validator and test, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier."]
excluded: ["Editing any earlier contract or record (LPK-0's amendment.json and README among them), the review-record brief registry and the generic briefs, the evolution surface record, the frozen identity rule, docs/DEVELOPMENT_STATUS.md, the harness documents or any R10 or R12 file; changing any byte of the adopted contract files (candidate c6's nine files and status.json), the review history, the D5a oracle test tests/test_linux_probe_interface_oracle.py or its identity architecture/linux-probe-interface/oracle-identity.json, which are adopted bytes; resolving the source commit; a v2/ interface revision; a CONTRACT registry series; the probe kit itself (any linux-probe-kit/ file); installed launcher, trust or root-policy bytes, verifier code or keys, acceptance argv changes, timeout changes, ci/ changes, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.", "Any network access during validation."]
