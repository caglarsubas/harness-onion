expectedEvidence: ["Exactly five existing modified paths; 122 original files byte-identical; all 279 original methods and assertions plus new custody regressions collected, zero skips/xfails/deselection. Same complete stage-two 127-path set and all original later stage counts.","Native initialization/order/handoff/cleanup algorithms covered with explicit unit adapters, no kernel/live execution or test-only production bypass. Bounded source-delta proof preserves unaffected source regions and historical test/document prefixes.","Separate source/local/required CI/merge/local exact-main; no artifact, deployment, native AMD64/ARM64, runtime, assurance or tenant-acceptance promotion. No new administrator authentication or billing."]
