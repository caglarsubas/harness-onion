contracts: ["Consume exact merged MET-REPAIR-011 and its inert baseline/region oracle before edits. Begin from conformance main 7205075d2f234b622dd61072803b754f1dffeb79; no warm source or different product checkout.","Only the two explicitly scoped custody/supervisor modules may alter existing source regions. Existing test_linux_boundary.py, test_supervisor.py and linux-boundary.md must remain exact byte prefixes; append new test classes/helpers and the correction report. All 122 other files, original assertions, 279 test IDs, old 120-file baseline fence and source guards remain unchanged.","Preserve all six later packet YAML/digests, paths and eight-command inventories. This is an in-place stage-two correction: 127 files, no new stage or filename. CONF-LIVE-003 must pin its actual corrected predecessor and retain original-versus-corrected evidence.","Retained bytes or a descriptor alone are not authority. Only fixed installed custody, three independent valid roles, verified scope, durable reservation and active kernel-bound session may hand verified inputs to the proxy. No new public schema, signature purpose, backend selector, path option or live execution."]
deliverables: ["Implement retained no-follow file and ancestor handles plus verified immutable bytes for installed identity, trust, capacity, release, packet/campaign/bundle and every signed kit member required downstream. Establish first-read custody once and retain it through the owning session; do not reconstruct custody by reopening a validated path.","Keep read_owned and read_owned_kit legacy return types and call behavior for existing consumers. Native custody capture/handoff is internal and non-authorizing unless the installed factory and complete owned handle registry verify it. Legacy cached digest or mocked bytes cannot supply a production custody lease.","Construct InstalledContext only in NativeSupervisor, bind it to its owner/process/active session and hand off verified release/profile/CA/observation-binding bytes with retained identities. Reuse the verified rootfs directory handle; no second rootfs path lookup. No caller context, callback, FD, token or verified flag is admitted.","Recheck file and named inode, every parent-chain identity/owner/mode, content-change metadata, signer validity/revocation and wall/monotonic deadlines before operations and after blocking I/O. Detect changed/replaced trust and enrollment without refresh or reopening. Existing ambient-FD rejection remains: only internally owned verified custody FDs may be recognized, never a caller allowlist.","Close and invalidate retained custody on every initialization failure, reservation/boundary failure, cancel, expiry, terminal operation and close; continue cleanup after one close error without resurrecting nonce or reporting successful cleanup. Prevent leaks, double-close/recycled-FD use, cross-owner/fork/subclass/serialized handle reuse; child receives no authority file path/FD/bytes.","Preserve every predecessor test byte and append flat independently discovered regressions for the full native factory-to-fixed-proxy handoff using explicit OS-mocked unit fixtures. Test no reopening, source substitution, each stale trust/ancestor change, ambient descriptor injection, rootfs replacement, exhaustion and all cleanup paths. Existing unit adapters never become native execution.","Append a canonical SOURCE_DELTA_ONLY proof/report to docs/live-backend/linux-boundary.md binding MET-REPAIR-011, this packet digest, exact old/new source hashes, allowed regions, original 279 IDs and the current inventory. Reuse the pinned data-only oracle in appended tests; no snapshot compile/import/exec, relaxed hashes, skipped tests or modified existing assertions.","Run exactly all eight declared commands under one signed offline process tree, zero skipped/xfail/deselected product tests, then required localhost PR CI and independent local exact-main. Hand off the corrected commit/tree/inventory/test counts to CONF-LIVE-003; source success grants no live installation or native acceptance."]
excluded: ["All other product files including public schemas, crypto/canonical/live authority helpers, replay store, Makefile/dispatcher, baseline fixtures, workflow/toolchain/PORTING and every predecessor test body; warm sources; new dependencies/downloads; live/native probes, networking, credentials or OS policy installation during coding/CI; client/server transport or observer implementation; unrelated isolation redesign, timing fixes, tenant data or trust/replay history changes."]
