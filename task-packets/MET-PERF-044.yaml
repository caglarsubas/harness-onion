contracts: ["Accepted base is main 8f5cc7e9678d8cd13f6dda3ae5d205eada9f55e8, tree d9a546ac5ea771c1f8aa546c2e313d017e1b63b2, holding 272 immutable packets including MET-ADOPT-006. Add MET-PERF-044 only, as packet 273. Preserve all 272 predecessor YAML files, every contract snapshot, review record and status record, the catalogs, the chain-compaction records (architecture/chain-compaction/, the identity rule among them) and the v1 identity model scripts/chain_identity.py byte for byte.", "The packet's own files: the four records under architecture/chain-product-packets/ (rule.json, vectors.json, decisions.md, and README.md with the two folds ruled at the mechanics, CPP-C4-1 and the R8/R12 precedence sentence), the model scripts/chain_identity_v2.py, and the D5a oracle (bound by its identity architecture/oracle-identity-met-perf-044.json, file sha256 c2c0c56d, candidate c4); tests/test_chain_compaction.py's live identity test runs the v2 model with S and C and keeps the frozen v1 pins, its three new tests check the v1 = v2 regression on the K = 0 era, the product rules for every listed product and every vector, and its pin of the README moves to the folded bytes; tests/conftest.py's NEVER_SHARED gains those three tests (Q-CPPC1-1 (a), Q-273-NS; the root conftest.py is unchanged); the registry gains exactly one rider, MET-PERF-044/packet (kind PACKET, the generic packet brief architecture/review-briefs/REVIEW_BRIEF_PACKET.md, sha256 6dcff68d7e6b01823f1740063e94910edcc159a71a6ee803f1b66c62fd06e274, version 1), appended last; the CONTRACT records stay lane-local (MON-273-RIDERS).", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ADOPT-006 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_chain_product_publish.py calls its validate() on the current tree, as tests/test_chain_compaction.py runs the v2 model. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict, and MET-PERF-041's caps unchanged.", "Add one 273-packet current catalog with an exact 273-to-272 inverse before the accepted 272-to-271 MET-ADOPT-006 layer. The new layer scripts/validate_chain_product_publish.py reads only its era's reviewed bytes, each bound by digest (the seven packet files, the registry and the generic packet brief), and checks V1 (the seven packet files equal their adopted digests), V2 (architecture/chain-product-packets/ holds exactly the four records, each of mode 100644, and rule.json's owner-decision evidence names decisions.md with the sha256 of its bytes), V3 (the oracle identity names the oracle test, is KEEP and binds its bytes) and V4 (the registry differs from the base by exactly the one rider), each with a failing test, and its canonical hunks. The packet publishes no product (K = 0), so its step is explained by the existing vocabulary.", "Inherited validators, tests and documents change only by: mechanical 273-packet membership and count updates; layer tests and the MET-ADOPT-006 layer's checks adjusted solely for the successor bridge; C2's test changes in 272's test tests/test_release_profile.py; the one-deeper successor hand edit of 271's test tests/test_edge_record_v12.py; the count lines of tests/test_met_perf_043.py and tests/test_chain_compaction.py, which the cascade skips; tests/test_chain_compaction.py's changes in contracts[1]; tests/conftest.py's three NEVER_SHARED members; the rider; and the index docs. The new head's test keeps the full fan-in (8 own and 84 predecessor routes) and the generic retain-names scaffold.", "Recorded, not folded: RP-P3-1 and RP-P4-1 (the collection guard leaves ci/ test modules unguarded; the root conftest.py is GATE_CI) go to COLLECTION-GUARD-CI-001 (Q-CPP-CIGUARD-1 (b)); the versioned *_v2 lane tools and their 271-to-273 replay proof at K = 0 are a lane step after this packet and before 274 (Q-273-V2TOOLS (a)); 274 waits for the owner's verifier bundle install (Q-CPP-2)."]
