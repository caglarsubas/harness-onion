id: SDK-005
repository: mas-harness-sdks
branch: codex/sdk-005-framework-integrations
objective: Implement Python-only, optional, tenant-neutral invocation adapters clean-room for LangChain, LangGraph, CrewAI, Semantic Kernel, MCP, and caller-supplied vector clients.
predecessors: [SDK-002, SDK-004]
allowedPaths: ["python/src/planeon_harness/integrations/", "python/tests/integrations/", "python/optional-dependencies.lock", "python/pyproject.toml", "python/build_backend.py", "examples/integrations/", "ci/targets/sdk-005.json", "tests/generated/test_make_dispatch.py"]
warmSourceAccess: PROHIBITED_DURING_IMPLEMENTATION
sourceReuse: []
contracts: ["Consumes telemetry API v1 only through explicit caller-invoked wrappers that never capture arguments, prompts, messages, results, credentials, or framework state", "Consumes protocol helper API v1 by validating the exact MCP 2026-07-28 default or 2025-11-25 compatibility revision before delegating an explicit call_tool invocation", "Produces optional framework integration API v1 under planeon_harness.integrations; importing planeon_harness or planeon_harness.integrations never imports an optional framework"]
deliverables: ["Declare exactly five isolated Python extras and matching wheel metadata: langchain -> langchain-core>=1.6,<2; langgraph -> langgraph>=1.2,<2; crewai -> crewai>=1.15,<2; semantic-kernel -> semantic-kernel>=1.44,<2; mcp -> mcp>=2.1,<3. The deterministic JSON optional-dependencies.lock records baseline versions 1.6.1, 1.2.11, 1.15.18, 1.44.1, and 2.1.1, their import names, upstream URLs, and OFFLINE_FAKE_SURFACE_ONLY verification; it may not claim live framework compatibility.", "The integration root exports IntegrationUnavailableError, IntegrationContractError, IntegrationSpec, and an immutable five-entry compatibility registry. Framework modules load their one declared import only when their factory is called and fail with code OPTIONAL_INTEGRATION_UNAVAILABLE plus the exact extra name when absent; no module installs, downloads, discovers plugins, reads credentials, or auto-registers hooks.", "Provide bounded adapters with explicit methods only: LangChain runnable invoke/ainvoke; LangGraph graph invoke/ainvoke; CrewAI crew kickoff/kickoff_async; Semantic Kernel kernel invoke/invoke_prompt; MCP client call_tool. Each factory validates its framework import and required callable surface, preserves return values and exceptions, emits only tenant-neutral SDK-002 spans to a caller-supplied sink, and never invokes the wrapped object during construction.", "Provide a dependency-free vector search callable adapter for synchronous and asynchronous caller-supplied clients. It accepts no vendor endpoint or credential, owns no vector-client extra, and delegates only when the returned wrapper is explicitly called.", "Keep python/pyproject.toml, deterministic build_backend.py METADATA, and optional-dependencies.lock byte-semantically aligned; base package metadata keeps every framework optional. Add offline fake-framework success/failure tests, base-import absence tests, metadata parity tests, no-content telemetry assertions, exception-preservation tests, and provider-neutral examples."]
excluded: ["TypeScript integrations, streaming iterator instrumentation, framework subclassing, automatic monkey-patching, entry-point discovery, automatic registration, network clients, vector vendor SDKs, Anthropic, Google, OpenAI, or other paid-provider integrations, hosted observability, API-key examples, and mandatory framework dependencies."]
prefetchCommands: []
offlineAcceptanceCommands: [["make","integration-matrix"],["make","zero-bill"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence: ["Offline fake-framework tests cover both sync and async delegation for every bounded method and prove construction performs no wrapped call or network operation.", "A subprocess with every optional import denied proves planeon_harness and planeon_harness.integrations import successfully, while each explicit framework factory fails with the closed OPTIONAL_INTEGRATION_UNAVAILABLE code and correct extra.", "Wheel METADATA, pyproject optional-dependencies, and optional-dependencies.lock expose exactly the five declared extras and no paid-provider, credential, hosted telemetry, runtime-download, or vector-vendor dependency.", "Span evidence contains only fixed harness.integration.* operation names and SDK-002 tenant-neutral context attributes; fake prompts, arguments, results, exception text, and framework state never appear.", "Generated target inventory includes integration-matrix and zero-bill, direct-argv dispatch remains closed, PORTING stays NO_AUTHORIZATION, and the deny-all-outbound canary passes."]
rollback: Revert one optional integration module without changing the SDK core.
