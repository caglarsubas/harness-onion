expectedEvidence:
  - "The diff touches only allowedPaths: 4 deletions, 4 page edits, 1 new resolver, 2 new tests, 1 sentence of docs and 1 new descriptor."
  - "offlineAcceptanceCommands keep CTRL-TRANSPORT-001's six argv byte-exact and in order, with ctrl-fix-004-page-status and ctrl-fix-004-page-resolver inserted before security (the Q-CPP-2 ordered-supersequence rule)."
  - "page-not-found-status.test.ts fails at e46641d6 with 4 (page, loading) pairs and passes at the packet head; its synthetic TMPDIR case proves the rule still detects a violation."
  - "page-resolver.test.ts passes, and the predecessor suites run by ctrl-fix-003-regression, the CTRL-007 status-contract scope and security (typecheck, Vitest, dependency audit) still pass unchanged, including tests/harness-status/ui-source.test.ts and tests/security/accessibility-source.test.ts."
  - "Dry-run evidence, not a verifier command (heavy, run only on the lane monitor's word): next build plus next start bound to 127.0.0.1, as in R04's demo recipe. For each of /organizations/[organizationId], /harnesses/[harnessId] and /planes/[planeId], a known fixture id returns 200, an unknown id returns 404 and a cross-tenant-shaped id returns 404 with a body identical to the unknown one. Before the fix, the unknown organisation returned 200."
  - "No API route, dependency, dispatch rule, ledger or other public contract changes; the visible loading labels are unchanged, and the organisation page no longer announces loading twice."
rollback: Revert this commit to restore the four route-level loading.tsx files and the prior page bodies; no data, schema or dependency state is involved.
