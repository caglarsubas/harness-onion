id: CTRL-FIX-004
repository: mas-harness-control-plane
branch: codex/ctrl-fix-004-page-not-found-status
objective: Make every dynamic control-web page destination return HTTP 404 for an unknown or unauthorized id by deciding existence before any Suspense boundary streams, replacing the four route-level loading.tsx boundaries above notFound() pages with per-page Suspense that keeps the same loading labels, and guard the rule with a structural test, without changing any API route, dependency, dispatch rule or public contract beyond pinning the page status.
