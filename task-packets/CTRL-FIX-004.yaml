contracts: ["Built on R04 main e46641d609cef2224b6f0069076d14e45d3d7f24 (CTRL-TRANSPORT-001, tree fcff6654d81e4f81509bdd7d6d690e744527b8dc); every line reference below is at that commit", "docs/harness-overview.md:76-77 pins one bounded 404 for unknown and unauthorized organization-scoped API objects; docs/harness-overview.md:80-82 lists the page destinations; docs/harness-overview.md:127 and docs/security/THREAT_MODEL.md:9 require indistinguishable not-found results. This packet extends the 404 to the page destinations /organizations/[organizationId], /harnesses/[harnessId] and /planes/[planeId]: an unknown id and an unauthorized id give the same status and the same not-found body", "Keeps CTRL-TRANSPORT-001's exclusion: the Makefile, ci/run_make_target.py, ci/handlers/**, every predecessor ci/targets descriptor, the transport files, the absence of .github/workflows/ and PORTING.yaml are unchanged", "The API routes under apps/control-web/src/app/api/** and lib/harness-status/http.ts are unchanged; they already return 404 (tests/harness-status/http.test.ts:103-104,118)", "Each dynamic page decides existence, and calls notFound(), before it returns any element; no loading.tsx sits in the page's segment or any ancestor segment under apps/control-web/src/app; the page's data-dependent body renders inside its own React Suspense whose fallback is StatusLoading with the deleted loading.tsx's label, byte for byte", "The joined route sources read by tests/harness-status/ui-source.test.ts:11-17 still contain createFixtureProjectionSet (apps/control-web/src/app/overview/page.tsx and apps/control-web/src/app/organizations/page.tsx keep it), so that predecessor test passes unchanged", "page-resolution.ts is preview composition (it imports fixtures.ts); CTRL-INTEGRATE-002's preview/production split moves it, must keep page-not-found-status.test.ts green, and must keep the existence read before first paint cheap and bounded (Roadmap-Visionary trade-off, roadmap 336ebc7c)"]
deliverables:
  - "Delete apps/control-web/src/app/organizations/loading.tsx, apps/control-web/src/app/organizations/[organizationId]/loading.tsx, apps/control-web/src/app/harnesses/[harnessId]/loading.tsx and apps/control-web/src/app/planes/[planeId]/loading.tsx. The four other loading.tsx files (overview, questionnaires, demands, profiles) stay, none of them sits above a page that calls notFound(), and the three pinned by tests/security/accessibility-source.test.ts:15-21 are among them."
  - "Add apps/control-web/src/lib/harness-status/page-resolution.ts: pure, synchronous resolvers resolveOrganizationProjection(organizationId), resolveHarnessProjection(harnessId) and resolvePlaneProjection(planeId). Each returns the fixture projection or null, with exactly today's page logic: the organisation resolver accepts FIXTURE_ORGANIZATION_ID and org.copper-ridge-labs (Copper Ridge Materials Lab), as at organizations/[organizationId]/page.tsx:8-10; the harness and plane resolvers return null unless harnessDefinition/planeDefinition accept the id and the fixture set holds a matching projection, as at harnesses/[harnessId]/page.tsx:9-11 and planes/[planeId]/page.tsx:9-11. No I/O, no environment read, no new dependency."
  - "Change the three dynamic pages to call their resolver after awaiting params, call notFound() on null before returning any element, and return the unchanged detail or overview component wrapped in <Suspense fallback={<StatusLoading label=...>}>. The labels are 'Loading the authorized organization projection' (organization), 'Loading the harness projection' (harness) and 'Loading the plane projection' (plane), the deleted files' labels. Props, filters and operatorScope pass through unchanged."
  - "Change apps/control-web/src/app/organizations/page.tsx to wrap its unchanged OperatorPortfolio in <Suspense fallback={<StatusLoading label=\"Loading the authorized organization portfolio\" />}>, the deleted portfolio loading label; it keeps its two createFixtureProjectionSet calls."
  - "Add tests/harness-status/page-not-found-status.test.ts (vitest, node:fs only, socket-free; T1). Its rule function walks a given app root with lstat, never follows a symbolic link, finds every page.tsx whose source matches /\\bnotFound\\(\\)/u, and reports each loading.tsx in that page's directory or any ancestor up to and including the app root. Case 1: on apps/control-web/src/app the rule reports no pair, and the notFound pages found include the three dynamic destinations. Case 2: on a temporary tree under TMPDIR with one loading.tsx above one notFound page, the rule reports exactly that pair. Case 3: each of the three dynamic pages calls its resolver and notFound() before the first JSX return. At e46641d6 case 1 fails with 4 pairs (script-counted); at the packet head it passes."
  - "Add tests/harness-status/page-resolver.test.ts (vitest; T2). Each resolver returns a projection for every id the fixture set exposes (both organisations, every fixture harness and plane), and null for an unknown id, an empty string and a cross-tenant-shaped id (org.unknown-tenant, an unknown harness id, an unknown plane id). The organisation resolver gives the same null for an unknown and a cross-tenant id."
  - "In docs/harness-overview.md, append one sentence to the paragraph at lines 80-84: 'An unknown or unauthorized page destination renders the not-found view with HTTP 404, decided before any loading boundary streams.' No other line changes."
  - "Add ci/targets/ctrl-fix-004.json (schemaVersion harness.planeon.ai/make-target-descriptor/v1alpha1, packetId CTRL-FIX-004) registering two closed argv targets. ctrl-fix-004-page-status runs [[\"npm\",\"run\",\"typecheck\"],[\"node_modules/.bin/vitest\",\"run\",\"tests/harness-status/page-not-found-status.test.ts\",\"--pool=forks\",\"--sequence.concurrent=false\"]]. ctrl-fix-004-page-resolver runs [[\"node_modules/.bin/vitest\",\"run\",\"tests/harness-status/page-resolver.test.ts\",\"--pool=forks\",\"--sequence.concurrent=false\"]]. Both are acceptedVariables {}. Named allowedPaths exception: the packet needs its own make targets; no other descriptor is touched."
excluded: ["The Makefile, ci/run_make_target.py, ci/handlers/**, predecessor ci/targets/*.json, the transport files (ci/verify-offline.sh, ci/warm-source-isolation.sh, ci/network_canary.py, ci/run_packet_argv.py), ci/zero_bill_scan.py, .github/**, PORTING.yaml, package.json/package-lock.json, pyproject.toml/uv.lock, next.config.ts, any middleware or proxy file, apps/control-web/src/app/layout.tsx, every error.tsx and not-found.tsx, the four other loading.tsx files, apps/control-web/src/app/api/**, lib/harness-status/http.ts, runtime.ts, fixtures.ts and taxonomy.ts, components/**, e2e/**, every existing test file, prisma, deploy, new dependencies, network, warm sources, prefetch.sh, verifier or host configuration; CTRL-INTEGRATE-002's items (F-R04-10/12/13/14/15/16, the preview/production split, durable adapters) stay out."]
