excluded: ["Network I/O, protocol/session persistence, endpoint discovery, authentication or authorization decisions, resume-token minting or interpretation, deprecated MCP Roots, Sampling, or Logging dependencies, 2025 experimental Tasks translation, arbitrary CloudEvents extensions, and embedded protocol servers."]
