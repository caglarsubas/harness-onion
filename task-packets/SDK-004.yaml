contracts: ["MCP request helpers accept exactly 2026-07-28 and the explicit 2025-11-25 compatibility profile; 2026 requests are self-describing and session-free, 2025 compatibility never silently upgrades or drops required session metadata, and unsupported/deprecated methods fail closed", "MCP task helpers implement only the io.modelcontextprotocol/tasks state vocabulary for 2026-07-28; they do not bridge the incompatible 2025-11-25 experimental task API", "A2A v1.0 task conversion preserves every defined state except TASK_STATE_UNSPECIFIED, which fails closed; terminal and interrupted classifications are explicit", "SSE resume helpers treat Last-Event-ID as an opaque caller-owned printable-ASCII cursor of 1-256 characters and never mint, decode, sign, persist, or authorize from it", "HarnessCloudEvent helpers validate the closed v1alpha1 generated contract and emit deterministic structured JSON bytes", "Produces dependency-free Python planeon_harness.protocols and TypeScript @planeon/harness-sdk/protocols API v1 surfaces"]
