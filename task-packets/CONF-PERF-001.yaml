contracts: ["Start from accepted main9df7dd7f2df8ac64096ef37d8df259761947d552 / tree1310cc74cc0ed39cfeb1068e998a0f78502a4be4;127 files/327 tests. Do not merge or implement draft CONF-LIVE-003 here. Read architecture/conformance-performance-amendment.json and docs/alpha-2/CONFORMANCE_PERFORMANCE_REPAIR.md.","Only crypto.py::_add may change in runtime source, retaining its signature and all other bytes. Preserve behavior for all valid and malformed/zero-denominator integer-point cases; no decoder, scalar-multiplier, signature, role, validity, revocation, canonical or small-order rule change.","First run the whole declared eight-command recipe with unchanged crypto and observational cProfile in appended supervisor module hooks. Profile actual inherited cases and the fixed three-sample deterministic workload. No test selection, skipped cases, monkeypatching or historical source execution.","Only named source-accounting regions may change in predecessor helpers/tests; all behavioral test bytes/parameters and327 IDs remain. Append regressions only to tests/live_backend/test_supervisor.py; append proof only to unchanged docs/live-backend/linux-boundary.md prefix.121 other files unchanged; no added file.","Current bytes/modes/digests and exact bounded delta must be checked before historical comparisons. Preserve closed stage counts110/120/127/135/141/146/151 and all historical proofs. No blanket path exemption, fake current inventory, cache, hidden collection or broad rewrite.","No public contract, tenant isolation, credential custody, replay, privileged policy, dependency, toolchain, billing, timeout or environment change. Profile attribution insufficient or parity failure means stop, not wider edits."]
deliverables: ["Retain full unoptimized profile and matched candidate profile, three fixed samples each, all workload results and environment identity. Confirm _add/pow contribution before selecting an optimization; source inspection alone is insufficient.","Implement bounded pure integer arithmetic only after measurement, independently check valid and invalid RFC8032 fixtures already available locally plus separately written affine differential reference, scalar extremes, invalid encodings and zero denominators. Do not execute snapshots or skip malformed cases.","Append new unit regressions and fixed module-scoped cProfile hooks that restore prior profiler state and only report observations. Preserve all327 old test IDs and behavior; no timing assertion masquerades as crypto acceptance.","Add canonical SOURCE_DELTA_ONLY proof binding meta authority, packet, exact before checkpoint, scoped region replacements and appended new test IDs; fail on unrelated changes, altered prefix/suffix, skipped or hidden tests, extra stage paths or invalid modes.","Require median fixed-workload time at most0.85 of the matched unoptimized median, full trusted elapsed at most750 seconds for candidate local and LOCAL exact-main, plus required CI green within existing bounds. Timing failures retain evidence and require diagnosis, never a longer timeout.","Run unchanged eight commands in one signed deny-all tree for each local measurement/candidate, required localhost PR CI and independent local exact-main. Preserve failed CI history. Hand off actual accepted new checkpoint for a separately authorized draft003 reconciliation."]
excluded: ["All other product files and all predecessor behavioral tests; Makefile/dispatcher/workflow/toolchain/PORTING/fixtures; new files/dependencies/downloads/crypto services; cached verification/signatures, production monkeypatches; source access, live/native execution, credentials, OS/admin/root policy changes, public signature redesign, broader algorithm replacement or tenant acceptance."]
