objective: Bootstrap a clean-room, dependency-minimal Knowledge Plane foundation with six inert service shells, four isolated PostgreSQL ownership domains, tenant RLS, append-only inbox/outbox/source references, privacy-safe contract mocks, immutable image/chart source, and closed offline dispatch.
