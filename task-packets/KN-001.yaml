    2146278a95344cd2a8e22596b2f315b46edffc88 and source-contract-only release
    manifest SHA-256
    c5dd4c39d1c69d07f8d8de3d1a09584bb906172fee2d5ac20ad25ff344b0db79.
    The exact canonical manifest entry digests are lifecycle CloudEvent
