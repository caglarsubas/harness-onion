contracts: ["Accepted base is main 5e83b257677d7596f479e66cbe8431e6b8a99ec4, tree 7439fc1307363fd59016038d7b3b290e5a1394a9, holding 239 immutable packets including MET-ENFORCE-028. Add MET-ENFORCE-029 only, as packet 240. Preserve all 239 predecessor YAML files, every contract snapshot, review record and status record (MET-ENFORCE-025's compiled filter programs and publisher, the v1, v2 and EDGE-2 edge records, seccomp allowlists v3 and v4 with both models, the repository registry and the W03 plan v2 are byte-identical), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions Q-HE3A-1 (c) and Q-HE3A-1b (a) (2026-10-13), and the lane monitor's owner-delegated Q-HE3D-3 (a) and Q-PR-1..10 (a) (2026-10-15), recorded verbatim in architecture/compiled-filter-programs-v2/status.json. Add architecture/compiled-filter-programs-v2/ (programs/EFFECT_GATE.aarch64.bpf and programs/EFFECT_GATE.x86_64.bpf, index.json, README, review brief, the verbatim independent review record and the status record ADOPTED_DATA_CONTRACT), the standard-library publisher scripts/compiled_filter_programs_v2.py, and edge record v3 (architecture/artifact-edges/operator-harness-engineering-v3.json and README-v3.md). Each EFFECT_GATE program is the pinned v4 model's output and MET-ENFORCE-025's v3 program with exactly one six-instruction readlinkat block inserted (x86_64 at instruction 173, 200 instructions; aarch64 at 34, 189 instructions); the other twelve programs are MET-ENFORCE-025's files, indexed and not re-emitted. Edge record v3 is v2's 31 rows unchanged plus the two programs, registered for R10's HE-003A2 under host-enforcement/contracts/seccomp-v4/. The status record discharges seccomp allowlists v4's open republication item; v4's own files stay byte-identical.", "Add one 240-packet current catalog with an exact 240-to-239 inverse before the accepted 239-to-238 MET-ENFORCE-028 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its semantic check reads repository bytes only through reviewed_bytes, and the contract directory's listing and file modes only through reviewed_tree and reviewed_mode. It binds the ten contract files and every input (the v4 model, policy, syscall table, vectors and status, MET-ENFORCE-025's index and fourteen programs, edge record v2, the HS43 record, the repository registry and safe_yaml) by digest before parsing and on every read, and executes the v4 model and safe_yaml from this era's bytes. Independently of the publisher it checks all fourteen programs against v4's digests and lengths, the twelve byte-identical programs, the exact readlinkat block, the replay of all 401 EFFECT_GATE decision vectors (206 x86_64 and 195 aarch64, 10 readlinkat on each) through the published bytes, the index, edge record v3 against v2, both README status lines, the status and review records, and the contract's closed file set with git mode 100644.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-028 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_compiled_filter_programs_v2.py calls its validate() on the current tree. Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling.", "Inherited validators, tests and documents change only by: mechanical 240-packet membership and count updates; layer tests and the MET-ENFORCE-028 layer's checks adjusted solely for the successor bridge; catalog-membership filters ignoring only the added MET-ENFORCE-029 member; the sector-catalog tripwire's naming set gaining this packet's review record, whose checks-run text names the catalogs; and the current-state text. No other inherited logic, program, skip or limit changes, and each change is reversible through this packet's inverse authority."]
