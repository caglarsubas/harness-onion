  - >-
    Advances only the white-goods sector pack from 0.3.0 to 0.4.0 and adds
    exactly twelve pack resources for a resulting exact 64-file/61-resource
    inventory: one contract binding, one five-profile recommendation catalog,
    five CompileRequest demand fixtures, and five closed golden-output
    envelopes. Common content, contracts lock, journey, ontology,
    business/data/governance/integration resources, pack format 0.1.0, and
    framework distribution 0.1.1 remain byte-identical.
deliverables:
  - >-
    Add a closed contract-binding resource and one recommendation-only provider
    catalog containing exactly five profiles. Every profile has a stable id,
    environment class, one demand fixture path, one expected-output envelope
    path, explicit infrastructure and model selector recommendations, accepted
    selector set, selected provider ids, prerequisite harness ids, quantitative
    resource envelope, isolation requirements, exclusions, and explanation.
    Recommendations use disposition PROPOSED_SELECTOR_ONLY and cannot enter a
    HarnessProfile unless the tenant demand explicitly contains exactly one
    accepted selector for every active provider group.
  - >-
    minimal-arm64 is self-managed ARM64 Linux on K3s. It requests
    model.local-cpu, platform.k3s, platform.provider.k3s, and
    provider.planeon.llamacpp; accepts trust.observability-finops and
    trust.security-safety prerequisites; attests architecture.arm64-available,
    connectivity.connected, and tenant.namespace-isolation; and accepts only
    provider.runtime.infrastructure.k3s plus provider.planeon.llamacpp. Its
    planning envelope is 2000 CPU millicores, 4096 MiB memory, 8192 MiB
    ephemeral storage, 8192 MiB model storage, and execution limits 1
    concurrent task, 300 seconds, 1 retry, 12 tool calls, and 32768 model
    tokens.
  - >-
    minimal-amd64 is self-managed AMD64 Linux on upstream Kubernetes. It
    requests deployment.kubernetes, model.local-cpu,
    platform.provider.kubernetes-upstream, and provider.planeon.llamacpp;
    accepts trust.observability-finops and trust.security-safety prerequisites;
    attests architecture.amd64-available, connectivity.connected, and
    tenant.namespace-isolation; and accepts only
    provider.runtime.infrastructure.kubernetes-upstream plus
    provider.planeon.llamacpp. Its planning envelope is 4000 CPU millicores,
    8192 MiB memory, 16384 MiB ephemeral storage, 16384 MiB model storage, and
    execution limits 2 concurrent tasks, 300 seconds, 1 retry, 16 tool calls,
    and 65536 model tokens.
  - >-
    regulated-openshift is self-managed AMD64 Linux on OpenShift. It requests
    agent.governed-action, assurance.required, model.local-cpu,
    platform.openshift, platform.provider.openshift, and
    provider.planeon.llamacpp; accepts trust.governance-agentops,
    trust.observability-finops, and trust.security-safety prerequisites;
    attests architecture.amd64-available, connectivity.connected,
    platform.openshift.arbitrary-uid, and tenant.namespace-isolation; and
    accepts only provider.runtime.infrastructure.openshift plus
    provider.planeon.llamacpp. Its planning envelope is 8000 CPU millicores,
    16384 MiB memory, 32768 MiB ephemeral storage, 32768 MiB model storage, and
    execution limits 4 concurrent tasks, 600 seconds, 1 retry, 24 tool calls,
    and 131072 model tokens. Regulated is a tenant-policy posture, not a legal
    compliance assertion.
  - >-
    silo is self-managed AMD64 Linux on upstream Kubernetes. It requests
    agent.read-only, deployment.kubernetes, model.local-cpu,
    platform.provider.kubernetes-upstream, provider.planeon.llamacpp, and
    retrieval.cited; accepts knowledge.data-integration,
    knowledge.domain-semantic, trust.governance-agentops,
    trust.observability-finops, and trust.security-safety prerequisites;
    attests architecture.amd64-available, connectivity.connected,
    connectivity.silo, and tenant.namespace-isolation; and accepts only
    provider.runtime.infrastructure.kubernetes-upstream plus
    provider.planeon.llamacpp. connectivity.connected satisfies the released
    compiler's binary non-air-gap admission while connectivity.silo is the
    narrower signed locality fact. Its planning envelope is 8000 CPU
    millicores, 16384 MiB memory, 32768 MiB ephemeral storage, 32768 MiB model
    storage, and execution limits 4 concurrent tasks, 600 seconds, 2 retries,
    24 tool calls, and 131072 model tokens.
  - >-
    air-gap is air-gapped AMD64 Linux on K3s. It requests deployment.airgap,
    model.local-cpu, platform.k3s, platform.provider.k3s, and
    provider.planeon.llamacpp; accepts trust.observability-finops and
    trust.security-safety prerequisites; attests architecture.amd64-available,
    connectivity.airgap, and tenant.namespace-isolation; and accepts only
    provider.runtime.infrastructure.k3s plus provider.planeon.llamacpp. Its
    planning envelope is 4000 CPU millicores, 8192 MiB memory, 32768 MiB
    ephemeral storage, 32768 MiB model storage, and execution limits 2
    concurrent tasks, 600 seconds, 1 retry, 16 tool calls, and 65536 model
    tokens. Isolation requires deny-all outbound, no runtime downloads, and a
    tenant-supplied digest-pinned local OCI layout or registry.
  - >-
    Every demand is a full synthetic CompileRequest with a submitted
    QuestionnaireAnswerSet, the ten exact READY/PASS readiness gates, explicit
    tenant-bound environment facts and deterministic synthetic attestation
    digest, empty immutable assurance subjects, exact accepted prerequisites,
    and exact resource-envelope execution budget. Fixture VERIFIED status is
    schema test input only and is not cryptographic, deployment, runtime,
    assurance, or tenant evidence.
  - >-
    Every golden envelope captures exactly profile.json, bom.json,
    install-plan.json, evidence-plan.json, explanation.md, and profile.sha256
    bytes produced against the bound public compiler/catalog, plus each file's
    SHA-256. JSON reconstruction uses SORTED_UTF8_JSON_V1 and text is exact
    UTF-8. Acceptance independently reconstructs the six files twice in memory,
    compares all bytes and digests, and proves every BOM entry belongs to the
    selected module/provider closure. This pack-local lock does not rerun the
    upstream compiler and does not claim cross-repository conformance,
    deployment, runtime behavior, assurance, or tenant acceptance.
  - >-
    All provider catalog records are PLANNED, credential-free,
    external-telemetry-free, runtime-download-disabled, and open-source
    non-metered/self-hosted or tenant-supplied. Every resource, BOM, install
    unit, and evidence state remains PLANNED or MISSING_PLANNED; no artifact
    digest, provider availability, capacity sufficiency, legal conclusion, or
    production readiness is fabricated.
  - >-
    Register only the unique provider-profiles Make target with exact
    PACK=white-goods and direct argv to ci/handlers/ind_wg_004.py. Update the
    descriptor-inventory regression without changing Makefile or the
    dispatcher. Update predecessor handlers/tests only for sector version,
    exact file/resource inventory, archive name, packet output version, and
    cumulative successor dispatch; preserve every predecessor content byte,
    decision, digest, and validation contract.
excluded:
  - >-
    Provider ranking that mutates a profile, automatic selector acceptance,
    implicit or fallback provider selection, more than one selector per active
    group, unselected module or provider BOM entries, copied public
    schema/compiler/catalog bytes, upstream paths during product acceptance,
    warm checkout access, cloud provisioning, cluster creation, GPU
    requirements, mutable artifact references, fabricated artifact digests,
    paid/metered providers, API keys, credentials, secrets, remote reads,
    external telemetry, runtime downloads, executable pack content, legal or
    regulatory compliance conclusions, release signing, publication,
    deployment, runtime evidence, assurance evidence, or tenant acceptance.
