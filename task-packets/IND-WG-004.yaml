expectedEvidence:
  - The exact predecessor commit, 0.3.0 raw pack file and computed digest, 52-file/49-resource inventory, framework wheel, public contracts commit, compiler source, release manifest, catalog lock/digest/entries, and twelve schema digests match immutable packet bindings without mounting or reading a warm-source checkout.
  - Exactly five recommendation-only profiles, five full demand fixtures, and five closed golden envelopes form the exact declared 0.4.0 inventory of 64 pack files and 61 resource ids; ids, paths, selectors, prerequisites, environment facts, envelopes, and explanations are unique and closed.
  - Each active infrastructure and model group contains exactly one explicitly accepted selector. Proposed selectors remain PROPOSED_SELECTOR_ONLY; omitted, incompatible, surplus, or ambiguous selector fixtures fail closed and no fallback is substituted.
  - Two in-memory reconstructions per profile are byte-identical for all six outputs and match every locked SHA-256. Each profile SHA references exact profile.json bytes; every BOM entry and install wave is a subset of the selected module/provider closure and carries only PLANNED or MISSING_PLANNED state.
  - Minimal ARM64, minimal AMD64, regulated OpenShift, silo, and air-gap environment facts, prerequisite closures, selected providers, resource envelopes, isolation constraints, and no-bill restrictions match their exact packet definitions. The silo dual-fact and air-gap deny-all/no-runtime-download boundaries are explicit.
  - Two canonical indexes and fixed-epoch archives of white-goods 0.4.0 are byte-identical and temporary outputs are removed; common.foundation 1.0.0, framework 0.1.1, and every predecessor content byte and decision remain unchanged.
  - Dispatcher inventory includes pack, data-readiness, governance-integrations, and provider-profiles with no duplicate target, undeclared variable, shell transport, ambiguous handler, or predecessor regression.
  - Source, candidate, CI, merge, artifact, publication, deployment, runtime, assurance, and tenant acceptance remain separate evidence states; all post-merge operational and tenant states remain false or NOT_RUN_ENV_UNAVAILABLE.
rollback: Revert the unreleased white-goods 0.4.0 provider-profile slice and restore exact IND-WG-003 commit 219cafc97d89513e89b9f0eaa0349756a2a3954c and pack 0.3.0; retain common.foundation 1.0.0, framework 0.1.1, predecessor evidence, and every downstream release, runtime, assurance, or tenant record unchanged.
