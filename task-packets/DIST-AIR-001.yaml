contracts:
  - Consumes immutable RELEASED directory, signed-release chain, OCI layout, and explicit supply-chain evidence-source set v1alpha1.
  - Produces deterministic physical-transfer archive, transfer manifest/checksum, VERIFIED_IMPORT directory, and digest-preserving local OCI relocation receipt v1alpha1.
  - >-
    Implementation starts from exact merged mas-harness-distribution DIST-003
    commit c44136bbfa6c87d93c68c70c92fd97a6da8d9124. Its pull-request and
    exact-main runs are 33638910112 and 33639066541. All earlier selection,
    staging, supply-chain, approval, Cosign, trust/revocation, promotion,
    closed-dispatch, inert-PORTING, and zero-bill constraints remain active.
  - >-
    Export accepts exactly one immutable RELEASED directory plus an explicit
    closed evidence map. Required evidence names are license-policy.json,
    vulnerability-policy.json, vulnerability-db.json, dispositions.json,
    model-custody.json, and exactly one deterministic SPDX JSON document for
    every selected component. It rejects a private key/password/seed/token,
    symlink, hard link, special file, mutable path, duplicate logical name,
    extra unclassified evidence, missing component SBOM, changed signed chain,
    or source exceeding the fixed entry/byte/path bounds.
  - >-
    airgap.py writes an uncompressed POSIX ustar archive in lexical path order
    with uid/gid/mtime zero, empty owner names, normalized 0644 files and 0755
    directories, and no PAX/global/sparse/device/FIFO/link entries. A canonical
    transfer-manifest.json binds schema, RELEASED record and release digests,
    every payload/evidence path, size, SHA-256, media role, and archive limits.
    The archive is staged privately, fsynced, published by no-overwrite atomic
    rename, and returned with its SHA-256 for separate physical custody.
  - >-
    Import requires the expected archive SHA-256 out of band, verifies it before
    parsing, applies the same fixed maximum archive bytes, entries, per-file
    bytes, total expanded bytes, path depth/length, and compression-ratio rules,
    and rejects duplicate, absolute, empty, dot, traversal, backslash, Unicode-
    ambiguous, linked, sparse, special, PAX, extra, missing, wrong-mode, or
    checksum-mismatched members. It extracts each regular file create-exclusively
    without tarfile.extract and never follows a destination path.
  - >-
    Import recomputes transfer-manifest closure, validates the full DIST-003
    signed release with the imported public trust and explicit verification
    instant, verifies bundle/evidence equality and the OCI layout, checks every
    required evidence-source digest, SPDX component coverage, vulnerability DB
    self digest, and model manifest binding, then writes a self-digested
    VERIFIED_IMPORT receipt. Only the verified private sibling is atomically
    renamed; failure leaves no destination or partial extraction.
  - >-
    relocation.py copies only the verified imported OCI layout into a private
    sibling under a caller-supplied local destination. It validates every source
    and destination blob and exact tree digest, changes no OCI bytes or digest,
    creates a canonical receipt binding import receipt, source/destination OCI
    digest, release digest, and stable local target id, then atomically publishes
    without overwrite. It performs no registry login, push, pull, tag rewrite,
    endpoint discovery, cluster apply, or network fallback.
  - >-
    SourceReuse entries remain historical provenance only. Product implementation
    and acceptance neither mount nor open any warm-start checkout. The root
    launcher retains exact Cosign 3.1.1 custody because import re-verifies the
    signed chain, and all commands run in one deny-all-outbound process tree.
  - >-
    ci/targets/dist-air-001.json owns only airgap-export-import,
    relocation-proof, and archive-security direct-argv handlers. make prefetch
    remains first and make zero-bill remains the final cumulative gate.
deliverables:
  - Deterministic bounded archive containing released OCI bytes, lock, signed chain, trust, SBOMs, license policy, vulnerability policy/database/dispositions, and model custody evidence.
  - Digest-before-parse safe import, full offline re-verification, atomic VERIFIED_IMPORT publication, and byte-identical OCI relocation receipt.
excluded:
  - Network fallback, runtime downloads, registry mutation, secret/private-key export, generic tar extraction, unchecked compression, unverified import, digest rewrite, deployment, runtime, assurance, or tenant acceptance.
  - Warm-source access, cloud storage/KMS, hosted runners, GitHub artifact/cache/package storage, API keys, external telemetry, or billable services.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["make","airgap-export-import"],["make","relocation-proof"],["make","archive-security"],["make","zero-bill"]]
