expectedEvidence:
  - Two independent temporary zones export and import the same archive with OS-denied network, matching archive/manifest/release/OCI digests, complete required evidence, and no secret material.
  - Repeated export of identical input is byte-identical; wrong out-of-band digest, corrupt signature/checksum/blob, missing or extra evidence, and signed-subject mutation fail before publication.
  - Traversal, absolute/backslash/dot/Unicode-ambiguous/duplicate paths, link/device/FIFO/PAX/sparse members, oversized archive/file/expanded set, excessive depth/count, and decompression-bomb vectors leave no extracted destination.
  - Relocation yields byte-identical source/destination OCI tree digests and rejects mutation, symlink, hard link, existing destination, invalid target id, or injected pre-publish failure.
  - Signed hash-pinned acceptance runs prefetch, all three packet targets, and zero-bill with OS-denied outbound traffic; import/relocation evidence does not assert deployment/runtime/assurance/tenant acceptance.
rollback: Delete only a failed private import/relocation candidate or select a prior immutable imported release digest. Never overwrite a verified import, alter the source archive, or delete prior local registry content.
