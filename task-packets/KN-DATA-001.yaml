deliverables:
  - >-
    SourceDefinition immutable metadata contains sourceId, connector kind
    FILE|HTTP|POSTGRESQL|EVENT, profile digest, endpoint-reference digest,
    optional credential-reference digest, network-policy digest, expected-schema
    digest, exact active-domain-version digest, semantic-mapping digest,
    owner digest, classification PUBLIC|INTERNAL|CONFIDENTIAL|RESTRICTED,
    sorted residency tokens, maxRecords, maxBytes, deadlineMs, createdAt, and
    creator. It contains no URL, hostname, IP, path, SQL, topic, connection
    string, secret name/key/value, raw owner list, or source payload. Limits are
    positive and capped at 10000 records, 2 MiB per response, 8 MiB per sample,
    32 pages/polls, and 30000 ms.
  - >-
    Source states are DECLARED, VALIDATING, VALID, INVALID, SAMPLING, SAMPLED,
    and DISABLED. Normal transitions are DECLARED->VALIDATING,
    VALIDATING->VALID|INVALID, VALID->SAMPLING,
    SAMPLING->SAMPLED|INVALID, and VALID|SAMPLED->DISABLED. Revisions are
    append-only and every expected revision is checked. ACTIVE, READY,
    READY_FOR_APPROVAL, DEGRADED, REVOKED, owner approval, committed ingestion,
    checkpoint advancement, and re-enable behavior are absent and reserved for
    KN-DATA-002 or a later explicit packet.
  - >-
    Every read and mutation first requires an injected fail-closed permit bound
    to organization, subject, exact action, resource digest, expiry, allowed=true,
    and decision id. An EndpointGrant is already verified outside this repository
    and binds organization, source, connector kind, endpoint-reference digest,
    network-policy digest, exact operation, expiry, and grant id. A SecretGrant
    similarly binds only the credential-reference digest and permitted operation;
    it never contains secret metadata or bytes. Mismatch, expiry, deny, missing
    grant, provider exception, or identity drift prevents state/material access.
    This repository never discovers endpoints, reads Kubernetes Secrets, calls a
    policy service, authenticates to a source, or signs/verifies either grant.
  - >-
    Validation also requires an injected DomainBindingObservation bound to the
    same organization/source plus the exact active-domain-version and semantic-
    mapping digests in SourceDefinition. It must attest both ACTIVE at an exact
    observedAt and carry an observation digest. Missing, stale, inactive,
    superseded, cross-tenant, or mismatched bindings deny before connector I/O.
    The ingestion core never reads the domain SQL schema or discovers/calls a
    domain endpoint; tests inject this metadata-only predecessor observation.
  - >-
    ConnectorProfile is closed to the four packet providers and process runtime.
    FILE accepts only an injected mount grant plus a normalized relative POSIX
    path of at most 512 bytes; absolute paths, empty/dot/dot-dot segments,
    backslashes, NUL/control characters, symlinks, devices, sockets, and archive
    expansion deny before material access. The core never opens a filesystem
    path; the injected file port returns bounded bytes plus an observed digest
    and regular-file/no-symlink attestation matching the grant.
  - >-
    HTTP builds only GET read plans from an already verified endpoint grant.
    The grant, not the request body, supplies normalized scheme, ASCII host,
    port, path prefix, and pagination mode. Userinfo, fragments, arbitrary query
    strings, redirects, scheme changes, cross-host next links, DNS resolution,
    proxy selection, cookies, request bodies, unsafe headers, link-local/cloud
    metadata targets, and connector-provided absolute next URLs are forbidden.
    The injected HTTP port receives the closed plan and returns bounded status,
    media type, bytes, and an opaque same-grant next-token; the core performs no
    socket or name-resolution operation.
  - >-
    POSTGRESQL uses only a pre-authorized statement id and digest supplied by the
    endpoint grant. SQL text, identifiers, clauses, connection strings, and
    transaction commands are never accepted from the API, fixture, or provider
    result. Parameters are a closed bounded map of scalar values and are supplied
    separately to an injected port. The observation must attest read-only
    transaction, prepared execution, statement timeout no greater than the plan
    deadline, and server-side row limit no greater than maxRecords. Multiple
    statements, COPY, DDL/DML, stored procedures, temp objects, and catalog or
    cross-database discovery deny.
  - >-
    EVENT uses an endpoint-grant-bound subscription/topic digest, closed
    partition, opaque checkpoint candidate, and bounded poll count/bytes. It
    accepts no broker URL, wildcard topic, consumer-group creation, offset reset,
    producer/admin operation, schema-registry discovery, or auto-commit. The
    injected port returns ordered immutable envelopes; duplicate delivery may be
    represented but no durable checkpoint advances in this packet.
  - >-
    The strict local decoder accepts only application/json,
    application/x-ndjson, text/csv, text/plain, and text/markdown bytes already
    returned by an injected port. UTF-8 is strict; JSON rejects duplicate keys,
    non-finite numbers, nesting over 16, more than 256 fields, or strings over
    16384 bytes; NDJSON rejects blank/oversized lines; CSV requires a unique
    bounded header and fixed column count; text is one document. Archives,
    compression, XML/entities, YAML, pickle, executable formats, encodings other
    than UTF-8, and media-type sniffing are forbidden. DecodedRecord exposes only
    deterministic record/content/schema digests and transient closed values.
  - >-
    LeaseRevision is tenant/source/partition scoped, append-only, and has states
    ACQUIRED, RENEWED, RELEASED, and EXPIRED. Acquisition assigns a strictly
    increasing positive fencing token and TTL from 1 through 300 seconds;
    renewal preserves the token and requires owner, prior revision, unexpired
    lease, and matching policy/grants. Release and expiry are terminal for that
    lease id. A new acquisition receives a larger token. Every connector result,
    checkpoint candidate, and staged-batch operation must present the current
    owner, revision, token, source-version digest, and unexpired lease; stale,
    foreign-tenant, released, expired, or superseded workers cannot append state.
  - >-
    A successful sample creates an immutable StagedBatch only after all pages or
    polls decode within the aggregate limits. It records batch/source/version/
    schema/domain/mapping/material/checkpoint-candidate digests, media type,
    connector kind, record/byte counts, sorted StagedRecordDigest metadata,
    fencing token, timestamps, and a canonical batch digest. Payloads, field
    names/values, documents, rows, events, SQL parameters, endpoint/secret data,
    and provider messages are transient and never stored or emitted. An injected
    content-addressed staging sink must return an organization/source/batch-bound
    exact-digest receipt; receipt mismatch or sink failure leaves no batch,
    record, source revision, idempotency record, evidence, or event. STAGED is
    not COMMITTED, accepted, indexed, deployable, or tenant approved.
  - >-
    Duplicate commands with the same organization/idempotency key and canonical
    request digest return the prior metadata result. Reuse with another digest
    returns IDEMPOTENCY_CONFLICT. Source validation and sample staging append the
    source revision, metadata-only evidence, and metadata-only outbox event in
    one copy-on-commit transaction; injected failure leaves the prior source and
    lease pointers unchanged. Events are limited to data.source.declared.v1,
    data.source.validated.v1, data.source.invalid.v1,
    data.source.sample-staged.v1, and data.source.disabled.v1 and can never claim
    readiness, activation, commit, runtime, assurance, or tenant acceptance.
  - >-
    The standard-library controller ASGI adapter exposes exactly POST
    /knowledge/v1/sources, GET /knowledge/v1/sources/{sourceId}, POST
    /knowledge/v1/sources/{sourceId}:validate, POST
    /knowledge/v1/sources/{sourceId}:sample, and GET
    /knowledge/v1/staged-batches/{batchId}. Mutation requests require an
    idempotency key and If-Match after creation. Caller identity, permits, endpoint
    grants, secret grants, connector ports, and staging sink are injected by the
    trusted adapter boundary, never parsed from public bodies. Bodies and query
    strings are closed/bounded; unknown routes/methods/fields, stale revisions,
    missing dependencies, and all exceptions return stable non-echoing errors.
    Lease operations are an in-process worker port only and are not public HTTP.
  - >-
    migrations/ingestion/002_connector_service.sql adds tenant-RLS
    source_definition, source_revision, connector_lease_revision,
    connector_lease_pointer, staged_batch, staged_record_digest,
    ingestion_idempotency, ingestion_evidence, and ingestion_event_outbox tables.
    Metadata/revision/batch/record/idempotency/evidence/outbox rows reject UPDATE
    and DELETE. Only narrowly scoped SECURITY DEFINER functions may compare-and-
    append a lease revision/current pointer or atomically stage metadata, after
    validating transaction-local organization context, expected revision,
    fencing token, and digests. Runtime receives own-schema SELECT/INSERT and
    exact function execution only, never BYPASSRLS, DDL, TRUNCATE, DELETE,
    arbitrary UPDATE, cross-schema/public privileges, or access to material.
    There is no down migration, role/database/extension creation, credential,
    endpoint, binary column, checkpoint pointer, batch commit pointer, or retry
    queue. PostgreSQL execution remains NOT_RUN_ENV_UNAVAILABLE.
  - >-
    Independently authored fixtures/connectors vectors cover FILE, HTTP,
    POSTGRESQL, and EVENT source classes with four synthetic white-goods records
    each, exact public predecessor locks, deterministic decoded/staged digests,
    and evidence-axis statuses. Positive cases yield only VALID or SAMPLED/STAGED.
    Negative cases cover tenant/grant mismatch, expired/stale lease, fencing
    replay, path traversal/symlink, SSRF/redirect/next-link escape, SQL text or
    write attempt, wildcard/admin event operation, malformed/oversized decoder
    input, duplicate batch, sink failure, and checkpoint promotion. Fixtures use
    new synthetic bytes and never copy predecessor or warm-source material.
  - >-
    KN-DATA-001 owns ci/targets/kn-data-001.json for Make integration. It
    registers connector-parity, connector-contract, and security handlers under
    tests/connectors and cumulatively reuses the existing prefetch target so
    KN-001 and KN-DOM locks/toolchain checks run first. It does not edit Makefile,
    ci/run_make_target.py, ci/run_packet_argv.py, or prior descriptors/handlers.
    Negative tests retain unknown, duplicate, ambiguous, shell, undeclared
    variable, transport, PORTING, warm-source, and zero-bill denial.
  - >-
    The packet owns one evidence-preserving correction to
    .github/workflows/verify.yml: the already pinned, credential-free public
    checkout changes only fetch-depth from 2 to 0. KN-DATA-001 is the third
    cumulative product commit, so depth 2 contains KN-DATA-001 and KN-DOM-001
    but omits exact KN-001 foundation object 672e73e... required by the unchanged
    cumulative prefetch and foundation-tree security assertions. Full public
    history is the durable minimum that preserves exact ancestor evidence for
    later packets without packet-by-packet depth growth. The pinned checkout
    action, persist-credentials=false, self-hosted labels, launcher-only step,
    permissions, timeout, fork denial, and all zero-bill constraints remain
    byte-for-byte unchanged. No tag, LFS, submodule, artifact, cache, hosted
    runner, credential, paid API, cloud resource, or runtime download is added.
    The inherited common workflow assertion and zero-bill scanner change only
    their exact required marker from fetch-depth 2 to fetch-depth 0. The scanner
    remains otherwise byte-identical and is re-pinned above; all other common
    assertions and scanner forbidden-token/resource checks remain unchanged.
  - >-
    Update only existing connector-controller and ingest-worker Containerfile/
    chart source. Images remain externally supplied by immutable digest,
    package-install-free, non-root, read-only, and disabled by default. Charts
    may reference only pre-existing digest-bound endpoint, credential, staging,
    and source-network-policy configuration; they create no Secret, namespace,
    source, database, bucket, PVC, public route, policy service, key, credential,
    image, or cloud resource. Network policy remains default-deny. Build, chart
    rendering, source connectivity, PostgreSQL, container, Kubernetes/OpenShift,
    runtime, assurance, and tenant acceptance remain NOT_RUN_ENV_UNAVAILABLE or
    PENDING_TENANT_AUTHORITY as appropriate.
excluded:
  - >-
    Warm-source access or reuse; connector writes/actions; arbitrary SQL or
    source code; endpoint/DNS/credential discovery; unrestricted filesystem or
    network access; redirects; external SaaS and SFTP providers; runtime package
    or driver loading; unbounded reads; raw payload persistence; readiness or
    quality decisions; owner approval; source activation; committed batches;
    checkpoint advancement; retries/dead-letter; provenance graph publication;
    indexing/retrieval/memory; deployment; release; assurance; tenant acceptance;
    and any cloud-, GitHub-, API-key-, or third-party-billable operation.
