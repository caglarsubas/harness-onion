expectedEvidence:
  - All six profiles render byte-identically twice with the exact expected module/resource inventory and only local file dependencies and digest-pinned images.
  - Minimal profiles and every other profile emit zero bytes for disabled subcharts; selected images/modules equal the profile declaration with no fallback, implicit selection, or mega-image.
  - Every Deployment, ServiceAccount, Role/RoleBinding, and NetworkPolicy passes namespace, RBAC, pod-security, resource-bound, secret-reference, and forbidden-field checks; regulated OpenShift has no fixed UID/group or SCC mutation.
  - air-gap has deny-all network posture and no external endpoint; bridge declares only tenant-supplied local integration references and no cloud provisioner.
  - Signed hash-pinned acceptance runs prefetch, all three packet targets, and zero-bill under OS-denied outbound isolation; CI/merge/exact-main remain separate from artifact/install/deployment/runtime/assurance/tenant acceptance.
rollback: Select the prior immutable distribution release/profile digest and revert only the unreleased chart/profile slice. Never overwrite an existing chart or release or mutate tenant cluster state.
