contracts:
  - Consumes closed profile/BOM selection, white-goods provider-profile recommendations, local immutable chart/image references, and Kubernetes/OpenShift isolation requirements v1alpha1.
  - Produces six deterministic composable Helm value-profile families and exact selected-subchart render evidence v1alpha1.
  - >-
    Implementation starts from exact merged mas-harness-distribution
    DIST-AIR-001 commit 90d6f720902eae355bd93840600eaa32d8c86fce.
    Its pull-request and exact-main runs are 33640567489 and 33640736555.
    All exact resolution, supply-chain, signing, release, air-gap, closed
    dispatch, inert PORTING, and zero-bill contracts remain active unchanged.
  - >-
    The sector-profile predecessor is exact merged mas-harness-industry-packs
    IND-WG-004 commit 3814e642c8c8eb9f9bf77f230930eeff209de565,
    white-goods 0.4.0 computed pack digest
    38a056e7f3008aa9980fc12f1677f6f160dddb18aa156e63258921b911ab1773,
    and five explicit tenant-accepted provider profiles. This repository does
    not copy or open that repository; fixtures independently encode only the
    deployment facts and selectors pinned here. bridge is the sixth generic
    platform family and is not misrepresented as a white-goods recommendation.
  - >-
    Rendering invokes only root-installed /opt/planeon/bin/helm v4.2.0 with
    SHA-256 87c4f99aa4edc63a5536838123680bece0e63c51019e515b122ba27f6276a3c9.
    The trusted launcher verifies the exact binary before repository code runs.
    Helm receives direct argv, --dependency-update is forbidden, every
    dependency is pre-vendored under the parent chart, and no repository,
    plugin, registry, cache, credentials, or network source is consulted.
  - >-
    charts/harness-platform is one thin local parent with exactly five vendored
    subcharts: runtime-infrastructure, model-inference, ai-gateway,
    data-integration, and control-overview. Dependencies use only file://charts
    paths and exact versions. Each condition maps to one closed modules.*.enabled
    boolean. No umbrella template may invent a module, and a disabled subchart
    emits zero resource, image, volume, RBAC, service, or annotation bytes.
  - >-
    profiles contains exactly minimal-arm64, minimal-amd64,
    regulated-openshift, bridge, silo, and air-gap values. Each closes profile
    id, platform, architecture, namespace, connectivity, selected modules,
    digest-only image references, resource requests/limits, storage class
    reference, and security posture. The first, second, third, fifth, and sixth
    preserve their corresponding white-goods deployment facts; bridge is a
    generic connected upstream-Kubernetes profile with tenant-supplied local
    integration endpoints and no external provisioning.
  - >-
    Every rendered Deployment uses a dedicated non-automounted ServiceAccount,
    namespace Role/RoleBinding only, runAsNonRoot, RuntimeDefault seccomp,
    allowPrivilegeEscalation false, readOnlyRootFilesystem, drop ALL, bounded
    CPU/memory requests and limits, and digest-only image. No host namespace,
    hostPath, privileged, host port, cluster role, wildcard RBAC, default service
    account, embedded Secret value, cloud resource, LoadBalancer, NodePort,
    external telemetry, runtime download, or mutable reference is permitted.
  - >-
    Every profile renders a namespace-scoped default-deny ingress/egress
    NetworkPolicy. OpenShift output sets no runAsUser, fsGroup, supplemental
    group, or fixed UID and is therefore compatible with arbitrary-UID SCC
    assignment; it does not create or weaken an SCC. air-gap admits no external
    endpoint/egress and every profile uses only local digest-pinned artifacts.
  - >-
    Tests render each profile twice to separate temporary output roots and
    compare exact bytes, resource inventory, chart-source provenance, selected
    module set, image digest closure, and absence of unselected modules. Static
    security admission independently checks every chart/profile source and all
    renders. These are render/schema/security facts, not install, deployment,
    runtime, regulatory, assurance, or tenant-acceptance evidence.
  - >-
    SourceReuse entries remain historical reference/discovery provenance only;
    no warm-start checkout is mounted or opened. ci/targets/dist-004.json owns
    only helm-render-matrix, minimal-selectivity-proof, and helm-security
    direct-argv handlers. make prefetch remains first and zero-bill remains last.
deliverables:
  - Thin five-subchart local composition chart and six exact profile values for ARM64, AMD64, regulated OpenShift, bridge, silo, and air-gap environments.
  - Deterministic render inventory, strict minimal selectivity, digest-only artifact proof, namespace isolation/RBAC/pod-security proof, and OpenShift arbitrary-UID proof.
excluded:
  - Mega charts, dependency update/download, unused modules, cloud resources, cluster apply, privileged/fixed-UID defaults, wildcard/cluster RBAC, embedded secrets, external telemetry, runtime downloads, mutable references, deployment/runtime/assurance/tenant acceptance, or legal compliance claims.
  - Warm-source access, hosted runners, GitHub artifact/cache/package storage, API keys, credentials, billable services, or registry mutation.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["make","helm-render-matrix"],["make","minimal-selectivity-proof"],["make","helm-security"],["make","zero-bill"]]
