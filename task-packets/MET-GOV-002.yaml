contracts: ["Accepted base is main 2043cc27883448e3ff030b7868110e295f32fe09, tree b6def2de17702a0e90e82a25671c2eea1cb34fc2, holding 258 immutable packets including MET-ENFORCE-041. Add MET-GOV-002 only, as packet 259. Preserve all 258 predecessor YAML files, every contract snapshot, review record and status record (every review record and oracle test that predates v2 is frozen by path and file digest in the new frozen list), existing authority, index and source-lock bytes, and historical attempt records. One packet, branch and PR.", "Owner decisions (via the lane monitor, recorded verbatim in architecture/review-record/status.json): Q-RR2-1..5 \"Accept all five (a) (Recommended)\", Q-RR2-6 \"Gate material (Recommended)\", Q-RR2-CAP \"Fold into rev 4, no round (Recommended)\", D-3 \"File-byte sha256 (Recommended)\" and Q-RR2-NAMES \"Load hashes locally (Recommended)\". The lane monitor's owner-delegated rulings (2026-10-22): Q-RR2-ID (a) (packet id and series MET-GOV-002/contract), Q-RR2-LEGACY (c) (the frozen list derived at this base by the lane that may read every file and copied in unopened, sha256 e33afcf6), Q-RR2-FROZEN (design revision 4's digest freeze kept), Q-RR2-VOID (b) with Q-RR2-VOID-PREFIX (b) as corrected, and Q-RR2-ADOPT-SHAPE (a).", "Add architecture/review-record/ (README.md, the published REVIEW_BRIEF.md, the brief registry briefs.json, vectors.json, the frozen list legacy-review-records.json, oracle-identity.json and oracle-identity-evolution-surface.json; status.json ADOPTED_CONTRACT_CANDIDATE; review-round1.json to review-round5.json, the reviewers' v2 records byte for byte, each with its review-identity-round<n>.json), the four schemas schemas/review-record.schema.json, review-identity.schema.json, oracle-identity.schema.json and review-briefs.schema.json, and the standard-library reference model scripts/review_record.py. The adopted bytes are the final contract round's subject: status.json binds every round, the final round's contract files by digest and the README's status line as the one adoption edit. The candidate's own tests are tests/test_review_record.py (after the layer's tests, byte for byte as the adoption left them, minus its four-line module docstring) and the in-suite pre-check tests/test_review_records_in_tree.py; the oracle tests written outside the candidate by a separate agent (D5a) are tests/test_review_record_oracle.py and tests/test_evolution_surface_oracle.py, scoped to the evolution surface record's version 2, each bound by an oracle identity.", "Amend MET-GOV-001's evolution surface record to version 2 (owner decision Q-RR2-6): the programme class GATE_REVIEW_PROCESS with four path entries (prefix architecture/review-record/; exact architecture/review-record-authority.json, scripts/review_record.py and tests/test_review_records_in_tree.py), the under-plus-name entries for architecture/review-record/ in GATE_REVIEW_BRIEF and GATE_REVIEW_RECORD, and GATE_REVIEW_PROCESS in independentOf of ORACLE_TESTS, REVIEW_RECORD and GATE_REVIEW_RECORD. The derived gate-material list grows from 27 to 31 entries. Its vectors and README are re-pinned, and tests/test_evolution_surface.py's three pins follow (31 derived, 25 accepted, the group RR2); scripts/evolution_surface.py does not change.", "Add one 259-packet current catalog with an exact 259-to-258 inverse before the accepted 258-to-257 MET-ENFORCE-041 layer, composed linearly: every newer authority is read fresh exactly once per route. The new projection imports no predecessor validator and rechecks its whole authority on every public route. Its inverse hunks are the canonical byte-minimal ones, which its semantic check recomputes from its own era's bytes (MET-PERF-040's carried rule). The semantic check reads repository bytes only through reviewed_bytes, reviewed_mode and reviewed_tree, refuses a path outside its era before reading it and binds every era file by digest. It checks the freeze (under architecture/ only MET-GOV-001's record, vectors and README change, and only the contract's directory is added; no model changes); the files added (new, each once, the directory closed, mode 100644, no absolute local path); the adoption (the status record's closed shape and values, the adopted files as the final round's reviewed bytes, the one adoption edit, every round bound to its record and identity, the series valid under the contract's rules as the layer restates them, ending in PASS_FOR_ADOPTION on the adopted subject; the reference model's own check_series runs over the same rounds in the in-suite pre-check); the model replaying its vectors from this era's bytes; the published registry, read with parse, pinning the published brief; and the frozen list, read with parse, derived at this base; and the evolution surface record v2 deriving 31 gate-material entries. Every refusal is a pure check with a failing case on plain data.", "Built under MET-PERF-042's identity rule and step rule: every chain validator other than the new head equals its previous-era bytes except for the bump vocabulary (i) to (v), and 258's layer except for the bridge vocabulary (vi) to (x); the new head stays inside the allow-list frozen in architecture/chain-compaction/identity-rule.json and binds no successor. The new head's test keeps the full fan-in (8 own and 70 predecessor routes, every catalog walk and round trip, the full payload loop); 258's test, once bridged, is compacted by C2 (its route test keeps its 8 own routes and the adjacent predecessor's, its payload test one mutation and the table check, every test name kept). tests/conftest.py is unchanged, and 255's two identity tests stay never-shared.", "The installed activation authority admits at most 64 acceptance commands and the trusted verifier requires every command of the newest accepted packet in order. Inherit all 64 MET-ENFORCE-041 direct-argv commands unchanged and in order, and add no argv: the new layer validator runs inside the outer pytest, whose tests/test_review_record.py calls its validate() on the current tree, and the in-suite pre-check runs there too (Q-RR2-4). Keep the identical offline wrapper environment, with no prefetch, no hidden tests, no timeout change and no cached security verdict. Keep the six-worker 900 s parallel-suite deadline, the 600 s nested predecessor bound, the local 750 s gate, the Linux runner launcher's 900 s bound, the 15 min workflow timeout and the 32 MiB outer output ceiling, of which the diagnostics stream takes at most 30 MiB (MET-PERF-041's caps, unchanged).", "Inherited validators, tests and documents change only by: mechanical 259-packet membership and count updates; layer tests and the MET-ENFORCE-041 layer's checks adjusted solely for the successor bridge; C2's two test changes in 258's test tests/test_policy_observation_digests.py; the one-deeper successor hand edit of 257's test tests/test_evolution_surface.py (as 258 made for 256's), with its three record v2 pins; the count line of 256's test tests/test_edge_record_v9.py, which the cascade misses after 258's hand edit; tests/test_sector_catalog.py's GLOB_READERS gaining exactly scripts/review_record.py, whose in-suite pre-check walks the checkout (the slot-218 tripwire's rule for a new .py that lists the checkout); the oracle agent's scoping of tests/test_evolution_surface_oracle.py to the record's version 2; catalog-membership filters ignoring only the added MET-GOV-002 member; and the current-state text. No other inherited logic, skip or limit changes, and each change is reversible through this packet's inverse authority."]
deliverables: ["The review record v2 contract with its schemas, registry, frozen list, oracle identities, vectors, README and reference model, and its status with the five v2 contract rounds and their identities under architecture/review-record/, adopted after independent contract review; the evolution surface record v2.", "A fresh 259-to-258 inverse authority with canonical byte-minimal hunks, a layer validator and test, the in-suite pre-check, the complete inherited suite, and the current master, index and repository-plan state; required verify from the owner-operated verifier after the owner's per-PR approval of the exact head (gate material)."]
excluded: ["Editing any earlier contract, record or harness document other than MET-GOV-001's record, vectors and README, or the frozen identity rule; rewriting any review record or oracle test that predates v2; R10 and R12 adoption of v2; publishing a name-token digest (owner Q-RR2-NAMES); installed launcher, trust or root-policy bytes, verifier code or keys, acceptance argv changes, timeout changes, ci/ changes, runner registration, host or cloud provisioning, runtime downloads, warm-source access and tenant acceptance.", "Any network access during validation."]
