    b1db59b19689e240d1224f0a116f19072a10f0cc8baa5ba34a30cdd37feb896a,
    wheelhouse inventory
    79f00f38eca25736612634e31b0a3909c1f34af7ffd18bafbc9292a3c6691957,
    and license inventory
    d4875eb83cfca4774fd0c84f91647bda759cc32cd0beb75191600c68894f7951
    before checked-out code runs. No package resolution or install occurs in
    prefetch or acceptance.
  - >-
    Produces planeon.knowledge.domain/v1 DomainDefinition, DomainVersion,
    DomainVersionRevision, ValidationReport, SemanticMapping,
    MappingRevision, ApprovalAttestation, CompatibilityReport,
    DomainEvidence, and DomainEvent metadata contracts plus the closed
    /knowledge/v1/domains API. Organization and subject are always injected as
    KN-001 TenantIdentity; product bodies, headers, queries, graphs, shapes,
    mappings, fixtures, and package metadata never supply tenant identity.
deliverables:
  - >-
    Keep the KN-001 root project and root uv.lock dependency-free. Add a
    separately installable services/domain-service dependency manifest and
    dependencies.lock.json containing exactly the eight-package semantic
    runtime closure and wheel/license hashes above. The service performs a
    startup version check and reports NOT_READY on a missing or mismatched
    engine. The externally supplied immutable base image must already contain
    that closure; the Containerfile performs no install, fetch, or build in this
    packet. Jena is a literal PROVIDER_UNAVAILABLE guidance value and introduces
    no image, endpoint, credential, code path, or fallback.
  - >-
    DomainDefinition contains organizationId, domainId, displayName,
    defaultLanguage, supportedLanguages, businessOwnerIds, dataOwnerIds,
    compatibilityMode BACKWARD or STRICT, createdAt, and createdBySubjectId.
    DomainVersion immutable metadata contains domainId, semantic version,
    packageDigest, ontologyDigest, shapesDigest, importManifestDigest,
    licenseExpression Apache-2.0, ownersDigest, createdAt, and creator. Graph
    bytes, shapes, mappings, labels, business facts, approval bodies, tokens,
    and source payloads are never written to events, errors, logs, SQL evidence,
    or mocks; validation material is supplied by an injected exact-digest local
    provider and is not retained by the service core.
  - >-
    Domain version states are DRAFT, VALIDATING, VALID, INVALID,
    AWAITING_APPROVAL, ACTIVE, REJECTED, SUPERSEDED, and RETIRED. The only normal
    transitions are DRAFT->VALIDATING, VALIDATING->VALID|INVALID,
    VALID->AWAITING_APPROVAL, AWAITING_APPROVAL->REJECTED, and an approved
    AWAITING_APPROVAL->ACTIVE. Atomic activation appends the new ACTIVE revision,
    changes the one active pointer, and appends SUPERSEDED for the prior active
    version in one transaction. A previously approved compatible SUPERSEDED
    version may be reactivated as rollback, atomically superseding the current
    active; no version/package/report/evidence is mutated or deleted. RETIRED is
    terminal and cannot be activated. Duplicate commands with the same
    organization/idempotency key and request digest return the prior result;
    reuse with a different digest returns IDEMPOTENCY_CONFLICT.
  - >-
    ApprovalAttestation is an already-verified transport input containing
    approvalId, organizationId, domainId, version, packageDigest, decision
    APPROVED or REJECTED, decidedAt, approverSubjectId, and evidenceDigest. Its
    organization/domain/version/package must match immutable metadata and its
    evidence digest is persisted. This repository never signs, verifies a
    tenant key, implements an approval workflow, accepts self-approval, or
    treats a policy allow, fixture, test, or generated output as owner approval.
    Every read and mutation first requires an injected fail-closed policy permit
    bound to organization, subject, exact action, resource digest, expiry, and
    allowed=true; transport/mismatch/expiry/deny prevents state access.
  - >-
    Local semantic validation accepts only bounded Turtle or JSON-LD bytes from
    the injected digest provider: maximum 2 MiB per document, 4 MiB total,
    50000 data triples, 20000 shape triples, 128 findings, and 30 seconds by an
    injected monotonic deadline. JSON-LD @context is inline object/array only;
    string contexts and @import are rejected before RDFLib. Turtle/JSON-LD
    graphs may use only urn:planeon:<closed-domain>: identifiers and the exact
    non-dereferenced RDF, RDFS, XSD, OWL, and SHACL W3C namespace prefixes.
    file, ftp, data, arbitrary http/https, relative traversal, owl:imports,
    external contexts, RDF/XML/entity expansion, archives, scripts, executable
    literals, and unknown media types fail before validation.
  - >-
    pySHACL is invoked only with advanced=false, js=false, inference=none,
    do_owl_imports=false, abort_on_first=false, meta_shacl=false, and explicit
    in-memory data/shapes graphs. Shapes containing sh:sparql, SHACL-SPARQL
    constraint components, sh:js, JavaScript functions, rules, or remote graph
    references are rejected. ValidationReport contains only organizationId,
    domainId, version, package/graph/shapes digests, exact engine versions and
    modes, conforms, bounded triple/finding counts, sorted findings of stable
    reasonCode/severity/focusDigest/pathDigest/constraintComponent, startedAt,
    completedAt, and reportDigest; messages and offending literal values are
    never retained or echoed. Parser/limit/deadline/engine errors append an
    INVALID revision with bounded stable reasons and never alter active state.
  - >-
    SemanticMapping immutable metadata contains mappingId, semantic version,
    exact active domainVersionDigest, sourceSchemaDigest, assertionsDigest,
    ownersDigest, provenanceDigests, createdAt, and creator. Packet-local JSON
    assertions contain only sourceFieldDigest, targetTerm IRI,
    transformationKind DIRECT|ENUM|UNIT|DERIVED, and non-empty provenance
    digests; raw field names, schemas, queries, source values, code, formulas,
    credentials, or transformation scripts are forbidden. Validation requires
    every target term to exist in the exact validated graph and produces sorted
    missing/invalid reason codes. Mapping states DRAFT, VALIDATING, VALID,
    INVALID, AWAITING_APPROVAL, ACTIVE, REJECTED, and SUPERSEDED follow the same
    append-only approval/idempotency model and cannot outlive or silently switch
    their pinned domain digest.
  - >-
    Compatibility compares canonical term inventories and per-term RDF
    statement digests against the currently active version. Equal inventories
    and statements are IDENTICAL; additive terms with unchanged prior term
    statements are BACKWARD_COMPATIBLE; removed terms or changed prior term
    statements are BREAKING. STRICT accepts only IDENTICAL; BACKWARD accepts
    IDENTICAL or BACKWARD_COMPATIBLE. Breaking publication and rollback deny
    with COMPATIBILITY_BLOCKED and preserve the prior pointer. Replacement
    mappings are evidence metadata only in this packet and cannot override this
    closed classifier.
  - >-
    The standard-library ASGI adapter exposes exactly POST
    /knowledge/v1/domains, GET /knowledge/v1/domains/{domainId}/versions, POST
    /knowledge/v1/domains/{domainId}/versions, POST
    /knowledge/v1/domains/{domainId}/versions/{version}:validate, POST
    /knowledge/v1/domains/{domainId}/versions/{version}:request-approval, POST
    /knowledge/v1/domains/{domainId}/versions/{version}:record-decision, POST
    /knowledge/v1/domains/{domainId}/versions/{version}:publish, POST
    /knowledge/v1/domains/{domainId}/versions/{version}:rollback, POST
    /knowledge/v1/domains/{domainId}/versions/{version}:resolve, GET
    /knowledge/v1/domains/{domainId}/versions/{version}/report, and POST
    /knowledge/v1/mappings:validate. Mutation requests require an idempotency key
    and If-Match revision where state already exists. Bodies are closed and
    bounded; caller identity, unknown fields/routes/methods, stale revision,
    missing policy/material/approval/provenance, and any dependency error return
    stable non-echoing failures. Lists are bounded and deterministically sorted;
    no endpoint discovers a package, source, graph, key, or network service.
  - >-
    DomainEvidence and DomainEvent contain only organization/domain/version/
    mapping ids, state/revision, package/report/approval/compatibility/resource
    digests, stable reason codes, correlation/causation ids, occurredAt, and a
    canonical record digest. They contain no RDF, SHACL report text, source
    schema, mapping assertion, business label/fact, token, prompt, model output,
    or tenant acceptance flag. Evidence append and outbox append occur in the
    same atomic store transaction as each successful state transition; injected
    failure leaves no partial state, pointer, evidence, idempotency, or event.
  - >-
    migrations/domain/002_semantic_service.sql adds tenant-RLS domain_definition,
    domain_version, domain_version_revision, semantic_mapping,
    semantic_mapping_revision, validation_report, domain_evidence,
    domain_event_outbox, domain_idempotency, and active_domain_pointer tables.
    Immutable metadata/revision/report/evidence/outbox/idempotency rows reject
    UPDATE and DELETE. The runtime role receives own-schema SELECT/INSERT and
    exact function execution only, never BYPASSRLS, DDL, TRUNCATE, DELETE,
    arbitrary UPDATE, cross-schema, or public privileges. One controlled atomic
    activation function validates transaction-local organization context,
    expected revision, approval/package/report/compatibility digests, and changes
    only active_domain_pointer while appending revisions/evidence/outbox. No down
    migration, destructive command, extension, database, role, object store, or
    package bytes are created. PostgreSQL execution remains
    NOT_RUN_ENV_UNAVAILABLE.
  - >-
    Independently authored fixtures/domain/white-goods vectors declare the
    eleven required business concepts, refrigeration/laundry/dish-care/cooking
    product families, named synthetic owners, CTQ/KPI/outcome relationships,
    valid and invalid SHACL data, digest-only semantic mappings, and exact
    IND-WG-001 provenance locks. The positive graph validates and reaches term
    coverage 100%; missing owner, missing provenance, unknown target term,
    invalid SHACL, stale digest, tenant mismatch, and breaking compatibility
    vectors deny with sorted stable reason codes. Fixtures are synthetic,
    contain no copied predecessor or warm-source bytes, and keep publication,
    deployment, runtime, assurance, and tenant acceptance false.
  - >-
    KN-DOM-001 owns only ci/targets/kn-dom-001.json and its exact handlers under
    already allowed service/domain/test/fixture paths. It cumulatively registers
    prefetch, domain-contract, white-goods-domain-parity, and security without
    editing Makefile, ci/run_make_target.py, KN-001 descriptors, or KN-001
    handlers. Prefetch first runs KN-001 locks and then verifies the service
    dependency lock and exact installed semantic versions without installing or
    downloading. All commands are direct argv; negative tests retain unknown,
    overlapping, shell, and undeclared-variable rejection.
  - >-
    The inherited ci/run_packet_argv.py currently rejects every command sequence
    except KN-001's two bootstrap targets. KN-DOM-001 is the one bounded
    transport-generalization exception: it removes only that packet-specific
    equality gate and accepts one non-empty prefetch phase equal to
    [["make","prefetch"]] plus one non-empty offlineAcceptanceCommands array.
    Each command remains a non-empty direct argv array; shells/environment
    launchers, control characters, recursive verify-offline, forbidden offline
    network/install/prefetch tokens, unexpected execution metadata, packet
    mutation, missing OS isolation identity, leaked packet/warm-root variables,
    or offline-environment drift fail before or between commands. Tests prove
    KN-001 remains accepted, KN-DOM-001 becomes accepted, and malformed or
    broadened transport remains denied. This exception does not change Makefile,
    ci/run_make_target.py, any descriptor other than kn-dom-001.json, or any
    handler owned by KN-001.
  - >-
    The inherited tests/common/test_security_sql_delivery.py changed-path check
    currently diffs the empty repository base against HEAD, so every legitimate
    later-packet path is falsely evaluated as KN-001-owned. KN-DOM-001 may change
    only that test's comparison endpoint to exact merged KN-001 commit
    672e73e512113fbf2bb96c222b2ffea7f58e79ed and assert that commit remains an
    ancestor of HEAD. The original KN-001 allowed-path set and every other
    foundation security assertion remain unchanged. This correction grants no
    KN-DOM implementation ownership under tests/common and does not weaken
    current-packet allowedPaths, cumulative dispatch, or zero-bill scanning.
  - >-
    Update only the existing domain-service Containerfile/chart source. The
    image remains externally supplied by immutable digest, non-root, read-only,
    and package-install-free. The chart stays disabled by default and additionally
    requires an existing semantic-provider bundle digest/config reference; it
    creates no image, package mirror, namespace, Secret, database, object store,
    PVC, public route, IdP, policy service, key, credential, or cloud resource.
    Network policy remains default-deny; deployment, chart rendering, container
    build/start, PostgreSQL, and Kubernetes/OpenShift proof remain
    NOT_RUN_ENV_UNAVAILABLE.
excluded:
  - >-
    Warm-source observation/access/mount/path transport/copying/adaptation/
    translation/execution; copied industry-pack bytes; automatic ontology or
    mapping invention; LLM completion; owner/approval inference; private keys or
    signing; approval workflow implementation; policy-authority fallback; RDF
    remote fetch/import/dereference; RDF/XML; archives; SPARQL/JavaScript SHACL;
    Jena runtime; triplestore; OCI registry/publish/pull; package installation;
    source ingestion; raw source schemas/values; retrieval/index/embedding;
    memory/runtime checkpoints; destructive data behavior; cross-tenant access;
    public endpoints; hosted runners; Actions artifacts/cache/Packages; cloud
    provisioning; paid or metered APIs; API keys; runtime downloads; mutable
    images; external telemetry defaults; production DB/image/chart execution;
    release/artifact/SBOM/signature; deployment; runtime proof; live security;
    assurance; or tenant acceptance.
prefetchCommands: [["make","prefetch"]]
offlineAcceptanceCommands: [["make","domain-contract"],["make","white-goods-domain-parity"],["make","security"]]
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
expectedEvidence:
  - Exact KN-001 commit/source locks, IND-WG-001 commit/artifact locks, CPython 3.12.14, eight-package service dependency lock, root-owned toolchain/wheelhouse/license inventories, and installed semantic versions agree before domain tests run; no root project dependency or predecessor/warm path is introduced.
  - Turtle and closed inline-context JSON-LD positive vectors parse locally and produce deterministic graph/shapes/term digests. Remote/string contexts, @import, owl:imports, arbitrary HTTP/HTTPS/FTP/file/data IRIs, RDF/XML, traversal, oversize/triple-limit/deadline, SHACL-SPARQL, JS, rules, unknown media, and engine mismatch deny without network access or input echo.
  - pySHACL positive/negative vectors prove the exact safe invocation modes, deterministic conformance, bounded sorted digest-only findings, stable error reasons, and zero retained graph/literal/report-message content.
  - Domain lifecycle vectors cover every allowed transition, illegal/repeated/stale transitions, idempotent replay/conflict, approval match/deny/self-approval, publish, prior-version supersede, compatible rollback, terminal retirement, atomic failure injection, and preservation of one exact active pointer.
